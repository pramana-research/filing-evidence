ased or performance-based awards. Generally, equity awards are expensed pro rata over their respective vesting periods (i.e., requisite service period), based on the market value of the awards at the time of grant, with accelerated expense for participants who satisfy qualified retirement eligibility. The time-based awards vest in equal installments upon the lapse of specified periods of time, typically three, four, and five years, subject to the provisions for death, disability, and retirement in the applicable award agreements.\nPerformance-based awards, which contain variable vesting criteria, are expensed based on management’s expectation of the percentage of the award, if any, that will ultimately vest. These estimates can change periodically throughout the measurement period. Vesting of performance-based awards is contingent upon the achievement of predetermined performance goals within specified time periods.\nIn addition to their time-based awards, performance-based awards are granted to executives and other senior managers to provide additional incentive to achieve pre-established profitability and growth targets and/or relative investment performance. The targets for the performance-based awards, as well as the number of units that ultimately may vest, vary by grant.\nThe following primarily shows the performance measurement criteria for our performance-based restricted equity awards outstanding at December 31, 2025:\nPerformance Measurement Year(s) of Grant Vesting range (as a percentage of target)\nGrowth of our personal auto and commercial auto businesses, both compared to its respective market 2023-2025 0-250%\nInvestment results relative to peer group 2024-2025 0-250%\nInvestment results relative to peer group 2023 0-200%\nAll restricted equity awards are settled at or after vesting in Progressive common shares from existing treasury shares on a one-to-one basis.\nA summary of all employee restricted equity award activity during the years ended December 31, follows:\n2025 2024 2023\nRestricted Equity Awards Number of Shares1 Weighted Average Grant Date Fair Value Number of Shares1 Weighted Average Grant Date Fair Value Number of Shares1 Weighted Average Grant Date Fair Value\nBeginning of year 2,505,662 $ 129.66 2,893,742 $ 101.18 3,198,150 $ 81.71\nAdd (deduct):\nGranted2 659,301 208.06 826,377 160.13 1,080,658 110.93\nVested (1,014,448) 96.51 (1,186,442) 81.84 (1,338,466) 63.10\nForfeited (54,198) 171.83 (28,015) 111.35 (46,600) 84.86\nEnd of year3,4 2,096,317 $ 169.27 2,505,662 $ 129.66 2,893,742 $ 101.18\n1 Includes restricted stock units. All performance-based awards are included at their target amounts.\n2 We reinvest dividend equivalents on restricted stock units. For 2025, 2024, and 2023, the number of units “granted” shown in the table above includes 51,511, 23,153, and 36,656 of dividend equivalent units, respectively, at a weighted average grant date fair value of $0, since the dividends were factored into the grant date fair values of the original grants.\n3 At December 31, 2025, the number of shares included 362,029 performance-based restricted stock units at their target amounts. We expect 703,551 units to vest based upon our current estimates of the likelihood of achieving the predetermined performance measures applicable to each award.\n4 At December 31, 2025, the total unrecognized compensation cost related to unvested restricted equity awards was $98 million, which includes performance-based awards at their currently estimated vesting value. This compensation expense will be recognized into our consolidated statements of comprehensive income over the weighted average vesting period of 2.4 years.\nApp.-A-35"}]}, {"n": 73, "id": "FE-0722", "slice": "S6", "company": "Southern Company", "form": "10-K", "question": "What was Southern Company's Maximum Coverage Per Occurrence Per Unit Limit To Obtain Replacement Power for the fiscal year ended December 31, 2025?", "found": true, "display": "490", "scale": "millions", "unit": "USD", "period": "2025-01-01 to 2025-12-31", "dims": {}, "line": "NEIL also covers the additional costs that would be incurred in obtaining replacement power during a prolonged accidental outage at a member's nuclear plant. Members can purchase this coverage, subject to a deductible waiting period of up to 26 weeks, with a maximum per occurrence per unit limit of $490 million. After the deductible period, weekly indemnity payments would be received until either the unit is operational or until the limit is exhausted. Alabama Power and Georgia Power each purchase limits based on the projected full cost of replacement power, subject to ownership limitations, and have each elected a 12-week deductible waiting period for each nuclear plant.", "url": "https://www.sec.gov/Archives/edgar/data/92122/000009212226000006/so-20251231.htm", "pages": [{"label": 203, "gold": true, "text": "Table of Contents Index to Financial Statements\nCOMBINED NOTES TO FINANCIAL STATEMENTS\nNuclear Fuel Disposal Costs\nActing through the DOE and pursuant to the Nuclear Waste Policy Act of 1982, the U.S. government entered into contracts with Alabama Power and Georgia Power that required the DOE to take title to and dispose of spent nuclear fuel generated at Plants Farley, Hatch, and Vogtle Units 1 and 2 beginning no later than January 31, 1998. The DOE has yet to commence performance of its contractual and statutory obligation to dispose of spent nuclear fuel. Consequently, Alabama Power and Georgia Power pursued and continue to pursue legal remedies against the U.S. government for its partial breach of contract.\nIn June 2024 and August 2024, the Court of Federal Claims entered final judgments on damages in the third and fourth round of lawsuits against the U.S. government, respectively, awarding Alabama Power a total of approximately $100 million and Georgia Power a total of approximately $121 million (based on its ownership interests), which represent claims for the period from January 1, 2011 through December 31, 2019.\nIn December 2024, the Alabama PSC directed Alabama Power to return the award, which was reflected as a regulatory liability at December 31, 2024, to customers through bill credits during the months of January, February, and March 2025. During the third quarter 2024, Georgia Power credited the award to accounts where the original costs were charged, which reduced rate base, fuel, and cost of service for the benefit of customers, as previously authorized by the Georgia PSC. As a result of this regulatory treatment, there was no material impact on Southern Company's, Alabama Power's, or Georgia Power's net income.\nOn September 5, 2025, Alabama Power and Georgia Power filed their fifth round of lawsuits against the U.S. government in the Court of Federal Claims, seeking damages for the costs of continuing to store spent nuclear fuel at Plants Farley, Hatch, and Vogtle Units 1 and 2 for the period from January 1, 2020 through December 31, 2024. Damages will continue to accumulate until the issue is resolved, the U.S. government disposes of Alabama Power's and Georgia Power's spent nuclear fuel pursuant to its contractual obligations, or alternative storage is otherwise provided. No amounts have been recognized in the financial statements as of December 31, 2025 for any potential recoveries from the pending lawsuits.\nThe final outcome of this matter cannot be determined at this time. However, Alabama Power and Georgia Power expect to credit any recoveries for the benefit of customers in accordance with direction from their respective PSC; therefore, no material impact on Southern Company's, Alabama Power's, or Georgia Power's net income is expected.\nOn-site dry spent fuel storage facilities are operational at all three plants and can be expanded to accommodate spent fuel through the expected life of each plant.\nNuclear Insurance\nUnder the Price-Anderson Amendments Act (Act), Alabama Power and Georgia Power maintain agreements of indemnity with the NRC that, together with private insurance, cover third-party liability arising from any nuclear incident occurring at the companies' nuclear power plants. The Act provides funds up to $16.3 billion for public liability claims that could arise from a single nuclear incident. Each nuclear plant is insured against this liability to a maximum of $500 million by American Nuclear Insurers (ANI), with the remaining coverage provided by a mandatory program of deferred premiums that could be assessed, after a nuclear incident, against all owners of commercial nuclear reactors. A company could be assessed up to $166 million per incident for each licensed reactor it operates but not more than an aggregate of $25 million per incident to be paid in a calendar year for each reactor. Such maximum assessment, excluding any applicable state premium taxes, for Alabama Power and Georgia Power, based on its ownership and buyback interests in all licensed reactors, is $332 million and $473 million, respectively, per incident, but not more than an aggregate of $49 million and $71 million, respectively, to be paid for each incident in any one year. Both the maximum assessment per reactor and the maximum yearly assessment are adjusted for inflation at least every five years. The next scheduled adjustment is due no later than November 1, 2028. See Note 5 under \"Joint Ownership Agreements\" for additional information on joint ownership agreements.\nAlabama Power and Georgia Power are members of Nuclear Electric Insurance Limited (NEIL), a mutual insurer established to provide property damage insurance in an amount up to $1.5 billion for members' operating nuclear generating facilities. Additionally, both companies have NEIL policies that currently provide decontamination, excess property insurance, and premature decommissioning coverage up to $1.25 billion for nuclear losses and policies providing coverage up to $750 million for non-nuclear losses in excess of the $1.5 billion primary coverage.\nNEIL also covers the additional costs that would be incurred in obtaining replacement power during a prolonged accidental outage at a member's nuclear plant. Members can purchase this coverage, subject to a deductible waiting period of up to 26 weeks, with a maximum per occurrence per unit limit of $490 million. After the deductible period, weekly indemnity payments would be received until either the unit is operational or until the limit is exhausted. Alabama Power and Georgia Power each purchase limits based on the projected full cost of replacement power, subject to ownership limitations, and have each elected a 12-week deductible waiting period for each nuclear plant.\nII-153"}, {"label": 204, "gold": false, "text": "Table of Contents Index to Financial Statements\nCOMBINED NOTES TO FINANCIAL STATEMENTS\nUnder each of the NEIL policies, members are subject to assessments each year if losses exceed the accumulated funds available to the insurer. The maximum annual assessments for Alabama Power and Georgia Power as of December 31, 2025 under the NEIL policies would be $61 million and $84 million, respectively.\nClaims resulting from terrorist acts and cyber events are covered under both the ANI and NEIL policies (subject to normal policy limits). The maximum aggregate that NEIL will pay for all claims resulting from terrorist acts and cyber events in any 12-month period is $3.2 billion each, plus such additional amounts NEIL can recover through reinsurance, indemnity, or other sources.\nFor all on-site property damage insurance policies for commercial nuclear power plants, the NRC requires that the proceeds of such policies shall be dedicated first for the sole purpose of placing the reactor in a safe and stable condition after an accident. Any remaining proceeds are to be applied next toward the costs of decontamination and debris removal operations ordered by the NRC, and any further remaining proceeds are to be paid either to the applicable company or to its debt trustees as may be appropriate under the policies and applicable trust indentures. In the event of a loss, the amount of insurance available might not be adequate to cover property damage and other expenses incurred. Uninsured losses and other expenses, to the extent not recovered from customers, would be borne by Alabama Power or Georgia Power, as applicable, and could have a material effect on Southern Company's, Alabama Power's, and Georgia Power's financial condition, cash flows, and results of operations.\nAll retrospective assessments, whether generated for liability, property, or replacement power, may be subject to applicable state premium taxes.\nOther Matters\nMississippi Power\nKemper County Energy Facility\nIn 2023, 2024, and 2025, Mississippi Power recorded charges to income associated with abandonment and related closure costs and ongoing period costs, net of salvage proceeds, for the mine and gasifier-related assets at the Kemper County energy facility. These charges, including related tax impacts, totaled $17 million pre-tax ($12 million after tax) in 2023, $12 million pre-tax ($9 million after tax) in 2024, and $13 million pre-tax ($10 million after tax) in 2025. The pre-tax charges are included in other operations and maintenance expenses on the statements of income. Dismantlement of the abandoned gasifier-related assets was completed at the end of 2025. Site restoration activities for the mine are substantially complete, and any additional costs are expected to be immaterial. See \"General Litigation Matters – Southern Company and Mississippi Power\" herein for information regarding litigation associated with the Kemper County energy facility.\nDepartment of Revenue Audit\nOn March 31, 2025, the Mississippi Department of Revenue (Mississippi DOR) completed an audit of sales and use taxes paid by Mississippi Power from October 2019 to July 2024 and entered a final assessment, indicating a total amount due of $29 million, including associated penalties and interest. Mississippi Power did not agree with the audit findings and filed an administrative appeal with the Mississippi DOR on May 29, 2025. On November 4, 2025, Mississippi Power and the Mississippi DOR reached a settlement agreement on an assessment of approximately $13 million including associated penalties and interest, $11 million of which was previously paid by Mississippi Power. On November 5, 2025, Mississippi Power made a final $2 million payment. This matter is now concluded.\nPursuant to an accounting order approved by the Mississippi PSC on January 13, 2026, Mississippi Power deferred $9 million of the agreed-upon assessment related to taxes and associated interest to a regulatory asset for disposition in a future rate proceeding.\nCommitments\nTo supply a portion of the fuel requirements of the Southern Company system's electric generating plants, the Southern Company system has entered into various long-term commitments not recognized on the balance sheets for the procurement and delivery of fossil fuel and, for Alabama Power and Georgia Power, nuclear fuel. The majority of the Registrants' fuel expense for the periods presented was purchased under long-term commitments. Each Registrant expects that a substantial amount of its future fuel needs will continue to be purchased under long-term commitments.\nGeorgia Power has commitments, in the form of capacity purchases, regarding a portion of a 5% interest in the original cost of Plant Vogtle Units 1 and 2 owned by MEAG Power that are in effect until the later of the retirement of the plant or the latest stated maturity date of MEAG Power's bonds issued to finance such ownership interest. The payments for capacity are required whether or not any capacity is available. Portions of the capacity payments made to MEAG Power for its Plant Vogtle Units 1 and 2 investment relate to costs in excess of Georgia Power's allowed investment for ratemaking purposes. The present value of these portions at the time of the disallowance was written off. Generally, the cost of such capacity is included in purchased power in Southern Company's consolidated statements of income and in purchased power, non-affiliates in Georgia Power's statements of\nII-154"}, {"label": 246, "gold": false, "text": "Table of Contents Index to Financial Statements\nCOMBINED NOTES TO FINANCIAL STATEMENTS\nUnrecognized Tax Benefits\nChanges in unrecognized tax benefits for the periods presented were as follows:\nSouthern Company Alabama Power Georgia Power Southern Company Gas\n(in millions)\nUnrecognized tax benefits at December 31, 2022 $ 80 $ — $ — $ 32\nTax positions changes —\nIncrease from prior periods 88 — 86 2\nStatute of limitations expiration (52) — (9) —\nUnrecognized tax benefits at December 31, 2023 116 — 77 34\nTax positions changes —\nIncrease from prior periods 10 — — 10\nDecrease from prior periods (44) — (43) —\nUnrecognized tax benefits at December 31, 2024 82 — 34 44\nTax positions changes —\nStatute of limitations expiration (34) — (34) —\nIncrease from current period 122 50 72 —\nUnrecognized tax benefits at December 31, 2025 $ 170 $ 50 $ 72 $ 44\nThe unrecognized tax positions increase from prior periods for 2023 is primarily related to the amendment of certain 2019 through 2021 state tax filing positions related to tax credit utilization, a portion of which decreased in the fourth quarter 2023 due to a statute of limitations expiration. If effective settlement of the positions is favorable, these positions would decrease Southern Company's and Georgia Power's annual effective tax rates. The ultimate outcome of this unrecognized tax benefit, which is expected to be resolved within the next 12 months, is dependent on acceptance by the state or expiration of related statute of limitations.\nThe unrecognized tax positions reductions due to statute of limitations expiration for 2023 primarily relate to a 2019 state tax filing position to exclude certain gains from 2019 dispositions from taxation in a certain unitary state. This tax position and related interest was recognized in the fourth quarter 2023 and decreased Southern Company's annual effective tax rate.\nThe unrecognized tax positions increase from prior periods for 2024 is primarily related to a certain state tax filing position at Southern Company Gas. If effective settlement of this position is favorable, this position would decrease Southern Company's and Southern Company Gas' annual effective tax rates. The ultimate outcome is dependent on acceptance by the state.\nThe unrecognized tax positions decrease from prior periods and statute of limitations expiration for 2024 and 2025, respectively, are primarily related to the 2019 through 2021 amended state filing positions related to tax credit utilization at Georgia Power.\nAlabama Power and Georgia Power recorded an unrecognized tax position in the second quarter 2025 for zero-emission nuclear power PTCs generated on the consolidated 2024 federal income tax return due to the uncertainty to meet the prevailing wage requirements. In the fourth quarter 2025, the unrecognized tax position at Alabama Power and Georgia Power was reversed as Southern Company received the acceptance letter from the IRS on these PTCs for the 2024 tax year. The reversal of the unrecognized tax position did not impact Southern Company's, Alabama Power's, and Georgia Power's effective tax rates.\nThe unrecognized tax positions increase from the current period is related to the Alabama Power and Georgia Power zero-emission nuclear power PTCs for the 2025 tax year of $50 million and $72 million, respectively.\nAll of the Registrants classify interest on tax uncertainties as interest expense. Accrued interest for all tax positions was immaterial for all periods presented. None of the Registrants accrued any penalties on uncertain tax positions.\nThe IRS has finalized its audits of Southern Company's consolidated federal income tax returns through 2024. Southern Company is a participant in the Compliance Assurance Process of the IRS. The IRS selected six Southern Power partnership returns for exam for the 2020 and 2021 tax years. One audit for 2020 is still under review, and the remaining audits have been closed with no change. The ultimate outcome of this matter cannot be determined at this time. The audits for the Registrants' state income tax returns have either been concluded, or the statute of limitations has expired, for years prior to 2018.\nII-196"}]}, {"n": 74, "id": "FE-0736", "slice": "S6", "company": "United Parcel Service, Inc.", "form": "10-K", "question": "What was United Parcel Service, Inc.'s amortization of intangible assets for the fiscal year ended December 31, 2025?", "found": true, "display": "700", "scale": "millions", "unit": "USD", "period": "2025-01-01 to 2025-12-31", "dims": {}, "line": "Amortization of intangible assets was $700, $648 and $597 million in each of 2025, 2024 and 2023, respectively. Expected amortization of finite-lived intangible assets recorded as of December 31, 2025 for the next five years is as follows (in millions): 2026—$783; 2027—$688; 2028—$577; 2029—$461; 2030—$355.", "url": "https://www.sec.gov/Archives/edgar/data/1090727/000162828026008432/ups-20251231.htm", "pages": [{"label": 93, "gold": true, "text": "UNITED PARCEL SERVICE, INC. AND SUBSIDIARIES\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS\nIn the course of our ongoing monitoring of reporting units, we also noted developments within our Mail Innovations reporting unit. Beginning in the first quarter of 2025, Mail Innovations experienced cost increases in excess of our expectations due to increases in purchased transportation rates, resulting from the expiration of a contract with our primary vendor. In December 2025, we entered into an agreement with the United States Postal Service (\"USPS\") to support final-mile delivery for Mail Innovations volumes starting in 2026. This agreement is expected to reduce exposure to purchased transportation cost volatility and enhance the predictability of future operating results, mitigating the cost-related risk identified earlier in the year. As of our July 1, 2025 testing date, approximately $295 million in goodwill is represented by our Mail Innovations reporting unit included in SCS.\nIntangible Assets\nThe following is a summary of intangible assets as of December 31, 2025 and 2024 (in millions):\nGross Carrying Amount Accumulated Amortization Net Carrying Value Weighted-Average Amortization Period (in years)\nDecember 31, 2025\nCapitalized software $ 6,810 $ (4,593) $ 2,217 6.9\nCustomer relationships 1,438 (293) 1,145 14.3\nTrademarks, patents and other 368 (154) 214 7.6\nFranchise rights 382 (68) 314 20.0\nTrade name 116 (39) 77 9.5\nLicenses 88 (39) 49 3.4\nAmortizable intangible assets $ 9,202 $ (5,186) $ 4,016 8.6\nIndefinite-lived intangible assets 5 — 5\nTotal Intangible Assets $ 9,207 $ (5,186) $ 4,021\nDecember 31, 2024\nCapitalized software $ 6,088 $ (4,159) $ 1,929\nCustomer relationships 677 (206) 471\nTrademarks, patents and other 369 (103) 266\nFranchise rights 348 (55) 293\nTrade name 109 (26) 83\nLicenses 30 (12) 18\nAmortizable intangible assets $ 7,621 $ (4,561) $ 3,060\nIndefinite-lived intangible assets 4 — 4\nTotal Intangible Assets $ 7,625 $ (4,561) $ 3,064\nAs of December 31, 2025 and 2024, we do not have material indefinite-lived intangible assets and we did not record any impairments related to indefinite-lived intangibles during those periods.\nAll of our other recorded intangible assets are deemed to be finite-lived and are amortized over their estimated useful lives. Impairment tests for these assets are performed when a triggering event occurs that may indicate that the carrying value of the intangible asset may not be recoverable. Additionally, a decision to sell or abandon an intangible asset before the end of its useful life may result in an impairment charge. Impairments of finite-lived intangible assets were $39, $71 and $8 million in 2025, 2024, and 2023, respectively, and were recorded within Other expenses in our statements of consolidated income. In 2025, these charges primarily consisted of software impairment charges related to a business within SCS. In 2024, these charges represented trade name and capitalized software license impairments.\nAmortization of intangible assets was $700, $648 and $597 million in each of 2025, 2024 and 2023, respectively. Expected amortization of finite-lived intangible assets recorded as of December 31, 2025 for the next five years is as follows (in millions): 2026—$783; 2027—$688; 2028—$577; 2029—$461; 2030—$355.\n92"}, {"label": 92, "gold": false, "text": "UNITED PARCEL SERVICE, INC. AND SUBSIDIARIES\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS\nNOTE 7. GOODWILL AND INTANGIBLE ASSETS\nThe following table indicates the allocation of goodwill (in millions):\nU.S. Domestic Package International Package Supply Chain Solutions Consolidated\nBalance as of January 1, 2024 $ 847 $ 503 $ 3,522 $ 4,872\nAcquired — — 4 4\nDivestiture — — (495) (495)\nCurrency / Other — (16) (65) (81)\nBalance as of December 31, 2024 $ 847 $ 487 $ 2,966 $ 4,300\nAcquired — 79 1,265 1,344\nCurrency / Other — 30 163 193\nBalance as of December 31, 2025 $ 847 $ 596 $ 4,394 $ 5,837\n2025 Goodwill Activity\nGoodwill acquired during 2025 was associated with our acquisitions of Frigo-Trans and Biotech & Pharma Logistics (\"Frigo-Trans\") and Andlauer Healthcare Group, Inc (\"AHG\"), which are both reported within SCS. In 2025, the increase in goodwill balance is primarily due to the acquisitions of the above mentioned businesses as discussed in note 8. The remaining changes were due to the impact of changes in the value of the U.S. Dollar on the translation of non-U.S. Dollar goodwill balances.\n2024 Goodwill Activity\nGoodwill acquired during 2024 was associated with our acquisition of certain locations of The UPS Store. It also reflects the 2024 completion of purchase accounting allocations from our 2023 acquisitions of MNX Global Logistics and Happy Returns, which are both reported within SCS. In 2024, the decrease in goodwill balance is primarily due to the divestiture of our truckload brokerage business (\"Coyote\") within SCS as discussed in note 8. The remaining changes were due to the impact of changes in the value of the U.S. Dollar on the translation of non-U.S. Dollar goodwill balances.\nGoodwill Impairment\nWe conducted our most recent annual goodwill impairment testing as of July 1, 2025 using both qualitative and quantitative methods. As of our July 1, 2025 testing date, approximately $877 million and $738 million of our $4.8 billion consolidated goodwill balance is represented by our Global Freight Forwarding (\"GFF\") and Healthcare Logistics and Distribution (\"HLD\") reporting units, respectively. Based on our annual impairment evaluation, both reporting units exhibited a limited excess of fair value above carrying value and reflect a greater risk of an impairment occurring in future periods. This limited excess was primarily driven by current market conditions, volatility in global markets, early stages of our current healthcare growth strategy and ongoing integration of recent acquisitions. Both GFF and HLD reporting units are included in SCS.\nFor each of our reporting units, we continue to monitor the impact of macroeconomic conditions and business performance on our estimates of fair value. Subsequent to our annual testing date, the GFF reporting unit continued to face volatile market conditions and management updated its long-term projections for the mix and timing of revenue growth. We concluded that the change in projections triggered the need for an interim quantitative test for goodwill impairment in the fourth quarter of 2025. The interim impairment test methodology was consistent with our approach for annual impairment testing, using our current view of key inputs and assumptions. The interim impairment test indicated that the GFF reporting unit continues to have a limited excess of fair value over carrying value consistent with the last annual test, and no impairment was recorded.\nNo other reporting units had indications that an impairment was more likely than not. Actual reporting unit performance, revisions to our forecasts of future performance, market factors, changes in global trade policy, changes in estimates or assumptions in future impairment testing, or a combination thereof could result in a non-cash impairment charge in one or more of our reporting units during a future period.\n91"}, {"label": 75, "gold": false, "text": "UNITED PARCEL SERVICE, INC. AND SUBSIDIARIES\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS\nNOTE 3. MARKETABLE SECURITIES AND NON-CURRENT INVESTMENTS\nThe following is a summary of marketable securities classified as trading and available-for-sale as of December 31, 2025 and 2024 (in millions):\nCost Unrealized Losses Estimated Fair Value\n2025\nCurrent trading marketable securities:\nEquity securities $ 3 $ — $ 3\nCurrent available-for-sale marketable securities:\nU.S. government and agency debt securities — — —\nCorporate debt securities — — —\nTotal available-for-sale marketable securities — — —\nTotal current marketable securities $ 3 $ — $ 3\nCost Unrealized Losses Estimated Fair Value\n2024\nCurrent trading marketable securities:\nEquity securities $ 3 $ — $ 3\nCurrent available-for-sale marketable securities:\nU.S. government and agency debt securities 165 (1) 164\nCorporate debt securities 39 — 39\nTotal available-for-sale marketable securities 204 (1) 203\nTotal current marketable securities $ 207 $ (1) $ 206\nTotal current marketable securities pledged as collateral for our self-insurance requirements had estimated fair values of $177 million as of December 31, 2024. No marketable securities were pledged as collateral for our self-insurance requirements as of December 31, 2025.\nNon-Current Investments\nWe hold non-current investments that are reported within Other Non-Current Assets in our consolidated balance sheets. Cash paid for these investments, excluding investments obtained through business acquisitions, is included in Other investing activities in our statements of consolidated cash flows.\n•Equity method investments: As of December 31, 2025 and 2024, equity securities accounted for under the equity method had carrying values of $254 and $304 million, respectively.\n•Other equity securities: Certain securities that do not have readily determinable fair values are reported in accordance with the measurement alternative in Accounting Standards Codification Topic 321 Investments – Equity Securities. As of December 31, 2025 and 2024, we had equity securities of $46 and $42 million, respectively, accounted for under this measurement alternative.\n•Other investments: We hold an investment in a variable life insurance policy to fund benefits for the UPS Excess Coordinating Benefit Plan with a fair market value of $21 and $19 million as of December 31, 2025 and 2024, respectively.\n74"}]}, {"n": 75, "id": "FE-0671", "slice": "S6", "company": "JPMorgan Chase & Co.", "form": "10-Q", "question": "What was JPMorgan Chase & Co.'s legal expense for the three months ended September 30, 2026?", "found": true, "display": "63", "scale": "millions", "unit": "USD", "period": "2026-07-01 to 2026-09-30", "dims": {}, "line": "The Firm has established reserves for several hundred of its currently outstanding legal proceedings. Under U.S. GAAP for contingencies, the Firm accrues for a litigation-related liability when it is probable that such a liability has been incurred and the amount of the loss can be reasonably estimated. The Firm evaluates its outstanding legal proceedings each quarter to assess its litigation reserves, and makes adjustments in such reserves, upward or downward, as appropriate, based on management’s best judgment after consultation with counsel. The Firm’s legal expense was $63 million and $62 million for the three months ended September 30, 2026 and 2025, respectively. There is", "url": "https://www.sec.gov/Archives/edgar/data/19617/000162828026069523/jpm-20260930.htm", "pages": [{"label": 185, "gold": true, "text": "the parties’ contractual agreements concerning forum selection and did not recognize foreign sanctions laws as a basis for not making payment. Russian courts have entered judgment against the Firm in a number of claims. This includes one claim for $439 million, for which the courts have stayed the enforcement of the judgment against the Firm's unprotected assets in Russia pending the outcome of an appeal, and a judgment for another claim has been executed against assets held onshore by the Firm in Russia. The total amount of the judgments exceeds the total amount of available assets that the Firm holds in Russia. Russian courts have allowed plaintiffs to withhold dividends due to the Firm’s clients for the purpose of satisfying judgments, which the Firm is opposing as unlawful. The Firm continues to appeal the Russian courts' decisions, but certain judgments are now enforceable against Firm assets in Russia. Russian courts have also ordered interim freezes of Firm assets in Russia (including, among other things, funds in bank accounts, securities, shares in authorized capital, and certain trademarks, of the named defendants) pending a determination of certain underlying claims against the Firm. The Firm has challenged claims being pursued in the Russian courts and related freeze orders in other jurisdictions provided for by the parties’ contractual forum selections. If further claims are enforced despite the actions taken by the Firm to challenge the claims and orders and to seek the proper application of law, the Firm’s assets in Russia could be seized in full, and certain client assets could also be seized, or the Firm could be prevented from complying with its obligations.\n* * *\nIn addition to the various legal proceedings discussed above, JPMorganChase and its subsidiaries are named as defendants or are otherwise involved in a substantial number of other legal proceedings. The Firm believes it has meritorious defenses to the claims asserted against it in its currently outstanding legal proceedings and it intends to defend itself vigorously. Additional legal proceedings may be initiated from time to time in the future.\nThe Firm has established reserves for several hundred of its currently outstanding legal proceedings. Under U.S. GAAP for contingencies, the Firm accrues for a litigation-related liability when it is probable that such a liability has been incurred and the amount of the loss can be reasonably estimated. The Firm evaluates its outstanding legal proceedings each quarter to assess its litigation reserves, and makes adjustments in such reserves, upward or downward, as appropriate, based on management’s best judgment after consultation with counsel. The Firm’s legal expense was $63 million and $62 million for the three months ended September 30, 2026 and 2025, respectively. There is\nno assurance that the Firm’s litigation reserves will not need to be adjusted in the future.\nIn view of the inherent difficulty of predicting the outcome of legal proceedings, particularly where the claimants seek very large or indeterminate damages, or where the matters present novel legal theories, involve a large number of parties or are in early stages of discovery, the Firm cannot state with confidence what will be the eventual outcomes of the currently pending matters, the timing of their ultimate resolution or the eventual losses, fines, penalties or consequences related to those matters. JPMorganChase believes, based upon its current knowledge and after consultation with counsel, consideration of the material legal proceedings described above and after taking into account its current litigation reserves and its estimated aggregate range of possible losses, that the other legal proceedings currently pending against it should not have a material adverse effect on the Firm’s consolidated financial condition. The Firm notes, however, that in light of the uncertainties involved in such proceedings, there is no assurance that the ultimate resolution of these matters will not significantly exceed the reserves it has currently accrued or that a matter will not have material reputational consequences. As a result, the outcome of a particular matter may be material to JPMorganChase’s operating results for a particular period, depending on, among other factors, the size of the loss or liability imposed and the level of JPMorganChase’s income for that period.\n186"}, {"label": 186, "gold": false, "text": "Note 25 – Business segments & Corporate\nThe Firm is managed on an LOB basis. There are three reportable business segments – Consumer & Community Banking, Commercial & Investment Bank, and Asset & Wealth Management – with the remaining activities in Corporate.\nThe business segments are determined based on the products and services provided, or the type of customer served, and they reflect the manner in which financial information is evaluated by the Firm’s Operating Committee, whose members act collectively as the Firm’s chief operating decision maker. Segment results are presented on a managed basis. Refer to JPMorganChase’s 2025 Form 10-K Explanation and Reconciliation of the Firm’s Use of Non-GAAP Financial Measures on page 59 for a definition of managed basis and Note 32 for a further discussion of the Firm’s business segments.\nDescription of business segment reporting methodology\nResults of the reportable business segments are intended to present each segment as if it were a stand-alone business. The management reporting process that derives business segment results includes the allocation of certain income and expense items. The Firm periodically assesses the assumptions, methodologies and reporting classifications used for segment reporting, and therefore further refinements may be implemented in future periods. The Firm also assesses the level of capital required for each LOB on at least an annual basis. The Firm’s LOBs also provide various business metrics which are utilized by the Firm and its investors and analysts in assessing performance.\nRevenue sharing\nWhen business segments or businesses within each segment join efforts to sell products and services to the Firm’s clients and customers, the participating businesses may agree to share revenue from those transactions. Revenue is generally recognized in the segment responsible for the related product or service, with allocations to the other segments or businesses involved in the transaction. The segment and business results reflect these revenue-sharing agreements.\nFunds transfer pricing\nFunds transfer pricing (“FTP”) is the process by which the Firm allocates interest income and expense to the LOBs and Other Corporate and transfers the primary interest rate risk and liquidity risk to Treasury and CIO.\nThe funds transfer pricing process considers the interest rate and liquidity risk characteristics of assets and liabilities and off-balance sheet products. Periodically, the methodology and assumptions utilized in the FTP process are adjusted to reflect economic conditions and other factors, which may impact the allocation of net interest income to the segments.\nForeign exchange risk\nForeign exchange risk is transferred from the LOBs and Other Corporate to Treasury and CIO for certain revenues and expenses. Treasury and CIO manages these risks centrally and reports the impact of foreign exchange rate movements related to the transferred risk in its results.\nCapital allocation\nThe amount of capital assigned to each LOB and Corporate is referred to as equity. At least annually, the assumptions, judgments and methodologies used to allocate capital are reassessed and, as a result, the capital allocated to the LOBs and Corporate may change. Refer to Note 32 of JPMorganChase’s 2025 Form 10-K for additional information on capital allocation.\n187"}, {"label": 13, "gold": false, "text": "Income tax expense\n(in millions) Three months ended September 30, Nine months ended September 30,\n2026 2025 Change 2026 2025 Change\nIncome before income tax expense $ 20,134 $ 18,743 7 % $ 68,129 $ 55,435 23 %\nIncome tax expense 4,829 4,350 11 15,175 11,412 33\nEffective tax rate 24.0 % 23.2 % 22.3 % 20.6 %\nQuarterly results\nThe effective tax rate increased driven by:\n•the current-period tax expense related to the filing of prior-year tax returns as compared with a benefit in the prior year, and\n•changes in the level and mix of income and expenses subject to U.S. federal, state and local taxes,\nlargely offset by\n•tax benefits related to the resolution of certain tax audits.\nYear-to-date results\nThe effective tax rate increased driven by:\n•lower tax benefits related to the resolution of certain tax audits and the impact of tax regulations, including the absence of a $774 million income tax benefit recorded in the prior year,\n•changes in the level and mix of income and expenses subject to U.S. federal, state and local taxes, and\n•current-period tax expense related to the filing of prior-year tax returns as compared with a benefit in the prior year,\npartially offset by\n•higher tax benefits related to the vesting of employee share-based awards.\n14"}]}, {"n": 76, "id": "FE-0754", "slice": "S7", "company": "Apple Inc.", "form": "10-K", "question": "What was Apple Inc.'s weighted-average diluted shares (number) for the fiscal year ended September 27, 2025?", "found": true, "display": "15,004,697", "scale": "thousands", "unit": "shares", "period": "2024-09-29 to 2025-09-27", "dims": {}, "line": "Weighted-average diluted shares 14,720,306 15,004,697 15,408,095", "url": "https://www.sec.gov/Archives/edgar/data/320193/000032019326000026/aapl-20260926.htm", "pages": [{"label": 40, "gold": true, "text": "The following table shows disaggregated net sales, as well as the portion of total net sales that was previously deferred, for 2026, 2025 and 2024 (in millions):\n2026 2025 2024\niPhone $ 254,098 $ 209,586 $ 201,183\nMac 37,929 33,708 29,984\niPad 27,929 28,023 26,694\nWearables, Home and Accessories 35,577 35,686 37,005\nServices (1) 123,301 109,158 96,169\nTotal net sales $ 478,834 $ 416,161 $ 391,035\nPortion of total net sales that was included in deferred revenue as of the beginning of the period $ 8,717 $ 8,229 $ 7,728\n(1)Services net sales include amortization of the deferred value of services bundled in the sales price of certain products.\nThe Company’s proportion of net sales by disaggregated revenue source was generally consistent for each reportable segment (refer to Note 14, “Segment Information and Geographic Data”) for 2026, 2025 and 2024, except in Greater China, where iPhone revenue represented a moderately higher proportion of net sales. In addition, in 2026, Services revenue represented a moderately lower proportion of net sales in Greater China.\nAs of September 26, 2026 and September 27, 2025, the Company had total deferred revenue of $14.8 billion and $13.7 billion, respectively. As of September 26, 2026, the Company expects 65% of total deferred revenue to be realized in less than a year, 22% within one-to-two years, 11% within two-to-three years and 2% in greater than three years.\nNote 3 – Earnings Per Share\nThe following table shows the computation of basic and diluted earnings per share for 2026, 2025 and 2024 (net income in millions and shares in thousands):\n2026 2025 2024\nNumerator:\nNet income $ 132,175 $ 112,010 $ 93,736\nDenominator:\nWeighted-average basic shares outstanding 14,661,935 14,948,500 15,343,783\nEffect of dilutive share-based awards 58,371 56,197 64,312\nWeighted-average diluted shares 14,720,306 15,004,697 15,408,095\nBasic earnings per share $ 9.01 $ 7.49 $ 6.11\nDiluted earnings per share $ 8.98 $ 7.46 $ 6.08\nApple Inc. | 2026 Form 10-K | 39"}, {"label": 21, "gold": false, "text": "Item 1B. Unresolved Staff Comments\nNone.\nItem 1C. Cybersecurity\nThe Company’s management, led by its Head of Corporate Information Security, has overall responsibility for identifying, assessing and managing any material risks from cybersecurity threats. The Company’s Head of Corporate Information Security leads a dedicated Information Security team of highly skilled individuals with experience across industries that, among other things, develops and distributes information security policies, standards and procedures; engages in employee cybersecurity training; implements security controls; assesses security risk and compliance posture; monitors and responds to security events; and executes security testing and assessments. The Company’s Head of Corporate Information Security has extensive knowledge and skills gained from over 25 years of experience in the cybersecurity industry, including serving in leadership positions at other large technology companies and leading the Company’s Information Security team since 2016.\nThe Company’s Information Security team coordinates with teams across the Company to prevent, respond to and manage security incidents, and engages third parties, as appropriate, to assess, test or otherwise assist with aspects of its security processes and incident response. A dedicated Supplier Trust team manages information security risks the Company is exposed to through its supplier relationships. The Company has processes to log, track, address, and escalate for further assessment and report, as appropriate, cybersecurity incidents across the Company and its suppliers to senior management and the Audit and Finance Committee (“Audit Committee”) of the Board. The Company’s enterprise risk management program is designed to identify, assess, and monitor the Company’s business risks, including financial, operational, compliance and reputational risks, and reflects management’s assessment of cybersecurity risks.\nThe Audit Committee assists the Board in the oversight and monitoring of cybersecurity matters. The Audit Committee regularly reviews and discusses the Company’s cybersecurity risks with management, including the Company’s Head of Corporate Information Security, its General Counsel and the Heads of Compliance and Business Conduct, Business Assurance, and Internal Audit, and receives updates, as necessary, regarding cybersecurity incidents. The Chair of the Audit Committee regularly reports the substance of such reviews and discussions to the Board, as necessary, and recommends to the Board such actions as the Audit Committee deems appropriate.\nFor a discussion of the Company’s cybersecurity-related risks, see Item 1A of this Form 10-K under the heading “Risk Factors.”\nItem 2. Properties\nThe Company’s headquarters is located in Cupertino, California. As of September 26, 2026, the Company owned or leased facilities and land for corporate functions, R&D, data centers, retail and other purposes at locations throughout the U.S. and in various places outside the U.S. The Company believes its existing facilities and equipment, which are used by all reportable segments, are in good operating condition and are suitable for the conduct of its business.\nItem 3. Legal Proceedings\nDigital Markets Act Investigations\nOn March 25, 2024, the Commission announced that it had opened a formal noncompliance investigation against the Company under Article 5(4) of the EU DMA (“Article 5(4) Investigation”). The Article 5(4) Investigation relates to how developers may communicate and promote offers to end users for apps distributed through the App Store, as well as how developers may conclude contracts with those end users. On June 24, 2024, the Commission announced that it had opened an additional formal investigation against the Company regarding whether the Company’s new contractual requirements for third-party app developers and app marketplaces may violate the DMA (“Article 6(4) Investigation”). On April 23, 2025, the Commission fined the Company €500 million in the Article 5(4) Investigation and issued a cease and desist order requiring the Company to remove technical and commercial restrictions that prevent developers from steering users to alternative distribution channels outside the App Store. The Company has appealed the Commission’s Article 5(4) decision. Also on April 23, 2025, the Commission issued preliminary findings in the Article 6(4) Investigation. If the Commission makes a final determination in the Article 6(4) Investigation that there has been a violation, it can issue a cease and desist order and may impose fines up to 10% of the Company’s annual worldwide net sales. The Commission may also seek to impose additional fines if it deems that the Company has violated a cease and desist order. The Company believes that it complies with the DMA and has continued to make changes to its compliance plan in response to feedback and engagement with the Commission.\nApple Inc. | 2026 Form 10-K | 20"}, {"label": 39, "gold": false, "text": "Derivative Instruments\nThe Company presents derivative assets and liabilities at their gross fair values in the Consolidated Balance Sheets.\nIncome Taxes\nThe Company records certain deferred tax assets and liabilities in connection with the minimum tax on certain foreign earnings created by the TCJA.\nLeases\nThe Company combines and accounts for lease and nonlease components as a single lease component for leases of corporate and retail facilities.\nNote 2 – Revenue\nThe Company recognizes revenue at the amount to which it expects to be entitled when control of products or services is transferred to its customers. Control is generally transferred when the Company has a present right to payment and title and the significant risks and rewards of ownership of products or services are transferred to its customers. For most of the Company’s Products net sales, control transfers when products are shipped. For the Company’s Services net sales, control transfers over time as services are delivered. Payment for Products and Services net sales is collected within a short period following transfer of control or commencement of delivery of services, as applicable.\nThe Company records reductions to Products net sales related to future product returns, price protection and other customer incentive programs based on the Company’s expectations and historical experience.\nFor arrangements with multiple performance obligations, which represent promises within an arrangement that are distinct, the Company allocates revenue to all distinct performance obligations based on their relative stand-alone selling prices (“SSPs”). When available, the Company uses observable prices to determine SSPs. When observable prices are not available, SSPs are established that reflect the Company’s best estimates of what the selling prices of the performance obligations would be if they were sold regularly on a stand-alone basis. The Company’s process for estimating SSPs without observable prices considers multiple factors that may vary depending upon the unique facts and circumstances related to each performance obligation including, where applicable, prices charged by the Company for similar offerings, market trends in the pricing for similar offerings, product-specific business objectives and the estimated cost to provide the performance obligation.\nThe Company has identified the performance obligations regularly included in arrangements involving the sale of iPhone, Mac and iPad. The first material performance obligation, which represents the substantial portion of the allocated sales price, is the hardware and bundled software delivered at the time of sale. The second material performance obligation is the right to receive certain product-related bundled services, which include iCloud®, Siri and Siri AI, and Maps. The Company allocates revenue and any related discounts to all of its performance obligations based on their relative SSPs. Because the Company lacks observable prices for product-related bundled services, the allocation of revenue is based on the Company’s estimated SSPs. Revenue allocated to the delivered hardware and bundled software is recognized when control has transferred to the customer, which generally occurs when the product is shipped. Revenue allocated to product-related bundled services is deferred and recognized on a straight-line basis over the estimated period they are expected to be provided.\nFor certain long-term service arrangements, the Company has performance obligations for services it has not yet delivered. For these arrangements, the Company does not have a right to bill for the undelivered services. The Company has determined that any unbilled consideration relates entirely to the value of the undelivered services. Accordingly, the Company has not recognized revenue, and does not disclose amounts, related to these undelivered services.\nFor the sale of third-party products where the Company obtains control of the product before transferring it to the customer, the Company recognizes revenue based on the gross amount billed to customers. The Company considers multiple factors when determining whether it obtains control of third-party products, including evaluating if it can establish the price of the product, retains inventory risk for tangible products or has the responsibility for ensuring acceptability of the product. For third-party applications sold through the App Store, the Company does not obtain control of the product before transferring it to the customer. Therefore, the Company accounts for all third-party application–related sales on a net basis by recognizing in Services net sales only the commission it retains.\nApple Inc. | 2026 Form 10-K | 38"}]}, {"n": 77, "id": "FE-0761", "slice": "S7", "company": "Allstate Corporation", "form": "10-K", "question": "What was Allstate Corporation's Net income applicable to common shareholders per common share - Diluted (per share) for the three months ended December 31, 2024?", "found": true, "display": "7.07", "scale": "", "unit": "USD per share", "period": "2024-10-01 to 2024-12-31", "dims": {}, "line": "Net income applicable to common shareholders per common share - Diluted 2.11 4.46 7.76 1.13 13.95 4.33 14.37 7.07", "url": "https://www.sec.gov/Archives/edgar/data/899051/000089905126000031/all-20251231.htm", "pages": [{"label": 168, "gold": true, "text": "2025 Form 10-K Notes to Consolidated Financial Statements\nFor the years ended December 31,\n($ in millions) 2025 2024 2023\nCash flows from operating activities\nNet change in proceeds managed\nNet change in fixed income securities $ (228) $ (4) $ 259\nNet change in short-term investments 335 (146) (139)\nOperating cash flow provided (used) $ 107 $ (150) $ 120\nNet change in liabilities\nLiabilities for collateral, beginning of year $ (2,041) $ (1,891) $ (2,011)\nLiabilities for collateral, end of year (1,934) (2,041) (1,891)\nOperating cash flow (used) provided $ (107) $ 150 $ (120)\nNote 20 Other Comprehensive Income (Loss)\nComponents of other comprehensive income (loss) on a pre-tax and after-tax basis\nFor the years ended December 31,\n2025 2024 2023\n($ in millions) Pre-tax Tax After-tax Pre-tax Tax After-tax Pre-tax Tax After-tax\nUnrealized net holding gains and losses arising during the period, net of related offsets $ 983 $ (214) $ 769 $ (495) $ 97 $ (398) $ 1,547 $ (322) $ 1,225\nLess: reclassification adjustment of realized capital gains and losses (379) 80 (299) (293) 62 (231) (539) 113 (426)\nUnrealized net capital gains and losses 1,362 (294) 1,068 (202) 35 (167) 2,086 (435) 1,651\nUnrealized foreign currency translation adjustments 114 (24) 90 (59) 12 (47) 85 (18) 67\nUnamortized pension and other postretirement prior service credit (1) 1 (1) — (3) 1 (2) (20) 4 (16)\nDiscount rate for reserve for future policy benefits (18) 4 (14) 34 (7) 27 (13) 3 (10)\nOther comprehensive income (loss) $ 1,459 $ (315) $ 1,144 $ (230) $ 41 $ (189) $ 2,138 $ (446) $ 1,692\n(1)Represents prior service credits reclassified out of other comprehensive income and amortized into operating costs and expenses.\nNote 21 Quarterly Results (unaudited)\nFirst quarter Second quarter Third quarter Fourth quarter\n($ in millions, except per share data) 2025 2024 2025 2024 2025 2024 2025 2024\nRevenues $ 16,452 $ 15,259 $ 16,633 $ 15,714 $ 17,255 $ 16,627 $ 17,345 $ 16,506\nNet income applicable to common shareholders 566 1,189 2,079 301 3,717 1,161 3,803 1,899\nNet income applicable to common shareholders per common share - Basic 2.13 4.51 7.86 1.14 14.13 4.39 14.55 7.16\nNet income applicable to common shareholders per common share - Diluted 2.11 4.46 7.76 1.13 13.95 4.33 14.37 7.07\nConsolidated net income applicable to common shareholders was $3.80 billion in the fourth quarter of 2025 compared to $1.90 billion in the fourth quarter of 2024, primarily due to improved underwriting results from increased earned premium and improved loss trends and higher investment results.\nThe Allstate Corporation 167"}, {"label": 150, "gold": false, "text": "2025 Form 10-K Notes to Consolidated Financial Statements\nregulatory approval to assess member companies based on their market share during the second preceding calendar year.\nAs a result of the January California wildfires, the FAIR Plan received regulatory approval on February 11, 2025 to assess member insurers $1.00 billion. The Company’s personal lines and commercial lines average market share used for the assessment was 4.6% and 2.0%, respectively, net of credits. Members are allowed to request the state insurance commission’s prior approval to collect temporary supplemental fees from policyholders in the state in order to recoup amounts assessed. Insurers may seek recoupment for 50% of their assessment share up to $1.00 billion, and 100% of amounts exceeding that threshold, for both residential and commercial property insurance. In 2025, the Company paid $45 million toward the FAIR Plan’s $1 billion assessment and has received approval from the California Department of Insurance to recoup 50% of the amount paid.\nAs of September 30, 2025, the FAIR Plan‘s capital balance was a deficit of $444 million. At December 31, 2025, we have accrued for the Company’s share of future estimated assessments based on the January 2025 wildfire event.\nThe Company’s reinsurance program is designed to provide reinsurance protection for catastrophes resulting from multiple perils, including fires. Note 11 includes a summary of the Company’s reinsurance program. Several of the Company’s core traditional markets per occurrence agreements provide for the inclusion of non-recoupable assessments as part of the definition of loss.\nEffective March 1, 2025 through February 28, 2026, the FAIR Plan’s reinsurance program covers losses up to $7.1 billion less retention of $1.25 billion with $3.46 billion placed with reinsurers.\nTexas Windstorm Insurance Association The Company participates as a member of the Texas Windstorm Insurance Association (“TWIA”), which provides wind and hail property coverage to coastal risks unable to procure coverage in the voluntary market. Wind and hail coverage is written on a TWIA-issued policy. TWIA follows a funding structure first utilizing currently available funds set aside from current and prior years. Under the current law, to the extent losses exceed premiums received from policyholders, TWIA utilizes a combination of reinsurance, TWIA-issued securities, as well as member and policyholder assessments to fund loss payments. As of December 31, 2025, the Company’s participation rate in TWIA was 12.8%.\nAny assessments from TWIA for a particular quarter or annual period may be material to the results of operations and cash flows, but not to the financial position of the Company.\nNorth Carolina Joint Underwriters Association The North Carolina Joint Underwriters Association (“NCJUA”) was created to provide property insurance for properties, other than the state’s beach and coastal areas, that insurers are not otherwise willing to insure.\nAll insurers licensed to write property insurance in North Carolina are members of the NCJUA. Premiums, losses and expenses of the NCJUA are shared by the member companies in proportion to their respective North Carolina property insurance writings. Member companies participate in deficits or surpluses based on their participation ratios, which are determined annually. The Company had a $14 million receivable from the NCJUA on December 31, 2025 representing its participation in the NCJUA’s surplus of $87 million for all open years.\nNorth Carolina Insurance Underwriting Association The North Carolina Insurance Underwriting Association (“NCIUA”) provides property insurance, including windstorm coverage, for properties located in the state’s beach and coastal areas that insurers are not otherwise willing to insure. All insurers licensed to write residential and commercial property insurance in North Carolina are members of the NCIUA. Members are assessed in proportion to their North Carolina residential and commercial property insurance writings, which is determined annually and varies by coverage, for plan deficits. As of December 31, 2025, the NCIUA had a surplus of $1.60 billion. No member company is entitled to the distribution of any portion of the NCIUA’s surplus. Legislation in 2009 capped insurers’ assessments for losses incurred in any calendar year at $1.00 billion. Subsequent to an industry assessment of $1.00 billion, if the NCIUA continues to require funding, it may authorize insurers to assess a 10% catastrophe recovery charge on each property insurance policy statewide to be remitted to the NCIUA.\nNew Jersey Property-Liability Insurance Guaranty Association The New Jersey Property-Liability Insurance Guaranty Association (“PLIGA”) serves as the statutory administrator of the Unsatisfied Claim and Judgment Fund (“UCJF”).\nAs statutory administrator of the UCJF, PLIGA provides compensation to qualified claimants for PIP, bodily injury, or death caused by private passenger automobiles operated by uninsured or “hit and run” drivers. The UCJF also provides private passenger pedestrian PIP benefits when no other coverage is available.\nPLIGA annually collects a UCJF assessment from all admitted property and casualty insurers writing motor vehicle liability insurance in New Jersey for UCJF indemnification and expenses. UCJF assessments can be expensed as losses recoverable in rates as appropriate. As of December 31, 2024, the date of its most recent annual financial report, the UCJF fund had a balance of $74 million.\nOther programs The Company is also subject to assessments by the NCRF and the FHCF, which are described in Note 11.\nGuaranty funds\nUnder state insurance guaranty fund laws, insurers doing business in a state can be assessed, up to prescribed limits, for certain obligations of insolvent insurance companies to policyholders and claimants.\nThe Allstate Corporation 149"}, {"label": 169, "gold": false, "text": "2025 Form 10-K\nReport of Independent Registered Public Accounting Firm\nTo the Shareholders and the Board of Directors of The Allstate Corporation\nOpinions on the Financial Statements and Internal Control over Financial Reporting\nWe have audited the accompanying Consolidated Statements of Financial Position of The Allstate Corporation and subsidiaries (the “Company”) as of December 31, 2025 and 2024, the related Consolidated Statements of Operations, Comprehensive Income (Loss), Shareholders’ Equity, and Cash Flows, for each of the three years in the period ended December 31, 2025, and the related notes and the schedules listed in the Index at Item 15 (collectively referred to as the \"financial statements\"). We also have audited the Company’s internal control over financial reporting as of December 31, 2025, based on criteria established in Internal Control – Integrated Framework (2013) issued by the Committee of Sponsoring Organizations of the Treadway Commission (COSO).\nIn our opinion, the financial statements referred to above present fairly, in all material respects, the financial position of the Company as of December 31, 2025 and 2024, and the results of its operations and its cash flows for each of the three years in the period ended December 31, 2025, in conformity with accounting principles generally accepted in the United States of America. Also, in our opinion, the Company maintained, in all material respects, effective internal control over financial reporting as of December 31, 2025, based on criteria established in Internal Control – Integrated Framework (2013) issued by COSO.\nBasis for Opinions\nThe Company’s management is responsible for these financial statements, for maintaining effective internal control over financial reporting, and for its assessment of the effectiveness of internal control over financial reporting, included in the accompanying Item 9A. Controls and Procedures. Our responsibility is to express an opinion on these financial statements and an opinion on the Company’s internal control over financial reporting based on our audits. We are a public accounting firm registered with the Public Company Accounting Oversight Board (United States) (PCAOB) and are required to be independent with respect to the Company in accordance with the U.S. federal securities laws and the applicable rules and regulations of the Securities and Exchange Commission and the PCAOB.\nWe conducted our audits in accordance with the standards of the PCAOB. Those standards require that we plan and perform the audits to obtain reasonable assurance about whether the financial statements are free of material misstatement, whether due to error or fraud, and whether effective internal control over financial reporting was maintained in all material respects.\nOur audits of the financial statements included performing procedures to assess the risks of material misstatement of the financial statements, whether due to error or fraud, and performing procedures to respond to those risks. Such procedures included examining, on a test basis, evidence regarding the amounts and disclosures in the financial statements. Our audits also included evaluating the accounting principles used and significant estimates made by management, as well as evaluating the overall presentation of the financial statements. Our audit of internal control over financial reporting included obtaining an understanding of internal control over financial reporting, assessing the risk that a material weakness exists, and testing and evaluating the design and operating effectiveness of internal control based on the assessed risk. Our audits also included performing such other procedures as we considered necessary in the circumstances. We believe that our audits provide a reasonable basis for our opinions.\nDefinition and Limitations of Internal Control over Financial Reporting\nA company’s internal control over financial reporting is a process designed to provide reasonable assurance regarding the reliability of financial reporting and the preparation of financial statements for external purposes in accordance with generally accepted accounting principles. A company’s internal control over financial reporting includes those policies and procedures that (1) pertain to the maintenance of records that, in reasonable detail, accurately and fairly reflect the transactions and dispositions of the assets of the company; (2) provide reasonable assurance that transactions are recorded as necessary to permit preparation of financial statements in accordance with generally accepted accounting principles, and that receipts and expenditures of the company are being made only in accordance with authorizations of management and directors of the company; and (3) provide reasonable assurance regarding prevention or timely detection of unauthorized acquisition, use, or disposition of the company’s assets that could have a material effect on the financial statements.\nBecause of its inherent limitations, internal control over financial reporting may not prevent or detect misstatements. Also, projections of any evaluation of effectiveness to future periods are subject to the risk that controls may become inadequate because of changes in conditions, or that the degree of compliance with the policies or procedures may deteriorate.\n168 www.allstate.com"}]}, {"n": 78, "id": "FE-0867", "slice": "S7", "company": "U.S. Bancorp", "form": "10-K", "question": "What was U.S. Bancorp's earnings per common share (per share) for the fiscal year ended December 31, 2024?", "found": true, "display": "3.79", "scale": "", "unit": "USD per share", "period": "2024-01-01 to 2024-12-31", "dims": {}, "line": "Earnings per common share $ 4.62 $ 3.79 $ 3.27", "url": "https://www.sec.gov/Archives/edgar/data/36104/000003610426000011/usb-20251231_d2.htm", "pages": [{"label": 45, "gold": true, "text": "U.S. Bancorp\nConsolidated Statement of Income\nYear Ended December 31 (Dollars and Shares in Millions, Except Per Share Data) 2025 2024 2023\nInterest Income\nLoans $ 22,368 $ 23,009 $ 22,324\nLoans held for sale 165 173 147\nInvestment securities 5,398 5,111 4,485\nOther interest income 3,039 3,373 3,051\nTotal interest income 30,970 31,666 30,007\nInterest Expense\nDeposits 10,151 11,688 8,775\nShort-term borrowings 1,373 1,107 1,971\nLong-term debt 2,797 2,582 1,865\nTotal interest expense 14,321 15,377 12,611\nNet interest income 16,649 16,289 17,396\nProvision for credit losses 2,186 2,238 2,275\nNet interest income after provision for credit losses 14,463 14,051 15,121\nNoninterest Income\nCard revenue 1,735 1,679 1,630\nCorporate payment products revenue 765 773 759\nMerchant processing services 1,  models, and management’s assessment of model estimates and related adjustments; 3) adjustments to reflect management’s consideration of qualitative factors; 4) the ACL methodology and governance process. With the support of specialists, we assessed the economic scenarios and related probability weights by, among other procedures, evaluating management’s methodology and agreeing a sample of key economic variables used to external sources. We also performed and considered the results of various sensitivity analyses and analytical procedures, including comparison of a sample of the key economic variables to alternative external sources, historical statistics and peer bank information. With respect to expected loss models, with the support of specialists, we evaluated model calculation design and reperformed the calculation for a sample of models. We also tested the appropriateness of key inputs and assumptions used in these models by agreeing a sample of inputs to internal and external sources. As to model adjustments, with the support of specialists, we evaluated management’s estimate methodology and assessment of factors that could potentially impact the accuracy of expected loss models. We also recalculated a sample of model adjustments and tested internal and external data used by agreeing a sample of inputs to internal and external sources. Regarding the completeness of qualitative factors identified and incorporated into measuring the ACL, with the support of specialists, we evaluated the potential impact of imprecision in the expected loss models and economic scenario assumptions; emerging risks related to changes in the environment impacting specific portfolio segments and portfolio concentrations. We also evaluated and tested internal and external data used in the qualitative adjustments by agreeing significant inputs and underlying data to internal and external sources. We evaluated the overall ACL amount, including model estimates and adjustments, qualitative factors adjustments, and whether the recorded ACL appropriately reflects expected credit losses on the loan and lease portfolio and unfunded credit commitments. We reviewed historical loss statistics, peer-bank information, subsequent events and transactions and considered whether they corroborate or contradict the Company’s measurement of the ACL. We searched for and evaluated information that corroborates or contradicts management’s forecasted assumptions and related probability weights as well as identification and measurement of adjustments to model estimates and qualitative factors.\nWe have served as the Company’s auditor since 2003.\nMinneapolis, Minnesota\nFebruary 23, 2026\n63"}, {"label": 44, "gold": false, "text": "U.S. Bancorp\nConsolidated Balance Sheet\nAt December 31 (Dollars in Millions) 2025 2024\nAssets\nCash and due from banks $ 46,890 $ 56,502\nInvestment securities\nHeld-to-maturity (fair value $67,079 and $66,275, respectively) 76,170 78,634\nAvailable-for-sale ($294 and $320 pledged as collateral, respectively)(a) 90,838 85,992\nLoans held for sale (including $2,353 and $2,251 of mortgage loans carried at fair value, respectively) 2,538 2,573\nLoans\nCommercial 153,958 139,484\nCommercial real estate 48,920 48,859\nResidential mortgages 115,885 118,813\nCredit card 32,234 30,350\nOther retail 40,338 42,326\nTotal loans 391,335 379,832\nLess allowance for loan losses (7,605) (7,583)\nNet loans 383,730 372,249\nPremises and equipment 3,768 3,565\nGoodwill 12,635 12,536\nOther intangible assets 4,904 5,547\nOther assets (including $2,585 and $7,501 of trading securities at fair value pledged as collateral, respectively)(a) 70,872 60,720\nTotal assets $ 692,345 $ 678,318\nLiabilities and Shareholders’ Equity\nDeposits\nNoninterest-bearing $ 84,116 $ 84,158\nInterest-bearing (including $718 and $5,754 of time deposits carried at fair value, respectively) 438,100 434,151\nTotal deposits 522,216 518,309\nShort-term borrowings 17,162 15,518\nLong-t ent.\nAllstate Protection and Run-off Property-Liability segments comprise Property-Liability. The Company does not allocate investment income, net gains and losses on investments and derivatives, or assets to the Allstate Protection and Run-off Property-Liability segments. Management reviews assets at the Property-Liability, Protection Services and Corporate levels for decision-making purposes.\nThe dispositions of the employer voluntary benefits (“EVB”) and group health businesses in 2025 did not qualify for discontinued operations. The Allstate Health and Benefits segment is no longer a reportable segment, with results of this segment recast to reflect only the results of the EVB and group health businesses. The retained individual health business, previously included in the Allstate Health and Benefits segment, does not meet the required thresholds for separate reportable segment disclosure and is presented in all other for all periods presented.\nUnderwriting income is calculated as premiums earned and other revenue, less claims and claims expenses, amortization of deferred policy acquisition costs (“DAC”), operating costs and expenses, amortization or impairment of purchased intangibles and restructuring and related charges as determined using GAAP.\nAdjusted net income (loss) is net income (loss) applicable to common shareholders, excluding:\n• Net gains and losses on investments and derivatives\n• Pension and other postretirement remeasurement gains and losses\n• Amortization or impairment of purchased intangibles\n• Gain or loss on disposition\n• Adjustments for other significant non-recurring, infrequent or unusual items, when (a) the nature of the charge or gain is such that it is reasonably unlikely to recur within two years, or (b) there has been no similar charge or gain within the prior two years\n• Income tax expense or benefit on reconciling items\nA reconciliation of these measures to net income (loss) applicable to common shareholders is provided
