le below.\nChanges in Accumulated Other Comprehensive Income (Loss) by Component(1)\nCurrency Translation Adjustment Unrealized Holding Gains (Losses) on Securities Derivatives Defined Benefit Plans Total\n(Millions of dollars)\nBalance at December 31, 2024 $ (259) $ (19) $ (14) $ (2,468) $ (2,760)\nComponents of Other Comprehensive Income (Loss):\nBefore Reclassifications 61 16 (15) (10) 52\nReclassifications(2) (3) — — 34 83 117\nNet Other Comprehensive Income (Loss) 61 16 19 73 169\nBalance at September 30, 2025 $ (198) $ (3) $ 5 $ (2,395) $ (2,591)\nBalance at December 31, 2025 $ (199) $ (4) $ 8 $ (2,269) $ (2,464)\nComponents of Other Comprehensive Income (Loss):\nBefore Reclassifications (63) 1 (58) 402 282\nReclassifications(2) (3) — — 14 184 198\nNet Other Comprehensive Income (Loss) (63) 1 (44) 586 480\nBalance at September 30, 2026 $ (262) $ (3) $ (36) $ (1,683) $ (1,984)\n(1)All amounts are net of tax.\n(2)Refer to Note 14 Financial and Derivative Instruments for reclassified components of cash flow hedging.\n(3)Refer to Note 8 Employee Benefits for reclassified components, including amortization of actuarial gains or losses, amortization of prior service costs, and special events, including settlements, totaling $243 that are included in employee benefit costs for the nine months ended September 30, 2026. Related income taxes for the same period, totaling $59, are reflected in “Income Tax Expense (Benefit)” on the Consolidated Statement of Income. All other reclassified amounts were insignificant.\n8"}, {"label": 19, "gold": false, "text": "Table of Contents\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS - (Continued)\nNote 12. Other Contingencies and Commitments\nIncome Taxes The company calculates its income tax expense and liabilities quarterly. These liabilities generally are subject to audit and are not finalized with the individual taxing authorities until several years after the end of the annual period for which income taxes have been calculated.\nSettlement of open tax years, as well as other tax issues in countries where the company conducts its businesses, is not expected to have a material effect on the consolidated financial position or liquidity of the company and, in the opinion of management, adequate provision has been made for income taxes for all years under examination or subject to future examination.\nGuarantees The company has provided certain guarantees in the ordinary course of business, including financial and performance guarantees related to equity affiliates. Chevron has no material guarantees outstanding.\nIndemnifications The company often includes standard indemnification provisions in its arrangements with its partners, suppliers and vendors in the ordinary course of business, the terms of which range in duration and sometimes are not limited. The company may be obligated to indemnify such parties for losses or claims suffered or incurred in connection with its service or other claims made against such parties.\nLong-Term Unconditional Purchase Obligations and Commitments, Including Throughput and Take-or-Pay Agreements The company and its subsidiaries have certain contingent liabilities with respect to long-term unconditional purchase obligations and commitments, including throughput and take-or-pay agreements, some of which may relate to suppliers’ financing arrangements. The agreements typically provide goods and services, such as pipeline and storage capacity, utilities, and petroleum products, to be used or sold in the ordinary course of the company’s business.\nEnvironmental The company is subject to loss contingencies pursuant to laws, regulations, private claims and legal proceedings related to environmental matters that are subject to legal settlements or that in the future may require the company to take action to correct or ameliorate the effects on the environment of prior release of chemicals or petroleum substances by the company or other parties. Such contingencies may exist for various operating, closed and divested sites, including, but not limited to, U.S. federal Superfund sites and analogous sites under state laws, refineries, chemical plants, marketing facilities, crude oil fields, and mining sites.\nAlthough the company has provided for known environmental obligations that are probable and reasonably estimable, it is likely that the company will continue to incur additional liabilities. The amount of additional future costs is not fully determinable due to such factors as the unknown magnitude of possible contamination, the unknown timing and extent of the corrective actions that may be required, the determination of the company’s liability in proportion to other responsible parties, and the extent to which such costs are recoverable from third parties. These future costs may be material to results of operations in the period in which they are recognized, but the company does not expect these costs will have a material effect on its consolidated financial position or liquidity.\nDecommissioning Obligations for Previously Divested Assets Some assets are divested along with their related liabilities, such as decommissioning obligations. In certain instances, such transferred obligations have returned and may continue to return to the company. To the extent the current owners of the company’s previously divested assets default on their decommissioning obligations, regulators may require that Chevron assume such obligations. The nature and amount of the loss is disclosed when it is reasonably possible that the loss could be material. The company accrues a liability when management determines the obligation to be both probable and reasonably estimable. The company could have additional significant obligations revert, primarily in the United States, but is not currently aware of any such obligations that are reasonably possible to be material. The liability balance at September 30, 2026 is $1.9 billion.\nOther Contingencies The company and its affiliates continue to review and analyze their operations and may close, retire, sell, exchange, acquire or restructure assets to achieve operational or strategic benefits and to improve competitiveness and profitability. These activities, individually or together, may result in significant gains or losses in future periods.\n19"}]}, {"n": 40, "id": "FE-0404", "slice": "S4", "company": "Chevron Corporation", "form": "10-Q", "question": "What was Chevron Corporation's contributions from noncontrolling interests for the nine months ended September 30, 2026?", "found": true, "display": "9", "scale": "millions", "unit": "USD", "period": "2026-01-01 to 2026-09-30", "dims": {}, "line": "Contributions from noncontrolling interests 9 8", "url": "https://www.sec.gov/Archives/edgar/data/93410/000009341026000200/cvx-20260930.htm", "pages": [{"label": 9, "gold": true, "text": "Table of Contents\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS - (Continued)\nNote 3. Information Relating to the Consolidated Statement of Cash Flows\nNine Months Ended September 30\n2026 2025\n(Millions of dollars)\nDistributions more (less) than income from equity affiliates included the following:\nDistributions from equity affiliates $ 5,764 $ 4,139\n(Income) loss from equity affiliates (4,967) (2,337)\nDistributions more (less) than income from equity affiliates $ 797 $ 1,802\nNet decrease (increase) in operating working capital was composed of the following:\nDecrease (increase) in accounts and notes receivable $ (8,098) $ 4,018\nDecrease (increase) in inventories (1,675) (767)\nDecrease (increase) in prepaid expenses and other current assets (1,182) (375)\nIncrease (decrease) in accounts payable and accrued liabilities 7,242 (4,193)\nIncrease (decrease) in income and other taxes payable 1,495 (1,368)\nNet decrease (increase) in operating working capital $ (2,218) $ (2,685)\nNet cash provided by operating activities included the following cash payments:\nInterest on debt (net of capit ets 3,663 3,658 10,591 10,035\nInternational Developmental Licensed Markets & Corporate 709 648 1,988 1,793\nTotal Revenues $ 7,157 $ 7,078 $ 20,773 $ 19,876\nU.S. $ 324 $ 325 $ 967 $ 968\nInternational Operated Markets 362 341 1,075 971\nInternational Developmental Licensed Markets & Corporate — — — 1\nTotal Franchised restaurants-occupancy expenses $ 687 $ 666 $ 2,042 $ 1,940\nU.S. $ 667 $ 701 $ 2,029 $ 2,040\nInternational Operated Markets 1,292 1,357 3,869 3,765\nInternational Developmental Licensed Markets & Corporate 129 115 360 304\nTotal Company-operated restaurant expenses $ 2,088 $ 2,172 $ 6,258 $ 6,109\nU.S. $ 145 $ 185 $ 432 $ 478\nInternational Operated Markets 192 170 570 505\nInternational Developmental Licensed Markets & Corporate 422 429 1,333 1,185\nTotal Selling, general, & administrative expenses $ 759 $ 785 $ 2,335 $ 2,167\nU.S. $ 24 $ 63 $ 188 $ 235\nInternational Operated Markets 20 28 51 108\nInternational Developmental Licensed Markets & Corporate (17) 7 12 80\nTotal Other segment expenses (income)* $ 27 $ 98 $ 250 $ 423\nU.S. $ 1,625 $ 1,498 $ 4,578 $ 4,327\nInternational Operated Markets 1,796 1,761 5,026 4,686\nInternational Developmental Licensed Markets & Corporate 174 97 283 224\nTotal Operating income $ 3,595 $ 3,357 $ 9,887 $ 9,237\nU.S. $ 332 $ 400 $ 963 $ 943\nInternational Operated Markets 548 607 1,417 1,347\nInternational Developmental Licensed Markets & Corporate 4 3 22 16\nTotal Capital expenditures $ 884 $ 1,011 $ 2,401 $ 2,306\nU.S. $ 245 $ 249 $ 741 $ 742\nInternational Operated Markets 212 201 642 579\nInternational Developmental Licensed Markets & Corporate 110 109 315 303\nTotal Depreciation & amortization** $ 567 $ 559 $ 1,698 $ 1,623\nIn millions September 30, 2026 December 31, 2025\nU.S. $ 23,249 $ 23,008\nInternational Operated Markets 28,000 27,487\nInternational Developmental Licensed Markets & Corporate 9,407 9,020\nTotal Assets $ 60,657 $ 59,515\n*Other segment expenses (income) is the difference between revenues nction with the accompanying Condensed Consolidated Financial Statements and the notes thereto, and the audited Consolidated Financial Statements and notes thereto included in our 2025 Annual Report on Form 10-K.\nCertain columns and rows in financial tables within MD&A may not add due to rounding. Percentages have been calculated from the underlying whole-dollar amounts for all periods presented.\nOverview\nThe Company franchises and owns and operates McDonald's restaurants, which serve a locally relevant menu of quality food and beverages in communities across more than 100 countries. Of the 46,554 McDonald's restaurants at September 30, 2026, approximately 95% were franchised.\nThe Company's reporting segments are aligned with its strategic priorities and reflect how management reviews and evaluates operating performance. Significant reportable segments include the United States (\"U.S.\") and International Operated Markets. In addition, the International Developmental Licensed Markets & Corporate includes the results of over 75 countries as well as Corporate activities.\nMcDonald's franchised restaurants are owned and operated under one of the following structures - conventional franchise, developmental license or affiliate. The optimal ownership structure for an individual restaurant, trading area or market (country) is based on a variety of factors, including the availability of individuals with entrepreneurial experience and financial resources, as well as the local legal and regulatory environment in critical areas such as property ownership and franchising. The business relationship between the Company and its independent franchisees is supported by adhering to standards and policies, including McDonald's Global Brand Standards, and is of fundamental importance to overall performance and to protecting the McDonald’s brand.\nThe Company is primarily a franchisor and believes franchising is paramount to delivering great-tasting food, locally relevant customer experiences and driving profitability. Franchising enables an individual to be their own employer and maintain control over all employment related matters, marketing and pricing decisions, while also benefiting from the strength of McDonald's global brand, operating system and financial resources.\nDirectly operating McDonald's restaurants contributes significantly to the Company's ability to act as a credible franchisor. One of the strengths of the franchising model is that the expertise from Company-owned and operated restaurants allows McDonald's to improve the operations and success of all restaurants, and allows innovations from franchisees to be tested and, when viable, efficiently implemented across relevant restaurants. Having Company-owned and operated restaurants provides Company personnel with a venue for restaurant operations training experience. In addition, in our Company-owned and operated restaurants, and in collaboration with franchisees, the Company is able to further develop and refine operating standards, marketing concepts and product and pricing strategies.\nThe Company's revenues consist of sales by Company-owned and operated restaurants and fees from franchised restaurants operated by conventional franchisees, developmental licensees and affiliates. Fees vary by type of site, amount of Company investment, if any, and local business conditions. These fees, along with occupancy and operating rights, are stipulated in franchise/license agreements that generally have 20-year terms. The Company's Other revenues are comprised of fees paid by franchisees to recover a portion of costs incurred by the Company for various technology and digital platforms, and revenues from brand licensing arrangements to market and sell consumer packaged goods using the McDonald's brand.\nConventional Franchise\nUnder a conventional franchise arrangement, the Company generally owns or secures a long-term lease on the land and building for the restaurant location and the franchisee pays for equipment, signs, seating and décor. The Company believes that ownership of real estate, combined with the co-investment by franchisees, enables it to achieve restaurant performance levels that are among the highest in the industry.\nFranchisees are responsible for reinvesting capital in their businesses over time. In addition, to accelerate implementation of certain initiatives, the Company may co-invest with franchisees to fund improvements to their restaurants or operating systems. These investments, developed in collaboration with franchisees, are designed to cater to consumer preferences, improve local business performance and increase the value of the McDonald's brand through the development of modernized, more attractive and higher revenue generating restaurants.\nThe Company requires franchisees to meet rigorous standards and generally does not work with passive investors. The business relationship with franchisees is designed to facilitate consistency and high quality at all McDonald’s restaurants. Conventional franchisees contribute to the Company's revenue, primarily through the payment of rent and royalties based upon a percent of sales, with specified minimum rent payments, along with initial fees paid upon the opening of a new restaurant or grant of a new franchise. The Company's heavily franchised business model is designed to generate stable and predictable revenue, which is largely a function of franchisee sales, and resulting cash flow streams.\n16"}]}, {"n": 42, "id": "FE-0383", "slice": "S4", "company": "Adobe Inc.", "form": "10-K", "question": "What was Adobe Inc.'s lapse of statute of limitations for the fiscal year ended November 28, 2025?", "found": true, "display": "60", "scale": "millions", "unit": "USD", "period": "2024-11-30 to 2025-11-28", "dims": {}, "line": "Lapse of statute of limitations (60) (63)", "url": "https://www.sec.gov/Archives/edgar/data/796343/000079634326000003/adbe-20251128.htm", "pages": [{"label": 72, "gold": true, "text": "Table of Contents\nADOBE INC.\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS (Continued)\nvarious years from fiscal 2026 through 2039. We also had federal and state capital loss carryforwards of $1.13 billion, most of which will expire in 2029. Certain tax loss and credit carryforwards are subject to limitations and/or are reduced by a valuation allowance. The net carrying amount of such assets is expected to be fully realized.\nIn assessing the realizability of deferred tax assets, management determined that it is more likely than not that we will not fully realize certain available tax assets. Deferred tax assets are offset by a valuation allowance to the extent it is more likely than not that they are not expected to be realized. As of November 28, 2025, we continue to maintain a valuation allowance of $806 million primarily related to certain U.S. state and federal credits and capital loss carryforwards. For fiscal 2025, the increase in the valuation allowance was $81 million.\nAs we repatriate foreign earnings for use in the United States, the distributions will generally be exempt from federal income taxes. As of November 28, 2025, the cumulative amount of foreign earnings considered permanently reinvested upon which taxes have not been provided, and the corresponding unrecognized deferred tax liability, was not material.\nAccounting for Uncertainty in Income Taxes\nDuring fiscal 2025 and 2024, the aggregate changes in our total gross amount of unrecognized tax benefits were as follows:\n(in millions) 2025 2024\nBeginning balance $ 683 $ 501\nGross increases in unrecognized tax benefits – prior year tax positions 12 6\nGross decreases in unrecognized tax benefits – prior year tax positions (50) (10)\nGross increases in unrecognized tax benefits – current year tax positions 108 269\nLapse of statute of limitations (60) (63)\nTax settlements — (20)\nEnding balance $ 693 $ 683\nOur policy is to record interest and penalties related to uncertain tax positions within the provision for income taxes. As of November 28, 2025 and November 29, 2024, the combined amounts of accrued interest and penalties included in long-term income taxes payable related to tax positions taken on our tax returns were not material.\nWhile we file federal, state and local income tax returns globally, our major tax jurisdictions are the United States, California and Ireland. We are subject to the examination of our income tax returns by various domestic and foreign tax authorities with 2021 being the earliest fiscal year open for examination in our major tax jurisdictions. We regularly assess the likelihood of outcomes resulting from examinations to determine the adequacy of our provision for income taxes and have reserved for potential adjustments that may result. While we believe our tax estimates are reasonable, we cannot provide assurance that the final determination of any of these examinations will not have an adverse effect on our financial position and results of operations.\nThe timing of the resolution of income tax examinations is highly uncertain as are the amounts and timing of tax payments that are part of any audit settlement process. These events could cause large fluctuations in the balance sheet classification of our tax assets and liabilities. We believe that within the next 12 months, it is reasonably possible that either certain audits will conclude or statutes of limitations on certain income tax examination periods will expire, or both. Although the timing of resolution, settlement and closing of audits is not certain, it is reasonably possible that the underlying unrecognized tax benefits may decrease by up to $40 million over the next 12 months.\n73"}, {"label": 77, "gold": false, "text": "Table of Contents\nADOBE INC.\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS (Continued)\nNOTE 14. STOCK REPURCHASE PROGRAM\nTo facilitate our stock repurchase program, designed to return value to our stockholders and minimize dilution from stock issuances, we may repurchase our shares in the open market or enter into structured repurchase agreements with third parties. In March 2024, our Board of Directors granted authority to repurchase up to $25 billion in our common stock through March 14, 2028. In September 2025, we entered into a stock repurchase arrangement with a large financial institution to execute up to $2.5 billion in open market repurchases, which remained partially outstanding as of November 28, 2025. Upon completion of this arrangement, $5.90 billion remains under our March 2024 stock repurchase authority.\nShare repurchase activities for fiscal 2025, 2024 and 2023 were as follows:\n(in millions) Number of Shares Delivered Amount Paid\nFiscal 2025\nAccelerated share repurchase agreements 16.8 $ 6,250\nOpen market repurchases 14.0 5,031\nTotal 30.8 $ 11,281\nFiscal 2024\nAccelerated share repurchase agreements 16.9 $ 9,500\nOther structured stock repurchases 0.6 — (1)\nTotal 17.5 $ 9,500\nFiscal 2023\nAccelerated share repurchase agreements 4.0 $ 1,400\nOther structured stock repurchases 7.5 3,000\nTotal 11.5 $ 4,400\n_________________________________________\n(1) During fiscal 2024, we received the final delivery of shares under a structured stock repurchase agreement entered into in fiscal 2023.\nUnder the terms of our accelerated share repurchase agreements, financial institutions agree to deliver a portion of shares to us at contract inception and the remaining shares at settlement. The total number of shares delivered and average purchase price paid per share are determined upon settlement based on the Volume Weighted Average Price (“VWAP”) over the term of the contract, less an agreed upon discount. Under the terms of our other structured stock repurchase agreements, financial institutions agree to deliver shares to us at monthly intervals during the respective contract terms, and the number of shares delivered each month are determined based on the total notional amount of the contracts, the number of trading days in the intervals and the VWAP during the intervals, less an agreed upon discount.\nPrepayments for stock repurchases are classified as treasury stock, a component of stockholders’ equity on our Consolidated Balance Sheets, at the payment date, though only shares physically delivered to us by the end of the respective period are excluded from the computation of net income per share.\n78"}, {"label": 73, "gold": false, "text": "Table of Contents\nADOBE INC.\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS (Continued)\nNOTE 11. BENEFIT PLANS\nRetirement Savings Plan\nThe Adobe Inc. 401(k) Retirement Savings Plan, qualified under Section 401(k) of the Internal Revenue Code, is a retirement savings plan covering substantially all of our U.S. employees. Under the plan, eligible employees may contribute up to 65% of their pretax or after-tax salary, subject to the IRS annual contribution limits. In fiscal 2025, we matched 50% of the first 6% of the employee’s eligible compensation. We contributed $96 million, $91 million and $85 million in fiscal 2025, 2024 and 2023, respectively. We are under no obligation to continue matching future employee contributions and, at our discretion, may change our practices at any time.\nDeferred Compensation Plan\nThe Adobe Inc. Deferred Compensation Plan is an unfunded, non-qualified, deferred compensation arrangement under which certain executives are able to defer a portion of their annual compensation. Participants may elect to contribute up to 75% of their base salary and 100% of other specified compensation, including commissions and bonuses. Members of the Board of Directors are also eligible to participate and are able to defer their directors’ fees and elect cash benefit distributions in the same manner as executives. Additionally, members of the Board are permitted to defer equity awards. Participants are able to elect the payment of benefits to begin on a specified date at least three years after the end of the plan year in which election is made or, with respect to equity awards, vests. For cash benefit elections, distributions are made in cash in the form of a lump sum, or five, ten, or fifteen-year annual installments. For equity award elections, distributions are made in stock in the form of a lump sum payment only.\nCertain deferred compensation is invested in money market and other mutual funds and subsequently recorded as other assets on our Consolidated Balance Sheets, with corresponding unrealized holding gains and losses recorded as investment gains (losses) in our Consolidated Statements of Income. Undistributed deferred compensation is recorded as other liabilities on our Consolidated Balance Sheets.\nAs of November 28, 2025 and November 29, 2024, the invested amounts under the plan totaled $342 million and $283 million, respectively. As of November 28, 2025 and November 29, 2024, undistributed deferred compensation due to participants totaled $354 million and $297 million, respectively.\nNOTE 12. STOCK-BASED COMPENSATION\nOur stock-based compensation programs are long-term retention programs that are intended to attract, retain and provide incentives for employees, officers and directors, and to align stockholder and employee interests. We have the following stock-based compensation plans and programs:\nRestricted Stock Units and Performance Share Programs\nWe grant restricted stock units and performance share awards to eligible employees under our 2019 Equity Incentive Plan (“2019 Plan”). Restricted stock units generally vest over four years. Certain grants have other vesting periods approved by the Executive Compensation Committee of our Board of Directors (the “ECC”).\nAs of November 28, 2025, we had reserved 76.0 million shares of our common stock for issuance under our 2019 Plan and had 32.8 million shares available for grant.\nOur Performance Share Programs aim to help focus key employees on building stockholder value, provide significant award potential for achieving outstanding company performance and enhance our ability to attract and retain highly talented and competent individuals. The ECC approves the terms of each of our Performance Share Programs, including the award calculation methodology. In January 2025, the ECC approved the 2025 Performance Share Program.\nShares outstanding under our 2025, 2024 and 2023 Performance Share Programs may be earned based on the achievement of (i) an objective relative total stockholder return measured over a three-year performance period, as well as (ii) revenue-based financial metrics measured over three one-year performance periods. Each type of performance goal is weighted\n74"}]}, {"n": 43, "id": "FE-0494", "slice": "S4", "company": "Verizon Communications Inc.", "form": "10-Q", "question": "What was Verizon Communications Inc.'s Income Before Provision For Income Taxes for the nine months ended September 30, 2026?", "found": true, "display": "18,875", "scale": "millions", "unit": "USD", "period": "2026-01-01 to 2026-09-30", "dims": {}, "line": "Income Before Provision For Income Taxes $ 6,817 $ 6,527 $ 18,875 $ 19,609", "url": "https://www.sec.gov/Archives/edgar/data/732712/000073271226000052/vz-20260930.htm", "pages": [{"label": 34, "gold": true, "text": "Table of Contents\nA reconciliation of the total reportable segments' operating income to consolidated income before provision for income taxes is as follows:\nThree Months Ended Nine Months Ended\nSeptember 30, September 30,\n(dollars in millions) 2026 2025 2026 2025\nTotal reportable segments operating income(1) $ 8,948 $ 8,380 $ 26,641 $ 24,917\nCorporate and other(1) (213) (215) (646) (586)\nOther components of net periodic benefit charges (Note 8) (28) (8) (70) (24)\nSeverance charges — — (397) —\nAcquisition and integration related charges (57) (52) (453) (52)\nAsset rationalization — — (258) —\nLoss on disposition of business — — (746) —\nTotal consolidated operating income 8,650 8,105 24,071 24,255\nEquity in earnings (losses) of unconsolidated businesses (3) (6) 46 (3)\nOther income, net 120 92 633 292\nInterest expense (1,950) (1,664) (5,875) (4,935)\nIncome Before Provision For Income Taxes $ 6,817 $ 6,527 $ 18,875 $ 19,609\n(1) Historical segment results have been reclassified to conform to the current period presentation. See Note 3 for additional information.\nNo single customer accounted for more than 10% of our total operating revenues during the three and nine months ended September 30, 2026 or 2025.\nThe CODM does not review disaggregated assets on a segment basis; therefore, such information is not presented. Depreciation and amortization included in the measure of segment profitability is primarily allocated based on proportional usage, and is included within Total reportable segments operating income.\nNote 11. Additional Financial Information\nWe maintain a voluntary supplier finance program with a financial institution which provides certain suppliers the option, at their sole discretion, to participate in the program and sell their receivables due from Verizon to the financial institution on a non-recourse basis. As of September 30, 2026 and December 31, 2025, $477 million and $723 million, respectively, remained as confirmed obligations outstanding related to suppliers participating in the supplier finance program.\nNote 12. Commitments and Contingencies\nIn the ordinary course of business, Verizon is involved in various litigation and regulatory proceedings at the state and federal level. Where it is determined, in consultation with counsel based on litigation and settlement risks, that a loss is probable and estimable in a given matter, Verizon establishes an accrual. In none of the currently pending matters is the amount of accrual material. An estimate of the reasonably possible loss or range of loss in excess of the amounts already accrued cannot be made at this time due to various factors typical in contested proceedings, including: (1) uncertain damage theories and demands; (2) a less than complete factual record; (3) uncertainty concerning legal theories and their resolution by courts or regulators; and (4) the unpredictable nature of the opposing party and its demands. We continuously monitor these proceedings as they develop and adjust any accrual or disclosure as needed. We do not expect that the ultimate resolution of any pending regulatory or legal matter in future periods will have a material effect on our financial condition, but it could have a material effect on our results of operations for a given reporting period.\nVerizon is currently involved in numerous federal district court actions alleging that Verizon is infringing various patents. Most of these cases are brought by non-practicing entities and effectively seek only monetary damages; a small number are brought by companies that have sold products and could seek injunctive relief as well. These cases have progressed to various stages and a small number may have gone to trial or may go to trial in the coming 12 months if they are not otherwise resolved.\nIn connection with the execution of agreements for the sales of businesses and investments, Verizon ordinarily provides representations and warranties to the purchasers pertaining to a variety of nonfinancial matters, such as ownership of the securities being sold, as well as indemnity from certain financial losses. From time to time, counterparties may make claims under these provisions, and Verizon will seek to defend against those claims and resolve them in the ordinary course of business.\nAs of September 30, 2026, Verizon had 29 renewable energy purchase agreements (REPAs) with third parties. Each of the REPAs is based on the expected operation of a renewable energy-generating facility and has a fixed price term of 12 to 20 years from the commencement of the facility's entry into commercial operation. Twenty-two of the facilities have entered into\n35"}, {"label": 9, "gold": false, "text": "Table of Contents\nAccounts Receivable and Contract Balances\nThe timing of revenue recognition may differ from the time of billing to our customers. Receivables presented in our condensed consolidated balance sheets represent an unconditional right to consideration. Contract balances represent amounts from an arrangement when either Verizon has performed, by transferring goods or services to the customer in advance of receiving all or partial consideration for such goods and services from the customer, or the customer has made the required payment to Verizon in advance of obtaining control of the goods and/or services promised to the customer in the contract.\nThe following table presents information about receivables from contracts with customers:\nAt September 30, At December 31,\n(dollars in millions) 2026 2025\nAccounts Receivable(1) $ 9,593 $ 9,646\nDevice payment plan agreement receivables(2) 20,018 21,726\n(1)Balances do not include receivables related to the following: activity associated with certain vendor agreements, leasing arrangements (such as those for towers and equipment), captive reinsurance arrangements primarily related to wireless device insurance and device payment plan agreement receivables presented separately.\n(2)Included in device payment plan agreement receivables presented in Note 6. Receivables derived from the sale of equipment on a device payment plan through an authorized agent are excluded.\nContract assets relate to our conditional right to receive consideration for goods or services provided to customers. Under fixed-term plans, an asset is created because the equipment revenue recognized upon sale exceeds the consideration received; this asset is subsequently reclassified to accounts receivable as wireless services are provided and billed. These balances are reported in our condensed consolidated balance sheets as Prepaid expenses and other and Other assets. The allowance for credit losses is recognized at inception and reassessed quarterly.\nContract liabilities arise when we bill our customers and receive consideration in advance of providing the goods or services promised in the contract. We typically bill service one month in advance, which is the primary component of the contract liability balance. Contract liabilities are recognized as revenue when services are provided to the customer. The contract liability balances are presented in our condensed consolidated balance sheets as Other current liabilities and Other liabilities.\nRevenues recognized related to contract liabilities existing at January 1, 2026 were $159 million and $5.0 billion for the three and nine months ended September 30, 2026, respectively. Revenues recognized related to contract liabilities existing at January 1, 2025 were $145 million and $5.0 billion for the three and nine months ended September 30, 2025, respectively.\nThe balances of contract assets and contract liabilities recorded in our condensed consolidated balance sheets were as follows:\nAt September 30, At December 31,\n(dollars in millions) 2026 2025\nAssets\nPrepaid expenses and other $ 478 $ 518\nOther assets 284 259\nTotal Contract Assets $ 762 $ 777\nLiabilities\nOther current liabilities $ 7,401 $ 7,576\nOther liabilities 2,142 2,433\nTotal Contract Liabilities $ 9,543 $ 10,009\nContract Costs\nTopic 606 requires an asset to be recognized for incremental costs to obtain a customer contract, which are then amortized to expense over the period of expected benefit. We recognize an asset for incremental commission expenses paid to internal and external sales personnel and agents, deferring these costs only when they are incremental and expected to be recoverable. The costs are amortized ratably as commission expense over the period of service transfer. Specifically, costs for postpaid wireless contracts (Consumer and Business) are amortized over the estimated upgrade cycles. Prepaid wireless and Consumer wireline contracts are amortized over the estimated customer relationship period. Costs to obtain contracts are recorded in Selling, general and administrative expense in our condensed consolidated statements of income.\nWe also defer costs incurred to fulfill contracts that: (1) relate directly to the contract; (2) are expected to generate resources that will be used to satisfy our performance obligation under the contract; and (3) are expected to be recovered through revenue generated under the contract. Contract fulfillment costs are expensed as we satisfy our performance obligations and recorded in Cost of services. These costs principally relate to direct costs that enhance our wireline business resources, such as costs incurred to install circuits.\n10"}, {"label": 33, "gold": false, "text": "Table of Contents\nNine Months Ended September 30,\n2026 2025\n(dollars in millions) Consumer Business Total Reportable Segments Consumer Business Total Reportable Segments\nExternal Operating Revenues\nMobility and broadband service(1) $ 58,374 $ 11,107 $ 69,481 $ 56,674 $ 11,171 $ 67,845\nWireless equipment 13,279 2,542 15,821 14,667 2,605 17,272\nOther(2)(6) 7,254 7,637 14,891 6,805 7,020 13,825\nIntersegment revenues 220 22 242 225 22 247\nTotal Operating Revenues(6) 79,127 21,308 100,435 78,371 20,818 99,189\nOperating Expenses(3)\nCost of wireless equipment 14,626 3,562 18,188 15,988 3,608 19,596\nCentrally managed network and shared service costs(4)(6) 13,654 6,741 20,395 13,522 6,767 20,289\nDepreciation and amortization expense(6) 11,389 3,226 14,615 10,693 2,989 13,682\nOther segment expenses(5)(6) 15,619 4,977 20,596 15,437 5,268 20,705\nTotal Operating Expenses(6) 55,288 18,506 73,794 55,640 18,632 74,272\nOperating Income(6) $ 23,839 $ 2,802 $ 26,641 $ 22,731 $ 2,186 $ 24,917\n(1) Mobility and broadband service revenue primarily includes revenue from mobility communication services, FWA broadband, Fios internet and other fiber-based services.\n(2) Other revenue pr n on significant issuances of long-term debt during fiscal 2026, for general corporate purposes, is as follows:\n(Amounts in millions)\nIssue Date Principal Amount Maturity Date Interest Rate Net Proceeds\nApril 28, 2025 $750 April 28, 2027 Floating $ 749\nApril 28, 2025 $750 April 28, 2027 4.100% 748\nApril 28, 2025 $1,000 April 28, 2030 4.350% 993\nApril 28, 2025 $1,500 April 28, 2035 4.900% 1,493\nTotal $ 3,983\nThese issuances are senior, unsecured notes which rank equally with all other senior, unsecured debt obligations of the Company, and are not convertible or exchangeable. These issuances do not contain any financial covenants which restrict the Company's ability to pay dividends or repurchase Company stock.\nMaturities\nThe following tables provide details of significant long-term debt maturities during fiscal 2026 and 2025, respectively:\n(Amounts in millions)\nMaturity Date Principal Amount Interest Rate Repayment\nJune 26, 2025 $875 3.550% $ 875\nSeptember 9, 2025 $1,750 3.900% 1,750\nTotal $ 2,625\n67"}, {"label": 16, "gold": false, "text": "If the quality or safety of products offered for sale on our third-party marketplace fails to meet our customers' expectations or regulatory standards, we could be held directly liable, lose customers, become subject to regulatory enforcement or otherwise experience reputational harm.\nSome of the products customers buy from our website are sold by third parties, which we refer to as marketplace transactions. While that transaction ultimately occurs between the third-party seller and the customer, some regulators and courts have taken a view that the retailer is responsible for marketplace transactions that occur on a retailer's digital platform. Unsettled law on whether a retailer is responsible for intellectual property or product liability claims related to marketplace transactions creates additional risk. Any unfavorable changes or legal interpretations could further expose us to liability. Our arrangements with our third-party marketplace sellers are complex and we may not be able to implement, maintain and develop the components of these commercial relationships, which may include fulfillment, inventory management, tax collection, payment processing, content and engaging other third parties to perform services.\nIn addition, poor quality or safety of third-party products offered for sale on our platforms could erode customer trust, leading to loss of sales, reduction in transactions and deterioration of our competitive position. In addition, we may face reputational, financial and other risks, including liability for third-party products offered for sale on our platform that are controversial, counterfeit, pirated or stolen or that infringe the intellectual property rights of others. We may not be able to collect sufficient damages for these types of breaches from third-party sellers. Furthermore, even if we are successful in negotiating a contractual shift in risk of loss to third parties, a regulator may view us as having responsibility for regulatory compliance of the third-party products offered for sale on our platform. Although we have marketplace compliance controls in place and impose contractual terms on sellers to prohibit sales of non-compliant products, we may not be able prevent sellers from offering prohibited items for sale, enforce such terms or fully protect against regulatory risk. Any of these events could have a material adverse impact on our business and results of operations and impede the execution of our eCommerce growth and enterprise strategy.\nWe rely extensively on information and financial systems to process transactions, summarize results and manage our business. Disruptions in our systems could harm our ability to conduct our operations.\nGiven the number of individual transactions we have each year, it is crucial that we maintain uninterrupted operation of our business-critical information systems. Our information systems are subject to damage or interruption from power outages, computer and telecommunications failures, computer viruses, ransomware, worms, other malicious computer programs, denial-of-service attacks, security incidents and breaches from a variety of threat actors, including both cybercriminals and nation state-sponsored actors and catastrophic events noted above in this Item 1A. The availability of our information systems and the integrity of data are essential to our business operations, including the processing of transactions, management of our associates, facilities, logistics, inventories, physical stores and clubs and our online operations. Our information systems are not fully redundant and our disaster recovery planning cannot account for all eventualities. If our systems are damaged, breached, attacked, interrupted or otherwise cease to function properly, we may have to make a significant investment to repair or replace them, and may experience loss or corruption of data as well as suffer interruptions in our business operations in the interim. Any interruption to the availability of our information systems or corruption of our data may have a material adverse effect on our business or results of operations. In addition, the cost of securing our systems against failure or attack is considerable, and increases in these costs, particularly in the wake of a breach or failure, could be significant.\nIn addition, we frequently update our information technology hardware, software, processes and systems. The risk of system disruption is increased when significant system changes are undertaken. If we fail to timely or successfully integrate and update our information systems and processes, system disruptions may occur and we may fail to realize the cost savings or operational benefits anticipated to be derived from these initiatives and our business, results of operations, financial condition and cash flows could be negatively impacted.\nIf the technology-based systems that give our customers the ability to shop with us online and enable us to deliver products and services do not function effectively, or keep pace with similar offerings of our competitors, our operating results, as well as our ability to grow our omnichannel business globally, could be materially adversely affected.\nAs noted above, customers are using digital means, including websites, captive and third-party digital applications, social media, and emerging agentic platforms to shop with us and our competitors and to do comparison shopping, and we use these digital means along with digital advertising, text messages and email to interact with our customers and enhance their shopping experience. As a part of our omnichannel sales strategy, we offer various pickup, delivery and shipping programs including options where many products available for purchase online can be picked up by the customer or member at a local Walmart store or Sam's Club, which provides additional customer traffic at such stores and clubs. Omnichannel retailing is a rapidly evolving part of the retail industry and of our operations around the world, and we continue to make investments in supply chain automation and enhancements to support our omnichannel strategy. We must anticipate and meet our customers' changing expectations while adjusting for technology investments and developments in our competitors' operations through focusing on the building and delivery of a seamless shopping experience across all channels by each operating segment, and structuring these offerings in a manner that allows us to maintain a direct relationship with our customers. We continue to invest in AI to enhance our customers' shopping experience and our associate work experience and to improve efficiencies of our supply chain, operations, management functions and talent recruitment and development; however, these are evolving technologies, there are\n17"}]}, {"n": 45, "id": "FE-0397", "slice": "S4", "company": "Comcast Corpor et prices was based on Level 2 inputs that use interest rates available to us for debt with similar terms and remaining maturities.\nNote 6: Significant Transactions\nVersant Separation\nOn January 2, 2026, we completed the previously announced separation of Versant into an independent, publicly traded company with its Class A common stock listed on The Nasdaq Stock Market under the ticker symbol “VSNT.” The Versant business is comprised of select cable television networks, including MS NOW, CNBC, USA Network, Golf Channel, E!, SYFY and Oxygen, and complementary digital platforms, including GolfNow, Fandango, Rotten Tomatoes and SportsEngine.\nThe Versant Separation was structured to qualify as a tax-free spin-off for U.S. federal income tax purposes and achieved through the transfer of assets and liabilities comprising the Versant business to Versant and its subsidiaries, followed by the distribution on January 2, 2026 of 100% of the shares of Versant common stock to Comcast shareholders in which each Comcast shareholder received 1 share of Versant common stock for every 25 shares of Comcast common stock owned as of the close of business on the record date of December 16, 2025 (the “Distribution”). Because the Versant business was not historically operated as a distinct business unit or division of Comcast, we undertook a series of corporate reorganization transactions in anticipation of the Versant Separation. Assets of approximately $12.5 billion, including approximately $7.7 billion of goodwill and $1.4 billion of other intangible assets, net of accumulated amortization, and liabilities of approximately $4.3 billion, including $3.0 billion of indebtedness from the issuance of certain notes and borrowings from a Term A loan facility and Term B loan facility associated with the Versant business were distributed through retained earnings as of the Versant Separation Date. Following the Versant Separation, we do not beneficially own any equity interest in Versant and no longer consolidate the results of the Versant business into our consolidated financial results.\nOn the Versant Separation Date, Versant distributed to us $2.25 billion of cash, which was funded by the $3.0 billion of prior indebtedness, resulting in a net cash distribution of $750 million to Versant in the first quarter of 2026. The proceeds from the $2.25 billion distribution, together with cash on hand, were used for the redemption on January 15, 2026 of all outstanding amounts of our 3.15% Notes due March 2026, including accrued and unpaid interest, totaling approximately $2.1 billion and all\n12"}, {"label": 5, "gold": false, "text": "Table of Contents\nComcast Corporation\nCondensed Consolidated Statements of Comprehensive Income\n(Unaudited)\nThree Months Ended September 30, Nine Months Ended September 30,\n(in millions) 2026 2025 2026 2025\nNet income $ 3,362 $ 3,249 $ 8,807 $ 17,590\nOther comprehensive income (loss), net of tax (expense) benefit:\nCurrency translation adjustments, net of deferred taxes of $4, $4, $(42), and $202 185 (590) (578) 2,120\nCash flow hedges:\nDeferred gains (losses), net of deferred taxes of $(1), $3, $(5), and $(12) 4 (12) 32 (15)\nRealized (gains) losses reclassified to net income, net of deferred taxes of $1, $(6), $(4), and $13 (3) 21 17 (46)\nEmployee benefit obligations and other, net of deferred taxes of $3, $10, $4, and $30 (13) (33) (30) (97)\nOther comprehensive income (loss) 173 (613) (560) 1,962\nComprehensive income 3,535 2,636 8,247 19,552\nLess: Net income (loss) attributable to noncontrolling interests (87) (83) (341) (241)\nLess: Other comprehensive income (loss) attributable to noncontrolling interests (1) 2 1 9\nComprehensive income attributable to Comcast Corporation $ 3,622 $ 2,716 $ 8,587 $ 19,783\nSee accompanying notes to condensed consolidated financial statements.\n2"}, {"label": 16, "gold": false, "text": "Table of Contents\nComcast Corporation\noutstanding amounts of our 5.35% Notes due November Months Ended\nin millions August 2, 2026 August 3, 2025 August 2, 2026 August 3, 2025\nNet sales – in the U.S. $ 43,907 $ 41,729 $ 82,640 $ 78,953\nNet sales – outside the U.S. 3,954 3,548 6,986 6,180\nNet sales $ 47,861 $ 45,277 $ 89,626 $ 85,133\nThe following table presents net sales by products and services:\nThree Months Ended Six Months Ended\nin millions August 2, 2026 August 3, 2025 August 2, 2026 August 3, 2025\nNet sales – products $ 46,300 $ 43,725 $ 86,736 $ 82,237\nNet sales – services 1,561 1,552 2,890 2,896\nNet sales $ 47,861 $ 45,277 $ 89,626 $ 85,133\nDeferred Revenue\nFor products and services sold in stores or online, payment is typically due at the point of sale. When we receive payment before the customer has taken possession of the merchandise or the service has been performed, the amount received is recorded as deferred revenue until the sale or service is complete. Such performance obligations are part of contracts with expected original durations of typically three months or less. As of August 2, 2026 and February 1, 2026, deferred revenue for products and services was $1.7 billion and $1.5 billion, respectively.\nWe further record deferred revenue for the sale of gift cards and recognize the associated revenue upon the redemption of those gift cards, which generally occurs within six months of gift card issuance. As of August 2, 2026 and February 1, 2026, our performance obligations for unredeemed gift cards were $1.0 billion and $1.1 billion, respectively. Gift card breakage income, which is our estimate of the portion of our outstanding gift card balance not expected to be redeemed, is recognized in net sales and was immaterial for the three and six months ended August 2, 2026 and August 3, 2025.\nFiscal Q2 2026 Form 10-Q 9"}, {"label": 9, "gold": false, "text": "Table of Contents\nTHE HOME DEPOT, INC.\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS\n(Unaudited)\n1.SUMMARY OF SIGNIFICANT ACCOUNTING POLICIES\nBasis of Presentation\nThe accompanying consolidated financial statements of The Home Depot, Inc., together with its subsidiaries (the “Company,” “The Home Depot,” “Home Depot,” “we,” “our” or “us”), have been prepared in accordance with the instructions to Form 10-Q and do not include all of the information and footnotes required by GAAP for complete financial statements. In the opinion of management, all adjustments (consisting of normal recurring accruals) considered necessary for a fair presentation have been included. Results of operations for interim periods are not necessarily indicative of results for the entire year. As a result, these consolidated financial statements should be read in conjunction with the consolidated financial statements and notes thereto included in our 2025 Form 10-K. During the six months ended August 2, 2026, there were no significant changes to our significant accounting policies as disclosed in the 2025 Form 10-K.\nReceivables, net\nThe following table presents components of receivables, net:\nin millions August 2, 2026 February 1, 2026\nCard receivables $ 1,342 $ 1,021\nRebate receivables 1,496 1,421\nCustomer receivables 3,557 2,588\nOther receivables 568 567\nReceivables, net $ 6,963 $ 5,597\nCard receivables consist of payments due from financial institutions for the settlement of credit card and debit card transactions. Rebate receivables represent amounts due from vendors for volume and co-op advertising rebates. Customer receivables relate to credit extended directly to certain customers in the ordinary course of business. The valuation allowance related to our receivables was not material to our consolidated financial statements at August 2, 2026 or February 1, 2026.\nSupplier Finance Program\nWe have a supplier finance program whereby participating suppliers may, at their sole discretion, elect to receive payment for one or more of our payment obligations, prior to their scheduled due dates, at a discounted price from participating financial institutions. The payment terms we negotiate with our suppliers are consistent, irrespective of whether a supplier participates in the program, and we are not a party to the agreements between the participating financial institutions and the suppliers in connection with the program. We do not reimburse suppliers for any costs they incur for participation in the program, and we have not pledged any assets as security or provided any guarantees as part of the program. Our outstanding obligations under our supplier finance program were $542 million at August 2, 2026 and $414 million at February 1, 2026 and are recorded within accounts payable on our consolidated balance sheets, and the associated payments are included in operating activities within our consolidated statements of cash flows.\nRecent Accounting Pronouncements\nWe did not adopt any new accounting pronouncements during the six months ended August 2, 2026 that had a material impact on our consolidated financial condition, results of operations, or cash flows. There have been no significant changes in accounting pronouncements not yet adopted as disclosed in the 2025 Form 10-K, and those not discussed in the 2025 Form 10-K are either not applicable or are not expected to have a material impact on our consolidated financial condition, results of operations, or cash flows.\nFiscal Q2 2026 Form 10-Q 6"}]}, {"n": 47, "id": "FE-0425", "slice": "S4", "company": "JPMorgan Chase & Co.", "form": "10-Q", "question": "What was JPMorgan Chase & Co.'s net gains/(losses) on sales of loans and lending-related commitments for the three months ended September 30, 2025?", "found": true, "display": "113", "scale": "millions", "unit": "USD", "period": "2025-07-01 to 2025-09-30", "dims": {}, "line": "Net gains/(losses) on sales of loans and lending-related commitments(a) $ 71 $ 113 $ 138 $ 156", "url": "https://www.sec.gov/Archives/edgar/data/19617/000162828026069523/jpm-20260930.htm", "pages": [{"label": 140, "gold": true, "text": "The foll ding credit card Credit card Wholesale(c)(d)\n• Residential real estate(a) • Auto and other(b) • Credit card loans • Secured by real estate • Commercial and industrial • Other(e)\n(a)Includes scored mortgage and home equity loans held in CCB and AWM, and scored mortgage loans held in CIB.\n(b)Includes scored auto, business banking and consumer unsecured loans as well as overdrafts, primarily in CCB.\n(c)Includes loans held in CIB, AWM, Corporate, and risk-rated exposure held in CCB, for which the wholesale methodology is applied when determining the allowance for loan losses.\n(d)The wholesale portfolio segment's classes align with loan classifications as defined by the Federal Reserve Board (\"FRB\") in effect at each period presented, based on the loan's collateral, purpose, and type of borrower.\n(e)Includes loans to financial institutions, personal investment companies and trusts, individuals and individual entities (predominantly Global Private Bank clients within AWM and J.P. Morgan Wealth Management within CCB), states and political subdivisions, nonprofits, as well as loans to SPEs. Refer to Note 14 of JPMorganChase’s 2025 Form 10-K for more information on SPEs.\nThe following tables summarize the Firm’s loan balances by portfolio segment.\nSeptember 30, 2026 (in millions) Consumer, excluding credit card Credit card Wholesale Total(a)(b)\nRetained $ 367,206 $ 252,697 $ 877,256 $ 1,497,159\nHeld-for-sale 301 — 15,523 15,824\nAt fair value 25,595 — 46,063 71,658\nTotal $ 393,102 $ 252,697 $ 938,842 $ 1,584,641\nDecember 31, 2025 (in millions) Consumer, excluding credit card Credit card Wholesale Total(a)(b)\nRetained $ 368,741 $ 247,797 $ 792,367 $ 1,408,905\nHeld-for-sale 334 — 13,506 13,840\nAt fair value 33,183 — 37,501 70,684\nTotal $ 402,258 $ 247,797 $ 843,374 $ 1,493,429\n(a)Excludes $7.6 billion and $7.0 billion of accrued interest receivables at September 30, 2026 and December 31, 2025, respectively. The Firm wrote off accrued interest receivables of ategory as of June 27, 2026 and September 27, 2025 (in millions):\nJune 27, 2026\nAdjusted Cost Unrealized Gains Unrealized Losses Fair Value Cash and Cash Equivalents Current Marketable Securities Non-Current Marketable Securities\nCash $ 26,777 $ — $ — $ 26,777 $ 26,777 $ — $ —\nLevel 1:\nMoney market funds 7,840 — — 7,840 7,840 — —\nMutual funds 873 222 (1) 1,094 — 1,094 —\nSubtotal 8,713 222 (1) 8,934 7,840 1,094 —\nLevel 2 (1):\nU.S. Treasury securities 20,398 11 (253) 20,156 735 4,034 15,387\nU.S. agency securities 6,176 — (100) 6,076 988 2,898 2,190\nNon-U.S. government securities 5,207 71 (349) 4,929 — 299 4,630\nCertificates of deposit and time deposits 3,025 — — 3,025 2,521 504 —\nCommercial paper 3,828 — — 3,828 683 3,145 —\nCorporate debt securities 49,679 121 (709) 49,091 — 10,808 38,283\nMortgage- and asset-backed securities 24,828 65 (1,192) 23,701 — 73 23,628\nSubtotal 113,141 268 (2,603) 110,806 4,927 21,761 84,118\nTotal $ 148,631 $ 490 $ (2,604) $ 146,517 $ 39,544 $ 22,855 $ 84,118\nApple Inc. | Q3 2026 Form 10-Q | 7"}, {"label": 7, "gold": false, "text": "Apple Inc.\nNotes to Condensed Consolidated Financial Statements (Unaudited)\nNote 1 – Summary of Significant Accounting Policies\nBasis of Presentation and Preparation\nThe condensed consolidated financial statements include the accounts of Apple Inc. and its wholly owned subsidiaries (collectively “Apple” or the “Company”). In the opinion of the Company’s management, the condensed consolidated financial statements reflect all adjustments, which are normal and recurring in nature, necessary for fair financial statement presentation. The preparation of these condensed consolidated financial statements and accompanying notes in conformity with U.S. generally accepted accounting principles (“GAAP”) requires the use of management estimates. Certain prior period amounts in the condensed consolidated financial statements and accompanying notes have been reclassified to conform to the current period’s presentation. These condensed consolidated financial statements and accompanying notes should be read in conjunction with the Company’s annual consolidated financial statements and accompanying notes included in its Annual Report on Form 10-K for the fiscal year ended September 27, 2025 (the “2025 Form 10-K”).\nThe Company’s fiscal year is the 52- or 53-week period that ends on the last Saturday of September. An additional week is included in the first fiscal quarter every five or six years to realign the Company’s fiscal quarters with calendar quarters. The Company’s fiscal years 2026 and 2025 span 52 weeks each. Unless otherwise stated, references to particular years, quarters, months and periods refer to the Company’s fiscal years ended in September and the associated quarters, months and periods of those fiscal years.\nNote 2 – Revenue\nThe following table shows disaggregated net sales, as well as the portion of total net sales that was previously deferred, for the three- and nine-month periods ended June 27, 2026 and June 28, 2025 (in millions):\nThree Months Ended Nine Months Ended\nJune 27, 2026 June 28, 2025 June 27, 2026 June 28, 2025\niPhone® $ 54,252 $ 44,582 $ 196,515 $ 160,561\nMac® 10,352 8,046 27,137 24,982\niPad® 6,191 6,581 21,700 21,071\nWearables, Home and Accessories 7,883 7,404 27,277 26,673\nServices 30,739 27,423 91,728 80,408\nTotal net sales $ 109,417 $ 94,036 $ 364,357 $ 313,695\nPortion of total net sales that was included in deferred revenue as of the beginning of the period $ 4,086 $ 4,015 $ 7,260 $ 6,958\nThe Company’s proportion of net sales by disaggregated revenue source was generally consistent for each reportable segment in Note 10, “Segment Information” for the three- and nine-month periods ended June 27, 2026 and June 28, 2025, except in Greater China, where iPhone revenue represented a moderately higher proportion of net sales.\nAs of June 27, 2026 and September 27, 2025, the Company had total deferred revenue of $14.9 billion and $13.7 billion, respectively. As of June 27, 2026, the Company expects 64% of total deferred revenue to be realized in less than a year, 23% within one-to-two years, 11% within two-to-three years and 2% in greater than three years.\nApple Inc. | Q3 2026 Form 10-Q | 6"}, {"label": 14, "gold": false, "text": "Item 2. Management’s Discussion and Analysis of Financial Condition and Results of Operations\nThis Item and other sections of this Quarterly Report on Form 10-Q (“Form 10-Q”) contain forward-looking statements, within the meaning of the Private Securities Litigation Reform Act of 1995, that involve risks and uncertainties. Forward-looking statements provide current expectations of future events based on certain assumptions and include any statement that does not directly relate to any historical or current fact. For example, statements in this Form 10-Q regarding the potential future impact of macroeconomic conditions and tariffs and other measures on the Company’s business and results of operations are forward-looking statements. Forward-looking statements can also be identified by words such as “future,” “anticipates,” “believes,” “estimates,” “expects,” “intends,” “plans,” “predicts,” “will,” “would,” “could,” “can,” “may,” and similar terms. Forward-looking statements are not guarantees of future performance and the Company’s actual results may differ significantly from the results discussed in the forward-looking statements. Factors that might cause such differences include, but are not limited to, those discussed in Part I, Item 1A of the 2025 Form 10-K and Part II, Item 1A of this Form 10-Q, in each case under the heading “Risk Factors.” The Company assumes no obligation to revise or update any forward-looking statements for any reason, except as required by law.\nUnless otherwise stated, all information presented herein is based on the Company’s fiscal calendar, and references to particular years, quarters, months or periods refer to the Company’s fiscal years ended in September and the associated quarters, months and periods of those fiscal years.\nThe following discussion should be read in conjunction with the 2025 Form 10-K filed with the U.S. Securities and Exchange Commission (“SEC”) and the condensed consolidated financial statements and accompanying notes included in Part I, Item 1 of this Form 10-Q.\nAvailable Information\nThe Company periodically provides certain information for investors on its corporate website, www.apple.com, and its investor relations website, investor.apple.com. This includes press releases and other information about financial performance, information on corporate governance, and details related to the Company’s annual meeting of shareholders. The information contained on the websites referenced in this Form 10-Q is not incorporated by reference into this filing. Further, the Company’s references to website URLs are intended to be inactive textual references only.\nBusiness Seasonality and Product Introductions\nThe Company has historically experienced higher net sales in its first quarter compared to other quarters in its fiscal year due in part to seasonal holiday demand. Additionally, new product and service introductions can significantly impact net sales, cost of sales and operating expenses. The timing of product introductions can also impact the Company’s net sales to its indirect distribution channels as these channels are filled with new inventory following a product launch, and channel inventory of an older product often declines as the launch of a newer product approaches. Net sales can also be affected when consumers and distributors anticipate a product introduction.\nDuring the third quarter of 2026, the Company announced iOS 27, macOS® 27 Golden Gate, iPadOS® 27, watchOS® 27, visionOS® 27 and tvOS® 27, and introduced Siri AI.\nMacroeconomic Conditions\nMacroeconomic conditions, including inflation, interest rates, component pricing and currency fluctuations, have directly and indirectly impacted, and could in the future materially impact, the Company’s results of operations and financial condition.\nThe Company is experiencing a period of supply constraints and increasing costs for components driven by factors such as industry supply-demand imbalances for components, including advanced semiconductors, storage (NAND) and memory (DRAM). The Company expects these trends to intensify, which may materially negatively impact the Company’s revenue, costs, gross margin, results of operations and financial condition. Actions, such as price increases, that have been and may in the future be taken by the Company may not effectively mitigate these negative impacts, and may also reduce demand for the Company’s products and materially adversely affect the Company’s revenue, costs, gross margin, results of operations and financial condition.\nApple Inc. | Q3 2026 Form 10-Q | 13"}]}, {"n": 49, "id": "FE-0464", "slice": "S4", "company": "Progressive Corporation", "form": "10-K", "question": "What was Progressive Corporation's subtotal net holding period gains (losses) for the fiscal year ended December 31, 2024?", "found": true, "display": "679", "scale": "millions", "unit": "USD", "period": "2024-01-01 to 2024-12-31", "dims": {}, "line": "Subtotal net holding period gains (losses) 480 679 348", "url": "https://www.sec.gov/Archives/edgar/data/80661/000008066126000086/pgr-20251231_d2.htm", "pages": [{"label": 13, "gold": true, "text": "Realized Gains (Losses) The components of net realized gains (losses) for the years ended December 31, were:\n(millions) 2025 2024 2023\nGross realized gains on security sales\nAvailable-for-sale securities:\nU.S. government $ 310 $ 64 $ 12\nCorporate and other debt 16 13 1\nResidential mortgage-backed 1 1 1\nCommercial mortgage-backed 0 1 0\nTotal available-for-sale securities 327 79 14\nEquity securities:\nNonredeemable preferred stocks 3 0 0\nCommon equities 104 33 381\nTotal equity securities 107 33 381\nSubt ad less attractive risk/reward profiles; and (iii) nonredeemable preferred stocks, predominantly due to the sale of certain holdings in U.S. bank preferred stocks. The gross gains in common equities reflected sales of securities, as part of our 2023 plan to incrementally reduce risk in the portfolio.\nApp.-A-14"}, {"label": 12, "gold": false, "text": "Gross Unrealized Losses The following tables show the composition of gross unrealized losses by major security type and by the length of time that individual securities have been in a continuous unrealized loss position:\nTotal No. of Sec. Total Fair Value Gross Unrealized Losses Less than 12 Months 12 Months or Greater\n($ in millions) No. of Sec. Fair Value Gross Unrealized Losses No. of Sec. Fair Value Gross Unrealized Losses\nDecember 31, 2025\nU.S. government 62 $ 17,402 $ (357) 8 $ 11,327 $ (54) 54 $ 6,075 $ (303)\nState and local government 252 1,589 (58) 60 318 (1) 192 1,271 (57)\nCorporate and other debt 141 3,821 (68) 36 1,177 (5) 105 2,644 (63)\nResidential mortgage-backed 30 293 (6) 12 233 (1) 18 60 (5)\nCommercial mortgage-backed 147 3,551 (233) 34 1,210 (3) 113 2,341 (230)\nOther asset-backed 64 1,924 (31) 32 1,148 (3) 32 776 (28)\nTotal fixed maturities 696 $ 28,580 $ (753) 182 $ 15,413 $ (67) 514 $ 13,167 $ (686)\nTotal No. of Sec. Total Fair Value Gross Unrealized Losses Less than 12 Months 12 Months or Greater\n($ in millions) No. of Sec. Fair Value Gross Unrealized Losses No. of Sec. Fair Value Gross Unrealized Losses\nDecember 31, 2024\nU.S. government 113 $ 38,782 $ (1,151) 39 $ 30,257 $ (418) 74 $ 8,525 $ (733)\nState and local government 379 2,339 (117) 127 783 (6) 252 1,556 (111)\nCorporate and other debt 304 7,034 (215) 122 2,935 (33) 182 4,099 (182)\nResidential mortgage-backed 40 428 (11) 12 377 (4) 28 51 (7)\nCommercial mortgage-backed 153 3,294 (376) 8 264 (16) 145 3,030 (360)\nOther asset-backed 84 1,907 (65) 34 912 (8) 50 995 (57)\nTotal fixed maturities 1,073 $ 53,784 $ (1,935) 342 $ 35,528 $ (485) 731 $ 18,256 $ (1,450)\nA review of the securities in an unrealized loss position indicated that, at the end of each period presented, the issuers were current with respect to their interest obligations and that there was no evidence of deterioration of the current cash flow projections that would indicate we would not receive the remaining principal at maturity.\nAllowance For Credit and Uncollectible Losses We are required to measure the amount of potential credit losses for all fixed-maturity securities in an unrealized loss position. We did not record any allowances for credit losses or any write-offs for credit losses deemed to be uncollectible during 2025 or 2024 and did not have a material credit loss allowance balance as of December 31, 2025 or 2024. During 2025, we realized a $1 million impairment loss, previously recognized as an unrealized loss, for an investment deemed to be uncollectible. During 2024, we recorded a $1 million write off for securities we intended to sell prior to a potential recovery.\nAs of December 31, 2025 and 2024, we believe that none of the unrealized losses on our fixed-maturity securities were related to material credit losses on any specific securities, or in the aggregate. We continue to expect all the securities in our fixed-maturity portfolio will pay their principal and interest obligations.\nIn addition, we reviewed our accrued investment income outstanding on those securities in an unrealized loss position at December 31, 2025 and 2024, to determine if the accrued interest amounts were uncollectible. Based on our analysis, we believe the issuers have sufficient liquidity and capital reserves to meet their current interest and future principal obligations and, therefore, did not write off any accrued income as uncollectible at December 31, 2025 or 2024.\nApp.-A-13"}, {"label": 67, "gold": false, "text": "Prepayment and Extension Risk We are exposed to this risk especially in our asset-backed (i.e., structured product) and preferred stock portfolios. Prepayment risk includes the risk of early redemption of security principal that may need to be reinvested at less attractive rates. Extension risk includes the risk that a security will not be redeemed when anticipated, and that the security that is extended will have a lower yield than a security we might be able to obtain by reinvesting the expected redemption principal. Our holdings of different types of structured debt and preferred securities help manage this risk. During 2025 and 2024, we did not experience significant adverse prepayment or extension of principal relative to our cash flow expectations in the portfolio.\nLiquidity Risk Our overall portfolio remains very liquid and we believe that it is sufficient to meet expected near-term liquidity requirements. The short-to-intermediate duration of our portfolio provides a source of liquidity. During 2026, we expect approximately $9.6 billion, or 24%, of principal repayment from our fixed-income\nportfolio, excluding U.S. government securities and short-term investments. Cash from interest and dividend payments provides an additional source of recurring liquidity.\nThe duration of our U.S. government securities, which are included in the fixed-income portfolio, was comprised of the following at December 31, 2025:\n($ in millions) Fair Value Duration (years)\nLess than one year1 $ 257 0.6\nOne to two years 462 1.2\nTwo to three years 2,311 2.5\nThree to five years 10,265 3.9\nFive to seven years 20,958 5.5\nSeven to ten years 9,045 8.0\nTotal U.S. government $ 43,298 5.4\n1 Excludes $7,919 million of U.S. treasury bills included in short-term investments.\nASSET-BACKED SECURITIES\nThe following table details the credit quality rating of our asset-backed securities at December 31, 2025:\n(millions) Average Rating1 Residential Mortgage-Backed Commercial Mortgage-Backed Other Asset-Backed Total\nAAA $ 2,361 $ 3,182 $ 4,751 $ 10,294\nAA 118 1,013 95 1,226\nA 555 578 811 1,944\nBBB 139 831 1,415 2,385\nNon-investment-grade/non-rated:\nBB 0 356 37 393\nB 0 13 0 13\nCCC and lower 1 0 0 1\nNon-rated 1 0 0 1\nTotal fair value $ 3,175 $ 5,973 $ 7,109 $ 16,257\n1 The credit quality ratings are assigned by NRSROs.\nOur residential mortgage-backed portfolio consists of deals that are backed by high-credit quality borrowers and/or those that have strong structural protections through underlying loan collateralization. The fair value of this portfolio grew by $1.6 billion in 2025 and new purchases were concentrated in high-quality investment-grade securities and contained both fixed-rate and adjustable residential mortgages. We viewed this sector as having attractive risk-adjusted spreads and potential returns.\nThe commercial mortgage-backed portfolio fair value grew by $1.6 billion in 2025 as we viewed the absolute and relative value of commercial mortgage-backed spreads as attractive. The growth in the portfolio was primarily a result of purchases of new issue investment-grade securities backed by single-borrower transactions across various sectors including apartments, logistics, grocery-anchored retail, life sciences, and self-storage. We maintained a preference for geographically diversified portfolios or high-quality single assets leased to creditworthy tenants.\nApp.-A-68"}]}, {"n": 50, "id": "FE-0478", "slice": "S4", "company": "Simon Property Group, Inc.", "form": "10-Q", "question": "What was Simon Property Group, Inc.'s total noncontrolling interests reflected in equity as of December 31, 2025?", "found": true, "display": "1,263,819", "scale": "thousands", "unit": "USD", "period": "2025-12-31", "dims": {}, "line": "Total noncontrolling interests reflected in equity $ 1,054,683 $ 1,263,819", "url": "https://www.sec.gov/Archives/edgar/data/1063761/000110465926123591/spg-20260930x10q.htm", "pages": [{"label": 17, "gold": true, "text": "Table of Contents\nSimon Property Group, Inc.\nSimon Property Group, L.P.\nCondensed Notes to Consolida in properties, net 355,303 378,906\nTotal noncontrolling interests reflected in equity $ 1,054,683 $ 1,263,819\nNet income attributable to noncontrolling interests (which includes nonredeemable and redeemable noncontrolling interests in consolidated properties, limited partners’ interests in the Operating Partnership and preferred distributions payable by the Operating Partnership on its outstanding preferred units) is a component of consolidated net income. In addition, the individual components of other comprehensive income (loss) are presented in the aggregate for both controlling and noncontrolling interests, with the portion attributable to noncontrolling interests deducted from comprehensive income attributable to common stockholders.\n18"}, {"label": 18, "gold": false, "text": "Table of Contents\nSimon Property Group, Inc.\nSimon Property Group, L.P.\nCondensed Notes to Consolidated Financial Statements\n(Unaudited)\n(Dollars in thousands, except share, per share, unit and per unit amounts\nand where indicated in millions or billions)\nThe Operating Partnership\nOur evaluation of the appropriateness of classifying the Operating Partnership’s common units of partnership interest, or units, held by Simon and the Operating Partnership's limited partners within permanent equity considered several significant factors. First, as a limited partnership, all decisions relating to the Operating Partnership’s operations and distributions are made by Simon, acting as the Operating Partnership’s sole general partner. The decisions of the general partner are made by Simon's Board of Directors or management. The Operating Partnership has no other governance structure. Secondly, the sole asset of Simon is its interest in the Operating Partnership. As a result, a share of common stock of Simon, or common stock, if owned by the Operating Partnership, is best characterized as being similar to a treasury share and thus not an asset of the Operating Partnership.\nLimited partners of the Operating Partnership have the right under the Operating Partnership’s partnership agreement to exchange their units for shares of common stock or cash, as selected by Simon as the sole general partner. Accordingly, we classify units held by limited partners in permanent equity because Simon may elect to issue shares of common stock to limited partners exercising their exchange rights rather than using cash. Under the Operating Partnership’s partnership agreement, the Operating Partnership is required to redeem units held by Simon only when Simon has repurchased shares of common stock. We classify units held by Simon in permanent equity because the decision to redeem those units would be made by Simon.\nNet income attributable to noncontrolling interests (which includes nonredeemable and redeemable noncontrolling interests in consolidated properties) is a component of consolidated net income.\nAccumulated Other Comprehensive Income (Loss)\nSimon\nThe total accumulated other comprehensive income (loss) related to Simon’s currency translation adjustment was ($234.1) million and ($278.3) million as of September 30, 2026 and December 31, 2025, respectively.\nThe reclassifications out of accumulated other comprehensive income (loss) consisted of the following:\nFor the Three Months Ended For the Nine Months Ended\nSeptember 30, September 30,\nAffected line item where\n2026 2025 2026 2025 net income is presented\nAccumulated derivative gains, net $ 1,706 $ 1,579 $ 5,118 $ 4,489 Interest expense\n(252) (212) (754) (603) Net income attributable to noncontrolling interests\n$ 1,454 $ 1,367 $ 4,364 $ 3,886\nThe Operating Partnership\nThe total accumulated other comprehensive income (loss) related to the Operating Partnership’s currency translation adjustment was ($274.6) million and ($326.0) million as of September 30, 2026 and December 31, 2025, respectively.\n19"}, {"label": 4, "gold": false, "text": "Table of Contents\nSimon Property Group, Inc.\nUnaudited Consolid
