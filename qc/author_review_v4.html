 TCC in\nwhich we hold a 95.0% ownership interest. As of September 30, 2026, we had invested $10.5 million and have committed to investing an\nadditional $8.0 million for the development of an industrial facility under this joint venture. We have determined that these joint ventures are\nVIEs. We are not the primary beneficiary of these VIEs because significant activities affecting economic performance are shared. TCC is the\nmanaging member, and we do not have substantive kick-out rights. We will continuously evaluate whether we are the primary beneficiary as\npower to direct significant activities can change during the joint venture's life. Our maximum loss exposure is limited to our common and\npreferred equity investments and committed funding.\n(5)In July 2026, we invested approximately $245.4 million in a joint venture between Cloud Capital and a global institutional investor that indirectly\nowns a stabilized data center located in Northern Virginia. The investment amount includes $4.7 million related to amounts reserved in\nconnection with the joint venture's financing. We have determined that this joint venture is a VOE. We have an effective 45.0% ownership\ninterest in the underlying property and account for our investment under the equity method. The unconsolidated entity had total debt\noutstanding of approximately $520.0 million as of September 30, 2026, all of which was non-recourse to us subject to limited customary\nexceptions.\n-15-\nTable of Contents\n5.Investments in Loans and Financing Receivables\nA.Loans\nThe following table presents information about our loans as of September 30, 2026 and December 31, 2025 (dollars\nin millions):\nSeptember 30, 2026\nLoan Type Principal Balance Total Carrying Value (1) Future Funding Commitments (2) Weighted Average Term (Years) (3) Weighted Average Interest Rate (4)\nSecured Loans (5) $1,830.5 $1,778.2 $65.0 3.9 8.4%\nConstruction Loans 170.8 170.8 92.9 1.3 8.2\nMortgage Loans 345.5 345.8 20.2 3.4 7.4\nUnsecured and Mezzanine Loans (6) 1,187.1 1,169.9 108.5 3.0 9.2\nTotal $3,533.9 $3,464.7 $286.6 3.4 8.6%\nDecember 31, 2025\nLoan Type Principal Balance Total Carrying Value (1) Future Funding Commitments (2) Weighted Average Term (Years) (3) Weighted Average Interest Rate (4)\nSecured Loans $1,250.4 $1,214.1 $— 4.6 8.8%\nMortgage Loans 256.2 256.2 34.0 5.1 7.6\nUnsecured and Mezzanine Loans 214.7 211.8 — 2.9 10.3\nTotal $1,721.3 $1,682.1 $34.0 4.5 8.8%\n(1)Total carrying value includes unamortized loan origination costs and allowances for credit losses. Total carrying amount excludes interest\nreceivable of $49.4 million and $27.8 million as of September 30, 2026 and December 31, 2025, respectively, which is presented in 'Other\nassets, net' on our consolidated balance sheets.\n(2)Our future funding commitments are subject to our borrowers’ compliance with the financial covenants and other applicable provisions of\neach respective loan agreement.\n(3)Based on original contractual maturity date assuming no extension options are exercised.\n(4)The weighted average interest rate is based on outstanding principal balances and interest rates in place as of September 30, 2026 and\nDecember 31, 2025.\n(5)Represents loans that have senior ranking security interests in certain assets pledged by borrowers, including material bank accounts,\nreceivables, real property, or equity securities, or a combination of such assets.\n(6)Our investments in unsecured and mezzanine loans represent loans whose proceeds are being used by borrowers to fund data center and\nindustrial investments.\nThe following table summarizes the activity within loans receivable, net for the three and nine months ended\nSeptember 30, 2026 (in millions):\nLoans receivable, net as of June 30, 2026 $3,297.6\nPrincipal fundings 241.5\nInterest drawn on loans 23.7\nPrincipal repayments (91.4)\nAccretion of original issue cost 0.4\nChange in allowance for credit losses (6.9)\nForeign currency remeasurement (0.2)\nLoans receivable, net as of September 30, 2026 $3,464.7\nLoans receivable, net as of December 31, 2025 $1,682.1\nPrincipal fundings 1,901.7\nInterest drawn on loans 32.3\nPrincipal repayments (91.4)\nAccretion of original issue cost 1.3\nChange in allowance for credit losses (33.6)\nForeign currency remeasurement (27.7)\nLoans receivable, net as of September 30, 2026 $3,464.7\n-16-\nTable of Contents\nB.Financing Receivables\nThe following table presents information about our investments in sales type and direct financing leases and sale-\nleaseback transactions accounted for as financing receivables in accordance with ASC 842, Leases, as of\nSeptember 30, 2026 and December 31, 2025 (dollars in millions):\nCarrying Value as of\nMaturity September 30, 2026 December 31, 2025\nSale-leaseback transactions accounted for as financing receivables (1) 2031 - 2050 $1,551.2 $1,574.6\nNet investment in sales type and direct financing leases 2027 - 2059 14.3 14.3\nTotal $1,565.5 $1,588.9\n(1)Amounts represent the portion of the purchase price allocated to above-market lease terms in sale-leaseback transactions, representing an\noff-market adjustment, net of repayments. For further information, see note 1, Summary of Significant Accounting Policies.\nC.Allowance for Credit Losses\nThe following table summarizes the activity within the allowance for credit losses related to loans and financing\nreceivable for the three and nine months ended September 30, 2026 and September 30, 2025 (in millions):\nThree months ended September 30, 2026 Loans Receivable Financing Receivable Unfunded Loan Commitments Total\nAllowance for credit losses as of June 30, 2026 $57.2 $20.3 $2.3 $79.8\nProvisions for credit losses (1) 6.9 7.7 (0.4) 14.2"}, {"label": 7, "gold": false, "text": "(1)The weighted average amortization period for acquired lease intangible assets is 10.5 years.\n(2)USD-denominated other assets consists primarily of $37.8 million of financing receivables allocated to sale-leaseback transactions, $15.6\nmillion right-of-use assets accounted for as finance leases, and $5.1 million right-of-use assets under long-term ground leases.\n(3)The weighted average amortization period for acquired lease intangible liabilities is 14.4 years.\n(4)USD-denominated other liabilities consists primarily of $20.8 million lease liabilities under finance leases, $10.6 million deferred rent on certain\nbelow-market leases, and $5.7 million lease liabilities under ground leases.\nThe aggregate purchase price of the assets acquired during the nine months ended September 30, 2026 included\ncontingent consideration of $13.8 million. For further information, see note 18, Commitments and Contingencies.\nThe properties acquired during the nine months ended September 30, 2026 generated total revenue and net\nincome of $137.3 million and $49.0 million, respectively.\nB.Investments in Existing Properties\nDuring the nine months ended September 30, 2026, we capitalized costs of $121.9 million on existing properties in\nour portfolio, consisting of $114.7 million for building improvements, $7.1 million for re-leasing costs, and $0.1\nmillion for recurring capital expenditures. In comparison, during the nine months ended September 30, 2025, we\ncapitalized costs of $88.9 million on existing properties in our portfolio, consisting of $84.0 million for building\nimprovements, $4.6 million for re-leasing costs, and $0.3 million for recurring capital expenditures.\nC.Properties with Existing Leases\nThe value of the in-place and above-market leases is recorded to 'Lease intangible assets, net' on our consolidated\nbalance sheets, and the value of the below-market leases is recorded to 'Lease intangible liabilities, net' on our\nconsolidated balance sheets.\nThe values of the in-place leases are amortized as depreciation and amortization expense. The amounts amortized\nto expense for all of our in-place leases for the nine months ended September 30, 2026 and 2025 were\n$616.3 million and $670.6 million, respectively.\nThe values of the above-market and below-market leases are amortized over the term of the respective leases,\nincluding any bargain renewal options, as an adjustment to rental revenue in our consolidated statements of income\nand comprehensive income. The amounts amortized as a net decrease to rental revenue for capitalized above-\nmarket and below-market leases for the nine months ended September 30, 2026 and 2025 were $24.6 million and\n$12.6 million, respectively.\nThe following table presents the estimated impact during the next five years and thereafter related to the\namortization of the above-market and below-market lease intangibles and the amortization of the in-place lease\nintangibles as of September 30, 2026 (in thousands):\nNet increase (decrease) to rental revenue Increase to amortization expense\n2026 $(9,674) $195,816\n2027 (36,858) 709,274\n2028 (28,685) 609,099\n2029 (25,658) 525,307\n2030 (14,852) 441,989\nThereafter 365,152 1,886,715\nTotal $249,425 $4,368,200\n-14-\nTable of Contents\nD.Gain on Sales of Real Estate\nThe following table summarizes our properties sold during the periods indicated below (dollars in millions):\nThree months ended September 30, Nine months ended September 30,\n2026 2025 2026 2025\nNumber of properties 182 140 359 268\nNet sales proceeds $526.6 $214.8 $875.2 $424.2\nGain on sales of real estate $113.9 $49.1 $187.8 $110.2\n4.Investments in Unconsolidated Entities\nThe following is a summary of our investments in unconsolidated entities for the periods indicated below (dollars in\nthousands):\nOwnership % Number of Properties Carrying Amount (1) of Investment as of Equity in earnings of unconsolidated entities\nNine months ended September 30,\nAs of September 30, 2026 September 30, 2026 December 31, 2025 2026 2025\nDigital Realty Joint Venture (2) 80.0% 2 $357,666 $293,073 $6,740 $9,229\nBellagio Las Vegas Joint Venture - Common Equity Interest (3) 21.9% 1 237,579 253,625 1,473 1,477\nBellagio Las Vegas Joint Venture - Preferred Equity Interest (3) n/a n/a 650,000 650,000 — —\nDevelopment Joint Ventures (4) 95.0% 3 128,297 59,758 (64) —\nCloud Capital Joint Venture (5) 45.0% 1 243,842 — (349) —\nTotal investment in unconsolidated entities $1,617,384 $1,256,456 $7,800 $10,706\n(1)As of September 30, 2026, the total carrying amount of the investments exceeded the underlying equity in net assets (i.e., basis difference) by\n$13.1 million. This basis difference is primarily due to the capitalized interest related to the data center and Passport Park development joint\nventures.\n(2)The joint venture with Digital Realty Trust, Inc. is expanding the capacity of its two data centers for the existing client, and our pro-rata share of\nthe estimated costs for the second and third phase of the development was $152.8 million as of September 30, 2026. We have determined\nthat this joint venture is a VOE. As we do not control this joint venture, we account for it under the equity method. Our maximum exposure to\nloss associated with this VOE is limited to our equity investment and our pro-rata share of the remaining estimated development costs for the\nsecond and third phase of the project.\n(3)During each of the nine months ended September 30, 2026 and 2025, we recognized interest income of $39.4 million for 8.1% preferential\ncumulative distributions, included within 'Interest and dividend income on loans and preferred equity investments' in our consolidated\nstatements of income and comprehensive income. The unconsolidated entity had total debt outstanding of $3.0 billion as of September 30,\n2026, all of which was non-recourse to us with limited customary exceptions.\n(4)As of September 30, 2026, we held a 95.0% common equity interest in each of the two joint ventures with Trammell Crow Company (\"TCC\")."}, {"label": 10, "gold": false, "text": "As of September 30, 2026, we had available borrowing capacity of $559.5 million under our unsecured revolving\ncredit facility (subject to customary conditions to borrowing) and an outstanding balance of $440.5 million. As of\nDecember 31, 2025, we had available borrowing capacity under our Fund Credit Facilities of $1.2 billion and an\noutstanding balance of $182.0 million, which included the delayed draw term loan until fully drawn in the second\nquarter of 2026.\nThe weighted average interest rate on outstanding borrowings under our unsecured revolving credit facility was\n4.8% and 6.4% during the nine months ended September 30, 2026 and 2025, respectively. As of September 30,\n2026, the weighted average interest rate on outstanding borrowings under our unsecured revolving credit facility\nwas 4.9%.\n-18-\nTable of Contents\nAs of September 30, 2026, origination costs of $4.8 million for the unsecured revolving credit facility are included in\n'Other assets, net' as compared to $6.2 million as of December 31, 2025, on our consolidated balance sheets, and\nare being amortized over the remaining term of the facility.\nC.Commercial Paper Programs\nIn July 2026, we expanded our global unsecured commercial paper programs to a total combined capacity of\n$5.5 billion, upsized from the prior $3.0 billion combined capacity. The programs consist of a $2.75 billion USD-\ndenominated commercial paper program and a $2.75 billion EUR-denominated commercial paper program. Each\ncommercial paper program permits us to issue up to a maximum aggregate amount of $2.75 billion (or foreign\ncurrency equivalent). Our EUR-denominated unsecured commercial paper program may be issued in USD or\nvarious foreign currencies, including but not limited to, EUR, GBP, Swiss Francs, Yen, Canadian Dollars, and\nAustralian Dollars, in each case, pursuant to customary terms in the European commercial paper market.\nThe commercial paper ranks pari passu in right of payment with all of our other unsecured senior indebtedness\noutstanding, exclusive of unexchanged bonds from our merger with VEREIT, Inc. in 2021 and unexchanged Spirit\nRealty Capital, Inc. (“Spirit”) bonds, including borrowings under our revolving credit facilities, our term loans and our\noutstanding senior unsecured notes (and is structurally subordinated to all our subsidiary debt). Proceeds from\ncommercial paper borrowings are used for general corporate purposes.\nAs of September 30, 2026, the balance of borrowings outstanding under our commercial paper programs totaled\n$1.5 billion, including $606.0 million of USD borrowings and €824.0 million of EUR borrowings, compared to\n$516.8 million outstanding commercial paper borrowings, including €407.0 million of EUR borrowings and $39.0\nmillion of USD borrowings, as of December 31, 2025. The weighted average interest rate on outstanding borrowings\nunder our commercial paper programs was 3.2% and 2.8% for the nine months ended September 30, 2026 and\n2025, respectively. We use our revolving credit facilities as a liquidity backstop for the repayment of the notes issued\nunder the commercial paper programs. The commercial paper borrowings generally carry a term of less than a year.\nD.Financial Covenants\nOur credit facilities are subject to various leverage and interest coverage ratio limitations, and as of September 30,\n2026, we were in compliance with the covenants under our credit facilities.\n7.Term Loans\nA.2026 Term Loan Facility\nIn March 2026, we entered into a $693.9 million unsecured term loan due January 2036, which carries a fixed\ninterest rate of 4.91% (the \"2026 Term Loan Facility\"). Concurrently, we executed a cross-currency swap on\n$500.0 million of proceeds for approximately €431.0 million. After giving effect to the swap, the effective blended\nborrowing rate was 4.36% and the outstanding principal balance was $711.7 million as of September 30, 2026.\nB.2026 Delayed Draw Term Loan\nDuring the three months ended June 30, 2026, the Fund fully drew on its $380.0 million unsecured delayed draw\nterm loan under the Fund Credit Facilities. The delayed draw term loan matures in April 2028, includes four six-\nmonth extensions, which can be exercised at our option, and is subject to interest rate swaps that fix the effective\ninterest rate at 4.92%.\nC.2025 Term Loan Facility\nOur term loan agreement governing our multi-currency term loan provides for a £900.0 million Sterling-denominated\nterm loan facility that will initially mature in January 2028, before giving effect to one twelve-month extension option.\nIn addition, the Company has the ability from time to time on no more than three occasions to increase the\nborrowings under the A&R Term Loan Agreement, which may be in the form of one or more new tranches of term\nloans, up to an aggregate amount of borrowings under the A&R Term Loan Agreement not to exceed $1.35 billion,\nsubject to receipt of lender commitments and the satisfaction of certain customary conditions precedent. As of\nSeptember 30, 2026, we had an outstanding balance of $1.2 billion. As of September 30, 2026, our credit ratings\nprovide for a borrowing rate of 70 basis points over the applicable benchmark rate, which includes adjusted SOFR\nfor USD-denominated loans and adjusted SONIA for GBP-denominated loans. In conjunction with the closing, we\nexecuted variable-to-fixed interest rate swaps, which fix the weighted average per annum interest rate at 4.2% over\nthe remaining one-year term.\n-19-\nTable of Contents\nD.2024 Term Loan Facility\nIn January 2024, in connection with the merger with Spirit (the \"Merger\"), we entered into an amended and restated\nterm loan agreement that replaced Spirit's then-existing term loans with various lenders. As of September 30, 2026,\nwe had an outstanding balance of $500.0 million, due August 2027, which is subject to interest rate swaps that fix\nthe effective interest rate at 3.2%.\nE.Deferred Financing Costs"}]}, {"n": 99, "id": "FE-0983", "slice": "S8", "company": "Travelers Companies, Inc.", "form": "10-K", "question": "What was Travelers Companies, Inc.'s net investment income for the three months ended December 31, 2025?", "found": false, "display": null, "scale": "None", "unit": null, "period": "2025-10-01 to 2025-12-31", "dims": {}, "line": null, "url": "https://www.sec.gov/Archives/edgar/data/86312/000008631226000065/trv-20251231.htm", "pages": [{"label": 117, "gold": false, "text": "Evaluating the impact of these considerations on the ultimate costs of claims and claim adjustment expenses requires specialized skills and knowledge.\nThe following are the primary procedures we performed to address this critical audit matter. We, with involvement of actuarial professionals with specialized skills and knowledge, evaluated the design and tested the operating effectiveness of certain internal controls over the Company’s reserving process for claims and claim adjustment expense reserves. This included controls related to the actuarial analyses and the determination of the Company’s estimate of the claims and claim adjustment expense reserves. We also involved actuarial professionals, who assisted in:\n•assessing the methodologies underlying the Company’s claims and claim adjustment expense reserve estimate and comparing to generally accepted actuarial practices\n•evaluating for certain lines of business, the Company’s estimates by performing independent analyses of claims and claim adjustment expense reserves using Company historical loss experience and industry data\n•assessing, for selected other lines of business, the Company’s internally prepared actuarial projection methods and key assumptions in comparison to the Company’s internal experience and related industry trends\n•developing a range of reserve estimates and assessing the position and movement within the range of the Company’s recorded reserves in order to evaluate the Company’s consolidated reserves.\n/s/ KPMG LLP\nKPMG LLP\nWe have served as the Company’s auditor since 1994.\nNew York, New York\nFebruary 12, 2026\n118"}, {"label": 118, "gold": false, "text": "THE TRAVELERS COMPANIES, INC. AND SUBSIDIARIES\nCONSOLIDATED STATEMENT OF INCOME\n(in millions, except per share amounts)\nFor the year ended December 31, 2025 2024 2023\nRevenues\nPremiums $ 43,914 $ 41,941 $ 37,761\nNet investment income 3,959 3,590 2,922\nFee income 495 473 433\nNet realized investment losses (48) (30) (105)\nOther revenues 508 449 353\nTotal revenues 48,828 46,423 41,364\nClaims and expenses\nClaims and claim adjustment expenses 27,221 27,059 26,215\nAmortization of deferred acquisition costs 7,266 6,973 6,226\nGeneral and administrative expenses 6,120 5,819 5,176\nInterest expense 425 392 376\nTotal claims and expenses 41,032 40,243 37,993\nIncome before income taxes 7,796 6,180 3,371\nIncome tax expense 1,508 1,181 380\nNet income $ 6,288 $ 4,999 $ 2,991\nNet income per share\nBasic $ 27.83 $ 21.76 $ 12.93\nDiluted $ 27.43 $ 21.47 $ 12.79\nWeighted average number of common shares outstanding\nBasic 224.2 228.0 229.7\nDiluted 227.6 231.1 232.2\nThe accompanying notes are an integral part of the consolidated financial statements.\n119"}, {"label": 34, "gold": false, "text": "Debt-to-total capital ratio The ratio of debt to total capitalization.\nDebt-to-total capital ratio excluding net unrealized gain (loss) on investments The ratio of debt to total capitalization excluding the after-tax impact of net unrealized investment gains and losses included in shareholders’ equity.\nDeductible The amount of loss that an insured retains.\nDeferred acquisition costs (DAC) Incremental direct costs of acquired and renewal insurance contracts, consisting of commissions (other than contingent commissions) and premium-related taxes that are deferred and amortized to achieve a matching of revenues and expenses when reported in financial statements prepared in accordance with U.S. Generally Accepted Accounting Principles (GAAP).\nDeficiency With regard to reserves for a given liability, a deficiency exists when it is estimated or determined that the reserves are insufficient to pay the ultimate settlement value of the related liabilities. Where the deficiency is the result of an estimate, the estimated amount of deficiency (or even the finding of whether or not a deficiency exists) may change as new information becomes available.\nDemand surge Significant short-term increases in building material and labor costs due to a sharp increase in demand for those materials and services, commonly as a result of a large catastrophe resulting in significant widespread property damage.\nDirect written premiums The amounts charged by an insurer to insureds in exchange for coverages provided in accordance with the terms of an insurance contract. The amounts exclude the impact of all reinsurance premiums, either assumed or ceded.\nEarned premiums or premiums earned That portion of property casualty premiums written that applies to the expired portion of the policy term. Earned premiums are recognized as revenues under both SAP and GAAP.\nEarned pricing The impact of renewal premium change on earned premiums relative to the impact of loss cost trends and other related factors on loss and loss adjustment expenses.\nExcess and surplus lines insurance Insurance for risks not covered by standard insurance due to the unique nature of the risk. Risks could be placed in excess and surplus lines markets due to any number of characteristics, such as loss experience, unique or unusual exposures, or insufficient experience in business. Excess and surplus lines are less regulated by the states, allowing greater flexibility to design specific insurance coverage and negotiate pricing based on the risks to be secured.\nExcess liability Additional casualty coverage above a layer of insurance exposures.\nExcess-of-loss reinsurance Reinsurance that indemnifies the reinsured against all or a specified portion of losses over a specified dollar amount or “retention.”\nExposure The measure of risk used in the pricing of an insurance product. The change in exposure is the amount of change in premium on policies that renew attributable to the change in portfolio risk.\nFacultative reinsurance The reinsurance of all or a portion of the insurance provided by a single policy. Each policy reinsured is separately negotiated.\n35"}]}]</script>
<script>
const items=JSON.parse(document.getElementById('data').textContent),KEY='fe-author-review-v4',$=id=>document.getElementById(id);
let v={},i=0;try{v=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}};
const norm=s=>(s||'').replace(/\s+/g,' ').trim();
const opts=x=>x.found?[['ok','Correct'],['value','Wrong answer key'],['unclear','Question unclear']]:[['ok','Correct: not on these pages'],['value','The answer is on these pages'],['unclear','Question unclear']];
function fact(k,t,c){const a=document.createElement('dt'),b=document.createElement('dd');a.textContent=k;b.textContent=t;if(c)b.className=c;$('facts').append(a,b)}
function show(){const x=items[i],r=v[x.id]||{};$('pos').textContent=`Question ${i+1} of ${items.length}`;const n=Object.keys(v).length;$('done').textContent=`${n} reviewed`;$('fill').style.width=(100*n/items.length)+'%';
$('meta').textContent=`${x.id} · ${x.slice} · ${x.company} · ${x.form}`;$('q').textContent=x.question;$('facts').replaceChildren();
if(x.found){fact('Answer key',[x.display,x.scale,x.unit].filter(Boolean).join(' '),'key');fact('Period',x.period);if(Object.keys(x.dims).length)fact('Segment',Object.values(x.dims).join(', '));fact('Line',x.line)}else fact('Answer key','Not found on the three pages shown','key');
const d=document.createElement('dt'),e=document.createElement('dd'),a=document.createElement('a');d.textContent='Source';a.href=x.url;a.target='_blank';a.rel='noopener';a.textContent='Open the original SEC filing';e.append(a);$('facts').append(d,e);
$('ask').textContent=x.found?'Do the page and filing support this exact answer to this question?':'Is the requested figure really absent from all three pages?';$('choices').replaceChildren(...opts(x).map(([k,l],j)=>{const b=document.createElement('button');b.textContent=`${j+1}. ${l}`;b.className=r.v===k?('on'+(k==='ok'?'':' no')):'';b.onclick=()=>pick(k);return b}));$('note').value=r.note||'';
$('pages').replaceChildren(...x.pages.map((p,j)=>{const o=document.createElement('details');o.open=j===0||!x.found;const s=document.createElement('summary');s.textContent=`Page ${p.label}${p.gold?' (answer page)':''}`;const b=document.createElement('div');b.className='pg';for(const t of p.text.split('\n')){const l=document.createElement('div');l.className='ln'+(p.gold&&norm(t).includes(norm(x.line))?' hit':'');l.textContent=t||' ';b.append(l)}o.append(s,b);return o}));$('prev').disabled=i===0;$('next').textContent=i===items.length-1?'Finish':'Next';scrollTo(0,0)}
function pick(k){const x=items[i];v[x.id]={v:k,note:$('note').value.trim()};save();show()}
$('note').oninput=()=>{const x=items[i];if(v[x.id]){v[x.id].note=$('note').value.trim();save()}};
$('prev').onclick=()=>{if(i>0){i--;show()}};$('next').onclick=()=>{if(i<items.length-1){i++;show()}};
$('dl').onclick=()=>{const rows=items.filter(x=>v[x.id]).map(x=>JSON.stringify({n:x.n,id:x.id,correct:v[x.id].v==='ok',gold_value_correct:v[x.id].v!=='value',failure_class:v[x.id].v==='ok'?null:v[x.id].v,note:v[x.id].note,reviewer:'author'}));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')+'\n'],{type:'application/x-ndjson'}));a.download='author_review_v4.jsonl';a.click();URL.revokeObjectURL(a.href)};
addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;const o=opts(items[i]);if(['1','2','3'].includes(e.key))pick(o[+e.key-1][0]);if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
show();
</script></body></html>
