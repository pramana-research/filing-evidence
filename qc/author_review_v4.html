ding net income available to Duke Energy common stockholders, as adjusted for distributed and undistributed earnings allocated to participating securities, by the diluted weighted average number of common shares outstanding during the period. Diluted EPS reflects the potential dilution that could occur if securities or other agreements to issue common stock, such as equity forward sale agreements, convertible debt or equity units, were exercised or settled. Duke Energy applies the if-converted method for calculating any potential dilutive effect of the conversion of the outstanding convertible notes on diluted EPS, if applicable. Duke Energy’s participating securities are restricted stock units that are entitled to dividends declared on Duke Energy common stock during the restricted stock unit’s vesting periods. Dividends declared on preferred stock are recorded on the Condensed Consolidated Statements of Operations as a reduction of net income to arrive at net income available to Duke Energy common stockholders.\n99"}, {"label": 101, "gold": false, "text": "FINANCIAL STATEMENTS EMPLOYEE BENEFIT PLANS\nNON-QUALIFIED PENSION PLANS\nNet periodic pension costs for non-qualified pension plans were not material for the three and nine months ended September 30, 2026, and 2025.\nOTHER POST-RETIREMENT BENEFIT PLANS\nNet periodic costs for OPEB plans were not material for the three and nine months ended September 30, 2026, and 2025.\n17. INCOME TAXES\nThe IRA established transferability markets that enable monetization of tax credits. In April 2026, Duke Energy executed a multiyear agreement with a counterparty for the sale of up to $3.1 billion in net tax credits, including nuclear PTCs, solar PTCs and ITCs to be earned from 2025 through 2028. Proceeds are expected to be received from 2026 through 2029, including approximately $2 billion for Duke Energy Carolinas, $700 million for Duke Energy Progress and $350 million for Duke Energy Florida. The net realizable value from the sale of these tax credits is expected to ultimately flow back to customers through rates over time, subject to regulatory approval.\nCorporate Alternative Minimum Tax\nOn February 18, 2026, the U.S. Treasury Department published Notice 2026-7 providing additional interim guidance on the application of the Corporate Alternative Minimum Tax (CAMT) under the Internal Revenue Code. The notice includes adjustments to the adjusted financial statement income that permit taxpayers to deduct certain tax-deductible repairs with respect to Section 168 property for CAMT purposes, as well as other adjustments related to capitalization differences.\nAs a result, in October 2026, Duke Energy filed amended federal income tax returns with additional refund claims of approximately $45 million for tax years 2023 and 2024. Duke Energy also reduced accrued taxes by $85 million related to tax year 2025. These amounts have been recorded to the Duke Energy Condensed Consolidated Balance Sheets as of September 30, 2026, as well as a corresponding $130 million reduction to deferred income tax assets due to lower CAMT credit carryforwards.\nEFFECTIVE TAX RATES\nThe ETRs from continuing operations for each of the Duke Energy Registrants are included in the following table.\nThree Months Ended Nine Months Ended\nSeptember 30, September 30,\n2026 2025 2026 2025\nDuke Energy 15.3 % 10.8 % 15.4 % 11.2 %\nDuke Energy Carolinas 14.4 % 6.9 % 9.3 % 7.8 %\nProgress Energy 17.8 % 15.9 % 16.5 % 15.9 %\nDuke Energy Progress 19.4 % 13.1 % 15.2 % 13.4 %\nDuke Energy Florida 17.2 % 19.5 % 18.9 % 19.4 %\nDuke Energy Ohio 16.8 % 14.3 % 18.3 % 16.3 %\nDuke Energy Indiana 13.2 % 12.6 % 13.5 % 12.8 %\nPiedmont 23.7 % 24.0 % 25.1 % 18.7 %\nThe increase in the ETR for Duke Energy for the three months ended September 30, 2026, was primarily due to a decrease in the amortization of EDIT.\nThe increase in the ETR for Duke Energy for the nine months ended September 30, 2026, was primarily due to non-deductible goodwill associated with the sale of Piedmont's Tennessee business and a decrease in the amortization of EDIT, partially offset by an increase in the amortization of nuclear PTCs.\nThe increase in the ETR for Duke Energy Carolinas for the three months ended September 30, 2026, was primarily due to a decrease in the amortization of EDIT.\nThe increase in the ETR for Duke Energy Carolinas for the nine months ended September 30, 2026, was primarily due to a decrease in the amortization of EDIT, partially offset by an increase in the amortization of nuclear PTCs.\nThe increase in the ETR for Progress Energy for the three months ended September 30, 2026, was primarily due to a decrease in the amortization of EDIT, partially offset by an increase in solar PTCs.\nThe increase in the ETR for Duke Energy Progress for the three months ended September 30, 2026, was primarily due to a decrease in the amortization of EDIT.\nThe increase in the ETR for Duke Energy Progress for the nine months ended September 30, 2026, was primarily due to a decrease in the amortization of EDIT.\nThe decrease in the ETR for Duke Energy Florida for the three months ended September 30, 2026, was primarily due to an increase in solar PTCs.\nThe increase in the ETR for Duke Energy Ohio for the three months ended September 30, 2026, was primarily due to a decrease in the amortization of EDIT.\n102"}]}, {"n": 60, "id": "FE-0512", "slice": "S5", "company": "American Express Company", "form": "10-K", "question": "What was American Express Company's goodwill for its ICS segment as of December 31, 2023?", "found": true, "display": "743", "scale": "millions", "unit": "USD", "period": "2023-12-31", "dims": {"us-gaap:StatementBusinessSegmentsAxis": "axp:InternationalCardServicesSegmentMember"}, "line": "Balance as of December 31, 2023 $ 379 $ 2,151 $ 743 $ 578 $ 3,851", "url": "https://www.sec.gov/Archives/edgar/data/4962/000000496226000080/axp-20251231.htm", "pages": [{"label": 120, "gold": true, "text": "Table of Contents\nNOTE 6\nOTHER ASSETS\nThe following is a summary of Other assets as of December 31, 2025 and 2024:\nTABLE 6.1: OTHER ASSETS\n(Millions) 2025 2024\nGoodwill $ 4,872 $ 4,187\nRight-of-use lease assets 998 804\nOther intangible assets, at amortized cost 90 123\nOther (a) 18,302 16,065\nTotal $ 24,263 $ 21,179\n(a)Primarily includes net deferred tax assets, other receivables net of reserves, investments in non-consolidated entities, prepaid assets and tax credit investments.\nGOODWILL\nThe changes in the carrying amount of goodwill reported in our reportable operating segments were as follows:\nTABLE 6.2: GOODWILL ROLLFORWARD\n(Millions) USCS CS ICS GMNS Total\nBalance as of December 31, 2023 $ 379 $ 2,151 $ 743 $ 578 $ 3,851\nAcquisitions (a) 394 — — — 394\nDispositions — — — (27) (27)\nOther (c) (1) (3) (27) — (31)\nBalance as of December 31, 2024 $ 772 $ 2,148 $ 716 $ 551 $ 4,187\nAcquisitions (b) — 590 — — 590\nDispositions — — — — —\nOther (c) 27 6 59 3 95\nBalance as of December 31, 2025 $ 799 $ 2,744 $ 775 $ 554 $ 4,872\n(a)Includes the acquisition of a reservation, table and event management technology provider.\n(b)Includes the acquisition of an expense management software company.\n(c)Primarily includes foreign currency translation.\nAccumulated impairment losses were $221 million as of both December 31, 2025 and 2024.\nOTHER INTANGIBLE ASSETS\nThe gross carrying amount for Other intangible assets as of December 31, 2025 and 2024 was $662 million and $642 million, respectively, with accumulated amortization of $572 million and $519 million, respectively.\nAmortization expense was $36 million, $46 million and $49 million for the years ended December 31, 2025, 2024 and 2023, respectively. For Other intangible assets on the Consolidated Balance Sheets as of December 31, 2025, amortization expense is expected to be $25 million in 2026, $23 million in 2027, $19 million in 2028, $16 million in 2029, $4 million in 2030 and $3 million thereafter.\n118"}, {"label": 121, "gold": false, "text": "Table of Contents\nTAX CREDIT INVESTMENTS\nWe hold tax credit investments that promote affordable housing, community development, and small businesses that foster economic growth in underserved areas and support compliance with the Community Reinvestment Act by our U.S. bank subsidiary, American Express National Bank (AENB). These investments generate a return primarily through the realization of income tax credits and other income tax benefits.\nAs of December 31, 2025 and 2024, we had $1,782 million and $1,568 million in tax credit investments, respectively, included in Other assets on the Consolidated Balance Sheets, comprised of Low-Income Housing Tax Credit (LIHTC) investments and other qualifying investments. We account for such tax credit investments using the Proportional Amortization Method.\nAs of December 31, 2025 and 2024, $1,266 million and $1,168 million of our tax credit investments, respectively, related to investments in unconsolidated VIEs for which we do not have a controlling financial interest. These amounts also represented our maximum exposure to loss for these entities.\nAs of December 31, 2025, we committed to provide funding related to certain of our tax credit investments, which is expected to be paid between 2026 and 2041, resulting in $755 million in future equity contributions reported in Other liabilities, of which $445 million specifically related to unconsolidated VIEs.\nThe following table presents tax credit investment expenses and associated income tax credits and other income tax benefits for the years ended December 31:\nTABLE 6.3: TAX CREDIT INVESTMENT EXPENSES, INCOME TAX CREDITS AND OTHER BENEFITS\n(Millions) 2025 2024 2023\nProportional amortization recognized in tax provision $ (233) $ (193) $ (185)\nIncome tax credits and Other income tax benefits (a) recognized in tax provision $ 276 $ 221 $ 204\n(a)Other income tax benefits are a result of tax deductible expenses generated by our tax credit investments.\nIncome tax credits and other income tax benefits associated with our tax credit investments are also recognized in the Consolidated Statements of Cash Flows in the Operating activities section primarily under Accounts payable and other liabilities.\n119"}, {"label": 135, "gold": false, "text": "Table of Contents\nThe following table presents the gains and losses recognized in Interest expense on the Consolidated Statements of Income associated with the fair value hedges of our fixed-rate long-term debt for the years ended December 31:\nTABLE 13.2: GAINS AND LOSSES ASSOCIATED WITH FAIR VALUE HEDGES ON FIXED-RATE LONG TERM DEBT\nGains (losses)\n(Millions) 2025 2024 2023\nFixed-rate long-term debt $ (339) $ 26 $ (289)\nDerivatives designated as hedging instruments 340 (27) 290\nTotal $ 1 $ (1) $ 1\nThe carrying values of the hedged liabilities, recorded within Long-term debt on the Consolidated Balance Sheets, were $37.0 billion and $18.9 billion as of December 31, 2025 and 2024, respectively, including the cumulative amount of fair value hedging adjustments of $366 million and $27 million for the respective periods.\nWe recognized in Interest expense on Long-term debt net increases of $106 million, $254 million and $189 million for the years ended December 31, 2025, 2024 and 2023, respectively. These were primarily related to the net settlements including interest accruals on our interest rate derivatives designated as fair value hedges.\nNET INVESTMENT HEDGES\nA net investment hedge is used to hedge future changes in currency exposure of a net investment in a foreign operation. We primarily designate foreign currency derivatives (typically foreign exchange forwards) and, in certain cases, foreign currency-denominated debt, as hedging instruments to reduce our exposure to changes in currency exchange rates on net investments in foreign subsidiaries with non-U.S. dollar functional currency. We had notional amounts of approximately $16.3 billion and $14.3 billion designated as net investment hedges as of December 31, 2025 and 2024, respectively. The gain or loss on these net investment hedges, net of taxes, recorded in AOCI as part of the cumulative translation adjustment, was a loss of $1 billion, a gain of $0.8 billion and a loss of $0.6 billion for the years ended December 31, 2025, 2024 and 2023, respectively. Net investment hedge reclassifications out of AOCI into the Consolidated Statements of Income were not significant for the years ended December 31, 2025, 2024 and 2023, respectively.\nDERIVATIVES NOT DESIGNATED AS HEDGES\nWe have derivatives that act as economic hedges, but are not designated as such for hedge accounting purposes. Foreign currency transactions from time to time may be partially or fully economically hedged through foreign currency contracts, primarily foreign exchange forwards. These hedges generally mature within one year. Foreign currency contracts involve the purchase and sale of designated currencies at an agreed upon rate for settlement on a specified date.\nThe changes in the fair value of derivatives that are not designated as hedges are primarily intended to offset the related foreign exchange gains or losses of the underlying foreign currency exposures. We had notional amounts of approximately $39.0 billion and $28.8 billion as of December 31, 2025 and 2024, respectively. The changes in the fair value of the derivatives and the related underlying foreign currency exposures resulted in net gains of $121 million, $102 million and $82 million for the years ended December 31, 2025, 2024 and 2023, respectively, that are recognized in Other, net expenses in the Consolidated Statements of Income.\nOur embedded derivative related to seller earnout shares granted to us upon the completion of a business combination in the second quarter of 2022 between our equity method investee, American Express Global Business Travel, and Apollo Strategic Growth Capital (C Ordinary Shares of GBT JerseyCo Limited) had a notional amount of $78 million as of both December 31, 2025 and 2024. This embedded derivative had a fair value of $10 million and $31 million as of December 31, 2025 and 2024, respectively. The changes in the fair value of the embedded derivative resulted in a loss of $21 million, a gain of $13 million and a loss of $9 million for the years ended December 31, 2025, 2024 and 2023, respectively, which were recognized in Service fees and other revenue in the Consolidated Statements of Income.\n133"}]}, {"n": 61, "id": "FE-0555", "slice": "S5", "company": "Eli Lilly and Company", "form": "10-Q", "question": "What was Eli Lilly and Company's revenue for its Reportable Segment for the nine months ended September 30, 2025?", "found": true, "display": "45,887", "scale": "millions", "unit": "USD", "period": "2025-01-01 to 2025-09-30", "dims": {"us-gaap:StatementBusinessSegmentsAxis": "lly:ReportableSegmentMember"}, "line": "Revenue $ 24,397 $ 17,601 $ 67,170 $ 45,887", "url": "https://www.sec.gov/Archives/edgar/data/59478/000005947826000108/lly-20260930.htm", "pages": [{"label": 22, "gold": true, "text": "The following table summarizes the activity related to each component of accumulated other comprehensive income (loss) during the nine months ended September 30, 2026 and 2025:\nForeign Currency Translation(1) Retirement Benefit Plans Other Accumulated Other Comprehensive Loss\nBalance at December 31, 2025 $ (1,149) $ (1,987) $ 255 $ (2,880)\nOther comprehensive income (loss) 226 43 (18) 251\nBalance at September 30, 2026 $ (922) $ (1,944) $ 237 $ (2,629)\nBalance at December 31, 2024 $ (2,390) $ (2,179) $ 246 $ (4,322)\nOther comprehensive income (loss) 1,098 6 12 1,116\nBalance at September 30, 2025 $ (1,292) $ (2,173) $ 259 $ (3,206)\n(1) Includes the impact of foreign currency transactions designated as net investment hedges. See Note 8 for additional information.\nNote 11: Segment Information\nWe operate as a single reportable segment engaged in the discovery, development, manufacturing, marketing, and sales of pharmaceutical products worldwide. A global research and development organization and a supply chain organization are responsible for the discovery, development, manufacturing, and supply of our products. Our commercial organizations market, distribute, and sell the products. The business is also supported by global corporate staff functions. Our determination that we operate as a single segment is consistent with the nature of our operations and the financial information regularly reviewed by the chief executive officer, in his capacity as the chief operating decision maker (CODM), for the purposes of evaluating performance, allocating resources, setting incentive compensation targets, and planning and forecasting for future periods.\nOur purpose is to unite caring with discovery to create medicines that make life better for people around the world. Our long-term success is significantly dependent on our ability to research and develop innovative medicines. The CODM uses consolidated net income to assess performance of our company, ensuring that we are investing in future research and development while efficiently delivering products to patients. The CODM allocates research and development resources based upon several factors, including the likelihood of technical success, unmet medical needs, and the viability of commercial success. A significant component of the CODM’s decision-making process is to ensure a balanced investment in our research and development portfolio to drive near-term success and sustain for the long-term.\nThe following table summarizes information for our single reportable segment, including significant segment expenses:\nThree Months Ended September 30, Nine Months Ended September 30,\n2026 2025 2026 2025\nRevenue $ 24,397 $ 17,601 $ 67,170 $ 45,887\nLess:\nCost of sales 3,933 3,008 10,778 7,680\nEarly-stage research and development(1) 1,663 1,250 4,379 3,396\nLate-stage research and development(1) 2,584 2,216 7,197 6,140\nMarketing, selling, and administrative 3,125 2,741 9,489 7,963\nAcquired in-process research and development 4,181 656 7,541 2,381\nOther segment items(2) 2,460 2,148 6,844 4,325\nNet income $ 6,451 $ 5,583 $ 20,942 $ 14,002\nInterest expense $ 378 $ 180 $ 1,055 $ 672\nExpenditures for long-lived assets(3) 3,639 2,320 8,983 5,821\n(1) Early-stage research and development primarily includes costs incurred from discovery through Phase 2 clinical trials. Late-stage research and development primarily includes costs incurred from Phase 3 clinical trials.\n(2) Other segment items primarily include income taxes.\n(3) Includes expenditures for property and equipment and computer software costs.\n23"}, {"label": 25, "gold": false, "text": "We have entered into voluntary agreements with the U.S. government in which, among other arrangements, we agreed to lower Medicaid and certain other drug prices for U.S. patients and to launch new medicines with a more balanced pricing approach across developed nations. Under the Medicare GLP-1 Bridge program, Medicare beneficiaries obtained access to discounted Lilly obesity medicines effective July 1, 2026 through December 31, 2027, and individual state Medicaid programs separately have the option to expand access to these medicines. We continue to engage with the Centers for Medicare & Medicaid Services on long-term Medicare access to obesity medicines. Continued uptake from this expanded access is unknown. Moreover, the outcome of these arrangements and broader U.S. policy efforts to align domestic pharmaceutical pricing with international benchmarks from countries with competing healthcare cost containment priorities is uncertain and could negatively impact our pricing strategies, product demand or access, or competitive positioning across global markets, and may result in reduced revenue in certain markets.\nThe Inflation Reduction Act of 2022 (IRA) requires the U.S. Department of Health and Human Services (HHS) to effectively set prices for certain single-source drugs and biologics reimbursed under Medicare Part B and Part D. Currently, these government prices generally apply beginning at nine years (for medicines approved under a New Drug Application) or thirteen years (for medicines approved under a Biologics License Application) following FDA approval or licensure for the molecule. HHS selected Jardiance, which is part of our collaboration with Boehringer Ingelheim, in August 2023 (effective 2026), and selected Trulicity and Verzenio in January 2026 (to be effective 2028), as medicines subject to government-set prices. Given our product portfolio, we expect other significant products will be selected in future years. The IRA has, and will continue to, meaningfully influence our business strategies and those of our competitors and could significantly impact our business and consolidated results of operations.\nThe U.S. and other countries have imposed or reached alignment on tariffs. In some cases, imposed tariffs have been paused but may come into effect quickly and unpredictably. While Lilly and pharmaceuticals are exempt from certain of these tariffs, such exemptions may expire, may be terminated or may not apply to any future tariffs. The precise impact of tariffs, trade protection measures, and other restrictions depends on their ultimate scope, timing, and other factors. If enacted, additional restrictions could result in supply disruptions or delays, further increase costs, or otherwise have a negative impact on our business.\nPrivate payers and pharmacy benefit managers in the U.S. continue to significantly impact the market for pharmaceuticals through negotiation of access, manufacturer price or rebate concessions and pharmacy reimbursement rates. Restrictive or unfavorable pricing, coverage, or reimbursement determinations for our medicines or product candidates by governments, regulatory agencies, courts, or private actors have and may continue to adversely impact our business and consolidated results of operations. In addition, we are engaged in litigation, investigations, and discussions with government entities related to government programs (including the 340B program), access to medicine, pricing, product safety, and other matters that could negatively impact our business and consolidated results of operations. It is not currently possible to predict the overall potential adverse impact to us or the general pharmaceutical industry of continued cost containment efforts worldwide.\nIn addition, regulatory issues concerning compliance with current Good Manufacturing Practices, quality assurance, safety signals, evolving standards, and increased scrutiny around excipients and potential impurities such as nitrosamines, and similar regulations and standards (and comparable foreign regulations and standards) for our products in some cases lead to regulatory and legal actions, product recalls and seizures, fines and penalties, interruption of production leading to product shortages, import bans or denials of import certifications, inability to realize the benefit of capital expenditures, or delays or denials in new product approvals, line extensions or supplemental approvals of current products pending resolution of the issues, or other negative impacts, any of which result in reputational harm or adversely affect our business.\nOther policies, regulations, legislation, or enforcement, including those proposed or pursued by lawmakers, regulators, and other authorities in the U.S. and worldwide, have and may continue to adversely impact our business and consolidated results of operations.\nIncretin Medicines\nMounjaro, Zepbound, and Foundayo accounted for 66 percent of our total revenue for the nine months ended September 30, 2026, and we expect cardiometabolic health products will continue to represent a significant and growing portion of our business, revenue, and prospects.\n26"}, {"label": 21, easonably likely to materially affect, the Company’s internal control over financial reporting.\nPART II - OTHER INFORMATION\nItem 1. Legal Proceedings\nFor a discussion of legal proceedings, see Part I – Item 1 – Note 11.\nItem 1A. Risk Factors\nIn evaluating the Company and our business, you should carefully consider the risks and uncertainties described in Part I – Item 1A – Risk Factors in our most recent Annual Report on Form 10-K, together with the other information in this Quarterly Report on Form 10-Q, including our condensed consolidated financial statements and related notes in Part I – Item 1 and Part I – Item 2 – Management’s Discussion and Analysis of Financial Condition and Results of Operations. Except as described below with respect to our spot cryptocurrency offer, there have been no material changes from the risk factors set forth in our 2025 Annual Report on Form 10-K. Additional risks not presently known to us, or that we currently believe to be immaterial, may also adversely affect our business, financial condition, results of operations, or cash flows.\nCryptocurrency\nCryptocurrency, or crypto, uses cryptography blockchain technology, and distributed networks to execute, record, and verify transactions. Unlike traditional financial markets, there may be no party that can prevent or reverse fraudulent transactions, restore lost or stolen assets, or halt operations during a disruption. This absence of a central counterparty or settlement intermediary makes cryptocurrencies susceptible to theft, fraud, and operational disruption and may make recovery of stolen assets difficult or impossible.\nCryptocurrency markets and service providers have been subject to regulatory actions, adverse publicity, and significant volatility. Custodians and other service providers have been targets of sophisticated cyber attacks, which may include intrusion into operations infrastructure, tampering with transaction-related software, theft or substitution of hardware security modules, impersonation of authorized signers, social engineering of personnel, manipulation of internal address books, and exploitation of administrative procedures.\nClients’ cryptocurrency held through Schwab CryptoTM is not a deposit or a security and is not protected by the FDIC or the Securities Investor Protection Corporation (SIPC).\nAny operational or security failure at our sub-custodian could result in loss or theft of clients’ cryptocurrency and expose us to remediation costs, regulatory scrutiny, and reputational harm.\nOur spot cryptocurrency offer currently relies on our sub-custodian to safeguard cryptocurrency held by our clients. Any operational failure, cybersecurity incident, fraud, insolvency, or other disruption at the sub-custodian, or a failure of the underlying blockchain infrastructure, could result in the theft or loss of our clients’ cryptocurrency, which may not be recoverable.\nCryptocurrency custodied through digital wallets is generally accessible only through associated private keys, which the sub-custodian holds and manages as part of its custodial services. Any loss or compromise of private keys or wallets, including through error, misconduct, or cyberattack affecting the sub-custodian or its personnel, could impair our clients’ ability to access\n- 69 -"}, {"label": 17, "gold": false, "text": "THE CHARLES SCHWAB CORPORATION\nManagement’s Discussion and Analysis of Financial Condition and Results of Operations\n(Tabular Amounts in Millions, Except Ratios, or as Noted)\nthe third quarter of 2026 increased year-over-year for both segments, due primarily to growth in margin and bank lending solutions, partially offset by lower yields on floating-rate assets, lower average balances of certain interest-earning assets, and higher average wholesale borrowings as robust demand for lending solutions outpaced deposit growth. Net interest revenue in the first nine months of 2026 increased year-over-year for both segments primarily due to growth in lending solutions and lower average wholesale borrowings, partially offset by lower yields on floating-rate assets and lower average balances of certain interest-earning assets. Asset management and administration fees increased for Investor Services primarily as a result of higher average balances in managed investing solutions, while higher average balances in Schwab equity and bond funds, ETFs, and CTFs, Mutual Fund OneSource®, and money market funds helped drive year-over-year growth for both segments. Trading revenue increased for both segments primarily due to higher order flow revenue and higher commission revenue reflecting higher DATs and changes in the mix of trading activity. Bank deposit account fees increased for both segments primarily due to improved net yields partially offset by lower average BDA balances. Investor Services other revenue increased primarily due to higher industry fees, gains recognized from certain equity investments, and lower losses recognized on the sale of AFS securities, partially offset by lower other service fees. Advisor Services other revenue increased primarily due to gains from certain equity investments, higher other service fees, lower losses on the sale of AFS securities, and higher industry fees.\nSegment Expenses Excluding Interest\nInvestor Services and Advisor Services total expenses excluding interest increased by 9% and 8%, respectively, in the third quarter of 2026, and 9% and 6%, respectively, in the first nine months of 2026 compared to the same periods in 2025. Compensation and benefits expense increased for both segments primarily due to annual merit increases and growth in headcount, higher incentive compensation, and higher other employee-related costs. Professional services expense was largely flat for Advisor Services and increased for Investor Services due to overall growth of the business and increased utilization of other professional services. Occupancy and equipment expense increased for both segments primarily due to higher software subscription costs and building expenses related to growth of the business. Communications expense increased for both segments primarily due to higher proxy-related and postage expenses, as well as higher exchange quotation services. Regulatory fees and assessments increased for both segments in the third quarter of 2026 primarily due to the 2025 FDIC special assessment reduction, while year-to-date fees decreased for Investor Services and increased slightly for Advisor Services as lower regulatory fees were partially offset by the 2025 FDIC special assessment reduction.\nRISK MANAGEMENT\nSchwab’s business activities expose it to a variety of risks, including operational, compliance, credit, market, and liquidity risks. The Company has a comprehensive risk management program to identify and manage these risks and their associated potential for financial and reputational impact.\nFor a discussion of our risk management programs, see Part II – Item 7 – Risk Management in the 2025 Form 10-K.\nMarket Risk\nMarket risk is the potential for changes in earnings or the value of financial instruments held by Schwab as a result of fluctuations in interest rates, equity prices, or market conditions. Schwab is exposed to market risk primarily from changes in interest rates within our interest-earning assets relative to changes in the costs of funding sources that finance these assets.\nTo manage interest rate risk, we have established policies and procedures, which include setting limits on net interest revenue risk and EVE risk. To remain within these limits, we manage the maturity, repricing, and cash flow characteristics of the investment portfolios, loan portfolios, and liabilities. Management monitors established guidelines to stay within the Company’s risk appetite. The Company utilizes interest rate swap derivative instruments to assist with managing interest rate risk, the effects of which are incorporated into the Company’s net interest revenue and EVE analyses. For further information on our interest rate risk management strategies utilizing interest rate swaps, see Item 1 – Note 12.\nOur measurement of interest rate risk involves assumptions that are inherently uncertain and, as a result, cannot precisely estimate the impact of changes in interest rates on net interest revenue, bank deposit account fees, or EVE. Actual results may differ from simulated results due to balance growth or decline and the timing, magnitude, and frequency of interest rate changes, as well as changes in market conditions and management strategies, including changes in asset and liability mix. Financial instruments are also subject to the risk that valuations will be negatively affected by changes in demand and the underlying market for a financial instrument.\n- 16 -"}]}, {"n": 63, "id": "FE-0608", "slice": "S5", "company": "Thermo Fisher Scientific Inc.", "form": "10-Q", "question": "What was Thermo Fisher Scientific Inc.'s revenues from external customers for its Life Sciences Solutions segment for the three months ended September 26, 2026?", "found": true, "display": "2,279", "scale": "millions", "unit": "USD", "period": "2026-06-28 to 2026-09-26", "dims": {"us-gaap:StatementBusinessSegmentsAxis": "tmo:LifeSciencesSolutionsMember"}, "line": "Revenues from external customers $ 2,279 $ 1,948 $ 1,090 $ 6,820 $ 12,137", "url": "https://www.sec.gov/Archives/edgar/data/97745/000009774526000179/tmo-20260926.htm", "pages": [{"label": 23, "gold": true, "text": "THERMO FISHER SCIENTIFIC INC.\nNOTES TO CONDENSED CONSOLIDATED FINANCIAL STATEMENTS\n(Unaudited)\nNote 11. Business Segment Information\nBusiness Segment Information\nThe company’s financial performance is reported in four segments. During 2026, there have been no changes to the company’s basis of segmentation or in the basis of measurement of segment income. Other segment items included in the below tables consist of stock-based compensation and oth ch have no or limited international operations, McDonald's does business in more than 100 countries and a substantial portion of its revenues and income is generated outside the U.S. In addition, because of its size, McDonald's inclusion in those indices tends to skew the results. Therefore, the Company believes that such a comparison is not meaningful.\nThe Company's market capitalization, trading volume and importance in an industry that is vital to the U.S. economy have resulted in McDonald's inclusion in the Dow Jones Industrial Average (\"DJIA\") since 1985. Like McDonald's, many DJIA companies generate meaningful revenues and income outside the U.S. and some manage global brands. Thus, the Company believes that the use of the DJIA companies as the group for comparison purposes is appropriate.\nThe following performance graph shows McDonald's cumulative total shareholder returns (i.e., price appreciation and reinvestment of dividends) relative to the Standard & Poor's 500 Stock Index (\"S&P 500 Index\") and to the DJIA companies for the five-year period ended December 31, 2025. The graph assumes that the value of an investment in McDonald's common stock, the S&P 500 Index and the DJIA companies (including McDonald's) was $100 at December 31, 2020. For the DJIA companies, returns are weighted for market capitalization as of the beginning of each period indicated. These returns may vary from those of the DJIA Index, which is not weighted by market capitalization and may be composed of different companies during the period under consideration.\nCompany/Index 12/31/2020 12/31/2021 12/31/2022 12/31/2023 12/31/2024 12/31/2025\nMcDonald's Corporation $100 $128 $128 $148 $148 $160\nS&P 500 Index $100 $129 $105 $133 $166 $196\nDow Jones Industrials $100 $121 $113 $131 $150 $173\nSource: S&P Capital IQ\nMcDonald's Corporation 2025 Annual Report 25"}]}, {"n": 65, "id": "FE-0734", "slice": "S6", "company": "UnitedHealth Group Incorporated", "form": "10-K", "question": "Wha ity:\nU.S. government and agency obligations 444 — (2) 442\nState and municipal obligations 28 — (2) 26\nCorporate obligations 40 — — 40\nTotal debt securities - held-to-maturity 512 — (4) 508\nTotal debt securities $ 50,327 $ 62 $ (2,962) $ 47,427\nNearly all of the Company’s investments in mortgage-backed securities were rated “Double A” or better as of December 31, 2025.\nThe Company held $5.5 billion and $4.9 billion of equity securities as of December 31, 2025 and 2024, respectively. The Company’s investments in equity securities primarily consist of venture investments and employee savings plan related investments. The carrying values of equity securities held at fair value on non-recurring basis were $3.3 billion and $3.0 billion, including cumulative net unrealized gains of $0.8 billion and $1.3 billion, as of December 31, 2025 and 2024, respectively. For the years ended December 31, 2025, 2024 and 2023, the Company recognized $(360) million, $710 million and $276 million, respectively, of unrealized (losses) or gains related to fair value adjustments on equity securities primarily in the Company’s venture portfolio and recorded $(54) million, $121 million and $44 million, respectively, of investment expenses related to the fair value adjustments. Unrealized gains and losses on equity securities are recorded within investment and other income with associated expenses recorded within operating costs within the Consolidated Statements of Operations.\nAdditionally, the Company’s investments included $3.8 billion of equity method investments primarily in operating businesses in the health care sector, as of both December 31, 2025 and 2024. The allowance for credit losses on held-to-maturity securities as of December 31, 2025 and 2024 was not material.\n53"}, {"label": 70, "gold": false, "text": "Table of Contents\nAssets and liabilities held for sale have been included within prepaid expenses and other current assets and other current liabilities on the Condensed Consolidated Balance Sheets, respectively. The assets and liabilities of the held for sale disposal groups as of December 31, 2025, were as follows:\n(in millions) South American Businesses Other Businesses\nAssets\nCash and cash equivalents $ 253 $ 317\nAccounts receivable and other current assets 747 515\nProperty, equipment and capitalized software 819 292\nGoodwill 176 434\nOther intangible assets 257 803\nOther long-term assets 320 346\nRemeasurement of assets of businesses held for sale to fair value less cost to sell (1) (1,523) (950)\nTotal assets $ 1,049 $ 1,757\nLiabilities\nMedical costs payable $ 205 $ 463\nAccounts payable and other current liabilities 408 301\nOther long-term liabilities 362 407\nTotal liabilities $ 975 $ 1,171\n(1) Includes the effect of $891 million of cumulative foreign currency translation losses and $275 million of noncontrolling interests for the South American businesses held for sale.\n2025 Deconsolidation of Business\nDue to changes in governance rights, the Company deconsolidated a business that had net assets and redeemable noncontrolling interests with carrying values of $1.4 billion and $2.6 billion, respectively. As a result of the deconsolidation, the Company recorded an equity method investment of $575 million and recognized a gain of $1.7 billion, which was included within operating costs on the Consolidated Statements of Operations.\n2024 Dispositions and Held for Sale\nDuring the year ended December 31, 2024, the Company completed or initiated various business portfolio refinement and asset disposition activities. The Company recorded a loss of $7.1 billion related to the sale of its Brazil operations, of which $4.1 billion related to the impact of cumulative foreign currency translation losses previously included in accumulated other comprehensive loss, and a loss of $1.2 billion related to the reclassification of the Company’s remaining South American operations as held for sale, of which $855 million related to the impact of cumulative foreign currency translation losses.\nAs a result of continued portfolio refinement, the Company sold other businesses and assets and entered into strategic transactions. These transactions resulted in total consideration received of $3.0 billion and an additional $1.9 billion of equity method investments related to the valuation of our retained interests in certain transactions. The carrying value for these transactions was $1.0 billion, primarily related to goodwill. The gains from business portfolio refinement, including strategic transactions, were recorded within operating costs in the Consolidated Statements of Operations and contributed about 80 basis points ($3.3 billion) to the operating cost ratio, nearly half ($1.4 billion) related to Optum Health with the remainder split between UnitedHealthcare ($1.1 billion) and Optum Insight ($800 million). Certain transactions also included various put and call options, which were valued at $630 million and included in other liabilities on the Consolidated Balance Sheets.\n69"}, {"label": 53, "gold": false, "text": "Table of Contents\nRedeemable Noncontrolling Interests\nRedeemable noncontrolling interests in the Company’s subsidiaries whose redemption is outside of the Company’s control are classified as temporary equity. These interests primarily relate to put options on unowned shares, which are typically redeemable at fair value after a certain time period. The Company accretes changes in the redemption value to the earliest redemption date utilizing the interest method. If all interests were currently redeemable, the difference between the carrying value and the estimated redemption value is not material. The following table provides details of the Company's redeemable noncontrolling interests’ activity for the years ended December 31, 2025 and 2024:\n(in millions) 2025 2024\nRedeemable noncontrolling interests, beginning of period $ 4,323 $ 4,498\nNet earnings 74 174\nAcquisitions 9 33\nRedemptions (189) (280)\nDistributions (99) (125)\nFair value, deconsolidations and other adjustments (2,510) 23\nRedeemable noncontrolling interests, end of period $ 1,608 $ 4,323\nShare-Based Compensation\nThe Company recognizes compensation expense for share-based awards, including stock options and restricted stock and restricted stock units (collectively, restricted shares), on a straight-line basis over the related service period (generally the vesting period) of the award, or to an employee’s eligible retirement date under the award agreement, if earlier. Restricted shares vest ratably, primarily over two to four years, and compensation expense related to restricted shares is based on the share price on the date of grant. Stock options vest ratably primarily over four years and may be exercised up to 10 years from the date of grant. Compensation expense related to stock options is based on the fair value at the date of grant, which is estimated on the date of grant using a binomial option-pricing model. Under the Company’s Employee Stock Purchase Plan (ESPP), eligible employees are allowed to purchase the Company’s stock at a discounted price, which is 90% of the market price of the Company’s common stock at the end of the six-month purchase period. Share-based compensation expense for all programs is recognized in operating costs in the Consolidated Statements of Operations.\nNet Earnings Per Common Share\nThe Company computes basic earnings per common share attributable to UnitedHealth Group common shareholders by dividing net earnings attributable to UnitedHealth Group common shareholders by the weighted-average number of common shares outstanding during the period. The Company determines diluted net earnings per common share attributable to UnitedHealth Group common shareholders using the weighted-average number of common shares outstanding during the period, adjusted for potentially dilutive shares associated with stock options, restricted shares and the ESPP (collectively, common stock equivalents), using the treasury stock method. The treasury stock method assumes a hypothetical issuance of shares to settle the share-based awards, with the assumed proceeds used to purchase common stock at the average market price for the period. Assumed proceeds include the amount the employee must pay upon exercise and the average unrecognized compensation cost. The difference between the number of shares assumed issued and number of shares assumed purchased represents the dilutive shares.\nRecently Adopted Accounting Standards\nIn December 2023, the Financial Accounting Standards Board issued ASU No. 2023-09, “Income Taxes (Topic 740): Improvements to Income Tax Disclosures.” Under ASU 2023-09, an entity is required to provide additional income tax disclosures on an annual basis, including disclosure of the disaggregation of income tax expense or benefit from continuing operations by federal, state and local, and foreign taxes; cash paid for income taxes by jurisdiction; and prescribed specific categories to be included within the effective tax rate reconciliation. The Company adopted the standard on a prospective basis and has included the required disclosures in Note 9.\nThe Company has determined that there have been no other recently adopted or issued accounting standards that had, or will have, a material impact on its Consolidated Financial Statements.\n52"}]}, {"n": 66, "id": "FE-0704", "slice": "S6", "company": "PepsiCo, Inc.", "form": "10-K", "question": "What was PepsiCo, Inc.'s shipping and handling expenses for the fiscal year ended December 28, 2024?", "found": true, "display": "16.0", "scale": "billions", "unit": "USD", "period": "2023-12-31 to 2024-12-28", "dims": {}, "line": "Distribution costs, including the costs of shipping and handling activities, which include certain merchandising activities, are reported as selling, general and administrative expenses. Shipping and handling expenses were $16.7 billion in 2025, $16.0 billion in 2024 and $15.4 billion in 2023.", "url": "https://www.sec.gov/Archives/edgar/data/77476/000007747626000007/pep-20251227.htm", "pages": [{"label": 70, "gold": true, "text": "Table of Contents\nThe terms of most of our incentive arrangements do not exceed one year and, therefore, do not require highly uncertain long-term estimates. Certain arrangements, such as fountain pouring rights, may extend beyond one year. Upfront payments to customers under these arrangements are recognized over the shorter of the economic or contractual life, primarily as a reduction of revenue, and the remaining balances of $329 million as of December 27, 2025 and $237 million as of December 28, 2024 are included in prepaid expenses and other current assets and other assets on our balance sheet.\nFor interim reporting, our policy is to allocate our forecasted full-year sales incentives for most of our programs to each of our interim reporting periods in the same year that benefits from the programs. The allocation methodology is based on our forecasted sales incentives for the full year and the proportion of each interim period’s actual gross revenue or volume, as applicable, to our forecasted annual gross revenue or volume, as applicable. Based on our review of the forecasts at each interim period, any changes in estimates and the related allocation of sales incentives are recognized beginning in the interim period that they are identified. In addition, we apply a similar allocation methodology for interim reporting purposes for certain advertising and other marketing activities. Our annual consolidated financial statements are not impacted by this interim allocation methodology.\nAdvertising and other marketing activities, reported as selling, general and administrative expenses, totaled $5.4 billion in 2025, $5.9 billion in 2024 and $5.7 billion in 2023, including advertising expenses of $3.4 billion in 2025, $3.9 billion in 2024 and $3.8 billion in 2023. Deferred advertising costs are not expensed until the year first used and consist of:\n•media and personal service prepayments;\n•promotional materials in inventory; and\n•production costs of future media advertising.\nDeferred advertising costs of $48 million and $58 million as of December 27, 2025 and December 28, 2024, respectively, are classified as prepaid expenses and other current assets on our balance sheet.\nDistribution Costs\nDistribution costs, including the costs of shipping and handling activities, which include certain merchandising activities, are reported as selling, general and administrative expenses. Shipping and handling expenses were $16.7 billion in 2025, $16.0 billion in 2024 and $15.4 billion in 2023.\nSoftware Costs\nWe capitalize certain computer software and software development costs incurred in connection with developing or obtaining computer software for internal use when both the preliminary project stage is completed and it is probable that the software will be used as intended. Capitalized software costs include (1) external direct costs of materials and services utilized in developing or obtaining computer software, (2) compensation and related benefits for employees who are directly associated with the software projects and (3) interest costs incurred while developing internal-use computer software. Capitalized software costs are included in property, plant and equipment on our balance sheet and amortized on a straight-line basis when placed into service over the estimated useful lives of the software, which approximate five to 10 years. Software amortization totaled $260 million in 2025, $199 million in 2024 and $159 million in 2023. Net capitalized software and development costs were $1.8 billion and $1.5 billion as of December 27, 2025 and December 28, 2024, respectively.\nCommitments and Contingencies\nWe are subject to various claims and contingencies related to lawsuits, certain taxes and environmental matters, as well as commitments under contractual and other commercial obligations. We recognize liabilities for contingencies and commitments when a loss is probable and estimable.\n70"}, {"label": 86, "gold": false, "text": "Table of Contents\nSelected financial information for our pension and retiree medical plans is as follows:\nPension Retiree Medical\nU.S. International\n2025 2024 2025 2024 2025 2024\nChange in projected benefit obligation\nObligation at beginning of year $ 11,324 $ 12,035 $ 2,786 $ 2,986 $ 616 $ 677\nService cost 312 347 47 46 31 31\nInterest cost 586 585 152 144 30 32\nPlan amendments 10 12 1 1 — —\nParticipant contributions — — 2 2 — —\nExperience loss/(gain) 247 (563) (74) (55) 18 (44)\nBenefit payments (640) (617) (112) (108) (74) (78)\nSettlement/curtailment (678) (506) (109) (62) — —\nSpecial termination benefits 21 31 — — — 1\nOther, including foreign currency adjustment — — 234 (168) 2 (3)\nObligation at end of year 11,182 11,324 2,927 2,786 623 616\nChange in fair value of plan assets\nFair value at beginning of year 10,609 11,541 3,397 3,528 163 183\nActual return on plan assets 1,296 (10) 149 142 15 5\nEmployer contributions/funding 354 236 67 59 51 53\nParticipant contributions — — 2 2 — —\nBenefit payments (640) (617) (112) (108) (74) (78)\nSettlement (670) (539) (109) (62) — —\nOther, including foreign currency adjustment — (2) 258 (164) — —\nFair value at end of year 10,949 10,609 3,652 3,397 155 163\nFunded status $ (233) $ (715) $ 725 $ 611 $ (468) $ (453)\nAmounts recognized\nOther assets $ 413 $ 388 $ 983 $ 792 $ — $ —\nOther current liabilities (61) (85) (14) (10) (55) (52)\nOther liabilities (585) (1,018) (244) (171) (413) (401)\nNet amount recognized $ (233) $ (715) $ 725 $ 611 $ (468) $ (453)\nAmounts included in accumulated other comprehensive loss (pre-tax)\nNet loss/(gain) $ 3,035 $ 3,618 $ 612 $ 633 $ (295) $ (333)\nPrior service cost/(credit) 61 54 (3) (5) (9) (14)\nTotal $ 3,096 $ 3,672 $ 609 $ 628 $ (304) $ (347)\nChanges recognized in net loss/(gain) included in other comprehensive loss\nNet (gain)/loss arising in current year $ (252) $ 320 $ (21) $ 8 $ 14 $ (36)\nAmortization and settlement recognition (331) (298) (59) (43) 25 25\nForeign currency translation loss/(gain) — — 59 (39) (1) 1\nTotal $ (583) $ 22 $ (21) $ (74) $ 38 $ (10)\nAccumulated benefit obligation at end of year $ 11,093 $ 11,069 $ 2,740 $ 2,638\nThe net gain arising in the current year is primarily attributable to higher actual asset return as compared to expected return on plan assets, partially offset by losses due to changes in discount rates and demographic experience.\n86"}, {"label": 69, "gold": false, "text": "Table of Contents\nNote 2 — Our Significant Accounting Policies\nRevenue Recognition\nWe recognize revenue when our performance obligation is satisfied. Our primary performance obligation (the distribution and sales of beverage and convenient food products) is satisfied upon the shipment or delivery of products to our customers, which is also when control is transferred. Merchandising activities are performed after a customer obtains control of the product, are accounted for as fulfillment of our performance obligation to ship or deliver product to our customers and are recorded in selling, general and administrative expenses. Merchandising activities are immaterial in the context of our contracts. In addition, we exclude from net revenue all sales, use, value-added and certain excise taxes assessed by government authorities on revenue producing transactions.\nThe transfer of control of products to our customers is typically based on written sales terms that generally do not allow for a right of return, except in the instance of a product recall or other limited circumstances that may allow for product returns. Our policy for DSD is to remove and replace damaged and out-of-date products from store shelves to ensure that consumers receive the product quality and freshness they expect. Similarly, our policy for certain warehouse-distributed products is to replace damaged and out-of-date products. As a result, we record reserves, based on estimates, for product recall, anticipated damaged and out-of-date products.\nOur products are sold for cash or on credit terms. Our credit terms, which are established in accordance with local and industry practices, typically require payment within 30 days of delivery in the United States, and generally within 30 to 90 days internationally, and may allow discounts for early payment.\nWe estimate and reserve for our expected credit loss exposure based on our experience with past due accounts and collectibility, write-off history, the aging of accounts receivable, our analysis of customer data, and forward-looking information (including the expected impact of a high interest rate and inflationary cost environment), leveraging estimates of creditworthiness and projections of default and recovery rates for certain of our customers.\nWe are exposed to concentration of credit risk from our major customers, including Walmart. We have not experienced credit issues with these customers. In 2025, sales to Walmart and its affiliates (including Sam’s) represented approximately 14% of our consolidated net revenue, including concentrate sales to our independent bottlers, which were used in finished goods sold by them to Walmart.\nTotal Marketplace Spending\nWe offer sales incentives and discounts through various programs to customers and consumers. Total marketplace spending includes sales incentives, discounts, advertising and other marketing activities. Sales incentives and discounts are primarily accounted for as a reduction of revenue and include payments to customers for performing activities on our behalf, such as payments for in-store displays, payments to gain distribution of new products, payments for shelf space and discounts to promote lower retail prices. Sales incentives and discounts also include support provided to our independent bottlers through funding of advertising and other marketing activities.\nA number of our sales incentives, such as bottler funding to independent bottlers and customer volume rebates, are based on annual targets, and accruals are established during the year, as products are delivered, for the expected payout, which may occur after year-end once reconciled and settled. These accruals are based on contract terms and our historical experience with similar programs and require management judgment with respect to estimating customer and consumer participation and performance levels. Differences between estimated expense and actual incentive costs are normally insignificant and are recognized in earnings in the period such differences are determined. In addition, certain advertising and marketing costs are also based on annual targets and recognized during the year as incurred.\n69"}]}, {"n": 67, "id": "FE-0654", "slice": "S6", "company": "Walt Disney Company", "form": "10-Q", "question": "What was Walt Disney Company's aggregate fair value of derivative instruments with credit-risk-related contingent features in a net liability position by counterparty as of June 27, 2026?", "found": true, "display": "0.7", "scale": "billions", "unit": "USD", "period": "2026-06-27", "dims": {}, "line": "derivative contracts. The aggregate fair value of derivative instruments with credit-risk-related contingent features in a net liability position by counterparty was $0.7 billion and $0.9 billion at June 27, 2026 and September 27, 2025, respectively.", "url": "https://www.sec.gov/Archives/edgar/data/1744489/000174448926000057/dis-20260627.htm", "pages": [{"label": 30, "gold": true, "text": "THE WALT DISNEY COMPANY\nNOTES TO CONDENSED CONSOLIDATED FINANCIAL STATEMENTS\n(unaudited; tabular dollars in millions, except for per share data)\nderivative contracts. The aggregate fair value of derivative instruments with credit-risk-related contingent features in a net liability position by counterparty was $0.7 billion and $0.9 billion at June 27, 2026 and September 27, 2025, respectively.\n15.Restructuring and Impairment Charges\nThe following amounts are recorded in “Restructuring and impairment charges” in the Condensed Consolidated Statements of Income:\nThe quarter ended June 27, 2026 included charges of $0.8 billion for an impairment of our investment in A+E Global Media (A+E) and $0.1 billion for severance. The nine-month period ended June 27, 2026 included charges of $1.0 billion for impairments of our investment in A+E and $0.2 billion for severance.\nThe quarter ended June 28, 2025 included a charge of $0.2 billion for an impairment of our investment in Tata Play Limited. The nine-month period ended June 28, 2025 included charges of $0.2 billion for impairments of our investment in Tata Play Limited, $0.1 billion for impairment of goodwill related to Star India and $0.1 billion for impairments of content.\n16.New Accounting Pronouncements\nImprovements to Income Tax Disclosures\nIn December 2023, the FASB issued guidance to enhance income tax disclosures. The new guidance requires an expanded effective tax rate reconciliation and the disclosure of cash taxes paid segregated between U.S. federal, U.S. state and foreign, with further disaggregation by jurisdiction if certain thresholds are met, and eliminates certain disclosures related to uncertain tax benefits. The new guidance is applicable to annual periods beginning with the Company’s 2026 fiscal year.\nDisaggregation of Income Statement Expense\nIn November 2024, the FASB issued guidance that requires the disclosure of additional information related to certain costs and expenses, including amounts of inventory purchases, employee compensation, and depreciation and amortization included in each income statement line item. The guidance also requires disclosure of the total amount of selling expenses and the Company’s definition of selling expenses. The guidance is effective for the Company for annual periods beginning with fiscal year 2028 and for interim periods beginning with fiscal year 2029. The Company is currently assessing the impacts of the new guidance on its financial statement disclosures.\nAccounting for Government Grants\nIn December 2025, the FASB issued guidance that establishes the recognition, measurement and presentation requirements for government grants. The guidance is effective at the beginning of the Company’s 2030 fiscal year (with early adoption permitted). The Company is currently assessing the impact this guidance will have on its financial statements and financial statement disclosures.\n17.Subsequent Events\nIn July 2026, the Company entered into an agreement to sell its 50% interest in A+E to an affiliate of co-owner Hearst Corporation for approximately $1.2 billion in cash. Closing is currently expected by the end of fiscal 2026, subject to customary closing conditions, including regulatory approvals and government consents.\n30"}, {"label": 31, "gold": false, "text": "MANAGEMENT’S DISCUSSION AND ANALYSIS OF\nFINANCIAL CONDITION AND RESULTS OF OPERATIONS\nItem 2: Management’s Discussion and Analysis of Financial Condition and Results of Operations\nORGANIZATION OF INFORMATION\nManagement’s Discussion and Analysis provides a narrative of the Company’s financial performance and condition that should be read in conjunction with the accompanying financial statements. It includes the following sections:\n•Consolidated Results\n•Current Quarter Results Compared to Prior-Year Quarter\n•Current Nine-Month Period Results Compared to Prior-Year Nine-Month Period\n•Seasonality\n•Business Segment Results\n•Corporate and Unallocated Shared Expenses\n•Financial Condition\n•Market Risk\n•Commitments and Contingencies\n•Other Matters\n•Supplemental Guarantor Financial Information\nCONSOLIDATED RESULTS\nQuarter Ended % Change Better (Worse) Nine Months Ended % Change Better (Worse)\n(in millions, except per share data) June 27, 2026 June 28, 2025 June 27, 20
