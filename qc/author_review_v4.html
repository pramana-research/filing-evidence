: "THE WALT DISNEY COMPANY\nCONDENSED CONSOLIDATED BALANCE SHEETS\n(unaudited; in millions, except per share data)\nJune 27, 2026 September 27, 2025\nASSETS\nCurrent assets\nCash and cash equivalents $ 5,185 $ 5,695\nReceivables, net 14,553 13,217\nInventories 2,081 2,134\nContent advances 1,934 2,063\nOther current assets 1,139 1,158\nTotal current assets 24,892 24,267\nProduced and licensed content costs 30,193 31,327\nInvestments 7,627 8,097\nParks, resorts and other property\nAttractions, buildings and equipment 87,448 82,041\nAccumulated depreciation (49,056) (48,889)\n38,392 33,152\nProjects in progress 5,169 6,911\nLand 1,183 1,192\n44,744 41,255\nIntangible assets, net 9,786 9,272\nGoodwill 74,682 73,294\nOther assets 12,816 10,002\nTotal assets $ 204,740 $ 197,514\nLIABILITIES AND EQUITY\nCurrent liabilities\nAccounts payable and other accrued liabilities $ 19,548 $ 21,203\nCurrent portion of borrowings 8,627 6,711\nDeferred revenue and other 6,930 6,248\nTotal current liabilities 35,105 34,162\nBorrowings 37,414 35,315\nDeferred income taxes 5,219 3,524\nOther long-term liabilities 10,160 9,901\nCommitments and contingencies (Note 12)\nEquity\nPreferred stock — —\nCommon stock and additional paid-in capital, $0.01 par value, Authorized – 4.6 billion shares, Issued – 1.9 billion shares 62,639 59,814\nRetained earnings 65,052 60,410\nAccumulated other comprehensive loss (2,908) (2,914)\nTreasury stock, at cost, 148 million shares at June 27, 2026 and 79 million shares at September 27, 2025 (14,751) (7,441)\nTotal Disney Shareholders’ equity 110,032 109,869\nNoncontrolling interests 6,810 4,743\nTotal equity 116,842 114,612\nTotal liabilities and equity $ 204,740 $ 197,514\nSee Notes to Condensed Consolidated Financial Statements\n5"}]}, {"n": 68, "id": "FE-0693", "slice": "S6", "company": "NextEra Energy, Inc.", "form": "10-K", "question": "What was NextEra Energy, Inc.'s unrecognized tax benefits that impact annual effective income tax rate as of December 31, 2025?", "found": true, "display": "143", "scale": "millions", "unit": "USD", "period": "2025-12-31", "dims": {}, "line": "A valuation allowance is recorded to reduce the carrying amounts of deferred tax assets when it is more likely than not that such assets will not be realized. NEE recognizes interest income (expense) related to unrecognized tax benefits (liabilities) in interest income and interest expense, respectively, net of the amount deferred at FPL. At FPL, the offset to accrued interest receivable (payable) on income taxes is classified as a regulatory liability (regulatory asset) which will be amortized to income (expense) over a five-year period upon settlement in accordance with regulatory treatment. All tax positions taken by NEE in its income tax returns that are recognized in the financial statements must satisfy a more-likely-than-not threshold. NEE and its subsidiaries file income tax returns in the U.S. federal jurisdiction and various states, the most significant of which is Florida, and certain foreign jurisdictions. Federal tax liabilities, with the exception of certain refund claims, are effectively settled for all years prior to 2022. State and foreign tax liabilities, which have varied statutes of limitations regarding additional assessments, are generally effectively settled for years prior to 2021. As of December 31, 2025, NEE had unrecognized tax benefits of approximately $143 million that, if recognized, could impact the annual effective income tax rate. See Note 5.", "url": "https://www.sec.gov/Archives/edgar/data/753308/000075330826000015/nee-20251231.htm", "pages": [{"label": 81, "gold": true, "text": "Table of Contents\nNEXTERA ENERGY, INC. AND FLORIDA POWER & LIGHT COMPANY\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS (Continued)\nA valuation allowance is recorded to reduce the carrying amounts of deferred tax assets when it is more likely than not that such assets will not be realized. NEE recognizes interest income (expense) related to unrecognized tax benefits (liabilities) in interest income and interest expense, respectively, net of the amount deferred at FPL. At FPL, the offset to accrued interest receivable (payable) on income taxes is classified as a regulatory liability (regulatory asset) which will be amortized to income (expense) over a five-year period upon settlement in accordance with regulatory treatment. All tax positions taken by NEE in its income tax returns that are recognized in the financial statements must satisfy a more-likely-than-not threshold. NEE and its subsidiaries file income tax returns in the U.S. federal jurisdiction and various states, the most significant of which is Florida, and certain foreign jurisdictions. Federal tax liabilities, with the exception of certain refund claims, are effectively settled for all years prior to 2022. State and foreign tax liabilities, which have varied statutes of limitations regarding additional assessments, are generally effectively settled for years prior to 2021. As of December 31, 2025, NEE had unrecognized tax benefits of approximately $143 million that, if recognized, could impact the annual effective income tax rate. See Note 5.\nNoncontrolling Interests – Noncontrolling interests represent the portions of net assets in consolidated entities that are not owned by NEE and are reported as a component of equity on NEE's consolidated balance sheets. As of December 31, 2025, noncontrolling interests on NEE's consolidated balance sheets primarily reflects the interests related to differential membership interests discussed below, as well as other noncontrolling interests in certain wind and solar generation and transmission assets sold to non-affiliated parties and XPLR Infrastructure Partners, LP (XPLR) (formerly NextEra Energy Partners, LP).\nCertain subsidiaries of NextEra Energy Resources have sold Class B noncontrolling membership interests in entities that have ownership interests in wind generation, solar generation and battery storage facilities, with generating/storage capacity in operation or under construction totaling approximately 12,350 MW, 5,409 MW and 2,624 MW, respectively, as of December 31, 2025, to third-party investors (differential membership interests). The third-party investors are allocated earnings, tax attributes and cash flows in accordance with the respective limited liability company agreements. Those economics are allocated primarily to the third-party investors until they receive a targeted return (the flip date) and thereafter to NEE. NEE has the right to call the third-party interests at specified amounts if and when the flip date occurs. NEE has determined the allocation of economics between the controlling party and third-party investor should not follow the respective ownership percentages for each wind generation, solar generation and battery storage project but rather the hypothetical liquidation of book value (HLBV) method based on the governing provisions in each respective limited liability company agreement. Under the HLBV method, the amounts of income and loss attributable to the noncontrolling interest reflects changes in the amount the owners would hypothetically receive at each balance sheet date under the respective liquidation provisions, assuming the net assets of these entities were liquidated at the recorded amounts, after taking into account any capital transactions, such as contributions and distributions, between the entities and the owners. At the point in time that the third-party investor, in hypothetical liquidation, would achieve its targeted return, NEE attributes the additional hypothetical proceeds to the differential membership interests based on the call price. A loss attributable to noncontrolling interests on NEE’s consolidated statements of income represents earnings attributable to NEE.\nAs of December 31, 2025 and 2024, approximately $10,654 million and $9,062 million, respectively, of noncontrolling interests on NEE's consolidated balance sheets relates to differential membership interests. For the years ended December 31, 2025, 2024 and 2023, NEE recorded earnings of approximately $1,578 million, $1,329 million and $1,135 million, respectively, associated with differential membership interests, which is reflected as net loss attributable to noncontrolling interests on NEE's consolidated statements of income.\nRedeemable Noncontrolling Interests – Certain subsidiaries of NextEra Energy Resources sold Class B noncontrolling membership interests in entities that have ownership interests in wind generation, solar generation and battery storage facilities to third-party investors. As specified in the respective limited liability company agreements, if, subject to certain contingencies, certain events occur, including, among others, those that would delay completion or cancel any of the underlying projects, an investor has the option to require NEER to return all or part of its investment. As these potential redemptions were outside of NEER’s control, these balances were classified as redeemable noncontrolling interests on NEE's consolidated balance sheet as of December 31, 2024. During 2025, the contingencies associated with the December 31, 2024 balance were resolved and reclassified to noncontrolling interests.\nVariable Interest Entities (VIEs) – An entity is considered to be a VIE when its total equity investment at risk is not sufficient to permit the entity to finance its activities without additional subordinated financial support, or its equity investors, as a group, lack the characteristics of having a controlling financial interest. A reporting company is required to consolidate a VIE as its primary beneficiary when it has both the power to direct the activities of the VIE that most significantly impact the VIE's economic performance, and the obligation to absorb losses or the right to receive benefits from the VIE that could potentially be significant to the VIE. NEE and FPL evaluate whether an entity is a VIE whenever reconsideration events as defined by the accounting guidance occur. See Note 9.\n82"}, {"label": 82, "gold": false, "text": "Table of Contents\nNEXTERA ENERGY, INC. AND FLORIDA POWER & LIGHT COMPANY\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS (Continued)\nLeases – NEE and FPL determine if an arrangement is a lease at inception. NEE and FPL recognize a right-of-use (ROU) asset and a lease liability for operating and finance leases by recognizing and measuring leases at the commencement date based on the present value of lease payments over the lease term. For sales-type leases, the book value of the leased asset is removed from the balance sheet and a net investment in sales-type lease is recognized based on fixed payments under the contract and the residual value of the asset being leased. NEE and FPL have elected not to apply the recognition requirements to short-term leases and not to separate nonlease components from associated lease components for all classes of underlying assets except for purchased power agreements. ROU assets are included in noncurrent other assets, lease liabilities are included in current and noncurrent other liabilities and net investments in sales-type leases are included in current and noncurrent other assets on NEE’s and FPL's consolidated balance sheets. Operating lease expense is included in O&M expense, interest and amortization expenses associated with finance leases are included in interest expense and depreciation and amortization expense, respectively, and rental income associated with operating leases and interest income associated with sales-type leases are included in operating revenues in NEE’s and FPL’s consolidated statements of income. See Note 10.\nDisposal of Businesses – In 2023, FPL sold its ownership interests in its Florida City Gas business for cash proceeds of approximately $924 million. In connection with the sale, a gain of approximately $406 million ($306 million after tax at NEE and $300 million after tax at FPL) was recorded in NEE's and FPL's consolidated statements of income for the year ended December 31, 2023 and is included in gains on disposal of businesses/assets – net.\nIn July 2025, a subsidiary of NEET entered into an agreement to sell a 50% equity interest in a joint venture, consisting of a rate-regulated electric transmission asset located in California. NEER expects to close the sale in the first quarter of 2026, subject to the satisfaction of customary closing conditions, for cash proceeds of approximately $270 million, subject to closing adjustments. Upon closing, the transmission assets and liabilities will be removed from NEE's balance sheet and NEE's remaining 50% interest will be reflected as an equity method investment.\nIn 2024, subsidiaries of NextEra Energy Resources sold 100% ownership interests in certain natural gas and oil shale formations and, as part of a joint venture (pipeline joint venture), sold an ownership interest, representing an approximately 15% economic interest, in three natural gas pipeline facilities located in the southern U.S. for total cash proceeds of approximately $101 million. A NextEra Energy Resources subsidiary has operated and continues to operate two of the pipeline facilities included in the sale. In connection with the sale, a gain of approximately $120 million ($77 million after tax) was recorded in NEE's consolidated statements of income for the year ended December 31, 2024 and is included in gains on disposal of businesses/assets – net. NEE’s remaining equity method investment interest, an approximately 85% economic interest, in the pipeline joint venture is a noncontrolling interest based on the governance structure of the joint venture.\nIn 2024, subsidiaries of NextEra Energy Resources sold an ownership interest, representing an approximately 65% economic interest, as part of a joint venture (renewable assets joint venture), consisting of a portfolio of five wind generation facilities and three solar generation facilities located in geographically diverse locations throughout the U.S. with a total generating capacity of 1,634 MW, for cash proceeds of approximately $900 million. A NextEra Energy Resources subsidiary continues to operate the facilities included in the sale. In connection with the sale, a gain of approximately $103 million ($76 million after tax) was recorded in NEE's consolidated statements of income for the year ended December 31, 2024 and is included in gains on disposal of businesses/assets – net. NEE’s remaining equity method investment interest, an approximately 35% economic interest, in the renewable assets joint venture is a noncontrolling interest based on the governance structure of the joint venture. Upon the projects in the renewable assets joint venture obtaining financing in the fourth quarter of 2024, NEE received a distribution of approximately $386 million.\nIn 2023, subsidiaries of NextEra Energy Resources sold to an XPLR subsidiary their 100% ownership interests in five wind generation facilities and three solar generation facilities located in geographically diverse locations throughout the U.S. with a total generating capacity of 688 MW for cash proceeds of approximately $566 million, plus working capital of $32 million. A NextEra Energy Resources subsidiary continues to operate the facilities included in the sale.\n2. Revenue from Contracts with Customers\nRevenue is recognized when control of the promised goods or services is transferred to customers at an amount that reflects the consideration to which the entity expects to be entitled in exchange for those goods and services. The promised goods or services in the majority of NEE’s contracts with customers is, at FPL, for the delivery of electricity based on tariff rates approved by the FPSC and, at NEER, for the delivery of energy commodities and the availability of electric capacity and electric transmission.\nFPL and NEER generate substantially all of NEE’s operating revenues, which primarily include revenues from contracts with customers, as well as derivative (see Note 3) and lease transactions at NEER. For the vast majority of contracts with customers, NEE believes that the obligation to deliver energy, capacity or transmission is satisfied over time as the customer simultaneously receives and consumes benefits as NEE performs. In 2025, 2024 and 2023, NEE’s revenue from contracts with customers was approximately $25.8 billion ($18.2 billion at FPL), $23.5 billion ($16.9 billion at FPL) and $24.8 billion ($18.2 billion at FPL), respectively. NEE's and FPL's receivables are primarily associated with revenues earned from contracts with customers, as well\n83"}, {"label": 11, "gold": false, "text": "Table of Contents\nOPERATIONS\nNEER sells products associated with its generation and battery storage facilities (energy, capacity, RECs and ancillary services) in competitive markets in regions where those facilities are located. Customer transactions may be supplied from NEER generation and battery storage facilities or from purchases in the wholesale markets, or from a combination thereof. See Markets and Competition below.\nNEER's generation and battery storage projects, natural gas pipelines and transmission assets (including noncontrolling or joint venture interests) as of December 31, 2025 are as follows:\n12"}]}, {"n": 69, "id": "FE-0664", "slice": "S6", "company": "Honeywell International Inc.", "form": "10-K", "question": "What was Honeywell International Inc.'s gain (loss) on interest rate swap agreements for the fiscal year ended December 31, 2024?", "found": true, "display": "30", "scale": "millions", "unit": "USD", "period": "2024-01-01 to 2024-12-31", "dims": {}, "line": "Interest rate swap agreements are designated as hedge relationships with gains or losses on the derivative recognized in Interest and other financial charges offsetting the gains and losses on the underlying debt being hedged. Gains and losses on interest rate swap agreements recognized in earnings were $57 million of income, $30 million of expense, and $121 million of income for the years ended December 31, 2025, 2024, and 2023, respectively. Gains and losses are fully offset by losses and gains on the underlying debt being hedged.", "url": "https://www.sec.gov/Archives/edgar/data/773840/000077384026000013/hon-20251231.htm", "pages": [{"label": 90, "gold": true, "text": "TABLE OF CONTENTS FINANCIAL STATEMENTS AND SUPPLEMENTARY DATA\nHONEYWELL INTERNATIONAL INC.\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS—(Continued)\n(Dollars in tables in millions, except per share amounts)\nDERIVATIVE AND HEDGING INSTRUMENTS\nThe following table summarizes the notional amounts and fair values of the Company’s outstanding derivatives by risk category and instrument type within the Consolidated Balance Sheet:\nNotional Fair Value Asset Fair Value (Liability)\nDecember 31, 2025 December 31, 2024 December 31, 2025 December 31, 2024 December 31, 2025 December 31, 2024\nDerivatives in fair value hedging relationships\nInterest rate swap agreements $ 4,068 $ 3,899 $ 14 $ 3 $ (93) $ (139)\nDerivatives in cash flow hedging relationships\nForeign currency exchange contracts 509 802 — 11 (6) (10)\nCommodity contracts — 1 — — — —\nDerivatives in net investment hedging relationships\nCross currency swap agreements 6,139 7,214 — 124 (801) (56)\nTotal derivatives designated as hedging instruments 10,716 11,916 14 138 (900) (205)\nDerivatives not designated as hedging instruments\nForeign currency exchange contracts 9,682 8,353 4 3 (5) (5)\nTotal derivatives at fair value $ 20,398 $ 20,269 $ 18 $ 141 $ (905) $ (210)\nAll derivative assets are presented in Other current assets or Other assets. All derivative liabilities are presented in Accrued liabilities or Other liabilities.\nIn addition to the foreign currency derivative contracts designated as net investment hedges, certain of the Company's foreign currency denominated debt instruments are designated as net investment hedges. The carrying value of those debt instruments designated as net investment hedges, which includes the adjustment for the foreign currency transaction gain or loss on those instruments, was $6,962 million and $6,158 million as of December 31, 2025, and 2024, respectively.\nInterest rate swap agreements are designated as hedge relationships with gains or losses on the derivative recognized in Interest and other financial charges offsetting the gains and losses on the underlying debt being hedged. Gains and losses on interest rate swap agreements recognized in earnings were $57 million of income, $30 million of expense, and $121 million of income for the years ended December 31, 2025, 2024, and 2023, respectively. Gains and losses are fully offset by losses and gains on the underlying debt being hedged.\nThe following table sets forth the amounts recorded in the Consolidated Balance Sheet related to cumulative basis adjustments for fair value hedges:\nCarrying Amount of Hedged Item Cumulative Amount of Fair Value Hedging Adjustment Included in the Carrying Amount of Hedged Item\nDecember 31, 2025 December 31, 2024 December 31, 2025 December 31, 2024\nLong-term debt $ 3,989 $ 3,763 $ (79) $ (136)\n89 Honeywell International Inc."}, {"label": 81, "gold": false, "text": "TABLE OF CONTENTS FINANCIAL STATEMENTS AND SUPPLEMENTARY DATA\nHONEYWELL INTERNATIONAL INC.\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS—(Continued)\n(Dollars in tables in millions, except per share amounts)\nMany jurisdictions impose limitations on the timing and utilization of net operating loss and tax credit carryforwards. Approximately $3,228 million of the non-U.S. net operating loss has no expiration period. The U.S. federal capital loss carryforward of $510 million expires in 2026. The remaining net operating loss, capital loss and credit carryforwards, and other tax attributes have expiration periods through 2045.\nThe table below summarizes the Company's change in unrecognized tax benefits for the years ended December 31, 2025, 2024, and 2023:\nYears Ended December 31,\n2025 2024 2023\nChange in unrecognized tax benefits\nBalance at beginning of year $ 1,201 $ 1,215 $ 1,077\nGross increases related to current period tax positions 30 64 89\nGross increases related to prior periods tax positions 99 12 181\nGross decreases related to prior periods tax positions (2) (17) —\nDecrease related to resolutions of audits with tax authorities (91) (31) (132)\nExpiration of the statute of limitations for the assessment of taxes (44) (9) (3)\nForeign currency translation 45 (33) 3\nBalance at end of year $ 1,238 $ 1,201 $ 1,215\nAs of December 31, 2025, 2024, and 2023, there were $1,238 million, $1,201 million, and $1,215 million, respectively, of unrecognized tax benefits that if recognized would be recorded as a component of tax expense.\nThe following table summarizes tax years that remain subject to examination by major tax jurisdictions as of December 31, 2025:\nJurisdiction Open Tax Years\nExamination in progress Examination not yet initiated\nU.S. Federal 2017-2021 2022-2025\nU.S. State 2013-2024 2025\nCanada 2018-2021 2022-2025\nChina 2013-2024 2025\nGermany 2017-2020 2021-2025\nIndia 2006-2020 2021-2025\nMalaysia 2019-2023 2024-2025\nPuerto Rico N/A 2020-2025\nSwitzerland N/A 2020-2025\nUnited Kingdom 2013-2023 2024-2025\nBased on the outcome of these examinations, or as a result of the expiration of statute of limitations for specific jurisdictions, it is reasonably possible that certain unrecognized tax benefits for tax positions taken on previously filed tax returns will materially change from those recorded as liabilities in the Company's financial statements. In addition, the outcome of these examinations may impact the valuation of certain deferred tax assets (such as net operating losses) in future periods.\nUnrecognized tax benefits for examinations in progress were $874 million, $787 million, and $803 million as of December 31, 2025, 2024, and 2023, respectively. Estimated interest and penalties related to the underpayment of income taxes are classified as a component of Tax expense in the Consolidated Statement of Operations and totaled $55 million, $94 million, and $74 million for the years ended December 31, 2025, 2024, and 2023, respectively. Accrued interest and penalties were $751 million, $707 million, and $612 million as of December 31, 2025, 2024, and 2023, respectively.\n80 Honeywell International Inc."}, {"label": 91, "gold": false, "text": "TABLE OF CONTENTS FINANCIAL STATEMENTS AND SUPPLEMENTARY DATA\nHONEYWELL INTERNATIONAL INC.\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS—(Continued)\n(Dollars in tables in millions, except per share amounts)\nThe following tables summarize the location and impact to the Consolidated Statement of Operations related to derivative instruments:\nYear Ended December 31, 2025\nNet Sales Cost of Products Sold Cost of Services Sold Selling, General and Administrative Expenses Other Income (Expense) Interest and Other Financial Charges\n$ 37,442 $ 16,153 $ 7,460 $ 5,450 $ 1,247 $ 1,344\nGain (loss) on cash flow hedges\nForeign currency exchange contracts\nAmount reclassified from accumulated other comprehensive loss into income — (3) (2) — — —\nGain (loss) on fair value hedges\nInterest rate swap agreements\nHedged items — — — — — (57)\nDerivatives designated as hedges — — — — — 57\nGain (loss) on derivatives not designated as hedging instruments\nForeign currency exchange contracts — — — — (376) —\nYear Ended December 31, 2024\nNet Sales Cost of Products Sold Cost of Services Sold Selling, General and Administrative Expenses Other Income (Expense) Interest and Other Financial Charges\n$ 34,717 $ 15,017 $ 6,343 $ 5,235 $ 843 $ 1,048\nGain (loss) on cash flow hedges\nForeign currency exchange contracts\nAmount reclassified from accumulated other comprehensive loss into income 2 — — 5 — —\nGain (loss) on fair value hedges\nInterest rate swap agreements\nHedged items — — — — — (30)\nDerivatives designated as hedges — — — — — 30\nGain (loss) on derivatives not designated as hedging instruments\nForeign currency exchange contracts — — — — 147 —\n90 Honeywell International Inc."}]}, {"n": 70, "id": "FE-0631", "slice": "S6", "company": "Adobe Inc.", "form": "10-K", "question": "What was Adobe Inc.'s contract assets as of November 29, 2024?", "found": true, "display": "248", "scale": "millions", "unit": "USD", "period": "2024-11-29", "dims": {}, "line": "A contract asset is recognized when a conditional right to consideration exists and transfer of control has occurred. Contract assets are typically related to subscription and hosted service contracts where the transaction price allocated to the satisfied performance obligations exceeds the value of billings to date. Contract assets are included in prepaid expenses and other current assets for the current portion and other assets for the long-term portion on the Consolidated Balance Sheets. We regularly review contract asset balances for impairment, considering factors such as historical experience, credit-worthiness, age of the balance, current economic conditions and a reasonable and supportable forecast of future economic conditions. Contract asset impairments were not material in fiscal 2025 and 2024. Contract assets were $241 million and $248 million as of November 28, 2025 and November 29, 2024, respectively.", "url": "https://www.sec.gov/Archives/edgar/data/796343/000079634326000003/adbe-20251128.htm", "pages": [{"label": 59, "gold": true, "text": "Table of Contents\nADOBE INC.\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS (Continued)\nDigital Media and Digital Experience subscription revenue by customer group for fiscal 2025, 2024 and 2023 were as follows:\n(in millions) 2025 2024 2023\nCreative & Marketing Professionals $ 16,303 $ 14,749 $ 13,425\nBusiness Professionals & Consumers 6,495 5,662 4,744\nTotal Digital Media and Digital Experience subscription revenue $ 22,798 $ 20,411 $ 18,169\nContract Balances\nTrade Receivables\nA receivable is recorded when an unconditional right to invoice and receive payment exists, such that only the passage of time is required before payment of consideration is due. Timing of revenue recognition may differ from the timing of invoicing to customers. Certain performance obligations may require payment before delivery of the license or service to the customer. Included in trade receivables on the Consolidated Balance Sheets are unbilled receivable balances which have not yet been invoiced, and are typically related to license revenue or services which are delivered prior to invoicing. As of November 28, 2025, the balance of trade receivables, net of allowances for doubtful accounts, was $2.34 billion, inclusive of unbilled receivables of $74 million. As of November 29, 2024, the balance of trade receivables, net of allowances for doubtful accounts, was $2.07 billion, inclusive of unbilled receivables of $66 million.\nAllowance for Doubtful Accounts\nWe maintain an allowance for doubtful accounts which reflects our best estimate of potentially uncollectible trade receivables and is based on both specific and general reserves. We maintain general reserves on a collective basis by considering factors such as historical experience, credit-worthiness, the age of the trade receivable balances, current economic conditions and a reasonable and supportable forecast of future economic conditions. The allowance for doubtful accounts was $13 million and $14 million as of November 28, 2025 and November 29, 2024, respectively.\nContract Assets\nA contract asset is recognized when a conditional right to consideration exists and transfer of control has occurred. Contract assets are typically related to subscription and hosted service contracts where the transaction price allocated to the satisfied performance obligations exceeds the value of billings to date. Contract assets are included in prepaid expenses and other current assets for the current portion and other assets for the long-term portion on the Consolidated Balance Sheets. We regularly review contract asset balances for impairment, considering factors such as historical experience, credit-worthiness, age of the balance, current economic conditions and a reasonable and supportable forecast of future economic conditions. Contract asset impairments were not material in fiscal 2025 and 2024. Contract assets were $241 million and $248 million as of November 28, 2025 and November 29, 2024, respectively.\nDeferred Revenue and Remaining Performance Obligations\nDeferred revenue primarily consists of billings or payments received in advance of revenue recognition from subscription services, including non-cancellable and non-refundable committed funds and refundable customer deposits. Deferred revenue is recognized as revenue when transfer of control to customers has occurred. Customers are typically invoiced for these agreements in regular installments and revenue is recognized ratably over the contractual subscription period. The deferred revenue balance is influenced by several factors, including the compounding effects of renewals, invoice duration, invoice timing, size and new business linearity within the quarter. Deferred revenue does not represent the total contract value of annual or multi-year non-cancellable subscription agreements.\nPayment terms and conditions vary by contract type, although terms generally include a requirement of payment within 30 to 60 days. In instances where the timing of revenue recognition differs from the timing of invoicing, we have determined our contracts generally do not include a significant financing component. The primary purpose of our invoicing terms is to provide customers with simplified and predictable ways of purchasing our products and services, such as invoicing at the\n60"}, {"label": 58, "gold": false, "text": "Table of Contents\nADOBE INC.\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS (Continued)\nOur segment results for fiscal 2025, 2024 and 2023 were as follows:\n(dollars in millions) Digital Media Digital Experience Publishing and Advertising Total\nFiscal 2025\nRevenue $ 17,649 $ 5,864 $ 256 $ 23,769\nCost of revenue 841 1,625 85 2,551\nGross profit $ 16,808 $ 4,239 $ 171 $ 21,218\nGross profit as a percentage of revenue 95 % % 72 % % 67 % % 89 % %\nFiscal 2024\nRevenue $ 15,864 $ 5,366 $ 275 $ 21,505\nCost of revenue 680 1,589 89 2,358\nGross profit $ 15,184 $ 3,777 $ 186 $ 19,147\nGross profit as a percentage of revenue 96 % % 70 % % 68 % % 89 % %\nFiscal 2023\nRevenue $ 14,216 $ 4,893 $ 300 $ 19,409\nCost of revenue 665 1,603 86 2,354\nGross profit $ 13,551 $ 3,290 $ 214 $ 17,055\nGross profit as a percentage of revenue 95 % % 67 % % 71 % % 88 % %\nSee the Consolidated Statements of Income for a reconciliation of consolidated gross profit to consolidated income before income taxes.\nWe generally categorize revenue by geographic area based on where the customer manages their utilization of our offerings. Revenue by geographic area for fiscal 2025, 2024 and 2023 were as follows:\n(in millions) 2025 2024 2023\nAmericas:\nUnited States $ 12,529 $ 11,499 $ 10,460\nOther 1,591 1,392 1,194\nTotal Americas 14,120 12,891 11,654\nEMEA 6,289 5,554 4,881\nAPAC 3,360 3,060 2,874\nRevenue $ 23,769 $ 21,505 $ 19,409\nSubscription revenue by segment for fiscal 2025, 2024 and 2023 were as follows:\n(in millions) 2025 2024 2023\nDigital Media $ 17,389 $ 15,547 $ 13,838\nDigital Experience 5,409 4,864 4,331\nPublishing and Advertising 106 110 115\nTotal subscription revenue $ 22,904 $ 20,521 $ 18,284\n59"}, {"label": 41, "gold": false, "text": "Table of Contents\nCash Flows from Operating Activities\nFor fiscal 2025, net cash provided by operating activities of $10.03 billion was primarily comprised of net income adjusted for the net effect of non-cash items. Working capital sources of cash included increases in deferred revenue, partially offset by increases in trade receivables attributable to the timing of billings.\nCash Flows from Investing Activities\nFor fiscal 2025, net cash used for investing activities of $1.19 billion was primarily due to purchases of short-term and long-term investments, net of proceeds from the maturities of short-term investments, and ongoing capital expenditures.\nCash Flows from Financing Activities\nFor fiscal 2025, net cash used for financing activities of $11.06 billion was primarily due to payments for our common stock repurchases and repayment of our 1.90% 2025 Notes and 3.25% 2025 Notes. These uses of cash were offset in part by proceeds from the issuance of senior notes. See the sections titled “Senior Notes” and “Stock Repurchase Program” below.\nLiquidity and Capital Resources Considerations\nOur existing cash, cash equivalents and investment balances may fluctuate during fiscal 2026 due to changes in our planned cash outlay.\nCash from operations could also be affected by various risks and uncertainties, including, but not limited to, risks detailed in the section titled “Risk Factors” in Part I, Item 1A of this report. Based on our current business plan and revenue prospects, we believe that our existing cash, cash equivalents and short-term investment balances, our anticipated cash flows from operations and our available revolving credit facility will be sufficient to meet our working capital, operating resource expenditure and capital expenditure requirements for the next twelve months and for the foreseeable future.\nOur cash equivalent and short-term investment portfolio as of November 28, 2025 consisted of money market funds, corporate debt securities, U.S. Treasury securities, time deposits and other investments.\nWe expect to continue our investing activities, including short-term and long-term investments, purchases of computer and server hardware to operate our network infrastructure, sales and marketing, product support and administrative staff. Furthermore, cash reserves may be used to repurchase stock under our stock repurchase program and to strategically acquire companies, products or technologies that are complementary to our business.\nOn November 18, 2025, we entered into a definitive agreement to acquire Semrush Holdings, Inc., a publicly held brand visibility platform company, for approximately $1.9 billion of cash consideration. The transaction is subject to regulatory approvals and customary closing conditions and is expected to close in the first half of fiscal 2026. We expect to finance the acquisition using cash on hand.\nRevolving Credit Agreement\nWe have a $1.5 billion senior unsecured revolving credit agreement (the “Revolving Credit Agreement”) with a syndicate of lenders, providing for loans to us and certain of our subsidiaries through June 30, 2027. Subject to the agreement of lenders, we may obtain up to an additional $500 million in commitments, for a maximum aggregate commitment of $2 billion. As of November 28, 2025, there were no outstanding borrowings under the Revolving Credit Agreement and the entire $1.5 billion credit line remains available for borrowing. Under the terms of our Revolving Credit Agreement, we are not prohibited from paying cash dividends unless payment would trigger an event of default or if one currently exists. We do not anticipate paying any cash dividends in the foreseeable future.\nCommercial Paper Program\nWe have a commercial paper program under which we may issue unsecured commercial paper up to a total of $3 billion outstanding at any time, with maturities of up to 397 days from the date of issue. The net proceeds from the issuance of commercial paper are expected to be used for general corporate purposes, which may include working capital, capital expenditures, acquisitions, stock repurchases, refinancing indebtedness or any other general corporate purposes. As of November 28, 2025, there were no outstanding borrowings under the commercial paper program.\n42"}]}, {"n": 71, "id": "FE-0719", "slice": "S6", "company": "Charles Schwab Corporation", "form": "10-K", "question": "What was Charles Schwab Corporation's amortization expense related to capitalized contract costs for the fiscal year ended December 31, 2025?", "found": true, "display": "111", "scale": "millions", "unit": "USD", "period": "2025-01-01 to 2025-12-31", "dims": {}, "line": "Capitalized contract costs relate to incremental costs of obtaining a contract with a customer, including sales commissions paid to employees for obtaining contracts with clients, and are presented in the table above. These costs are amortized to expense on a straight-line basis over a period that is consistent with how the related revenue is recognized. Amortization expense related to capitalized contract costs was $111 million, $97 million, and $85 million during the years ended December 31, 2025, 2024, and 2023, respectively, which was recorded in compensation and benefits expense on the consolidated statements of income.", "url": "https://www.sec.gov/Archives/edgar/data/316709/000031670926000009/schw-20251231.htm", "pages": [{"label": 88, "gold": true, "text": "THE CHARLES SCHWAB CORPORATION\nNotes to Consolidated Financial Statements\n(Tabular Amounts in Millions, Except Per Share Data, Option Price Amounts, Ratios, or as Noted)\nAcquired intangible assets are detailed below:\nDecember 31, 2025 December 31, 2024\nGross Carrying Value Accumulated Amortization Net Carrying Value Gross Carrying Value Accumulated Amortization Net Carrying Value\nClient relationships $ 9,819 $ (2,679) $ 7,140 $ 9,819 $ (2,171) $ 7,648\nTechnology 216 (216) — 216 (212) 4\nTrade names 113 (20) 93 111 (20) 91\nTotal acquired intangible assets $ 10,148 $ (2,915) $ 7,233 $ 10,146 $ (2,403) $ 7,743\nEstimated future annual amortization expense for acquired intangible assets as of December 31, 2025 is as follows:\n2026 $ 508\n2027 508\n2028 507\n le above. These costs are amortized to expense on a straight-line basis over a period that is consistent with how the related revenue is recognized. Amortization expense related to capitalized contract costs was $111 million, $97 million, and $85 million during the years ended December 31, 2025, 2024, and 2023, respectively, which was recorded in compensation and benefits expense on the consolidated statements of income.\nContract assets\nContract assets relate to the buy down of fixed-rate obligation amounts pursuant to the 2023 IDA agreement, and are presented in the table above. These assets are amortized on a straight-line basis over the remaining contractual term as a reduction to bank deposit account fee revenue. For additional discussion of the 2023 IDA agreement, see Note 15.\n- 87 -"}, {"label": 106, "gold": false, "text": "THE CHARLES SCHWAB CORPORATION\nNotes to Consolidated Financial Statements\n(Tabular Amounts in Millions, Except Per Share Data, Option Price Amounts, Ratios, or as Noted)\nRedemption Rights\nEach series of CSC’s preferred stock may be redeemed at CSC’s option on any dividend payment date on or after the earliest redemption date for that series. All outstanding preferred stock series may also be redeemed following a “capital treatment event,” as described in the terms of each series set forth in the relevant certificate of designations. Any redemption of CSC’s preferred stock is subject to approval from the Federal Reserve.\n20. Accumulated Other Comprehensive Income\nAOCI represents cumulative gains and losses that are not reflected in earnings. AOCI balances and the components of other comprehensive income (loss) are as follows:\nTotal AOCI\nBalance at December 31, 2022 $ (22,621)\nAvailable for sale securities:\nNet unrealized gain (loss), net of tax expense (benefit) of $886 2,653\nOther reclassifications included in other revenue, net of tax expense (benefit) of $15 46\nHeld to maturity securities:\nAmortization of amounts previously recorded upon transfer from available for sale, net of tax expense (benefit) of $657 1,817\nOther, net of tax expense (benefit) of $(9) (26)\nBalance at December 31, 2023 $ (18,131)\nAvailable for sale securities:\nNet unrealized gain (loss), net of tax expense (benefit) of $447 1,493\nOther reclassifications included in other revenue, net of tax expense (benefit) of $9 31\nHeld to maturity securities:\nAmortization of amounts previously recorded upon transfer from available for sale, net of tax expense (benefit) of $517 1,762\nOther, net of tax expense (benefit) of $2 (3)\nBalance at December 31, 2024 $ (14,848)\nAvailable for sale securities:\nNet unrealized gain (loss), net of tax expense (benefit) of $657 2,106\nOther reclassifications included in other revenue, net of tax expense (benefit) of $19 60\nHeld to maturity securities:\nAmortization of amounts previously recorded upon transfer from available for sale, net of tax expense (benefit) of $520 1,667\nDerivatives designated as cash flow hedging instruments:\nNet unrealized gain (loss), net of tax expense (benefit) of $(4) (13)\nReclassifications included in interest revenue, net of tax expense (benefit) of $16 50\nOther, net of tax expense (benefit) of $(3) (5)\nBalance at December 31, 2025 $ (10,983)\nAs of December 31, 2025, the total remaining unamortized loss on securities transferred from AFS to HTM included in AOCI was $8.1 billion net of tax effect ($10.6 billion pre-tax). This loss is being amortized over the remaining lives of the securities, offsetting amortization of the securities’ premiums or discounts, and resulting in no impact to net income.\n- 105 -"}, {"label": 89, "gold": false, "text": "THE CHARLES SCHWAB CORPORATION\nNotes to Consolidated Financial Statements\n(Tabular Amounts in Millions, Except Per Share Data, Option Price Amounts, Ratios, or as Noted)\n11. Variable Interest Entities\nAs of December 31, 2025 and 2024, substantially all of Schwab’s involvement with VIEs is through CSB’s CRA-related investments and most of these are related to LIHTC investments. As part of CSB’s community reinvestment initiatives, CSB invests in funds that make equity investments in multifamily affordable housing properties and receives tax credits and other tax benefits for these investments. During 2025, 2024, and 2023, CSB recorded amortization of $187 million, $154 million, and $119 million, respectively, and recognized tax credits and other tax benefits of $248 million, $200 million, and $153 million, respectively, associated with these investments. The amortization, as well as the tax credits and other tax benefits, are included in taxes on income. Tax credits and other tax benefits are reflected as cash flows from operating activities on the consolidated statements of cash flows.\nAggregate assets, liabilities, and maximum exposure to loss\nThe aggregate assets, liabilities, and maximum exposure to loss from those VIEs in which Schwab holds a variable interest, but is not the primary beneficiary, are summarized in the table below:\nDecember 31, 2025 December 31, 2024\nAggregate assets Aggregate liabilities Maximum exposure to loss Aggregate assets Aggregate liabilities Maximum exposure to loss\nLIHTC investments (1) $ 2,084 $ 1,111 $ 2,084 $ 1,729 $ 947 $ 1,729\nOther investments (2) 250 — 342 224 — 340\nTotal $ 2,334 $ 1,111 $ 2,426 $ 1,953 $ 947 $ 2,069\n(1) Aggregate assets and aggregate liabilities are included in other assets and accrued expenses and other liabilities, respectively, on the consolidated balance sheets.\n(2) Other investments include non-LIHTC CRA investments that are accounted for as loans at amortized cost, equity method investments, AFS securities, or using the adjusted cost method. Aggregate assets are included in AFS securities, bank loans – net, or other assets on the consolidated balance sheets.\nSchwab’s maximum exposure to loss would result from the loss of the investments, including any committed amounts. Schwab’s funding of these remaining commitments is dependent upon the occurrence of certain conditions, and Schwab expects to pay substantially all of these commitments between 2026 and 2029. During the years ended December 31, 2025, 2024, and 2023, Schwab did not provide or intend to provide financial or other support to the VIEs that it was not contractually required to provide.\n12. Bank Deposits\nBank deposits consist of interest-bearing and non-interest-bearing deposits as follows:\nDecember 31, 2025 2024\nInterest-bearing deposits:\nDeposits swept from brokerage accounts $ 232,410 $ 210,575\nChecking 16,473 15,593\nTime certificates of deposit (1) 2,000 27,701\nSavings and other 3,637 4,015\nTotal interest-bearing deposits 254,520 257,884\nNon-interest-bearing deposits 1,227 1,237\nTotal bank deposits $ 255,747 $ 259,121\n(1) Time certificates of deposit consist of brokered CDs. The weighted-average interest rates on outstanding time certificates of deposit at December 31, 2025 and 2024 were 4.03% and 4.90%, respectively. As of December 31, 2025 and 2024, there were no time deposits that were in excess of FDIC insurance limits or otherwise uninsured.\nTime certificates of deposit outstanding at December 31, 2025 mature between January 2026 and March 2026.\n- 88 -"}]}, {"n": 72, "id": "FE-0710", "slice": "S6", "company": "Progressive Corporation", "form": "10-K", "question": "What was Progressive Corporation's statutory net income for the fiscal year ended December 31, 2025?", "found": true, "display": "10,643", "scale": "millions", "unit": "USD", "period": "2025-01-01 to 2025-12-31", "dims": {}, "line": "Consolidated statutory surplus was $28,370 million and $27,171 million at December 31, 2025 and 2024, respectively. Statutory net income was $10,643 million, $7,670 million, and $3,502 million, for the years ended December 31, 2025, 2024, and 2023, respectively.", "url": "https://www.sec.gov/Archives/edgar/data/80661/000008066126000086/pgr-20251231_d2.htm", "pages": [{"label": 33, "gold": true, "text": "since these plans are funded by the federal government or by mechanisms supported by insurance companies in applicable states. We evaluate the financial condition of our other reinsurers and monitor concentrations of credit risk to minimize our exposure to significant losses from reinsurer insolvencies.\nFor our Non-Regulated reinsurers, we routinely monitor changes in the credit quality and concentration risks of the reinsurers who are counterparties to our reinsurance recoverables to determine if an allowance for credit losses should be established. For at-risk uncollateralized\nrecoverable balances, we evaluate several reinsurer specific factors, including reinsurer credit quality rating, credit rating outlook, historical experience, reinsurer surplus, recoverable duration, and collateralization composition in respect to our net exposure (i.e., the reinsurance recoverable amount less premiums payable to the reinsurer, where the right to offset exists). At December 31, 2025 and 2024, the allowance for credit losses related to these contracts was not material to our financial condition or results of operations.\n8. STATUTORY FINANCIAL INFORMATION\nConsolidated statutory surplus was $28,370 million and $27,171 million at December 31, 2025 and 2024, respectively. Statutory net income was $10,643 million, $7,670 million, and $3,502 million, for the years ended December 31, 2025, 2024, and 2023, respectively.\nAt December 31, 2025, $1,614 million of consolidated statutory surplus represented net admitted assets of our insurance subsidiaries and affiliates that are required to meet minimum statutory surplus requirements in such entities’ states of domicile. The companies may be licensed in states other than their states of domicile, which may have higher minimum statutory surplus requirements. Generally, the net admitted assets of insurance companies that, subject to other applicable insurance laws\nand regulations, are available for transfer to the parent company cannot include the net admitted assets required to meet the minimum statutory surplus requirements of the states where the companies are licensed.\nDuring 2025, the insurance subsidiaries paid aggregate dividends of $10,027 million to their parent company. Based on the dividend laws currently in effect, the insurance subsidiaries could pay aggregate dividends of $9,327 million in 2026 without prior approval from regulatory authorities, subject to other potential state specific limitations, capital requirements, and restrictions on the amount of dividends that can be paid within a 12-month period by the applicable subsidiary.\n9. EMPLOYEE BENEFIT PLANS\nRetirement Plans Progressive has a defined contribution pension plan (401(k) Plan) that covers employees who have been employed with the company for at least 30 days. Under Progressive’s 401(k) Plan, we match up to a maximum of 6% of an employee’s eligible compensation contributed to the plan, with employees vesting in the company match after providing two years of service. Matching contributions to the 401(k) Plan for the years ended December 31, 2025, 2024, and 2023, were $263 million, $235 million, and $206 million, respectively.\nEmployee and company matching contributions are invested, at the direction of the employee, in a number of investment options available under the plan, including various mutual funds, a self-directed brokerage option, and a Progressive common stock fund. Progressive’s common stock fund is an employee stock ownership program (ESOP) within the 401(k) Plan. At December 31, 2025, the ESOP held 15 million of our common shares, all of which are included in shares outstanding. Dividends on these shares are reinvested in common shares or paid out in cash, at the election of the participant, and the related tax benefit is recorded as part of our tax provision.\nPostemployment Benefits Progressive provides various postemployment benefits to former or inactive employees who meet eligibility requirements and to their beneficiaries and covered dependents. Postemployment benefits include salary continuation and disability-related benefits, including workers’ compensation and, if elected, continuation of health-care benefits for specified limited periods. The liability for these benefits was $23 million and $21 million at December 31, 2025 and 2024, respectively.\nIncentive Compensation Plans – Employees Progressive’s incentive compensation programs include both non-equity incentive plans (cash) and equity incentive plans. Progressive’s cash incentive compensation includes an annual cash incentive program (Gainshare Program) for nearly all employees. Progressive’s equity incentive compensation plans provide for the granting of restricted stock unit awards to key members of management.\nApp.-A-34"}, {"label": 2, "gold": false, "text": "The Progressive Corporation and Subsidiaries\nConsolidated Balance Sheets\nDecember 31,\n(millions) 2025 2024\nAssets\nAvailable-for-sale securities, at fair value:\nFixed maturities (amortized cost: $82,704 and $77,126) $ 82,866 $ 75,332\nShort-term investments (amortized cost: $10,005 and $615) 10,005 615\nTotal available-for-sale securities 92,871 75,947\nEquity securities, at fair value:\nNonredeemable preferred stocks (cost: $419 and $756) 404 728\nCommon equities (cost: $819 and $745) 4,098 3,575\nTotal equity securities 4,502 4,303\nTotal investments 97,373 80,250\nCash and cash equivalents 125 143\nRestricted cash and cash equivalents 13 11\nTotal cash, cash equivalents, restricted cash, and restricted cash equivalents 138 154\nAccrued investment income 670 594\nPremiums receivable, net of allowance for credit losses of $552 and $460 15,362 14,369\nReinsurance recoverables 4,083 4,765\nPrepaid reinsurance premiums 197 349\nDeferred acquisition costs 2,044 1,961\nProperty and equipment, net of accumulated depreciation of $1,460 and $1,461 783 790\nNet federal deferred income taxes 748 954\nOther assets 1,641
