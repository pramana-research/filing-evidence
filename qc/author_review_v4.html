d stock):\nSeries J 83/8% cumulative redeemable preferred stock, 1,000,000 shares authorized, 796,948 issued and outstanding with a liquidation value of $39,847 40,205 40,451\nCommon stock, $0.0001 par value, 511,990,000 shares authorized, 343,129,947 and 343,060,687 issued and outstanding, respectively 33 33\nClass B common stock, $0.0001 par value, 10,000 shares authorized, 8,000 issued and outstanding — —\nCapital in excess of par value 12,445,260 12,347,192\nAccumulated deficit (5,352,962) (4,608,136)\nAccumulated other comprehensive loss (168,039) (251,361)\nCommon stock held in treasury, at cost, 20,667,736 and 17,844,817 shares, respectively (2,879,347) (2,319,911)\nTotal stockholders’ equity 4,085,150 5,208,268\nNoncontrolling interests 1,054,683 1,263,819\nTotal equity 5,139,833 6,472,087\nTotal liabilities and equity $ 39,075,130 $ 40,606,466\nThe accompanying notes are an integral part of these statements.\n5"}, {"label": 16, "gold": false, "text": "Table of Contents\nSimon Property Group, Inc.\nSimon Property Group, L.P.\nCondensed Notes to Consolidated Financial Statements\n(Unaudited)\n(Dollars in thousands, except share, per share, unit and per unit amounts\nand where indicated in millions or billions)\n3. Significant Accounting Policies\nCash and Cash Equivalents and Short-term Investments\nWe consider all highly liquid investments purchased with an original maturity of 90 days or less to be cash and cash equivalents. Cash equivalents are carried at cost, which approximates fair value. Cash equivalents generally consist of commercial paper, bankers’ acceptances, Eurodollars, repurchase agreements, and money market deposits or securities. Financial instruments that potentially subject us to concentrations of credit risk include our cash and cash equivalents and our trade accounts receivable. We place our cash and cash equivalents with institutions of high credit quality. However, at certain times, such cash and cash equivalents are in excess of Federal Deposit Insurance Corporation and Securities Investor Protection Corporation insurance limits.\nEquity Instruments and Debt Securities\nEquity instruments and debt securities consist primarily of equity instruments directly held by us, our deferred compensation plan investments, the debt securities of our captive insurance subsidiary, and certain investments held to fund the debt service requirements of debt previously secured by investment properties. At September 30, 2026 and December 31, 2025, we had equity instruments with readily determinable fair values of $32.9 million and $33.7 million, respectively. Changes in the fair value of these equity instruments are recorded in unrealized (losses) gains in fair value of publicly traded equity instruments and derivative instrument, net in our consolidated statements of operations and comprehensive income. At September 30, 2026 and December 31, 2025, we had equity instruments without readily determinable fair values of $331.0 million and $329.1 million, respectively, for which we have elected the measurement alternative. We regularly evaluate these investments for any impairment in their estimated fair value, as well as any observable price changes for an identical or similar equity instrument of the same issuer, and determined that no material adjustment in the carrying value was required for the three or nine months ended September 30, 2026 and 2025.\nOur deferred compensation plan equity instruments are valued based upon quoted market prices. The investments have a matching liability as the amounts are fully payable to the employees that earned the compensation. Changes in value of these securities and changes to the matching liability to employees are both recognized in earnings and, as a result, there is no impact to consolidated net income.\nAt September 30, 2026 and December 31, 2025, we held debt securities of $158.4 million and $161.6 million, respectively, in our captive insurance subsidiary. The types of securities included in the investment portfolio of our captive insurance subsidiary are typically U.S. Treasury or other U.S. government securities as well as corporate debt securities with maturities ranging from less than one year to ten years. These securities are classified as available-for-sale and are valued based upon quoted market prices or other observable inputs when quoted market prices are not available. The amortized cost of debt securities, which approximates fair value, held by our captive insurance subsidiary is adjusted for amortization of premiums and accretion of discounts to maturity. Changes in the values of these securities are recognized in accumulated other comprehensive loss until the gain or loss is realized or until any unrealized loss is deemed to be other-than-temporary. We review any declines in value of these securities for other-than-temporary impairment and consider the severity and duration of any decline in value. To the extent an other-than-temporary impairment is deemed to have occurred, an impairment is recorded and a new cost basis is established.\nOur captive insurance subsidiary is required to maintain statutory minimum capital and surplus as well as maintain a minimum liquidity ratio. Therefore, our access to these securities may be limited.\nFair Value Measurements\nLevel 1 fair value inputs are quoted prices for identical items in active, liquid and visible markets such as stock exchanges. Level 2 fair value inputs are observable information for similar items in active or inactive markets, and appropriately consider counterparty creditworthiness in the valuations. Level 3 fair value inputs reflect our best estimate of inputs and assumptions market participants would use in pricing an asset or liability at the measurement date. The inputs are unobservable in the market and significant to the valuation estimate. We have no investments for which fair value is measured on a recurring basis using Level 3 inputs.\n17"}, {"label": Acquisition and divestiture-related items (58)\nCertain litigation charges, net (27)\nOther adjustments(3) 39\nIncome before income taxes $ 1,302\n(1)Includes the operations and ongoing transition agreements from businesses the Company has exited, divested, or intends to separate, including the Diabetes Business.\n(2)Other segment items for the Cardiovascular, Neuroscience, and Medical Surgical segments include royalty expense. The Cardiovascular segment for both periods also include income from funded research and development arrangements.\n(3)Includes adjustments to the Company's Italian payback accruals resulting from the June 30, 2025 Legislative Decree published by the Italian government for years 2015 to 2018.\n32"}, {"label": 4, "gold": false, "text": "Medtronic plc\nCondensed Consolidated Statements of Comprehensive Income\n(Unaudited)\nThree months ended\n(in millions) July 31, 2026 July 25, 2025\nNet income $ 1,479 $ 1,047\nOther comprehensive income (loss), net of tax:\nUnrealized gain (loss) on investment securities (48) 19\nTranslation adjustment (479) 349\nNet investment hedges 695 (559)\nNet change in retirement obligations 1 1\nUnrealized gain (loss) on cash flow hedges 173 (128)\nOther comprehensive income (loss) 342 (318)\nComprehensive income including noncontrolling interests 1,821 729\nComprehensive income attributable to noncontrolling interests (9) (8)\nComprehensive income attributable to Medtronic $ 1,812 $ 720\nThe accompanying notes are an integral part of these condensed consolidated financial statements.\n2"}]}, {"n": 2, "id": "FE-0091", "slice": "S1", "company": "Prologis, Inc.", "form": "10-Q", "question": "What was Prologis, Inc.'s cash and cash equivalents as of September 30, 2026?", "found": true, "display": "2,273,497", "scale": "thousands", "unit": "USD", "period": "2026-09-30", "dims": {}, "line": "Cash and cash equivalents 2,273,497 1,145,647", "url": "https://www.sec.gov/Archives/edgar/data/1045609/000119312526436160/pld-20260930.htm", "pages": [{"label": 3, "gold": true, "text": "Index\nPART I. FINANCIAL INFORMATION\nITEM 1. Financial Statements\nPROLOGIS, INC.\nCONSOLIDATED BALANCE SHEETS\n(Unaudited)\n(In thousands, except per share data)\nSeptember 30, 2026 December 31, 2025\nASSETS\nInvestments in real estate properties $ 98,759,850 $ 95,129,356\nLess accumulated depreciation 16,359,720 14,729,149\nNet investments in real estate properties 82,400,130 80,400,207\nInvestments in and advances to unconsolidated entities 11,505,548 11,093,936\nAssets held for sale or contribution 545,788 203,344\nNet investments in real estate 94,451,466 91,697,487\nCash and cash equivalents 2,273,497 1,145,647\nOther assets 7,169,743 5,881,122\nTotal assets $ 103,894,706 $ 98,724,256\nLIABILITIES AND EQUITY\nLiabilities:\nDebt $ 36,832,482 $ 35,037,073\nAccounts payable and accrued expenses 2,791,737 1,963,645\nOther liabilities 3,928,856 3,969,530\nTotal liabilities 43,553,075 40,970,248\nEquity:\nPrologis, Inc. stockholders’ equity:\nSeries Q preferred stock at stated liquidation preference of $50 per share; $0.01 par value; 1,279 shares issued and outstanding and 100,000 authorized at September 30, 2026 and December 31, 2025 63,948 63,948\nCommon stock; $0.01 par value; 950,396 and 929,153 shares issued and outstanding at September 30, 2026 and December 31, 2025, respectively 9,504 9,292\nAdditional paid-in capital 57,311,841 54,698,641\nAccumulated other comprehensive loss (412,673 ) (676,276 )\nDistributions in excess of net earnings (1,063,586 ) (902,427 )\nTotal Prologis, Inc. stockholders’ equity 55,909,034 53,193,178\nNoncontrolling interests 4,432,597 4,560,830\nTotal equity 60,341,631 57,754,008\nTotal liabilities and equity $ 103,894,706 $ 98,724,256\nThe accompanying notes are an integral part of these Consolidated Financial Statements.\n1"}, {"label": 34, "gold": false, "text": "Index\nITEM 2. Management’s Discussion and Analysis of Financial Condition and Results of Operations\nThe following should be read in conjunction with the Consolidated Financial Statements and related Notes included in Item 1 of this report and our Annual Report on Form 10-K for the year ended December 31, 2025, as filed with the United States (“U.S.”) Securities and Exchange Commission (“SEC”).\nThe statements in this report that are not historical facts are forward-looking statements within the meaning of Section 27A of the Securities Act of 1933, as amended, and Section 21E of the Securities Exchange Act of 1934, as amended. These forward-looking statements are based on current expectations, estimates and projections about the industry and markets in which we operate as well as management’s beliefs and assumptions. Such statements involve uncertainties that could significantly impact our financial results. Words such as “expects,” “anticipates,” “intends,” “plans,” “believes,” “seeks,” and “estimates,” including variations of such words and similar expressions, are intended to identify such forward-looking statements, which generally are not historical in nature. All statements that address operating performance, events or developments that we expect or anticipate will occur in the future — including statements relating to the combination with SEGRO plc (“SEGRO”), rent and occupancy growth, acquisition and development activity, including data center developments and power procurement related thereto, contribution and disposition activity, general conditions in the geographic areas where we operate, expectations regarding new lines of business, our debt, capital structure and financial position, our ability to earn revenues from co-investment ventures, form new co-investment ventures and the availability of capital in existing or new co-investment ventures — are forward-looking statements. These statements are not guarantees of future performance and involve certain risks, uncertainties and assumptions that are difficult to predict. Although we believe the expectations reflected in any forward-looking statements are based on reasonable assumptions, we can give no assurance that our expectations will be attained and, therefore, actual outcomes and results may differ materially from what is expressed or forecasted in such forward-looking statements. Some of the factors that may affect outcomes and results include, but are not limited to: (i) international, national, regional and local economic and political climates and conditions; (ii) changes in global financial markets, interest rates and foreign currency exchange rates; (iii) increased or unanticipated competition for our properties; (iv) risks associated with acquisitions, dispositions and development of properties, including those specific to data center development and the integration of the operations of significant real estate portfolios; (v) maintenance of Real Estate Investment Trust (“REIT”) status, tax structuring and changes in income tax laws and rates; (vi) availability of financing and capital, the levels of debt that we maintain and our credit ratings; (vii) risks related to our investments in our co-investment ventures, including our ability to establish new co-investment ventures; (viii) risks of doing business internationally, including currency risks; (ix) environmental uncertainties, including risks of natural disasters; (x) Prologis’ and SEGRO’s ability to complete the combination on the proposed terms or on the anticipated timeline, or at all, including risks and uncertainties relating to satisfying the conditions to the combination and relating to failure to realize the expected benefits or synergies of the combination; and (xi) those additional factors discussed under Part I, Item 1A. Risk Factors in our Annual Report on Form 10-K for the year ended December 31, 2025. We undertake no duty to update any forward-looking statements appearing in this report except as may be required by law.\nPrologis, Inc. is a self-administered and self-managed REIT and is the sole general partner of Prologis, L.P. through which it holds substantially all of its assets. We operate Prologis, Inc. and Prologis, L.P. as one enterprise and, therefore, our discussion and analysis refers to Prologis, Inc. and its consolidated subsidiaries, including Prologis, L.P. We invest in real estate through wholly owned subsidiaries and other entities through which we co-invest with partners and investors (\"co-investment ventures\"). We have a significant ownership interest in the co-investment ventures, which are either consolidated or unconsolidated based on our level of control of the entity.\nWe operate, manage and measure the operating performance of our properties on an owned and managed (“O&M”) basis. Our O&M portfolio includes our consolidated properties as well as properties owned by our unconsolidated co-investment ventures, which we manage. We make operating decisions based on our total O&M portfolio as we manage the properties without regard to their ownership. We also evaluate our results based on our proportionate economic ownership of each property included in the O&M portfolio (“our share”).\nIncluded in our discussion below are references to funds from operations (“FFO”) and net operating income (“NOI”), neither of which are U.S. generally accepted accounting principles (“GAAP”). See below for a reconciliation of Net Earnings Attributable to Common Stockholders/Unitholders in the Consolidated Statements of Income to our FFO measures and a reconciliation of NOI to Operating Income in the Consolidated Statements of Income, the most directly comparable GAAP measures.\nMANAGEMENT'S OVERVIEW\nPrologis is the global leader in logistics real estate, operating in high-barrier, high-growth markets across 20 countries on four continents. Our portfolio is concentrated in key commercial hubs strategically located near end consumers to enable the efficient flow of goods. We own, manage and develop high-quality logistics facilities and deliver integrated infrastructure solutions that optimize how our customers operate within our buildings. Our services address the evolving needs of modern supply chains, including the growing convergence of physical, digital and energy infrastructure, as logistics facilities increasingly support power and data-intensive operations. Consistent with this strategy, we are leveraging our development capabilities, energy solutions and strategic locations to deliver digital infrastructure requirements through selective development of data centers.\n32"}, {"label": 4, "gold": false, "text": "Index\nPROLOGIS, INC.\nCONSOLIDATED STATEMENTS OF INCOME\n(Unaudited)\n(In thousands, except per share amounts)\nThree Months Ended Nine Months Ended\nSeptember 30, September 30,\n2026 2025 2026 2025\nRevenues:\nRental $ 2,205,269 $ 2,054,200 $ 6,507,427 $ 6,066,797\nStrategic capital 164,326 150,351 566,757 438,652\nDevelopment management and other 17,923 9,330 36,509 31,966\nTotal revenues 2,387,518 2,213,881 7,110,693 6,537,415\nExpenses:\nRental 511,715 484,635 1,562,859 1,460,915\nStrategic capital 84,202 69,270 261,681 194,964\nGeneral and administrative 127,597 110,662 384,113 332,234\nDepreciation and amortization 710,300 647,999 2,131,324 1,957,278\nOther 16,957 8,724 47,246 30,079\nTotal expenses 1,450,771 1,321,290 4,387,223 3,975,470\nOperating income before gains on real estate transactions, net 936,747 892,591 2,723,470 2,561,945\nGains on dispositions of development properties and land, net 51,538 15,435 423,717 53,363\nGains on other dispositions of investments in real estate, net 56,435 32,235 359,924 116,078\nOperating income 1,044,720 940,261 3,507,111 2,731,386\nOther income (expense):\nEarnings from unconsolidated entities, net 155,417 92,827 396,183 268,418\nInterest expense (286,955 ) (258,274 ) (817,552 ) (741,891 )\nForeign currency, derivative and other gains (losses) and other income (expense), net 64,535 100,981 218,809 (53,506 )\nGains (losses) on early extinguishment of de rther information about the secured borrowings accounting and the classification of revenues and expenses.\nThird-party custodian administered programs: The estimated fair value of securities we own which are loaned in connection with these programs was $640 million and $433 million at December 31, 2025 and 2024, respectively. The estimated fair value of the related non-cash collateral on deposit with third-party custodians on our behalf, which is not reflected in our consolidated financial statements and cannot be sold or re-pledged, was $658 million and $443 million at December 31, 2025 and 2024, respectively.\nMortgage Loans\nOur mortgage loan investments are principally collateralized by commercial, agricultural and residential properties. See Notes 1 and 11 of the Notes to the Consolidated Financial Statements for further information.\n99"}]}, {"n": 4, "id": "FE-0092", "slice": "S1", "company": "Prologis, Inc.", "form": "10-Q", "question": "What was Prologis, Inc.'s investments in real estate properties as of September 30, 2026?", "found": true, "display": "98,759,850", "scale": "thousands", "unit": "USD", "period": "2026-09-30", "dims": {}, "line": "Investments in real estate properties $ 98,759,850 $ 95,129,356", "url": "https://www.sec.gov/Archives/edgar/data/1045609/000119312526436160/pld-20260930.htm", "pages": [{"label": 3, "gold": true, "text": "Index\nPART I. FINANCIAL INFORMATION\nITEM 1. Financial Statements\nPROLOGIS, INC.\nCONSOLIDATED BALANCE SHEETS\n(Unaudited)\n(In thousands, except per share data)\nSeptember 30, 2026 December 31, 2025\nASSETS\nInvestments in real estate properties $ 98,759,850 $ 95,129,356\nLess accumulated depreciation 16,359,720 14,729,149\nNet investments in real estate properties 82,400,130 80,400,207\nInvestments in and advances to unconsolidated entities 11,505,548 11,093,936\nAssets held for sale or contribution 545,788 203,344\nNet investments in real estate 94,451,466 91,697,487\nCash and cash equivalents 2,273,497 1,14 primarily as a result of our revolving credit facilities and commercial paper programs, term loans, mortgages payable, and long-term notes and bonds used to maintain liquidity and expand our real estate investment portfolio and operations. Our interest rate risk management objective is to limit the impact of interest rate changes on earnings and cash flow and to lower our overall borrowing costs. To achieve these objectives, we primarily issue long-term notes and bonds, primarily at fixed rates.\nIn order to mitigate and manage the effects of interest rate risks on our operations, we may utilize a variety of financial instruments, including interest rate swaps, interest rate swaptions, interest rate locks and caps. The use of these types of instruments to hedge our exposure to changes in interest rates carries additional risks, including counterparty credit risk, the enforceability of hedging contracts and the risk that unanticipated and significant changes in interest rates will cause a significant loss of basis in the contract. To limit counterparty credit risk, we will seek to enter into such agreements with major financial institutions with favorable credit ratings. There can be no assurance that we will be able to adequately protect against the foregoing risks or realize an economic benefit that exceeds the related amounts incurred in connection with engaging in such hedging activities. We do not enter into any derivative transactions for speculative or trading purposes.\nThe following table presents, by year of expected maturity, the principal amounts, average interest rates and estimated fair values of our fixed and variable rate debt as of December 31, 2025. This information is presented to evaluate the expected cash flows and sensitivity to interest rate changes.\nExpected Maturity Data\nThe following table summarizes the maturity of our debt as of December 31, 2025 (dollars in millions):\nConsolidated Fixed Rate Debt Consolidated Variable Rate Debt End of deposits with banks, net investments in leases, and other off-balance sheet credit exposures.\nThe process for establishing the ACL for loans takes into consideration many factors, including historical and forecasted loss trends, loan-level credit quality ratings and loan grade-specific characteristics. The process involves subjective and complex judgments. In addition, we review a variety of credit metrics and trends. These credit metrics and trends, however, do not solely determine the amount of the allowance as we use several analytical tools. For additional information on our ACL, see the “Critical Accounting Policies – Allowance for Credit Losses” section and Note 1 (Summary of Significant Accounting Policies) to Financial Statements in this Report. For additional information on our ACL for loans, see Note 3 (Loans and Related Allowance for Credit Losses) to Financial Statements in this Report, and for additional information on our ACL for debt securities, see Note 2 (Available-for-Sale and Held-to-Maturity Debt Securities) to Financial Statements in this Report.\nWells Fargo & Company 39"}, {"label": 75, "gold": false, "text": "Report of Independent Registered Public Accounting Firm\nTo the Stockholders and Board of Directors\nWells Fargo & Company:\nOpinion on Internal Control Over Financial Reporting\nWe have audited Wells Fargo & Company and subsidiaries’ (the Company) internal control over financial reporting as of December 31, 2025, based on criteria established in Internal Control – Integrated Framework (2013) issued by the Committee of Sponsoring Organizations of the Treadway Commission. In our opinion, the Company maintained, in all material respects, effective internal control over financial reporting as of December 31, 2025, based on criteria established in Internal Control – Integrated Framework (2013) issued by the Committee of Sponsoring Organizations of the Treadway Commission.\nWe also have audited, in accordance with the standards of the Public Company Accounting Oversight Board (United States) (PCAOB), the consolidated balance sheet of the Company as of December 31, 2025 and 2024, the related consolidated statement of income, comprehensive income, changes in equity, and cash flows for each of the years in the three-year period ended December 31, 2025, and the related notes (collectively, the consolidated financial statements), and our report dated February 24, 2026 expressed an unqualified opinion on those consolidated financial statements.\nBasis for Opinion\nThe Company’s management is responsible for maintaining effective internal control over financial reporting and for its assessment of the effectiveness of internal control over financial reporting, included in the accompanying Management’s Report on Internal Control Over Financial Reporting. Our responsibility is to express an opinion on the Company’s internal control over financial reporting based on our audit. We are a public accounting firm registered with the PCAOB and are required to be independent with respect to the Company in accordance with the U.S. federal securities laws and the applicable rules and regulations of the Securities and Exchange Commission and the PCAOB.\nWe conducted our audit in accordance with the standards of the PCAOB. Those standards require that we plan and perform the audit to obtain reasonable assurance about whether effective internal control over financial reporting was maintained in all material respects. Our audit of internal control over financial reporting included obtaining an understanding of internal control over financial reporting, assessing the risk that a material weakness exists, and testing and evaluating the design and operating effectiveness of internal control based on the assessed risk. Our audit also included performing such other procedures as we considered necessary in the circumstances. We believe that our audit provides a reasonable basis for our opinion.\nDefinition and Limitations of Internal Control Over Financial Reporting\nA company’s internal control over financial reporting is a process designed to provide reasonable assurance regarding the reliability of financial reporting and the preparation of financial statements for external purposes in accordance with generally accepted accounting principles. A company’s internal control over financial reporting includes those policies and procedures that (1) pertain to the maintenance of records that, in reasonable detail, accurately and fairly reflect the transactions and dispositions of the assets of the company; (2) provide reasonable assurance that transactions are recorded as necessary to permit preparation of financial statements in accordance with generally accepted accounting principles, and that receipts and expenditures of the company are being made only in accordance with authorizations of management and directors of the company; and (3) provide reasonable assurance regarding prevention or timely detection of unauthorized acquisition, use, or disposition of the company’s assets that could have a material effect on the financial statements.\nBecause of its inherent limitations, internal control over financial reporting may not prevent or detect misstatements. Also, projections of any evaluation of effectiveness to future periods are subject to the risk that controls may become inadequate because of changes in conditions, or that the degree of compliance with the policies or procedures may deteriorate.\nCharlotte, North Carolina\nFebruary 24, 2026\n76 Wells Fargo & Company"}]}, {"n": 10, "id": "FE-0109", "slice": "S1", "company": "Travelers Companies, Inc.", "form": "10-Q", "question": "What was Travelers Companies, Inc.'s retained earnings (shareholders’ equity) as of September 30, 2026?", "found": true, "display": "60,002", "scale": "millions", "unit": "USD", "period": "2026-09-30", "dims": {}, "line": "Retained earnings 60,002 54,931", "url": "https://www.sec.gov/Archives/edgar/data/86312/0000 s – accelerated computing and AI. Revenue from Data Center computing grew 59% driven by demand for our Blackwell computing platform. Revenue from Data Center networking grew 142% driven by the introduction and continued ramp of NVLink compute fabric for GB200 and GB300 systems and the growth of Ethernet and InfiniBand platforms.\nGraphics revenue – The year over year increase was driven by sales of our Blackwell architecture.\nReportable segment operating income – The year over year increase in Compute & Networking segment operating income was driven by growth in revenue, partially offset by a $4.5 billion charge associated with H20 excess inventory and purchase obligations in the first quarter of fiscal year 2026. The year over year increase in Graphics segment operating income was driven by the growth in revenue.\n40"}, {"label": 55, "gold": false, "text": "Table of Contents\nNVIDIA Corporation and Subsidiaries\nNotes to the Consolidated Financial Statements\nNote 1 - Organization and Summary of Significant Accounting Policies\nOur Company\nHeadquartered in Santa Clara, California, NVIDIA was incorporated in California in April 1993 and reincorporated in Delaware in April 1998.\nAll references to “NVIDIA,” “we,” “us,” “our” or the “Company” mean NVIDIA Corporation and its subsidiaries.\nCertain prior fiscal year balances have been reclassified to conform to the current fiscal year presentation. Non-marketable equity securities, previously presented within other assets, were reclassified to be presented separately on our consolidated balance sheets and had no impact to total assets or consolidated statement of cash flows.\nFiscal Year\nWe operate on a 52- or 53-week year, ending on the last Sunday in January. Fiscal years 2026, 2025 and 2024 were all 52-week years. Fiscal year 2027 will be a 53-week year with the fourth quarter consisting of 14 weeks.\nPrinciples of Consolidation\nOur consolidated financial statements include the accounts of NVIDIA Corporation and our wholly-owned subsidiaries. All intercompany balances and transactions have been eliminated in consolidation.\nUse of Estimates\nThe preparation of financial statements in conformity with U.S. GAAP requires management to make estimates and assumptions that affect the reported amounts of assets and liabilities and disclosures of contingent assets and liabilities at the date of the financial statements and the reported amounts of revenue and expenses during the reporting period. Actual results could differ materially from our estimates. On an on-going basis, we evaluate our estimates, including those related to accounts receivable, cash equivalents and marketable securities, goodwill, income taxes, inventories and product purchase commitments, investigation and settlement costs, litigation, non-marketable equity securities, other contingencies, property, plant, and equipment, revenue recognition, and stock-based compensation. These estimates are based on historical facts and various other assumptions that we believe are reasonable.\nRevenue Recognition\nWe derive our revenue primarily from product sales including hardware and systems. We determine revenue recognition through the following steps: (1) identification of the contract with a customer; (2) identification of the performance obligations in the contract; (3) determination of the transaction price; (4) allocation of the transaction price to the performance obligations in the contract (where revenue is allocated on a relative standalone selling price basis by maximizing the use of observable inputs to determine the standalone selling price for each performance obligation); and (5) recognition of revenue when, or as, we satisfy a performance obligation. Payment from customers, per our standard payment terms, is generally due shortly after delivery of our products.\nProduct Sales Revenue\nRevenue from product sales is recognized upon transfer of control of products to customers in an amount that reflects the consideration we expect to receive in exchange for those products. Certain products are sold with support or an extended warranty. Support and extended warranty revenue are recognized ratably over the service period, or as services are performed. Revenue is recognized net of allowances for returns, customer programs and any taxes collected from customers.\nFor products sold with a right of return, we record a reduction to revenue by establishing a sales return allowance for estimated product returns at the time revenue is recognized, based primarily on historical return rates. However, if product returns for a fiscal period are anticipated to exceed historical return rates, we may determine that additional sales return allowances are required to accurately reflect our estimated exposure for product returns.\nOur customer programs involve rebates, which are designed to serve as sales incentives to resellers of our products in various target markets, and MDFs which represent monies paid to our partners that are earmarked for market segment development and are designed to support our partners’ activities while also promoting NVIDIA products. We account for customer programs as a reduction to revenue and accrue for such programs for potential rebates and MDFs based on the amount we expect to be claimed by customers.\n56"}]}, {"n": 14, "id": "FE-0214", "slice": "S2", "company": "Prologis, Inc.", "form": "10-K", "question": "What was Prologis, Inc.'s net earnings attributable to controlling interests for the fiscal year ended December 31, 2023?", "found": true, "display": "3,059,214", "scale": "thousands", "unit": "USD", "period": "2023-01-01 to 2023-12-31", "dims": {}, "line": "Net earnings attributable to controlling interests 3,328,231 3,731,635 3,059,214", "url": "https://www.sec.gov/Archives/edgar/data/1045609/000119312526051453/pld-20251231.htm", "pages": [{"label": 55, "gold": true, "text": "Table of Contents\nPROLOGIS, INC.\nCONSOLIDATED STATEMENTS OF INCOME\n(In th e attributable to common stockholders – Diluted $ 3.56 $ 4.01 $ 3.29\nThe accompanying notes are an integral part of these Consolidated Financial Statements.\n55"}, {"label": 51, "gold": false, "text": "Table of Contents\nREPORT OF INDEPENDENT REGISTERED PUBLIC ACCOUNTING FIRM\nTo the Stockholders and Board of Directors\nPrologis, Inc.:\nOpinion on the Consolidated Financial Statements\nWe have audited the accompanying consolidated balance sheets of Prologis, Inc. and subsidiaries (the Company) as of December 31, 2025 and 2024, the related consolidated statements of income, comprehensive income, equity, and cash flows for each of the years in the three-year period ended December 31, 2025, and the related notes and financial statement schedule III (collectively, the consolidated financial statements). In our opinion, the consolidated financial statements present fairly, in all material respects, the financial position of the Company as of December 31, 2025 and 2024, and the results of its operations and its cash flows for each of the years in the three-year period ended December 31, 2025, in conformity with U.S. generally accepted accounting principles.\nWe also have audited, in accordance with the standards of the Public Company Accounting Oversight Board (United States) (PCAOB), the Company’s internal control over financial reporting as of December 31, 2025, based on criteria established in Internal Control – Integrated Framework (2013) issued by the Committee of Sponsoring Organizations of the Treadway Commission, and our report dated February 13, 2026 expressed an unqualified opinion on the effectiveness of the Company’s internal control over financial reporting.\nBasis for Opinion\nThese consolidated financial statements are the responsibility of the Company’s management. Our responsibility is to express an opinion on these consolidated financial statements based on our audits. We are a public accounting firm registered with the PCAOB and are required to be independent with respect to the Company in accordance with the U.S. federal securities laws and the applicable rules and regulations of the Securities and Exchange Commission and the PCAOB.\nWe conducted our audits in accordance with the standards of the PCAOB. Those standards require that we plan and perform the audit to obtain reasonable assurance about whether the consolidated financial statements are free of material misstatement, whether due to error or fraud. Our audits included performing procedures to assess the risks of material misstatement of the consolidated financial statements, whether due to error or fraud, and performing procedures that respond to those risks. Such procedures included examining, on a test basis, evidence regarding the amounts and disclosures in the consolidated financial statements. Our audits also included evaluating the accounting principles used and significant estimates made by management, as well as evaluating the overall presentation of the consolidated financial statements. We believe that our audits provide a reasonable basis for our opinion.\nCritical Audit Matter\nThe critical audit matter communicated below is a matter arising from the current period audit of the consolidated financial statements that was communicated or required to be communicated to the audit committee and that: (1) relates to accounts or disclosures that are material to the consolidated financial statements and (2) involved our especially challenging, subjective, or complex judgments. The communication of a critical audit matter does not alter in any way our opinion on the consolidated financial statements, taken as a whole, and we are not, by communicating the critical audit matter below, providing a separate opinion on the critical audit matter or on the accounts or disclosures to which it relates.\nAssessment of the Company’s evaluation of the expected holding period for operating properties\nAs discussed in Notes 2 and 3 to the consolidated financial statements, the Company had $80,561 million of operating properties as of December 31, 2025. The Company tests the recoverability of operating properties whenever events or changes in circumstances, including shortening the expected holding period of such assets, indicate that the carrying amount of these assets may not be recoverable.\nWe identified the assessment of the Company’s evaluation of the expected holding period for certain operating properties as a critical audit matter. Subjective auditor judgment was required to assess the relevant events or changes in circumstances that the Company used to evaluate its expected holding period. A shortening of the expected holding period could indicate a potential impairment.\nThe following are the primary procedures we performed to address this critical audit matter. We evaluated the design and tested the operating effectiveness of certain internal controls related to determining the expected holding period of operating properties and any related changes. We evaluated the Company’s expected holding period by inquiring of the Company regarding changes to the expected holding period, considering certain factors related to the current economic environment, reading minutes of the meetings of the Company’s Board of Directors, reading external communications with investors and analysts, and analyzing documents prepared by the Company regarding proposed real estate transactions and potential changes to the expected holding period.\n/s/ KPMG LLP\nWe have served as the Company’s auditor since 2002.\nDenver, Colorado\nFebruary 13, 2026\n51"}, {"label": 56, "gold": false, "text": "Table of Contents\nPROLOGIS, INC.\nCONSOLIDATED STATEMENTS OF COMPREHENSIVE INCOME\n(In thousands)\nYears Ended December 31,\n2025 2024 2023\nConsolidated net earnings $ 3,565,299 $ 3,947,935 $ 3,253,145\nOther comprehensive income:\nForeign currency translation gains (losses), net (575,862 ) 360,874 20,763\nUnrealized gains (losses) on derivative contra ed indebtedness, and do not contain financial covenants. We may redeem the notes at any time, subject to a make-whole premium.\nFor the senior notes issued in February 2020, upon the occurrence of certain change of control triggering events, we may be required to repurchase the notes, at a price equal to 101% of their principal amount, plus accrued and unpaid interest to the\n82"}]}, {"n": 19, "id": "FE-0161", "slice": "S2", "company": "General Dynamics Corporation", "form": "10-Q", "question": "What was General Dynamics Corporation's total noncurrent assets as of December 31, 2025?", "found": true, "display": "33,001", "scale": "millions", "unit": "USD", "period": "2025-12-31", "dims": {}, "line": "Total noncurrent assets 33,332 33,001", "url": "https://www.sec.gov/Archives/edgar/data/40533/000004053326000038/gd-20261004.htm", "pages": [{"label": 5, "gold": true, "text": "CONSOLIDATED BALANCE SHEET\n(Unaudited)\n(Dollars in millions) October 4, 2026 December 31, 2025\nASSETS\nCurrent assets:\nCash and equivalents $ 4,388 $ 2,333\nAccounts receivable 2,529 2,406\nUnbilled receivables 8,906 8,380\nInventories 9,124 9,232\nOther current assets 1,926 1,897\nTotal current assets 26,873 24,248\nNoncurrent assets:\nProperty, plant and equipment, net 7,853 7,525\nIntangible assets, net 1,231 1,375\nGoodwill 20,849 21,009\nOther assets 3,399 3,092\nTotal noncurrent assets 33,332 33,001\nTotal assets $ 60,205 $ 57,249\nLIABILITIES AND SHAREHOLDERS’ EQUITY\nCurrent liabilities:\nShort-term debt and current portion of long-term debt $ 756 $ 1,006\nAccounts payable 3,166 2,678\nCustomer advances and deposits 11,083 9,824\nOther current liabilities 3,821 3,288\nTotal current liabilities 18,826 16,796\nNoncurrent liabilities:\nLong-term debt 6,260 7,007\nOther liabilities 7,827 7,824\nCommitments and contingencies (see Note J)\nTotal noncurrent liabilities 14,087 14,831\nShareholders’ equity:\nCommon stock 482 482\nSurplus 4,646 4,403\nRetained earnings 46,299 44,080\nTreasury st 2 $ 12,700 $ 10,557\nSee notes to consolidated financial statements.\n66"}, {"label": 9, "gold": false, "text": "Table of Contents\ncost by combining operating system and management software with Oracle server, storage and networking hardware. We offer our Oracle Engineered Systems through flexible deployment options, including on-premise, as a cloud offering in OCI, as a platform for Oracle AI Database services in Oracle multicloud partner data centers and as a hybrid cloud offering in customer data centers.\nOracle Software and Hardware Support\nWe provide customers the option to purchase software support contracts in connection with the purchase of Oracle applications and infrastructure software licenses. Substantially all of our customers opt to purchase software support contracts when they purchase these software licenses. We believe our software support offerings protect and enhance our customers’ investments in Oracle applications and infrastructure technologies because they provide proactive and personalized support services and unspecified license upgrades and enhancements during the term of the support period. Substantially all software support customers renew their support contracts with us upon expiration in order to continue to benefit from technical support services and the periodic issuance of unspecified updates and enhancements, which current software support customers are entitled to receive.\nOracle hardware support offerings provide customers with unspecified software updates for software components that are essential to the functionality of our hardware products such as for Oracle operating systems and firmware. These offerings can also include product repairs, maintenance services and technical support services. We continue to evolve hardware support processes that are intended to proactively identify and solve quality issues.\nOracle Services\nWe offer services to help customers and partners maximize the performance of their investments in Oracle applications and infrastructure technologies. We believe that our services are differentiated based on our expertise in Oracle technologies, extensive experience and broad sets of intellectual property and best practices. Our services offerings substantially include, among others:\n•\nconsulting services, which are designed to help our customers and global system integrator partners more successfully architect and deploy our cloud and software offerings, including IT strategy alignment, enterprise architecture planning and design, implementation, integration, application development, security assessments and ongoing software enhancements and upgrades. We utilize a global, blended delivery model to optimize value for our customers and partners, which involves the use of consultants from local geographies, industry specialists and consultants from our global delivery and solution centers; and\n•\ncustomer success services, which are support services provided by Oracle to a customer to enable increased performance and higher availability of a customer’s Oracle products and services.\nOracle Cloud Operations\nOracle Cloud Operations deliver our Oracle Cloud offerings to customers through a secure, reliable, scalable, enterprise grade cloud infrastructure platform managed by Oracle employees within a global network of data centers. The Oracle Cloud enables secure and isolated cloud-based instances for each of our customers to access the functionality of Oracle Cloud offerings via a broad spectrum of devices. Oracle Cloud Operations leverage automated software tools to enable the rapid delivery of the latest cloud technology capabilities to the Oracle Cloud as they become available and provide Oracle customers access to the latest Oracle releases. We have invested in the rapid expansion of the Oracle Cloud by increasing existing data center capacity and adding data centers in new geographic locations to meet current and expected customer demand. We expect this trend will continue.\nManufacturing\nWe rely on third-party manufacturing partners to produce most of our hardware products that we market and sell to customers and utilize internally to deliver Oracle Cloud offerings, and we distribute most of our hardware products from these partners’ facilities. Our manufacturing processes are substantially based on standardization of components across product types and centralization of assembly and distribution centers. Production of our\n8"}, {"label": 66, "gold": false, "text": "Table of Contents\nORACLE CORPORATION\nCONSOLIDATED STATEMENTS OF OPERATIONS\nFor the Years Ended May 31, 2026, 2025 and 2024\nYear Ended May 31,\n(in millions, except per share data) 2026 2025 2024\nRevenues:\nCloud $ 33,989 $ 24,506 $ 19,774\nSoftware 24,541 24,724 24,690\nHardware 3,084 2,936 3,066\nServices 5,743 5,233 5,431\nTotal revenues 67,357 57,399 52,961\nOperating expenses:\nCloud and software(1) 17,597 11,569 9,427\nHardware(1) 868 782 891\nServices(1) 4,556 4,576 4,825\nSales and marketing(1) 8,331 8,651 8,274\nResearch and development 10,272 9,860 8,915\nGeneral and administrative 1,618 1,602 1,548\nAmortization of intangible assets 1,671 2,307 3,010\nRestructuring and other 1,838 374 718\nTotal operating expenses 46,751 39,721 37,608\nOperating income 20,606 17,678 15,353\nInterest expense (4,599 ) (3,578 ) (3,514 )\nNon-operating income (expenses), net 3,547 60 (98 )\nIncome before income taxes 19,554 14,160 11,741\nProvision for income taxes 2,467 1,717 1,274\nNet income $ 17,087 $ 12,443 $ 10,467\nPreferred stock dividends 103 — —\nNet income available to common shareholders $ 16,984 $ 12,443 $ 10,467\nEarnings per share attributable to common shareholders:\nBasic $ 5.94 $ 4.46 $ 3.82\nDiluted $ 5.83 $ 4.34 $ 3.71\nWeighted average common shares outstanding:\nBasic 2,860 2,789 2,744\nDiluted 2,914 2,866 2,823\n(1)\nExclusive of amortization of intangible assets, which is shown separately.\nSee notes to consolidated financial statements.\n6  from re-issuance of treasury stock 348 361 314\nTaxes paid related to net share settlement of equity awards (475) (677) (589)\nProceeds from issuance of debt 1,997 1,997 —\nRepayment of debt (1,500) — (500)\nOther financing activities, net (149) 95 (7)\nNet cash used for financing activities (11,060) (7,724) (5,182)\nEffect of foreign currency exchange rates on cash and cash equivalents 34 (9) 9\nNet change in cash and cash equivalents (2,182) 472 2,905\nCash and cash equivalents at beginning of year 7,613 7,141 4,236\nCash and cash equivalents at end of year $ 5,431 $ 7,613 $ 7,141\nSupplemental disclosures:\nCash paid for income taxes, net of refunds $ 2,219 $ 1,727 $ 1,854\nCash paid for interest $ 246 $ 143 $ 106\nSee accompanying Notes to Consolidated Financial Statements.\n51"}, {"label": 32, "gold": false, "text": "Table of Contents\nRESULTS OF OPERATIONS\nOverview of Fiscal 2025\nFor our fiscal 2025, we experienced strong demand across our Digital Media and Digital Experience offerings, driven by transformative and customer-focused product innovation. As we execute on our long-term growth initiatives, with emphasis on delivering value through AI-powered and highly differentiated solutions to meet the needs of our diverse and expanding customer base, we have continued to experience growth in software-based subscription revenue across our portfolio of offerings.\nDigital Media\nOur Digital Media products, services and solutions help users create, design and publish rich content and 3D experiences, and improve productivity by transforming how they view, share and collaborate on documents and content. These offerings include our Creative Cloud flagship applications (“apps”) such as Adobe Photoshop, Adobe Illustrator, Adobe Lightroom, Adobe Premiere Pro and Adobe After Effects; as well as Adobe Acrobat, Adobe Express, Adobe Firefly and many more products, which are available across surfaces and platforms as desktop tools, web and mobile apps and cloud-based services. Adobe Express is our web and mobile app designed to enable a broad spectrum of users, including novice content creators and communicators, to create, edit and customize content quickly and easily with content first, task-based solutions. Our Adobe Acrobat offerings fuel document productivity, enabling users to create, collaborate, review, approve, sign and track documents at home, in the office and across devices. AI innovation is deeply infused into our Digital Media solutions, including through Adobe Firefly-powered generative AI features available across our Creative Cloud flagship apps, and through Acrobat AI Assistant, a generative AI-powered conversational interface designed to enhance document experiences. In August 2025, we released Acrobat Studio, which brings together Adobe Acrobat, Adobe Express and AI agents to further unite productivity and creativity, empowering users to quickly derive insights from their documents and create visually compelling content. Our Digital Media customers include business professionals, consumers, creative professionals, creators and marketing professionals.\nDuring fiscal 2025, Annualized Recurring Revenue (“ARR”) was the key performance metric our management used to assess the health and trajectory of our overall Digital Media segment. Digital Media ARR was calculated as the sum of the annual value of Digital Media subscriptions and services and the annual value of Digital Media Enterprise Term License Agreements.\nDigital Media ARR grew to $19.20 billion at the end of fiscal 2025, representing 11.5% year-over-year growth. Our success in driving growth in ARR has positively affected our revenue growth. Digital Media segment revenue grew to $17.65 billion in fiscal 2025, up from $15.86 billion in fiscal 2024, representing 11% year-over-year growth.\nDigital Experience\nOur Digital Experience apps and services are designed to accelerate customer experience orchestration at scale and supply intelligence for businesses of any size in any industry. Digital Experience is comprised of solutions to deliver actionable data, with products such as Adobe Analytics and Adobe Real-Time Customer Data Platform; optimize personalized content delivery, with products such as Adobe Experience Manager, Adobe Commerce and Adobe GenStudio for Performance Marketing; and manage customer journeys, with products such as Adobe Marketo Engage and Adobe Campaign. Our differentiation and competitive advantage are strengthened by our ability to use the Adobe Experience Platform to integrate our comprehensive set of solutions and our ability to embed AI into our product portfolio, such as with our Adobe Experience Platform AI Assistant, a generative AI-powered conversational interface designed to help customers automate workflows and generate new audiences and journeys. Our Digital Experience customers include marketing professionals such as brand managers, channel marketers and campaign strategists.\nDigital Experience revenue was $5.86 billion in fiscal 2025, up from $5.37 billion in fiscal 2024, representing 9% year-over-year growth. Subscription revenue grew to $5.41 billion in fiscal 2025, up from $4.86 billion in fiscal 2024, representing 11% year-over-year growth.\nCustomer-Focused Strategy\nOur customers often are involved in workflows that integrate multiple Adobe products across both segments. By combining the creativity of our Digital Media business with the science of our Digital Experience business, such as with our Adobe GenStudio solutions, we help our customers to more efficiently and effectively make, manage, measure and monetize their content across every channel with an end-to-end workflow.\n33"}, {"label": 51, "gold": false, "text": "Table of Contents\nADOBE INC.\nNOTES TO CONSOLIDATED FINANCIAL STATEMENTS\nNOTE 1. BASIS OF PRESENTATION AND SIGNIFICANT ACCOUNTING POLICIES\nOperations\nAdobe’s mission is to empower everyone to create. We build innovative platforms and tools that unleash creativity, productivity and personalized customer experiences. For over four decades, our innovations have transformed how people everywhere engage across all types of media. Adobe’s solutions are the foundation of digital experiences, starting with the first creative spark, to the creation and development of all content and media, to the personalized delivery across every channel. We have operations in the Americas; Europe, Middle East and Africa (“EMEA”); and Asia-Pacific (“APAC”).\nBasis of Presentation\nThe accompanying Consolidated Financial Statements include those of Adobe and its subsidiaries, after elimination of all intercompany accounts and transactions. We have prepared the accompanying Consolidated Financial Statements in accordance with generally accepted accounting principles in the United States (“GAAP”) and pursuant to the rules and regulations of the U.S. Securities and Exchange Commission (the “SEC”).\nUse of Estimates\nIn preparing the Consolidated Financial Statements and related disclosures in conformity with GAAP and pursuant to the rules and regulations of the SEC, we must make estimates and judgments that affect the amounts reported in the Consolidated Financial Statements and accompanying Notes. Estimates are used for, but not limited to, sales allowances and programs, bad debts, stock-based compensation, determining the fair value of acquired assets and assumed liabilities, litigation and income taxes. Actual results may differ materially from these estimates.\nFiscal Year\nOur fiscal year is a 52- or 53-week year that ends on the Friday closest to November 30. Fiscal years 2025, 2024 and 2023 were 52-week years. Our next 53-week year will be fiscal year 2027.\nReclassifications\nCertain prior year amounts, which are not material, have been reclassified to conform to current year presentation in the Consolidated Statements of Cash Flows and Notes to Consolidated Financial Statements.\nSignificant Accounting Policies\nRevenue Recognition\nOur revenue is derived from the sale of cloud-enabled software subscriptions, cloud-hosted offerings, term-based, royalty, and perpetual software licenses, associated software maintenance and support plans, consulting services, training and technical support. Most of our enterprise customer arrangements involve multiple promises to our customers.\nRevenue is recognized when a contract exists between us and a customer and upon transfer of control of promised products or services to customers in an amount that reflects the consideration we expect to receive in exchange for those products or services. We enter into contracts that can include various combinations of products and services, which may be capable of being distinct and accounted for as separate performance obligations, or as in the case of certain cloud-enabled software subscription offerings, accounted for as a single performance obligation. Revenue is recognized net of allowances for returns and any taxes collected from customers, which are subsequently remitted to governmental authorities.\nSubscription, Product and Services Offerings\nWe enter into revenue arrangements in which a customer may purchase a combination of our products, services and/or solutions as described above. Certain revenue arrangements provide customers with unilateral cancellation rights, or options to either renew monthly on-premise term-based licenses or use committed funds to purchase other Adobe products or services.\n52"}]}, {"n": 22, "id": "FE-0212", "slice": "S2", "company": "Progressive Corporation", "form": "10-Q", "question": "What was Progressive Corporation's total net unrealized gains (losses) on fixed-maturity securities for the three months ended September 30, 2025?", "found": true, "display": "284", "scale": "millions", "unit": "USD", "period": "2025-07-01 to 2025-09-30", "dims": {}, "line": "Total net unrealized gains (losses) on fixed-maturity securities (1,898) 284 (2,847) 1,611", "url": "https://www.sec.gov/Archives/ed 89 (2,744) 189\nTotal shareholders’ equity $ 34,485 $ 35,445 $ 34,485 $ 35,445\nThere are 20 million Serial Preferred Shares authorized. There are 5 million Voting Preference Shares authorized; no such shares have been issued.\nSee notes to consolidated financial statements.\n3"}, {"label": 43, "gold": false, "text": "Our asset allocation strategy is to maintain 0%-25% of our portfolio in Group I securities, with the balance (75%-100%) of our portfolio in Group II securities.\nGroup I securities, 7% of the total portfolio at September 30, 2026, include:\n•common equities,\n•nonredeemable preferred stocks,\n•redeemable preferred stocks, except for 50% of investment-grade redeemable preferred stocks with cumulative dividends, which are included in Group II, and\n•all other non-investment-grade fixed-maturity securities.\nGroup II securities, 93% of the total portfolio at September 30, 2026, include:\n•short-term securities, and\n•all other fixed-maturity securities, including 50% of investment-grade redeemable preferred stocks with cumulative dividends.\nWe believe this asset allocation strategy allows us to appropriately assess the risks associated with these securities for capital purposes and is in line with the treatment by our regulators. Non-investment-grade fixed-maturity securities are determined by National Association of Insurance Commissioners (NAIC) and nationally recognized statistical rating organizations (NRSROs) as applicable. Our common equities portfolio is primarily indexed to the Russell 1000.\nSee Note 2 – Investments for a further breakdown of our portfolio.\nUnrealized Gains (Losses)\nAs of September 30, 2026, our fixed-maturity portfolio had a total after-tax net unrealized loss, which is recorded as part of accumulated other comprehensive income (loss) on our consolidated balance sheets, of $2,730 million, compared to a total after-tax net unrealized gain of $203 million and $117 million at September 30, 2025 and December 31, 2025, respectively. The decline from September 30, 2025 and December 31, 2025 was due to valuation decreases across fixed-maturity sectors as interest rates rose during 2026. Our U.S. government and corporate and other debt securities had the most significant valuation decrease from prior year and prior year end.\nSee Note 2 – Investments for a further breakdown of our gross unrealized gains (losses).\nFixed-Income Securities\nThe fixed-income portfolio is managed internally and includes fixed-maturity securities, short-term investments, and nonredeemable preferred stocks. Following are the primary exposures for our fixed-income portfolio.\nInterest Rate Risk Our duration of 3.6 years at September 30, 2026 and 3.4 years at both September 30, 2025 and December 31, 2025, fell within our acceptable range of 1.5 to 5.0 years. The duration distribution of our fixed-income portfolio, excluding short-term investments, represented by the interest rate sensitivity of the comparable benchmark U.S. Treasury Notes, was:\nDuration Distribution September 30, 2026 September 30, 2025 December 31, 2025\n1 year 10.6 % 10.8 % 11.8 %\n2 years 18.6 8.1 9.2\n3 years 21.5 30.5 19.5\n5 years 28.9 30.2 28.2\n7 years 13.2 19.9 19.4\n10 years 7.2 0.5 11.9\nTotal fixed-income portfolio 100.0 % 100.0 % 100.0 %\nCredit Risk This exposure is managed by maintaining an A minimum weighted average portfolio credit quality rating, as defined by NRSROs. At September 30, 2026 and 2025, and December 31, 2025, our weighted average credit quality rating was AA-. The credit quality distribution of the fixed-income portfolio was:\nAverage Rating1 September 30, 2026 September 30, 2025 December 31, 2025\nAAA 20.1 % 12.5 % 13.2 %\nAA 50.4 62.1 59.6\nA 8.9 8.1 8.8\nBBB 18.1 16.1 17.1\nNon-investment grade/non-rated\nBB 1.9 1.0 1.1\nB 0.4 0.1 0.1\nNon-rated 0.2 0.1 0.1\nTotal fixed-income portfolio 100.0 % 100.0 % 100.0 %\n1 The credit quality ratings are assigned by NRSROs.\n43"}]}, {"n": 24, "id": "FE-0149", "slice": "S2", "com TY $ 89,045 $ 77,099\nThe accompanying notes are an integral part of these consolidated financial statements.\n39"}, {"label": 18, "gold": false, "text": "Table of Contents\nItem 1B—Unresolved Staff Comments\nNone.\nItem 1C—Cybersecurity\nRisk Management and Global Strategy\nWe have implemented processes, technologies, and controls to seek to assess, identify, and manage risks associated with cybersecurity threats. Management considers cybersecurity risks within our overall approach to enterprise risk management. We evaluate these risks based on several frameworks, including the National Institute of Standards and Technology (NIST) Cybersecurity Framework (CSF), Center for Internet Security (CIS) 18 Critical Security Controls, and the Payment Card Industry Data Security Standard. Our governance policies, including our Information Security Policy, outline high-level objectives designed to meet compliance and regulatory requirements.\nWe undertake regular NIST CSF and CIS 18 Critical Security Controls assessments, conducted by a third-party, to measure program maturity. We have implemented a variety of technologies, leveraging third-party security providers for some, and engage in multiple activities to seek to identify and mitigate vulnerabilities and risks. These include, among other activities, scanning for common vulnerabilities and exposures, penetration tests on internal and external networks, code scans on applications, allowed application listing, configuration management tools, employee awareness and training, and internal and external audits. We also review with various frequencies and on a risk-based priority select third parties with whom we do business, in an effort to reduce the likelihood of security incidents or business interruptions. We maintain cybersecurity insurance that would apply to certain losses arising from significant security incidents.\nWe maintain a security operations center, supported by external providers and our employees, which provides threat detection and incident response capabilities. We maintain cyber incident response plans and related playbooks in coordination with stakeholders (including legal counsel). Significant incidents are prescribed to be escalated to a Cybersecurity Materiality Committee to assess materiality based on qualitative and quantitative factors and evaluate disclosure and corrective action. The Committee is composed of a cross-divisional group of executives representing the core business functions of Information Technology and Security, Operations, Administration, Finance and Accounting, and Legal. We conduct periodic tabletop exercises, including at the executive level, to review our response processes and incident management procedures.\nGovernance\nOur Board of Directors has delegated certain responsibilities to the Audit Committee of the Board. The Audit Committee reviews and discusses with management the identification and mitigation of cybersecurity risks, including (among other things) the effectiveness of risk-management policies and practices designed to help safeguard our operations, financial systems, and data. Our Chief Information and Digital Officer (CIDO) and his executive team, including the Vice President of Information Security and Chief Information Security Officer (CISO), present cybersecurity-related topics, including program maturity progress, regularly to the Audit Committee. The Internal Audit team, in its periodic compliance and risk assessment updates to the Audit Committee, also reports on its reviews of certain of our cybersecurity risk exposures, controls, and management actions. The full Board also receives cybersecurity evaluations from time to time.\n19"}, {"label": 39, "gold": false, "text": "Table of Contents\nCOSTCO WHOLESALE CORPORATION\nCONSOLIDATED STATEMENTS OF EQUITY\n(amounts in millions)\nCommon Stock Additional Paid-in Capital Accumulated Other Comprehensive Income (Loss) Retained Earnings Total Equity\nShares (000’s) Amount\ viously contractually required.\nNuclear Asset-Recovery Bonds\nDuke Energy Florida Project Finance, LLC (DEFPF) is a bankruptcy remote, wholly owned special purpose subsidiary of Duke Energy Florida. DEFPF was formed in 2016 for the sole purpose of issuing nuclear asset-recovery bonds to finance Duke Energy Florida's unrecovered regulatory asset related to Crystal River Unit 3.\nDEFPF issued senior secured bonds and used the proceeds to acquire nuclear asset-recovery property from Duke Energy Florida. The nuclear asset-recovery property acquired includes the right to impose, bill, collect and adjust a non-bypassable nuclear asset-recovery charge from all Duke Energy Florida retail customers until the bonds are paid in full and all financing costs have been recovered. The nuclear asset-recovery bonds are secured by the nuclear asset-recovery property and cash collections from the nuclear asset-recovery charges are the sole source of funds to satisfy the debt obligation. The bondholders have no recourse to Duke Energy Florida.\nDEFPF is considered a VIE primarily because the equity capitalization is insufficient to support its operations. Duke Energy Florida has the power to direct the significant activities of the VIE as described above and therefore Duke Energy Florida is considered the primary beneficiary and consolidates DEFPF.\nThe following table summarizes the impact of DEFPF on Duke Energy Florida's Condensed Consolidated Balance Sheets.\n(in millions) September 30, 2026 December 31, 2025\nRegulatory Assets: Current $ 63 $ 62\nCurrent Assets: Other 15 34\nOther Noncurrent Assets: Regulatory assets 632 682\nCurrent maturities of long-term debt 62 61\nLong-Term Debt 649 712\nStorm Recovery Bonds\nDuke Energy Carolinas NC Storm Funding, LLC (DECNCSF), Duke Energy Carolinas NC Storm Funding II, LLC (DECNCSFII), Duke Energy Carolinas SC Storm Funding, LLC (DECSCSF), Duke Energy Progress NC Storm Funding, LLC (DEPNCSF), Duke Energy Progress NC Storm Funding II, LLC idated financial statements.\nItem 3. Quantitative and Qualitative Disclosures about Market Risk.\nOur exposure to market risk results primarily from fluctuations in interest rates in connection with our long-term debt portfolio. We are also exposed to risks from foreign currency exchange rate fluctuations on the translation of our foreign operations into U.S. dollars and on the purchase of goods by these foreign operations that are not denominated in their local currencies. Additionally, we may experience inflation and deflation related to our purchase and sale of certain commodity products. During the first six months of fiscal 2026, there were no material changes to our market risks from those disclosed in the 2025 Form 10-K.\nItem 4. Controls and Procedures.\nUnder the direction and with the participation of our Principal Financial Officer and Interim Principal Executive Officer, we evaluated our disclosure controls and procedures (as defined in Rule 13a-15(e) under the Exchange Act) and concluded that our disclosure controls and procedures were effective as of August 2, 2026.\nWe are in the process of an ongoing business transformation initiative, which includes upgrading and migrating certain accounting and finance systems. We plan to continue to migrate additional business processes over the course of the next few years and have modified and will continue to modify the design and implementation of certain internal control processes as the transformation continues.\nExcept as described above, there were no other changes in our internal control over financial reporting during the fiscal quarter ended August 2, 2026 that have materially affected, or are reasonably likely to materially affect, our internal control over financial reporting.\nFiscal Q2 2026 Form 10-Q 22"}, {"label": 4, "gold": false, "text": "Table of Contents\nPART I – FINANCIAL INFORMATION\nItem 1. Financial Statements.\nTHE HOME DEPOT, INC.\nCONSOLIDATED BALANCE SHEETS\n(Unaudited)\nin millions, lion, respectively. The totals in both 2026 and 2025 reflected common share repurchases and dividends paid to shareholders, partially offset by the receipt of net proceeds from the issuance of debt and the net proceeds from employee stock option exercises. Common share repurchases in the first nine months of 2026 and 2025 were $4.74 billion and $1.49 billion, respectively. Net cash used in financing activities is the first nine months of 2026 also included the payment of debt.\nDividends. Dividends paid to shareholders were $759 million and $737 million in the first nine months of 2026 and 2025, respectively. The declaration and payment of future dividends to holders of the Company’s common stock will be at the discretion of the Company’s Board of Directors and will depend upon many factors, including the Company’s financial position, earnings, capital requirements of the Company’s operating subsidiaries, legal requirements, regulatory constraints and other factors as the Board of Directors deems relevant. Dividends will be paid by the Company only if declared by its Board of Directors out of funds legally available, subject to any other restrictions that may be applicable to the Company. On October 16, 2026, the Company declared a regular quarterly dividend of $1.25 per share, payable December 31, 2026 to shareholders of record on December 10, 2026.\nShare Repurchases. The Company’s Board of Directors has approved common share repurchase authorizations under which repurchases may be made from time to time in the open market, pursuant to pre-set trading plans meeting the requirements of Rule 10b5-1 under the Securities Exchange Act of 1934, as amended, in private transactions or otherwise. The authorizations do not have a stated expiration date. The Company expects that, generally over time, the combination of dividends to common shareholders and common share repurchases will likely not exceed net income. The Company also expects that in periods of growing premium volumes the amount of capital returned to shareholders relative to earnings would be somewhat less than it otherwise would have been absent the growth in premium volumes. The timing and actual number of shares to be repurchased in the future will depend on a variety of factors, including the Company’s financial position, earnings, share price, catastrophe losses, maintaining appropriate capital levels for business operations, changes in the levels of written premiums, funding of its qualified pension plan, regulatory capital requirements of the operating insurance subsidiaries, legal requirements, regulatory constraints, other investment opportunities (including mergers and acquisitions and related financings), market conditions, changes in tax laws and other factors. During the nine months ended September 30, 2026, the Company repurchased 14.3 million common shares under its share repurchase authorizations for a total cost of $4.60 billion. The average cost per share repurchased was $322.60. The cost of the treasury stock acquired pursuant to common share repurchases includes the 1% federal excise tax imposed on common share repurchase activity, net of common share issuances, as part of the Inflation Reduction Act of 2022. As of September 30, 2026, the Company had $2.42 billion of capacity remaining under its share repurchase authorizations. The most recent authorization was approved by the Board of Directors on January 21, 2026 and added $5.0 billion of repurchase capacity to the $2.02 billion capacity remaining at that date.\nCapital Resources. Capital resources reflect the overall financial strength of the Company and its ability to borrow funds at competitive rates and raise new capital to meet its needs. The following table summarizes the components of the Company’s capital structure as of September 30, 2026 and December 31, 2025.\n(in millions) September 30, 2026 December 31, 2025\nDebt:\nShort-term $ 100 $ 300\nLong-term 9,804 9,054\nNet unamortized fair valu isk, diversification and other prudent investment objectives.\nNonrecurring Fair Value Measurements – NEE tests its equity method investments for impairment whenever events or changes in circumstances indicate that the fair value of the investment is less than the carrying value. Indicators of impairment may include, among other things, an observable market price below NEE’s carrying value. Investments that are OTTI are written down to their estimated fair value on the reporting date and an impairment loss is recognized.\nNextEra Energy Resources owns a noncontrolling interest in XPLR, primarily through its limited partner interest in XPLR OpCo, and accounts for this ownership interest as an equity method investment. During the preparation of NEE's March 31, 2025 financial statements, it was determined that NextEra Energy Resources' investment in XPLR was OTTI as a result of a significant decline in trading price of XPLR's common units following XPLR's announcement of a strategic repositioning, including suspension of the distribution to common unitholders for an indefinite period. The impairment reflected NEE's fair value analysis using the market approach and the observable trading price of XPLR's common units at March 31, 2025 of $9.50. When making the OTTI determination, NEE considered, among other things, the extent to which the publicly traded unit price was less than cost. Based on the fair value analysis, the equity method investment with a carrying amount of approximately $1.7 billion was written down to its estimated fair value of $1.0 billion, resulting in an impairment charge of $0.7 billion ($0.5 billion after tax), which is reflected in equity in earnings (losses) of equity method investees in NEE’s condensed consolidated statements of income for the nine months ended September 30, 2025. Should NEE determine, based on future analysis which includes the current and future trading prices of XPLR's common units, that an additional impairment is other-than-temporary, an impairment loss would be recorded, which would impact NEE's condensed consolidated statements of income.\n4. Income Taxes\nNEE's effective income tax rate is based on the composition of pretax income or loss. A reconciliation of the income tax expense (benefit) and effective income tax rates based on the statutory U.S. federal income tax rate is as follows:\nNEE\nThree Months Ended September 30, Nine Months Ended September 30,\n2026 2025 2026 2025\n(millions, except for percentages)\nIncome taxes at U.S. statutory rate of 21% $ 1,056 21.0 % $ 396 21.0 % $ 1,841 21.0 % $ 674 21.0 %\nIncreases (reductions) resulting from:\nState income taxes – net of federal income tax benefit 227 4.5 71 3.7 318 3.6 134 4.2\nNontaxable or nondeductible items:\nTaxes attributable to noncontrolling interests 86 1.7 64 3.4 299 3.4 223 6.9\nAmortization of deferred regulatory credit (16) (0.3) (43) (2.3) (52) (0.6) (126) (3.9)\nOther – net — — 7 0.4 (27) (0.3) (11) (0.3)\nClean energy tax credits(a) (668) (13.3) (734) (38.9) (2,287) (26.1) (1,922) (59.9)\nValuation adjustments 47 0.9 31 1.7 109 1.2 82 2.5\nOther adjustments – net (70) (1.3) (42) (2.3) (112) (1.2) (81) (2.5)\nIncome tax expense (benefit) and effective tax rate $ 662 13.2 % $ (250) (13.3) % $ 89 1.0 % $ (1,027) (32.0) %\n______________________\n(a)For the three and nine months ended September 30, 2026, includes the impact from ITC amortization utilized as part of FPL's RSM. See Note 11 – Rate Regulation.\n30"}, {"label": 7, "gold": false, "text": "PART I – FINANCIAL INFORMATION\nItem 1. Financial Statements\nNEXTERA ENERGY, INC.\nCONDENSED CONSOLIDATED STATEMENTS OF INCOME\n(millions, except per share amounts)\n(unaudited)\nThree Months Ended September 30, Nine Months Ended September 30,\n2026 2025 2026 2025\nOPERATING REVENUES $ 8,090 $ 7,966 $ 22,325 $ 20,912\nOPERATING EXPENSES\nFuel, purchased power and interchange 1,699 1,423 4,402 3,771\nOther operations and maintenance 1,428 1,410 4,309 3,803\nMerger-r
