hted average shares outstanding 1,288.1 1,289.9 1,330.2\nBasic earnings per share $ 3.75 $ 3.63 $ 2.77\nDiluted earnings per share $ 3.73 $ 3.61 $ 2.76\nThe calculation of weighted average diluted shares outstanding excludes stock options, restricted stock units, and performance share units of approximately 17 million, 26 million, and 28 million ordinary shares in fiscal years 2026, 2025, and 2024, respectively because their effect would have been anti-dilutive on the Company’s earnings per share.\n15. Retirement Benefit Plans\nThe Company sponsors various retirement benefit plans, including defined benefit pension plans, post-retirement medical plans, defined contribution savings plans, and termination indemnity plans, covering substantially all U.S. employees and many employees outside the U.S. The net expense related to these plans was $469 million, $466 million, and $451 million in fiscal years 2026, 2025, and 2024, respectively.\nIn the U.S., the Company maintains qualified pension plans designed to provide guaranteed minimum retirement benefits to all eligible U.S. participants. Pension coverage for non-U.S. employees is provided, to the extent deemed appropriate, through separate plans. In addition to the benefits provided under the qualified pension plan, retirement benefits associated with wages in excess of the IRS allowable limits are provided to certain employees under a non-qualified plan. U.S. and Puerto Rico employees are also eligible to receive a medical benefit component, in addition to normal retirement benefits, through the Company’s post-retirement benefits.\nAt April 24, 2026 and April 25, 2025, the funded status of the Company’s benefit plans was $724 million overfunded and $440 million overfunded, respectively.\n97"}, {"label": 103, "gold": false, "text": "Table of Contents\nMedtronic plc\nNotes to Consolidated Financial Statements (Continued)\nThe Company’s U.S. plans target asset allocations at April 24, 2026, compared to the U.S. plans actual asset allocations at April 24, 2026 and April 25, 2025 by asset category, are as follows:\nU.S. Plans Target Allocation Actual Allocation\nApril 24, 2026 April 24, 2026 April 25, 2025\nAsset Category:\nEquity securities 34 % 43 % 39 %\nDebt securities 51 34 40\nOther 15 23 21\nTotal 100 % 100 % 100 %\nStrong performance on equity securities during the fiscal year resulted in asset allocations different than targets. Management expects to move the allocations closer to target over the intermediate term.\nRetirement Benefit Plan Asset Fair Values The following is a description of the valuation methodologies used for retirement benefit plan assets measured at fair value:\nShort-term investments: Short-term investments include money market funds. These investments are valued at the closing price reported in the active markets in which the individual security is traded.\nMutual funds: Comprised of investments in equity and fixed income securities held in pooled investment vehicles. The valuations of mutual funds are based on the respective net asset values which are determined by the fund daily at market close. The net asset values are calculated based on the valuation of the underlying assets which are determined using observable inputs. The net asset values are publicly reported.\nEquity commingled trusts: Comprised of investments in equity securities held in pooled investment vehicles. The valuations of equity commingled trusts are based on the respective net asset values which are determined by the fund daily at market close. The net asset values are calculated based on the valuation of the underlying assets which are determined using observable inputs. The net asset values are not publicly reported, and funds are valued at the net asset value practical expedient.\nFixed income commingled trusts: Comprised of investments in fixed income securities held in pooled investment vehicles. The valuations of fixed income commingled trusts are based on the respective net asset values which are determined by the fund, either daily or monthly depending on the investment, at market close. The net asset values are reported by the investment manager based on the valuation of the underlying assets held by the fund, less its liabilities. The net asset values are not publicly reported, and funds are valued at the net asset value practical expedient.\nPartnership units: Partnership units include investment partnerships that provide exposure to long/short equity, absolute return strategies, private equity investments, and real estate investments. The net asset values are reported by the investment manager based on the valuation of the underlying assets held by the partnerships, less its liabilities. The net asset values are not publicly reported, and funds are valued at the net asset value practical expedient.\nRegistered investment companies: Valued at net asset values which are not publicly reported. The net asset values are calculated based on the valuation of the underlying assets. The underlying assets are valued at the quoted market prices of shares held by the plan at year-end in the active market on which the individual securities are traded.\nInsurance contracts: Comprised of investments in collective (group) insurance contracts, consisting of individual insurance policies. The policyholder is the employer, and each member is the owner/beneficiary of their individual insurance policy. These policies are a part of the insurance company’s general portfolio and participate in the insurer’s profit-sharing policy on an excess yield basis.\nMeasurement using net asset value as a practical expedient is not used when it is determined to be probable that the fund will sell the investment for an amount different than the reported net asset value.\nThe methods described above may produce fair values that may not be indicative of net realizable value or reflective of future fair values. Furthermore, while the Company believes its valuation methodologies are appropriate and consistent with other market participants, the use of different methodologies or assumptions to determine fair value of certain financial instruments could result in a different fair value measurement at the reporting date.\n101"}, {"label": 100, "gold": false, "text": "Table of Contents\nMedtronic plc\nNotes to Consolidated Financial Statements (Continued)\nDefined Benefit Pension Plans The change in benefit obligation and funded status of the Company’s U.S. and Non-U.S. pension benefits are as follows:\nU.S. Pension Benefits(1) Non-U.S. Pension Benefits\nFiscal Year Fiscal Year\n(in millions) 2026 2025 2026 2025\nAccumulated benefit obligation at end of year: $ 3,302 $ 3,235 $ 1,677 $ 1,685\nChange in projected benefit obligation:\nProjected benefit obligation at beginning of year $ 3,269 $ 3,194 $ 1,797 $ 1,604\nService cost 50 52 49 43\nInterest cost 167 174 54 52\nEmployee contributions — — 11 10\nPlan curtailments, settlements, and amendments — — (52) (2)\nActuarial loss (gain)(2) 24 22 (22) 21\nBenefits paid (186) (173) (41) (59)\nCurrency exchange rate changes and other — — 5 129\nProjected benefit obligation at end of year $ 3,324 $ 3,269 $ 1,801 $ 1,797\nChange in plan assets:\nFair value of plan assets at beginning of year $ 3,610 $ 3,551 $ 1,823 $ 1,659\nActual return on plan assets 483 200 11 34\nEmployer contributions 30 31 48 45\nEmployee contributions — — 11 10\nPlan settlements — — (46) (2)\nBenefits paid (186) (173) (41) (59)\nCurrency exchange rate changes and other — — 15 138\nFair value of plan assets at end of year $ 3,937 $ 3,610 $ 1,821 $ 1,823\nFunded status at end of year:\nFair value of plan assets $ 3,937 $ 3,610 $ 1,821 $ 1,823\nBenefit obligations 3,324 3,269 1,801 1,797\nOver funded status of the plans 613 341 20 27\nRecognized asset $ 613 $ 341 $ 20 $ 27\nAmounts recognized on the consolidated balance sheets consist of:\nNon-current assets $ 847 $ 591 $ 318 $ 322\nCurrent liabilities (29) (29) (8) (7)\nNon 100,434 98,258\nOperating income 20,672 23,297 23,314\nInterest expense (4,409) (4,134) (4,087)\nInvestment and other income (loss), net 9,503 (490) 1,252\nIncome before income taxes 25,766 18,673 20,478\nIncome tax expense (6,106) (2,796) (5,371)\nNet income 19,660 15,877 15,107\nLess: Net income (loss) attributable to noncontrolling interests (338) (315) (282)\nNet income attributable to Comcast Corporation $ 19,998 $ 16,192 $ 15,388\nBasic earnings per common share attributable to Comcast Corporation shareholders $ 5.41 $ 4.17 $ 3.73\nDiluted earnings per common share attributable to Comcast Corporation shareholders $ 5.39 $ 4.14 $ 3.71\nSee accompanying notes to consolidated financial statements.\nComcast 2025 Annual Report on Form 10-K 62"}, {"label": 91, "gold": false, "text": "Table of Contents\nComcast Corporation\nShares of Common Stock Outstanding\n(in millions) Class A Class B\nBalance, December 31, 2022 4,211 9\nStock compensation plans 14 —\nRepurchases and retirements of common stock (262) —\nEmployee stock purchase plans 7 —\nBalance, December 31, 2023 3,969 9\nStock compensation plans 14 —\nRepurchases and retirements of common stock (212) —\nEmployee stock purchase plans 6 —\nBalance, December 31, 2024 3,778 9\nStock compensation plans 14 —\nRepurchases and retirements of common stock (205) —\nEmployee stock purchase plans 8 —\nBalance, December 31, 2025 3,595 9\nWeighted-Average Common Shares Outstanding\nYear ended December 31 (in millions) 2025 2024 2023\nWeighted-average number of common shares outstanding – basic 3,699 3,885 4,122\nEffect of dilutive securities 10 24 25\nWeighted-average number of common shares outstanding – diluted 3,709 3,908 4,148\nAntidilutive securities 237 184 169\nWeighted-average common shares outstanding used in calculating diluted earnings per common share attributable to Comcast Corporation shareholders (“diluted EPS”) considers the impact of potentially dilutive securities using the treasury stock method. Our potentially dilutive securities include potential common shares related to our stock options and our restricted share units (“RSUs”). Diluted EPS excludes the impact of potential common shares related to our stock options in periods in which the combination of the option exercise price and the associated unrecognized compensation expense is greater than the average market price of our common stock. Antidilutive securities represent the number of potential common shares related to share-based compensation awards that were excluded from diluted EPS because their effect would have been antidilutive.\nTreasury Stock\nOn December 15, 2025, we amended our Amended and Restated Articles of Incorporation (the “Articles”) in connection with the Separation of Versant by designating a new Class A Equivalent Preferred Stock (the “Preferred Stock”) and entering into an agreement with certain of our wholly-owned subsidiaries pursuant to which we issued 872,791.0278 shares of Preferred Stock, which was classified as treasury stock, in exchange for an aggregate 872,791,028 shares of Class A Common Stock held by such subsidiaries. This exchange was designed to ensure that our subsidiaries did not receive shares of Versant Class A Common stock in connection with the Separation. On January 9, 2026, all of the shares of Preferred Stock were automatically redeemed in exchange for 919,026,355 shares of our Class A Common Stock and no Preferred Stock is currently outstanding. On January 30, 2026, we amended the Articles to eliminate the provisions that had designated the Preferred Stock. As a result, the 872,791.0278 shares of Preferred Stock held as of December 31, 2025 are presented on a post-Separation basis as 919,026,355 shares of Class A Common Stock and classified as treasury stock in all periods presented in our consolidated balance sheets.\nAccumulated Other Comprehensive Income (Loss)\nDecember 31 (in millions) 2025 2024\nCumulative translation adjustments $ (247) $ (2,474)\nDeferred gains (losses) on cash flow hedges 44 106\nUnrecognized gains (losses) on employee benefit obligations and other 195 325\nAccumulated other comprehensive income (loss), net of deferred taxes $ (8) $ (2,043)\n89 Comcast 2025 Annual Report on Form 10-K"}, {"label": 65, "gold": false, "text": "Table of Contents\nComcast Corporation\nConsolidated Statements of Comprehensive Income\nYear ended December 31 (in millions) 2025 2024 2023\nNet income $ 19,660 $ 15,877 $ 15,107\nOther comprehensive income (loss), net of tax (expense) benefit:\nCurrency translation adjustments, net of deferred taxes of $208, $(137) and $(29) 2,236 (895) 1,478\nCash flow hedges:\nDeferred gains (losses), net of deferred taxes of $(14), $(4) and $8 (7) 57 16\nRealized (gains) losses reclassified to net income, net of deferred taxes of $15, $(1) and $38 (55) (1) (158)\nEmployee benefit obligations and other, net of deferred taxes of $36, $(9) and $(2) (129) 31 3\nOther comprehensive income (loss) 2,044 (807) 1,338\nComprehensive income (loss) 21,704 15,070 16,445\nLess: Net income (loss) attributable to noncontrolling interests (338) (315) (282)\nLess: Other comprehensive income (loss) attributable to noncontrolling interests 9 (17) (19)\nComprehensive income attributable to Comcast Corporation $ 22,033 $ 15,402 $ 16,746\nSee accompanying notes to consolidated financial statements.\n63 Comcast 2025 Annual Report on Form 10-K"}]}, {"n": 82, "id": "FE-0803", "slice": "S7", "company": "Lockheed Martin Corporation", "form": "10-K", "question": "What was Lockheed Martin Corporation's weighted average dilutive effect of equity awards (number of shares) for the fiscal year ended December 31, 2023?", "found": true, "display": "0.9", "scale": "millions", "unit": "shares", "period": "2023-01-01 to 2023-12-31", "dims": {}, "line": "Weighted average dilutive effect of equity awards 0.8 0.9 0.9", "url": "https://www.sec.gov/Archives/edgar/data/936468/000162828026004195/lmt-20251231.htm", "pages": [{"label": 66, "gold": true, "text": "Table of Contents\nNote 2 – Earnings Per Share\nThe weighted average number of shares outstanding used to compute earnings per common share were as follows (in millions):\n2025 2024 2023\nWeighted average common shares outstanding for basic computations 232.7 238.3 250.3\nWeighted average dilutive effect of equity awards 0.8 0.9 0.9\nWeighted average common shares outstanding for diluted computations 233.5 239.2 251.2\nWe compute basic and diluted earnings per common share by dividing net earnings by the respective weighted average number of common shares outstanding for the periods presented. Our calculation of diluted earnings per common share also includes the dilutive effects for the assumed vesting of outstanding restricted stock units (RSUs) and performance stock units (PSUs) based on the treasury stock method. There were no significant anti-dilutive equity awards for the years ended December 31, 2025, 2024 and 2023. Basic and diluted weighted average common shares outstanding decreased in 2025 compared to 2024 due to share repurchases.\nNote 3 – Information on Business Segments\nOverview\nWe operate in four business segments: Aeronautics, MFC, RMS and Space. We organize our business segments based on the nature of products and services offered. Following is a brief description of the activities of our business segments:\n•Aeronautics – Engaged in the research, design, development, manufacture, integration, sustainment, support and upgrade of advanced military aircraft, including combat and air mobility aircraft, unmanned air vehicles and related technologies.\n•Missiles and Fire Control – Provides air and missile defense systems; tactical missiles and precision strike weapon systems; logistics; fire control systems; and mission operations support, readiness, engineering support and integration services.\n•Rotary and Mission Systems – Designs, manufactures, services and supports various military and commercial helicopters, sea- and land-based missile defense systems, radar systems, laser systems, sea- and air-based mission and combat systems, command and control mission solutions, cyber solutions, simulation and training solutions, and services and supports surface ships.\n•Space – Engaged in the research and design, development, engineering and production of satellites, space transportation systems, and strategic, advanced strike, and defensive systems. Space provides network-enabled situational awareness and integrates complex space and ground global systems to help our customers gather, analyze and securely distribute critical intelligence data. Space is also responsible for various classified systems and services in support of vital national security systems. Operating profit for our Space business segment also includes our share of earnings for our 50% ownership interest in ULA, which provides expendable launch services to the U.S. Government and commercial customers. Our investment in ULA totaled $551 million at both December 31, 2025 and 2024.\n67"}, {"label": 4, "gold": false, "text": "Table of Contents\n•Training, logistics and simulation (TLS) programs such as those providing sustainment services and programs that provide simulators and associated training to U.S. military and foreign government customers.\nEffective January 2026, the IWSS and C6ISR lines of business within RMS were restructured and renamed Sensors, Effectors & Mission Systems (SEMS) and Mission Integrated Command and Control (MIC2). This includes realignment of various programs, such as Aegis and RCD moving from what was historically IWSS to MIC2, which more closely aligns with C6ISR. SEMS and MIC2 will therefore incorporate an updated mix of existing program portfolios designed to accelerate mission‑focused solutions and enhance our customers’ experience.\nSpace\nSpace is engaged in the research and design, development, engineering and production of satellites, space transportation systems, and strategic, advanced strike, and defensive systems. Space provides network-enabled situational awareness and integrates complex space and ground global systems to help our customers gather, analyze and securely distribute critical intelligence data. Space is also responsible for various classified systems and services in support of vital national security systems. Space’s major programs include:\n•The Trident II D5 Fleet Ballistic Missile (FBM), a program with the U.S. Navy for the only submarine-launched intercontinental ballistic missile currently in production in the U.S.\n•The Next Generation Overhead Persistent Infrared (Next Gen OPIR) system, which provides the U.S. Space Force with enhanced worldwide missile warning capabilities.\n•Next Generation Interceptor (NGI), a program with the Missile Defense Agency (MDA) utilizing next generation propulsion and sensors to provide homeland missile defense.\n•The Orion Multi-Purpose Crew Vehicle (Orion), NASA’s next generation exploration-class crewed vehicle for human exploration to the Moon and throughout the solar system.\n•Global Positioning System (GPS) III, a program to modernize the GPS satellite system for the U.S. Space Force.\n•Hypersonics programs, which include several programs with the U.S. Army and U.S. Navy to design, develop and build hypersonic strike weapons.\n•The Transport and Tracking Layer programs, multiple tranches of small satellites to support the proliferated space architecture, with constellations of missile warning and communications satellites for the Space Development Agency.\nIntellectual Property\nWe routinely apply for and own a substantial number of U.S. and foreign patents and trademarks related to the products and services we provide. We also develop and own other intellectual property, including copyrights, trade secrets and research, development and engineering know-how, that contributes significantly to our business. In addition, we license intellectual property to and from third parties. The Federal Acquisition Regulation (FAR) and Defense Federal Acquisition Regulation Supplement (DFARS) provide the U.S. Government certain rights in intellectual property, including patents, developed by us and our subcontractors and suppliers in performance of government contracts or with government funding. The U.S. Government may use or authorize others, including competitors, to use such intellectual property. See the discussion of matters related to our intellectual property in Item 1A - Risk Factors. Non-U.S. governments also may have certain rights in patents and other intellectual property developed in performance of our contracts for them. Although our intellectual property rights in the aggregate are important to the operation of our business, we do not believe that any existing patent, license or other intellectual property right is of such importance that its loss or termination would have a material adverse effect on our business taken as a whole.\nResearch and Development\nWe conduct research and development (R&D) activities using our own funds (referred to as company-funded or independent R&D (IR&D)) and under contractual arrangements with our customers (referred to as customer-funded R&D) to enhance existing products and services and to develop future technologies. R&D costs include basic research, applied research, concept formulation studies, design, development, and related test activities. See “Note 1 – Organization and Significant Accounting Policies” (under the caption “Research and development and similar costs”) included in our Notes to Consolidated Financial Statements.\nRaw Materials, Suppliers and Seasonality\nSome of our products require relatively scarce raw materials, such as rare earth minerals. Other important materials and components, on which certain of our products rely, include aluminum, titanium, specialty steel, carbon fiber and advanced microelectronics, such as semiconductors. We rely on other companies to provide materials, components and products and to\n5"}, {"label": 65, "gold": false, "text": "Table of Contents\nof products and services to agencies of the U.S. Government, regardless of the contract form (e.g., cost-reimbursable, fixed-price). We continually evaluate the recoverability of our assets for the portion of environmental costs that are probable of future recovery by assessing, among other factors, U.S. Government regulations, our U.S. Government business base and contract mix, our history of receiving reimbursement of such costs, and efforts by some U.S. Government representatives to limit such reimbursement. We include the portions of those environmental costs expected to be allocated to our non-U.S. government contracts, or determined not to be recoverable under U.S. Government contracts, in our operating costs at the time the liability is established or adjusted. Our assets for the portion of environmental costs that are probable of future recovery are recorded on our consolidated balance sheets within other assets, both current and noncurrent. We project costs and recovery of costs over approximately 20 years.\nDerivative financial instruments – Derivatives are recorded at their fair value and included in other current and noncurrent assets and liabilities on our consolidated balance sheets. The classification of gains and losses resulting from changes in the fair values of derivatives is dependent on our intended use of the derivative and its resulting designation. Adjustments to reflect changes in fair values of derivatives attributable to highly effective hedges are either reflected in earnings and largely offset by corresponding adjustments to the hedged items or reflected net of income taxes in accumulated other comprehensive loss until the hedged transaction is recognized in earnings. Changes in the fair value of the derivatives that are not highly effective, if any, are immediately recognized in earnings.\nRecent Accounting Pronouncements\nIn December 2025, the Financial Accounting Standards Board (FASB) issued Accounting Standards Update (ASU) No. 2025-10, Government Grants (Topic 832): Accounting for Government Grants Received by Business Entities. The ASU establishes guidance for the recognition, measurement, and presentation of government grants received by business entities. Under the new standard, a government grant is recognized only when it is probable that (i) the entity will satisfy the grant’s conditions and (ii) the grant will be received. If those conditions are met, the grant is classified either as a grant related to income or as a grant related to an asset, and the classification determines the appropriate accounting treatment. ASU No. 2025-10 retains the existing disclosure requirements in FASB Accounting Standards Codification (ASC) Topic 832, Government Assistance. For public business entities, the amendments are effective for annual reporting periods beginning after December 15, 2028, and for interim reporting periods within those annual reporting periods, with early adoption permitted. Entities may adopt the amendments using a modified-prospective, modified-retrospective, or full-retrospective approach for all government grants. We are currently evaluating the impact of the ASU on our disclosures and financial statements, including the approach and the timing of adoption.\nIn September 2025, the FASB issued ASU No. 2025-06, Intangibles – Goodwill and Other – Internal-Use Software (Subtopic 350-40): Targeted Improvements to the Accounting for Internal-Use Software. This guidance removes all references to project stages throughout ASC 350-40 and clarifies the threshold entities apply to begin capitalizing costs. Under the new standard, cost capitalization should only commence when an entity has committed to funding a software project and it is probable the project will be completed and the software will be used for its intended function. The amendments are effective for annual reporting periods beginning after December 15, 2027 and interim reporting periods within those annual reporting periods. Entities may apply the guidance using a prospective, retrospective or modified transition approach. Early adoption is permitted as of the beginning of an annual reporting period. We are currently determining the preferred transition approach and assessing the impact of the ASU on our disclosures and financial statements, including the timing of its adoption.\nIn November 2024, the FASB issued ASU No. 2024-03, Income Statement – Reporting Comprehensive Income – Expense Disaggregation Disclosures (Subtopic 220-40): Disaggregation of Income Statement Expenses. The ASU requires entities to disclose certain expenses, including purchases of inventory, employee compensation, depreciation, and intangible asset amortization, by caption. In addition, entities must provide a qualitative description of the amounts remaining in relevant expense captions that are not separately disaggregated quantitatively. The amendments are effective for annual reporting periods beginning after December 15, 2026, and for interim reporting periods beginning after December 15, 2027, with early adoption permitted. The ASU will affect only our disclosures and will not impact our results of operations or financial condition. We are currently evaluating the timing of its adoption.\nIn December 2023, the FASB issued ASU No. 2023-09, Income Taxes (Topic 740): Improvements to Income Tax Disclosures, which focuses on the rate reconciliation and income taxes paid. ASU No. 2023-09 requires public business entities to disclose, on an annual basis, specific categories in the effective tax rate reconciliation and provide additional information for reconciling items that meet a quantitative threshold. In addition, ASU No. 2023-09 requires companies to disclose further information about income taxes paid. The standard is effective for annual periods beginning after December 15, 2024, and may be applied prospectively or retrospectively. We adopted the ASU prospectively for the period ending December 31, 2025, and it affects only our disclosures and does not impact our results of operations or financial condition.\n66"}]}, {"n": 83, "id": "FE-0832", "slice": "S7", "company": "PepsiCo, Inc.", "form": "10-K", "question": "What was PepsiCo, Inc.'s total number of options granted (number of shares) for the fiscal year ended December 27, 2025?", "found": true, "display": "1,804", "scale": "thousands", "unit": "shares", "period": "2024-12-29 to 2025-12-27", "dims": {}, "line": "Total number of options granted (a) 1,804 2,034 2,162", "url": "https://www.sec.gov/Archives/edgar/data/77476/000007747626000007/pep-20251227.htm", "pages": [{"label": 85, "gold": true, "text": "Table of Contents\nOther Share-Based Compensation Data\nThe following is a summary of other share-based compensation data:\n2025 2024 2023\nStock Options\nTotal number of options granted (a) 1,804 2,034 2,162\nWeighted-average grant-date fair value per unit of options granted $ 21.13 $ 27.29 $ 29.81\nTotal intrinsic value of options exercised (a) $ 35,558 $ 99,388 $ 100,209\nTotal grant-date fair value of options vested (a) $ 32,506 $ 14,759 $ 11,830\nRSUs/PSUs\nTotal number of RSUs/PSUs granted (a) 2,199 2,348 2,151\nWeighted-average grant-date fair value per unit of RSUs/PSUs granted $ 153.22 $ 164.25 $ 171.11\nTotal intrinsic value of RSUs/PSUs converted (a) $ 299,958 $ 372,612 $ 396,123\nTotal grant-date fair value of RSUs/PSUs vested (a) $ 300,591 $ 280,673 $ 286,605\n(a)In thousands.\nAs of December 27, 2025 and December 28, 2024, there were approximately 341,000 and 311,000 outstanding awards, respectively, consisting primarily of phantom stock units that were granted under the PepsiCo Director Deferral Program and will be settled in shares of PepsiCo common stock pursuant to the LTIP at the end of the applicable deferral period, not included in the tables above.\nNote 7 — Pension, Retiree Medical and Savings Plans\nIn 2025 and 2024, we recognized pre-tax settlement charges of $237 million ($183 million after-tax or $0.13 per share) and $213 million ($165 million after-tax or $0.12 per share), respectively, in a U.S. qualified defined benefit pension plan due to lump sum distributions to retired or terminated employees and the purchases of group annuity contracts whereby a third-party insurance company assumed the obligation to pay and administer future benefit payments for certain retirees. The settlement charges were triggered when the aggregate of the cumulative lump sum distributions and the annuity contract premiums exceeded the total annual service and interest cost.\nAs of December 31, 2025, benefit accruals for salaried participants in the U.S. qualified defined benefit plans were frozen.\nGains and losses resulting from actual experience differing from our assumptions, including the difference between the actual and expected return on plan assets, as well as changes in our assumptions, are determined at each measurement date. These differences are recognized as a component of net gain or loss in accumulated other comprehensive loss within common shareholders’ equity. If this net accumulated gain or loss exceeds 10% of the greater of the market-related value of plan assets or plan obligations, a portion of the net gain or loss is included in other pension and retiree medical benefits (expense)/income for the following year based upon the average remaining service life for participants in PepsiCo Employees Retirement Hourly Plan (Plan H) (approximately 10 years) and retiree medical (approximately 12 years), and the remaining life expectancy for participants in PepsiCo Employees Retirement Plan I (Plan I) (approximately 26 years).\nThe cost or benefit of plan changes that increase or decrease benefits for prior employee service (prior service cost/(credit)) is included in other pension and retiree medical benefits (expense)/income on a straight-line basis over the average remaining service life for participants in Plan H, and the remaining life expectancy for participants in Plan I, except that prior service cost/(credit) for salaried participants subject to the benefit accruals freeze effective December 31, 2025 was amortized on a straight-line basis over the period up to the effective date of the freeze.\n85"}, {"label": 19, "gold": false, "text": "Table of Contents\nOur reliance on third-party service providers and enterprise-wide systems can have an adverse effect on our business.\nWe rely on third-party service providers, including software and cloud data service providers, for certain areas of our business, including procurement, supply chain, manufacturing, distribution, information technology support services and administrative functions (such as payroll processing, health and benefit plan administration and certain finance and accounting functions). Failure by these third parties to meet their contractual, regulatory and other obligations to us, or our failure to adequately monitor their performance, has in the past and could continue to result in our inability to achieve the expected cost savings or efficiencies and result in additional costs to correct errors made by such service providers. Depending on the function involved, such errors can also lead to business disruption, systems performance degradation, processing inefficiencies or other systems disruptions, the loss of or damage to intellectual property or sensitive data through security breaches or otherwise, incorrect or adverse effects on financial reporting, litigation, claims, legal or regulatory proceedings, inquiries or investigations, fines or penalties, remediation costs, damage to our reputation or have a negative impact on employee morale, all of which can adversely affect our business.\nIn addition, we continue on our multi-year phased business transformation initiative to migrate certain aspects of our systems, including our financial processing systems, to enterprise-wide systems solutions and have deployed these systems in certain countries and segments. We have experienced and could continue to experience systems outages and operating inefficiencies following these planned implementations. In addition, if we do not allocate and effectively manage the resources necessary to build and sustain the proper information technology infrastructure, or if we fail to achieve the expected benefits from this initiative, our business could be adversely affected.\nClimate change or measures to address climate change and other sustainability matters can negatively affect our business or damage our reputation.\nClimate change may increase the frequency or severity of natural disasters and other extreme weather conditions, including rising temperatures and drought. Natural disasters and extreme weather conditions could pose physical risks to our facilities, impair our production capabilities, disrupt our supply chain or impact demand for our products. In addition, climate change or other weather-related disruptions to our supply chain may also have a negative effect on agricultural production resulting in decreased availability or less favorable pricing for certain commodities that are necessary for our products, such as potatoes, sugar cane, corn, wheat, rice, oats, oranges and other commodities. Also, there is continued focus in many jurisdictions in which our products are made, manufactured, distributed or sold regarding environmental policies relating to climate change, biodiversity loss, deforestation, regulating greenhouse gas emissions, energy policies and sustainability, including single-use plastics. This increased focus may result in new or increased legal and regulatory requirements, such as potential carbon pricing programs or revised product labeling requirements or other regulatory measures, which could, along with initiatives to meet our sustainability goals, continue to result in significant increased costs and require additional investments in facilities and equipment. As a result, the effects of climate change can negatively affect our business and operations.\nIn addition, there can be no assurance that we will achieve our sustainability goals, which will require significant effort and resources from us and other stakeholders, such as our suppliers and other third parties, governmental entities, and the development of technology that may not currently exist or exist at scale. Further, developing and collecting, measuring and reporting sustainability information and metrics can be costly, difficult and time consuming and is subject to changing interpretive guidance and evolving reporting standards, including the European Sustainability Reporting Standards and Corporate Sustainability Reporting Directive in the European Union, especially to the extent these standards are not harmonized or consistent. Further, methodologies for reporting our data may be updated and previously\n19"}, {"label": 86, "gold": false, "text": "Table of Contents\nSelected financial information for our pension and retiree medical plans is as follows:\nPension Retiree Medical\nU.S. International\n2025 2024 2025 2024 2025 2024\nChange in projected benefit obligation\nObligation at beginning of year $ 11,324 $ 12,035 $ 2,786 $ 2,986 $ 616 $ 677\nService cost 312 347 47 46 31 31\nInterest cost 586 585 152 144 30 32\nPlan amendments 10 12 1 1 — —\nParticipant contributions — — 2 2 — —\nExperience loss/(gain) 247 (563) (74) (55) 18 (44)\nBenefit payments (640) (617) (112) (108) (74) (78)\nSettlement/curtailment (678) (506) (109) (62) — —\nSpecial termination benefits 21 31 — — — 1\nOther, including foreign currency adjustment — — 234 (168) 2 (3)\nObligation at end of year 11,182 11,324 2,927 2,786 623 616\nChange in fair value of plan assets\nFair value at beginning of year 10,609 11,541 3,397 3,528 163 183\nActual return on plan assets 1,296 (10) 149 142 15 5\nEmployer contributions/funding 354 236 67 59 51 53\nPartici of Exact Sciences’ debt, nearly all of which was repaid.\nOn September 27, 2026, Abbott repaid the €1.14 billion outstanding principal amount on its 1.500% Notes upon maturity. The repayment equated to approximately $1.3 billion. On September 15, 2025, Abbott repaid the $500 million outstanding principal amount of its 3.875% Notes upon maturity. On March 17, 2025, Abbott repaid the $1.0 billion outstanding principal amount of its 2.95% Notes upon maturity.\nNote 11 — Financial Instruments, Derivatives and Fair Value Measures\nCertain Abbott foreign subsidiaries enter into foreign currency forward exchange contracts to manage exposures to changes in foreign exchange rates, primarily for anticipated intercompany purchases by those subsidiaries whose functional currencies are not the U.S. dollar. These contracts, with gross notional amounts totaling $8.2 billion at September 30, 2026, and $7.4 billion at December 31, 2025, are designated as cash flow hedges of the variability of the cash flows due to changes in foreign exchange rates and are recorded at fair value. Accumulated gains and losses as of September 30, 2026, will be included in Cost of products sold at the time the products are sold, generally through the next twelve to eighteen months.\nAbbott enters into foreign currency forward exchange contracts to manage currency exposures for foreign currency denominated third-party trade payables and receivables, and for intercompany loans and trade accounts payable where the receivable or payable is denominated in a currency other than the functional currency of the entity. For intercompany loans, the contracts require Abbott to sell or buy foreign currencies, primarily European currencies, in exchange for primarily U.S. dollars and other European currencies. For intercompany and trade payables and receivables, the currency exposures are primarily the U.S. dollar and European currencies. At September 30, 2026, and December 31, 2025, Abbott held gross notional amounts of $12.8 billion and $13.1 billion, respectively, of such foreign currency forward exchange contracts.\nAbbott has designated a yen-denominated, 5-year term loan of $584 million and $589 million as of September 30, 2026, and December 31, 2025, respectively, as a hedge of the net investment in certain foreign subsidiaries. The change in the value of the debt, which is due to changes in foreign exchange rates, is recorded in Accumulated other comprehensive income (loss), net of tax.\n17"}, {"label": 3, "gold": false, "text": "Table of Contents\nAbbott Laboratories and Subsidiaries\nCondensed Consolidated Statement of Comprehensive Income\n(Unaudited)\n(dollars in millions)\nThree Months Ended Nine Months Ended\nSeptember 30 September 30\n2026 2025 2026 2025\nNet Earnings $ 920 $ 1,644 $ 2,925 $ 4,748\nForeign currency translation gain (loss) adjustments, net of taxes of $(3) and $(9) in 2026 and $(6) and $52 in 2025 (133) (136) (462) 1,414\nNet actuarial gains (losses) and amortization of net actuarial losses and prior service costs and credits, net of taxes of $1 and $3 in 2026 and $— and $— in 2025 2 (11) (10) 45\nNet gains (losses) for derivative instruments designated as cash flow hedges, net of taxes of $— and $45 in 2026 and $8 and $(101) in 2025 — 39 130 (237)\nOther comprehensive income (loss) (131) (108) (342) 1,222\nComprehensive Income $ 789 $ 1,536 $ 2,583 $ 5,970\nSeptember 30, 2026 December 31, 2025\nSupplemental Accumulated Other Comprehensive Income (Loss) Information, net of tax:\nCumulative foreign currency translation (loss) adjustments $ (6,393) $ (5,931)\nNet actuarial (losses) and prior service (costs) and credits (11) (1)\nCumulative gains (losses) on derivative instruments designated as cash flow hedges 61 (69)\nAccumulated other comprehensive income (loss) $ (6,343) $ (6,001)\nThe accompanying notes to the condensed consolidated financial statements are an integral part of this statement.\n4"}]}, {"n": 86, "id": "FE-0813", "slice": "S7", "com ctivities as an insurer, mortgage lender, employer, investor, investment advisor, broker-dealer, and taxpayer.\nThe Company also receives and responds to subpoenas or other inquiries seeking a broad range of information from state regulators, including state insurance commissioners; state attorneys general or other state governmental authorities; federal regulators, including the U.S. Securities and Exchange Commission; federal governmental authorities, including congressional committees; and the Financial Industry Regulatory Authority, as well as from local and national regulators and government authorities in jurisdictions outside the United States where the Company conducts business. The issues involved in information requests and regulatory matters vary widely, but can include inquiries or investigations concerning the Company’s compliance with applicable insurance and other laws and regulations. The Company cooperates in these inquiries.\n303"}, {"label": 302, "gold": false, "text": "Table of Contents\nMetLife, Inc.\nNotes to the Consolidated Financial Statements — (continued)\n22. Income Tax (continued)\nThe Company’s overall liability for unrecognized tax benefits may increase or decrease in the next 12 months. For example, U.S. federal tax legislation and regulation could impact unrecognized tax benefits. A reasonable estimate of the increase or decrease cannot be made at this time. However, the Company continues to believe that the ultimate resolution of the pending issues will not result in a material change to its consolidated financial statements, although the resolution of income tax matters could impact the Company’s effective tax rate for a particular future period.\nA reconciliation of the beginning and ending amount of unrecognized tax benefits was as follows:\nYears Ended December 31,\n2025 2024 2023\n(In millions)\nBalance at January 1, $ 218 $ 131 $ 129\nAdditions for tax positions of prior years (1) 28 127 27\nReductions for tax positions of pri ases Leases Income, Net\n2026 $ 1,598 $ (475) $ 1,123\n2027 1,263 (28) 1,235\n2028 1,221 — 1,221\n2029 1,123 — 1,123\n2030 115 — 115\nThereafter 13 — 13\n$ 5,333 $ (503) $ 4,830\nDerivative Financial Instruments\nWe record all derivatives on our consolidated balance sheets at fair value. The accounting for changes in the fair value of derivatives depends on the intended use of the derivative, whether we have designated a derivative as a hedge and whether the hedging relationship has satisfied the criteria necessary to apply hedge accounting. We may use a variety of derivative financial instruments in the normal course of business to selectively manage or hedge a portion of the risks associated with our indebtedness and interest payments. Our objectives in using interest rate derivatives are to add stability to interest expense and to manage our exposure to interest rate movements. To accomplish this objective, we primarily use interest rate swaps and caps. We require that hedging derivative instruments be highly effective in reducing the risk exposure that they are designated to hedge. We formally designate instruments that meets these hedging criteria as a hedge at the inception of the derivative contract. We have no credit-risk-related hedging or derivative activities.\n106"}]}, {"n": 90, "id": "FE-0949", "slice": "S8", "company": "NVIDIA Corporation", "form": "10-Q", "question": "What was NVIDIA Corporation's due in 2028 as of January 25, 2026?", "found": false, "display": null, "scale": "None", "unit": null, "period": "2026-01-25", "dims": {}, "line": null, "url": "https://www.sec.gov/Archives/edgar/data/1045810/000104581026000075/nvda-20260726.htm", "pages": [{"label": 5, "gold": false, "text": "NVIDIA Corporation and Subsidiaries\nCondensed Consolidated Statements of Shareholders’ Equity\n(Unaudited)\nCommon Stock Outstanding Additional Paid-in Capital Accumulated Other Comprehensive Income (Loss) Retained Earnings Total Shareholders’ Equity\nShares Amount\n(I ns on products that can be used for training, modifying, tuning, and deploying LLMs and other AI applications. Such restrictions have limited and could in the future limit the ability of downstream customers and users worldwide to acquire, deploy and use systems that include our products, software, and services, and negatively impact our business and financial results.\nSuch restrictions could include additional unilateral or multilateral export controls on certain products or technology, including but not limited to AI technologies. As geopolitical tensions have increased, semiconductors associated with AI, including GPUs and related products, are increasingly the focus of export control restrictions proposed by stakeholders in the U.S. and its allies. The United States has imposed unilateral worldwide controls restricting GPUs and associated products, and it is likely that additional unilateral or multilateral controls will be adopted. Such controls have been and may again be very broad in scope and application, prohibit us from exporting our products to any or all customers in one or more markets, and could negatively impact our manufacturing, testing and warehousing locations and options, or could impose other conditions that limit our ability to serve demand abroad and could negatively and materially impact our business, revenue and financial results. Export controls and other restrictions targeting GPUs and semiconductors associated with AI, which have been imposed and are likely to be more restrictive, would further limit our ability to export our technology, products, or services, creating a competitive disadvantage for us and negatively impacting our business and financial results. Export controls targeting GPUs and semiconductors associated with AI have subjected and may in the future subject downstream users of our products to restrictions on the use, resale, repair, or transfer of our products, negatively impacting our business and financial results. Controls could negatively impact our cost and/or ability to provide services such as NVIDIA AI cloud services and could impact the cost and/or ability for our CSPs and customers to provide services to their end customers, even outside China.\nExport controls have and could in the future disrupt our supply chain and distribution channels, negatively impacting our ability to serve demand, including in markets outside China and for our non-data center products. The possibility of additional export controls has negatively impacted and may in the future negatively impact demand for our products, benefiting competitors that offer alternatives less likely to be restricted by further controls. Repeated changes in the export control rules are likely to impose compliance burdens on our business and our customers, negatively and materially impacting our business. Complex U.S. export rules have already and are likely in the future to result in inquiries and investigations from foreign governments regarding sales of our products, subjecting our business, employees, and customers to increased burdens, disruption and risk.\nIncreasing use of economic sanctions and export controls has impacted and may in the future impact demand for our products or services, negatively impacting our business and financial results. Reduced demand due to export controls has and could in the future lead to excess inventory or cause us to incur related supply charges. Additional unilateral or multilateral controls are also likely to include deemed export control limitations that negatively impact the ability of our research and development teams to execute our roadmap or other objectives in a timely manner. Additional export restrictions may not only impact our ability to serve overseas markets, but also provoke responses from foreign governments, including China, that negatively impact our supply chain or our ability to provide our products and services to customers in all markets worldwide, which could also substantially reduce our revenue. Regulators in China have inquired about our sales and efforts to supply the China market and our fulfillment of the commitments we entered into at the close of our Mellanox acquisition. On September 15, 2025, China’s antitrust regulators published their preliminary finding that our compliance with applicable U.S. export controls, which required us to offer degraded products to the Chinese market, discriminated unfairly against customers in the China market and therefore violated the terms of China’s approval of our Mellanox acquisition. If regulators conclude that we have failed to fulfill the terms of our Mellanox acquisition or we have violated any applicable law in China, we could be subject to financial penalties, restrictions on our ability to conduct our business, restrictions or other orders regarding our networking business, products, and services, or otherwise impact our operations in China, any of which could have a material and adverse impact on our business, operating results and financial condition.\nWe continue to be subject to a series of shifting and expanding export control restrictions, impacting our ability to serve customers outside the United States.\n36"}]}, {"n": 91, "id": "FE-0986", "slice": "S8", "company": "UnitedHealth Group Incorporated", "form": "10-Q", "question": "What was UnitedHealth Group Incorporated's increase in cash and cash equivalents, including cash within businesses held for sale for the nine months ended September 30, 2025?", "found": false, "display": null, "scale": "None", "unit": null, "period": "2025-01-01 to 2025-09-30", "dims": {}, "line": null, "url": "https://www.sec.gov/Archives/edgar/data/731766/000073176626000266/unh-20260930.htm", "pages": [{"label": 27, "gold": false, "text": "Table of Contents\nRECENTLY ISSUED ACCOUNTING STANDARDS\nThere are no recently issued accounting standards that are expected to have a material impact on our Condensed Consolidated Financial Statements.\nCRITICAL ACCOUNTING ESTIMATES\nIn preparing our Condensed Consolidated Financial Statements, we are required to make judgments, assumptions and estimates, which we believe are reasonable and prudent based on the available facts and circumstances. These judgments, assumptions and estimates affect certain of our revenues and expenses and their related balance sheet accounts and disclosure of our contingent liabilities. We base our assumptions and estimates primarily on historical experience and consider known and projected trends. On an ongoing basis, we re-evaluate our selection of assumptions and the method of calculating our estimates. Actual results, however, may materially differ from our calculated estimates, and this difference would be reported in our current operations.\nOur critical accounting estimates include medical costs payable and goodwill. For a detailed description of our critical accounting estimates, see “Management’s Discussion and Analysis of Financial Condition and Results of Operations” included in Part II, Item 7 in our 2025 10-K. For a detailed discussion of our significant accounting policies, see Note 2 of Notes to the Consolidated Financial Statements included in Part II, Item 8, “Financial Statements and Supplementary Data” in our 2025 10-K.\nFORWARD-LOOKING STATEMENTS\nThe statements, estimates, projections, guidance or outlook contained in this document include “forward-looking” statements which are intended to take advantage of the “safe harbor” provisions of the federal securities laws. The words “believe,” “expect,” “intend,” “estimate,” “anticipate,” “forecast,” “outlook,” “plan,” “project,” “should” and similar expressions identify forward-looking statements. These statements may contain information about financial prospects, economic conditions and trends and involve risks and uncertainties. Actual results could differ materially from those that management expects, depending on the outcome of certain factors including: our ability to effectively estimate, price for and manage medical costs; new or changes in existing health care laws or regulations, or their enforcement or application; cyberattacks, other privacy/data security incidents, or our failure to comply with related regulations; reductions in revenue or delays to cash flows received under government programs; changes in Medicare, the CMS star ratings program or the application of risk adjustment data validation audits; our ability to successfully execute initiatives designed to simplify and improve the consumer healthcare experience; our ability to effectively execute our value-based care strategies; the DOJ’s legal actions concerning our participation in the Medicare program; our ability to maintain and achieve improvement in quality scores impacting revenue; failure to maintain effective and efficient information systems or if our technology products do not operate as intended; risks and uncertainties associated with our businesses providing pharmacy care services; competitive pressures, including our ability to maintain or increase our market share; changes in or challenges to our public sector contract awards; failure to achieve targeted operating cost productivity improvements; failure to develop and maintain satisfactory relationships with health care payers, physicians, hospitals and other service providers; the impact of potential changes in tax laws and regulations; increases in costs and other liabilities associated with litigation, government investigations, audits or reviews; risks and uncertainties associated with our increasing use of artificial intelligence and other emerging technologies; failure to complete, manage or integrate strategic transactions; risks and uncertainties associated with the sale of our remaining operations in South America; risks associated with public health crises arising from large-scale medical emergencies, pandemics, natural disasters and other extreme events; failure to attract, develop, retain, and manage the succession of key employees and executives; our investment portfolio performance; impairment of our goodwill and intangible assets; failure to protect proprietary rights to our databases, software and related products; downgrades in our credit ratings; and our ability to obtain sufficient funds from our regulated subsidiaries or from external financings to fund our obligations, reinvest in our business, maintain our debt to total capital ratio at targeted levels, maintain our quarterly dividend payment cycle, or continue repurchasing shares of our common stock.\nThe above list is not exhaustive. We discuss these matters, and certain risks that may affect our business operations, financial condition and results of operations, more fully in our filings with the SEC, including our reports on Forms 10-K, 10-Q and 8-K. By their nature, forward-looking statements are not guarantees of future performance or results and are subject to risks, uncertainties and assumptions that are difficult to predict or quantify. Actual results may vary materially from expectations expressed or implied in this document or any of our prior communications. You should not place undue reliance on forward-looking statements, which speak only as of the date they are made. We do not undertake to update or revise any forward-looking statements, except as required by law.\n26"}, {"label": 26, "gold": false, "text": "Table of Contents\nCapital Resources and Uses of Liquidity\nIn addition to cash flows from operations and cash and cash equivalent balances available for general corporate use, our capital resources and uses of liquidity are as follows:\nCash Requirements. A summary of our cash requirements as of December 31, 2025 was disclosed in Part II, Item 7, “Management’s Discussion and Analysis of Financial Condition and Results of Operations” in our 2025 10-K. During the nine months ended September 30, 2026, there were no material changes to this previously disclosed information outside the ordinary course of business. We believe our capital resources are sufficient to meet future, short-term and long-term, liquidity needs. We continually evaluate opportunities to expand our operations, including through internal development of new products, programs and technology applications and business combinations.\nShort-Term Borrowings. Our revolving bank credit facilities provide liquidity support for our commercial paper borrowing program, which facilitates the private placement of unsecured debt through independent broker-dealers, and are available for general corporate purposes. For more information on our commercial paper and bank credit facilities, see Note 5 of the Notes to the Condensed Consolidated Financial Statements included in Part I, Item 1 of this report and Note 8 of Notes to the Consolidated Financial Statements included in Part II, Item 8, “Financial Statements and Supplementary Data” in our 2025 10-K. As of September 30, 2026, we were in compliance with the various covenants under our bank credit facilities.\nLong-Term Debt. Periodically, we access capital markets and issue long-term debt for general corporate purposes, such as to meet our working capital requirements, to refinance debt, to finance acquisitions or for share repurchases. For more information on our long-term debt, see Note 5 of the Notes to the Condensed Consolidated Financial Statements included in Part I, Item 1 of this report and Note 8 of Notes to the Consolidated Financial Statements included in Part II, Item 8, “Financial Statements and Supplementary Data” in our 2025 10-K.\nCredit Ratings. Our credit ratings as of September 30, 2026 were as follows:\nMoody’s S&P Global Fitch A.M. Best\nRatings Outlook Ratings Outlook Ratings Outlook Ratings Outlook\nSenior unsecured debt A2 Negative A+ Negative A Negative A- Stable\nCommercial paper P-1 n/a A-1 n/a F1 n/a AMB-1 n/a\nThe availability of financing in the form of debt or equity is influenced by many factors, including our profitability, operating cash flows, debt levels, credit ratings, debt covenants and other contractual restrictions, regulatory requirements and economic and market conditions. A significant downgrade in our credit ratings or adverse conditions in the capital markets may increase the cost of borrowing for us or limit our access to capital.\nRegulatory Capital. Our regulated insurance and HMO subsidiaries have specified levels of statutory capital required to be maintained, which fluctuates based upon premiums received and the MCR of the regulated subsidiary. We have various agreements with reinsurers that could limit our risk of loss under certain circumstances, thus reducing our capital and surplus requirements. These agreements do not qualify for reinsurance accounting and are therefore accounted for under deposit accounting.\nShare Repurchase Program. During the nine months ended September 30, 2026, we repurchased approximately 13.8 million shares at an average price of $359.55 per share, including 6.4 million shares purchased at an average price of $312.73 per share pursuant to forward share repurchase contracts that were settled on July 1, 2026. See Note 6 of Notes to the Condensed Consolidated Financial Statements included in Part I, Item 1 of this report for more information on the Company’s forward share repurchase contracts.\nAs of September 30, 2026, we had Board of Directors’ authorization to purchase up to 7.2 million shares of our common stock. The Board of Directors from time to time may further amend the share repurchase program in order to increase the authorized number of shares which may be repurchased under the program.\nDividends. In June 2026, our Board of Directors increased our quarterly cash dividend to an annual rate of $9.28 compared to $8.84 per share which we had paid since June 2025. For more information on our dividend, see Note 6 of Notes to the Condensed Consolidated Financial Statements included in Part I, Item 1 of this report.\nFor additional liquidity discussion, see Note 10 of Notes to the Consolidated Financial Statements included in Part II, Item 8, “Financial Statements and Supplementary Data” and “Management’s Discussion and Analysis of Financial Condition and Results of Operations” included in Part II, Item 7 in our 2025 10-K.\n25"}, {"label": 1, "gold": false, "text": "UNITEDHEALTH GROUP\nTable of Contents\nPage\nPart I. Financial Information\nItem 1. Financial Statements (unaudited) 1\nCondensed Consolidated Balance Sheets as of September 30, 2026 and December 31, 2025 1\nCondensed Consolidated Statements of Operations for the Three and Nine Months Ended September 30, 2026 and 2025 2\nCondensed Consolidated Statements of Comprehensive Income for the Three and Nine Months Ended September 30, 2026 and 2025 3\nCondensed Consolidated Statements of Changes in Equity for the Three and Nine Months Ended September 30, 2026 and 2025 4\nCondensed Consolidated Statements of Cash Flows for the Nine Months Ended September 30, 2026 and 2025 6\nNotes to the Condensed Consolidated Financial Statements 7\n1. Basis of Presentation 7\n2. Investments 8\n3. Fair Value 10\n4. Medical Costs Payable 11\n5. Short-Term Borrowings and Long-Term Debt 12\n6. Shareholders’ Equity 12\n7. Commitments and Contingencies 12\n8. Held for Sale and Dispositions 14\n9. Segment Financial Information 15\nItem 2. Management’s Discussion and Analysis of Financial Condition and Results of Operations 17\nItem 3. Quantitative and Qualitative Disclosures About Market Risk 27\nItem 4. Controls and Procedures 27\nPart II. Other Information\nItem 1. Legal Proceedings 28\nItem 1A. Risk Factors 28\nItem 2. Unregistered Sales of Equity Securities and Use of Proceeds 28\nItem 5. Other Information 28\nItem 6. Exhibits 29\nSignatures 30"}]}, {"n": 92, "id": "FE-0968", "slice": "S8", "company": "PNC Financial Services Group, Inc.", "form": "10-K", "question": "What was PNC Financial Services Group, Inc.'s Less: Net in nsistent in all material respects with those applied in our 2025 Form 10-K. As permitted under the SEC requirements for interim reporting, certain footnotes or other financial information have been condensed or omitted.\nThese financial statements include all normal and recurring adjustments that are considered necessary for the fair statement of results for the interim periods presented. The information included in this Form 10-Q should be read in conjunction with the consolidated financial statements and accompanying notes included in our 2025 Form 10-K. Revenues, expenses, assets and liabilities can vary during each quarter of the year. Therefore, the results and trends in these interim financial statements may not be representative of those for the full year.\nPfizer’s fiscal quarter-end for subsidiaries operating outside the U.S. is as of and for the three and nine months ended August 23, 2026 and August 24, 2025, and for U.S. subsidiaries is as of and for the three and nine months ended September 27, 2026 and September 28, 2025.\nWe manage our commercial operations through two operating segments, each led by a single manager: Biopharma and PC1. Biopharma is the only reportable segment. See Note 13A.\nB. Revenues and Trade Accounts Receivable\nDeductions from Revenues––Our accruals for Medicare, Medicaid and related state program and performance-based contract rebates, chargebacks, sales allowances and sales returns and cash discounts are as follows:\n(MILLIONS) September 27, 2026 December 31, 2025\nReserve against Trade accounts receivable, net of allowance for doubtful accounts $ 2,229 $ 1,803\nOther current liabilities:\nAccrued rebates 9,801 7,909\nOther accruals 779 750\nOther noncurrent liabilities 347 1,204\nTotal accrued rebates and other sales-related accruals $ 13,155 $ 11,666\nTrade Accounts Receivable––Trade accounts receivable are stated at their net realizable value. The allowance for credit losses reflects our best estimate of expected credit losses of the receivables portfolio determined on the basis of historical experience, current information, and forecasts of future economic conditions. In developing the estimate for expected credit losses, trade accounts receivables are segmented into pools of assets depending on market, delinquency status, and customer type (high risk versus low risk and government versus non-government), and reserve percentages are established for each pool of trade accounts receivables.\nIn determining the reserve percentages for each pool of trade accounts receivables, we considered our historical experience with certain customers and customer types, regulatory and legal environments, country and political risk, and other relevant current and future forecasted macroeconomic factors. When management becomes aware of certain customer-specific factors that impact credit risk, specific allowances for these known troubled accounts are recorded.\nDuring the three and nine months ended September 27, 2026 and September 28, 2025, additions to the allowance for credit losses, write-offs and recoveries of customer receivables were not material to our condensed consolidated financial statements.\nFor additional information on our trade accounts receivable, see Note 1G in our 2025 Form 10-K.\nNote 2. Acquisition, In-Licensing Arrangement, Sale of Investment, Research and Development Arrangement and Collaborative Arrangement\nA. Acquisition\nMetsera––On November 13, 2025, we acquired Metsera, a clinical-stage biopharmaceutical company accelerating the next generation of medicines for obesity and cardiometabolic diseases, for $65.60 per share in cash plus a contingent value right (CVR) of up to $20.65 per share in potential additional payments (up to $2.3 billion) tied to the achievement of three specified milestones: $4.60 per share following the Phase 3 clinical trial start of Metsera’s injectable GLP-1 receptor agonist MET-097i+amylin analog MET-233i combination, $6.40 per share following FDA approval of Metsera’s monthly MET-097i monotherapy and $9.65 per share following FDA approval of Metsera’s monthly MET-097i+MET-233i combination. The total\n10"}]}, {"n": 94, "id": "FE-0910", "slice": "S8", "company": "General Dynamics Corporation", "form": "10-K", "question": "What was General Dynamics Corporation's capital expenditures (cash flows from investing activities) for the three months ended December 31, 2025?", "found": false, "display": null, "scale": "None", "unit": null, "period": "2025-10-01 to 2025-12-31", "dims": {}, "line": null, "url": "https://www.sec.gov/Archives/edgar/data/40533/000004053326000006/gd-20251231.htm", "pages": [{"label": 54, "gold": false, "text": "CONSOLIDATED STATEMENT OF CASH FLOWS\nYear Ended December 31\n(Dollars in millions) 2025 2024 2023\nCash flows from operating activities – continuing operations:\nNet earnings $ 4,210 $ 3,782 $ 3,315\nAdjustments to reconcile net earnings to net cash from operating activities:\nDepreciation of property, plant and equipment 680 644 608\nAmortization of intangible and finance lease right-of-use assets 244 242 255\nEquity-based compensation expense 196 183 181\nDeferred income tax provision (benefit) 256 (86) (177)\n(Increase) decrease in assets, net of effects of business acquisitions:\nAccounts receivable 556 16 38\nUnbilled receivables (146) (261) 913\nInventories 450 (1,195) (2,219)\nIncrease (decrease) in liabilities, net of effects of business acquisitions:\nAccounts payable (664) 247 (303)\nCustomer advances and deposits (4) 343 2,415\nOther, net (658) 197 (316)\nNet cash provided by operating activities 5,120 4,112 4,710\nCash flows from investing activities:\nCapital expenditures (1,161) (916) (904)\nOther, net (123) (37) (37)\nNet cash used by investing activities (1,284) (953) (941)\nCash flows from financing activities:\nDividends paid (1,593) (1,529) (1,428)\nRepayment of fixed-rate notes (1,500) (500) (1,250)\nProceeds from fixed-rate notes 747 — —\nPurchases of common stoc "question": "What was Realty Income Corporation's revolving credit facilities and commercial paper as of December 31, 2023?", "found": false, "display": null, "scale": "None", "unit": null, "period": "2023-12-31", "dims": {}, "line": null, "url": "https://www.sec.gov/Archives/edgar/data/726728/000072672826000011/o-20251231.htm", "pages": [{"label": 55, "gold": false, "text": "Table of Contents\nReport of Independent Registered Public Accounting Firm\nTo the Stockholders and Board of Directors\nRealty Income Corporation:\nOpinion on Internal Control Over Financial Reporting\nWe have audited Realty Income Corporation and subsidiaries' (the Company) internal control over financial reporting as of December 31, 2025, based on criteria established in Internal Control – Integrated Framework (2013) issued by the Committee of Sponsoring Organizations of the Treadway Commission. In our opinion, the Company maintained, in all material respects, effective internal control over financial reporting as of December 31, 2025, based on criteria established in Internal Control – Integrated Framework (2013) issued by the Committee of Sponsoring Organizations of the Treadway Commission.\nWe also have audited, in accordance with the standards of the Public Company Accounting Oversight Board (United States) (PCAOB), the consolidated balance sheets of the Company as of December 31, 2025 and 2024, the related consolidated statements of income and comprehensive income, equity, and cash flows for each of the years in the three-year period ended December 31, 2025, and the related notes and financial statement schedule III (collectively, the consolidated financial statements), and our report dated February 24, 2026 expressed an unqualified opinion on those consolidated financial statements.\nBasis for Opinion\nThe Company’s management is responsible for maintaining effective internal control over financial reporting and for its assessment of the effectiveness of internal control over financial reporting, included in the accompanying Management's Report on Internal Control Over Financial Reporting. Our responsibility is to express an opinion on the Company’s internal control over financial reporting based on our audit. We are a public accounting firm registered with the PCAOB and are required to be independent with respect to the Company in accordance with the U.S. federal securities laws and the applicable rules and regulations of the Securities and Exchange Commission and the PCAOB.\nWe conducted our audit in accordance with the standards of the PCAOB. Those standards require that we plan and perform the audit to obtain reasonable assurance about whether effective internal control over financial reporting was maintained in all material respects. Our audit of internal control over financial reporting included obtaining an understanding of internal control over financial reporting, assessing the risk that a material weakness exists, and testing and evaluating the design and operating effectiveness of internal control based on the assessed risk. Our audit also included performing such other procedures as we considered necessary in the circumstances. We believe that our audit provides a reasonable basis for our opinion.\nDefinition and Limitations of Internal Control Over Financial Reporting\nA company’s internal control over financial reporting is a process designed to provide reasonable assurance regarding the reliability of financial reporting and the preparation of financial statements for external purposes in accordance with generally accepted accounting principles. A company’s internal control over financial reporting includes those policies and procedures that (1) pertain to the maintenance of records that, in reasonable detail, accurately and fairly reflect the transactions and dispositions of the assets of the company; (2) provide reasonable assurance that transactions are recorded as necessary to permit preparation of financial statements in accordance with generally accepted accounting principles, and that receipts and expenditures of the company are being made only in accordance with authorizations of management and directors of the company; and (3) provide reasonable assurance regarding prevention or timely detection of unauthorized acquisition, use, or disposition of the company’s assets that could have a material effect on the financial statements.\nBecause of its inherent limitations, internal control over financial reporting may not prevent or detect misstatements. Also, projections of any evaluation of effectiveness to future periods are subject to the risk that controls may become inadequate because of changes in conditions, or that the degree of compliance with the policies or procedures may deteriorate.\n/s/ KPMG LLP\nSan Diego, California\nFebruary 24, 2026\n54"}, {"label": 61, "gold": false, "text": "Table of Contents\nDuring the year ended December 31, 2025, we formed and announced closings with respect to our open-end, perpetual life private capital vehicle (the \"Fund\"). As of December 31, 2025, we are considered the primary beneficiary of the Fund, Realty Income, L.P. and certain investments, including investments in joint ventures. Below is a summary of selected financial data of such consolidated VIEs, included on our consolidated balance sheets as of December 31, 2025 and 2024 (in thousands):\nDecember 31, 2025 December 31, 2024\nNet real estate $ 4,831,968 $ 2,882,135\nTotal assets $ 5,579,888 $ 3,461,843\nTotal liabilities $ 422,092 $ 131,096\nThe portion of a consolidated entity not owned by us is recorded as a noncontrolling interest. Noncontrolling interests are reflected on our consolidated balance sheets as a component of equity. Noncontrolling interests that were created or assumed as part of a business combination or asset acquisition were recognized at fair value as of the date of the transaction. For further details, see note 12, Noncontrolling Interests.\nUse of Estimates. The consolidated financial statements were prepared in conformity with U.S. GAAP, which requires management to make estimates and assumptions that affect the reported amounts of assets and liabilities, the disclosure of contingent assets and liabilities at the date of the financial statements, and the reported amounts of revenues and expenses during the reporting period. Actual results could differ from those estimates.\nNet Income per Common Share. Basic net income per common share is computed by dividing net income available to common stockholders by the weighted average number of common shares outstanding during each period. Diluted net income per common share is computed by dividing net income available to common stockholders, plus income attributable to dilutive shares and convertible common units for the period, by the weighted average number of common shares that would have been outstanding assuming the issuance of common shares for all dilutive common shares outstanding during the reporting period. For more detail, see note 18, Net Income per Common Share.\nCash Equivalents and Restricted Cash. We consider all short-term, highly liquid investments that are readily convertible to cash and have an original maturity of three months or less at the time of purchase to be cash equivalents. Restricted cash includes cash proceeds from the sale of assets held by qualified intermediaries in anticipation of the acquisition of replacement properties in tax-free exchanges under Section 1031 of the U.S. Internal Revenue Code of 1986, as amended (the “Code”), impounds related to mortgages payable and cash that is not immediately available to Realty Income (i.e. escrow deposits for future acquisitions).\nCash accounts maintained on behalf of Realty Income in demand deposits at commercial banks and money market funds may exceed federally insured levels or may be held in accounts without any federal insurance or any other insurance or guarantee. However, Realty Income has not experienced any losses in such accounts.\nIncome Taxes. We have elected to be taxed as a real estate investment trust (\"REIT\"), under the Code, as amended. We believe we have qualified and continue to qualify as a REIT. Under the REIT operating structure, we are permitted to deduct dividends paid to our stockholders in determining our taxable income. Assuming our dividends equal or exceed our taxable net income in the U.S., we generally will not be required to pay U.S. income taxes on such income. Accordingly, no provision has been made for federal income taxes in the accompanying consolidated financial statements, except for federal income taxes of our taxable REIT subsidiaries (\"TRS\"). A TRS is a subsidiary of a REIT that is subject to federal, state and local income taxes, as applicable. Our use of TRS entities enables us to engage in certain business activities while complying with the REIT qualification requirements and to retain any income generated by these businesses for reinvestment without the requirement to distribute those earnings. We are liable for taxes in our applicable international territories and have made the appropriate provisions in those territories. Therefore, the income taxes recorded in our consolidated statements of income and comprehensive income represent amounts for U.S. income taxes on our TRS entities, city and state income and franchise taxes, as well as income taxes for the applicable international territories.\nWe recognize deferred income tax in our taxable subsidiaries, including certain international jurisdictions. Deferred income tax assets and liabilities are generally the result of temporary differences between book and tax accounting, such as timing differences caused by different useful lives used for depreciation. We provide for a valuation allowance for deferred income tax assets if we believe some or all of the deferred income tax assets may not be realized.\n60"}, {"label": 56, "gold": false, "text": "Table of Content
