shares, respectively (2,879,347) (2,319,911)\nTotal stockholders’ equity 4,085,150 5,208,268\nNoncontrolling interests 1,054,683 1,263,819\nTotal equity 5,139,833 6,472,087\nTotal liabilities and equity $ 39,075,130 $ 40,606,466\nThe accompanying notes are an integral part of these statements.\n5"}]}, {"n": 51, "id": "FE-0393", "slice": "S4", "company": "Bank of America Corporation", "form": "10-Q", "question": "What was Bank of America Corporation's net income for the nine months ended September 30, 2025?", "found": true, "display": "22,862", "scale": "millions", "unit": "USD", "period": "2025-01-01 to 2025-09-30", "dims": {}, "line": "Net income $ 6,933 $ 8,332 $ 24,591 $ 22,862", "url": "https://www.sec.gov/Archives/edgar/data/70858/000007085826000548/bac-20260930.htm", "pages": [{"label": 87, "gold": true, "text": "NOTE 13 Earnings Per Common Share\nThe calculation of earnings per common share (EPS) and diluted EPS for the three and nine months ended September 30, 2026 and 2025 is presented below. For more information on the calculation of EPS, see Note 1 – Summary of Significant Accounting Principles to the Consolidated Financial Statements of the Corporation’s 2025 Annual Report on Form 10-K.\nThree Months Ended September 30 Nine Months Ended September 30\n(In millions, except per share information) 2026 2025 2026 2025\nEarnings per common share\nNet income $ 6,933 $ 8,332 $ 24,591 $ 22,862\nPreferred stock dividends and other (392) (429) (1,147) (1,126)\nNet income applicable to common shareholders $ 6,541 $ 7,903 $ 23,444 $ 21,736\nAverage common shares issued and outstanding 7,052.5 7,466.0 7,152.7 7,574.5\nEarnings per common share $ 0.93 $ 1.06 $ 3.28 $ 2.87\nDiluted earnings per common share\nNet income applicable to common shareholders $ 6,541 $ 7,903 $ 23,444 $ 21,736\nAdd preferred stock dividends due to assumed conversions 56 56 167 167\nNet income allocated to common shareholders $ 6,597 $ 7,959 $ 23,611 $ 21,903\nAverage common shares issued and outstanding 7,052.5 7,466.0 7,152.7 7,574.5\nDilutive potential common shares 169.7 161.1 159.8 150.2\nTotal average diluted common shares issued and outstanding 7,222.2 7,627.1 7,312.5 7,724.7\nDiluted earnings per common share $ 0.91 $ 1.04 $ 3.23 $ 2.84\nDiluted EPS is calculated by adjusting net income applicable to common shareholders and average common shares issued and outstanding for the potential impact, if dilutive, of any instruments that are exercisable or convertible into common shares. As the Corporation’s Series L convertible preferred stock (Series L) was dilutive to EPS for the three and nine months ended September 30, 2026 and the three and nine months ended September 30, 2025, total average dilutive common shares issued and outstanding included 62 million common shares, as the Series L was assumed to have been converted into common shares as of the beginning of the period. In addition, Series L preferred dividends of $56 million for both the three months ended September 30, 2026 and 2025 and $167 million for both the nine months ended September 30, 2026 and 2025 were included in net income allocated to common shareholders, as they would not have been paid if the Series L was converted.\nNOTE 14 Fair Value Measurements\nUnder applicable accounting standards, fair value is defined as the exchange price that would be received for an asset or paid to transfer a liability (an exit price) in the principal or most\nadvantageous market for the asset or liability in an orderly transaction between market participants on the measurement date. The Corporation determines the fair values of its financial instruments under applicable accounting standards and conducts a review of fair value hierarchy classifications on a quarterly basis. Transfers into or out of fair value hierarchy classifications are made if the significant inputs used in the financial models measuring the fair values of the assets and liabilities become unobservable or observable in the current marketplace. During the nine months ended September 30, 2026, there were no changes to valuation approaches or techniques that had, or are expected to have, a material impact on the Corporation’s consolidated financial position or results of operations.\nFor more information regarding the fair value hierarchy, how the Corporation measures fair value and valuation techniques, see Note 1 – Summary of Significant Accounting Principles and Note 20 – Fair Value Measurements to the Consolidated Financial Statements of the Corporation’s 2025 Annual Report on Form 10-K. The Corporation accounts for certain financial instruments under the fair value option. For more information, see Note 15 – Fair Value Option.\nBank of America 86"}, {"label": 5, "gold": false, "text": "Financial Highlights\nTable 1 Summary Income Statement and Selected Financial Data\nThree Months Ended September 30 Nine Months Ended September 30\n(Dollars in millions, except per share information) 2026 2025 2026 2025\nIncome statement\nNet interest income $ 16,449 $ 15,233 $ 48,191 $ 44,346\nNoninterest income 13,509 13,807 43,597 40,384\nTotal revenue, net of interest expense 29,958 29,040 91,788 84,730\nProvision for credit losses 1,269 1,295 3,972 4,367\nNoninterest expense 19,722 17,337 56,880 52,290\nIncome before income taxes 8,967 10,408 30,936 28,073\nIncome tax expense 2,034 2,076 6,345 5,211\nNet income 6,933 8,332 24,591 22,862\nPreferred stock dividends and other 392 429 1,147 1,126\nNet income applicable to common shareholders $ 6,541 $ 7,903 $ 23,444 $ 21,736\nPer common share information\nEarnings $ 0.93 $ 1.06 $ 3.28 $ 2.87\nDiluted earnings 0.91 1.04 3.23 2.84\nDividends paid 0.32 0.28 0.88 0.80\nPerformance ratios\nReturn on average assets (1) 0.79 % 0.96 % 0.94 % 0.90 %\nReturn on average common shareholders’ equity (1) 9.41 11.40 11.35 10.63\nReturn on average tangible common shareholders’ equity (1, 2) 12.60 15.29 15.20 14.30\nEfficiency ratio (1) 65.83 59.70 61.97 61.71\nSeptember 30 2026 December 31 2025\nBalance sheet\nTotal loans and leases $ 1,251,260 $ 1,185,700\nTotal assets 3,427,704 3,411,738\nTotal deposits 2,038,758 2,018,729\nTotal liabilities 3,130,955 3,108,495\nTotal common shareholders’ equity 271,753 277,251\nTotal shareholders’ equity 296,749 303,243\n(1)For definitions, see Key Metrics on page 101.\n(2)Return on average tangible common shareholders’ equity is a non-GAAP financial measure. For more information and a corresponding reconciliation to the most directly comparable financial measures defined by accounting principles generally accepted in the United States of America (GAAP), see Non-GAAP Reconciliations on page 46.\nNet income was $6.9 billion and $24.6 billion, or $0.91 and $3.23 per diluted share, for the three and nine months ended September 30, 2026 compared to $8.3 billion and $22.9 billion, or $1.04 and $2.84 per diluted share, for the same periods in 2025. The decrease in net income for the three-month period was primarily due to higher noninterest expense and lower noninterest income, partially offset by higher net interest income. The increase in net income for the nine-month period was due to higher net interest income and noninterest income, as well as lower provision for credit losses, partially offset by higher noninterest expense.\nTotal assets increased $16.0 billion from December 31, 2025 to $3.4 trillion primarily driven by higher loans and leases due to growth in commercial loans, higher securities borrowed or purchased under agreements to resell and higher derivative assets to support Global Markets client activity, as well as higher cash and cash equivalents due to balance sheet positioning, partially offset by lower debt securities due to net sales, maturities, and paydowns, as well as lower trading account assets due to Global Markets client activity.\nTotal liabilities increased $22.5 billion from December 31, 2025 to $3.1 trillion primarily driven by deposit growth in Global Banking, higher derivative liabilities, customer trade payables, and trading account liabilities to support Global Markets client activity, as well as higher short-term borrowings, partially offset by lower securities loaned or sold under agreements to repurchase driven by balance sheet positioning.\nShareholders’ equity decreased $6.5 billion from December 31, 2025 primarily due to returns of capital to shareholders through common stock repurchases and common and preferred stock dividends, a decrease in accumulated other comprehensive income (OCI) and a preferred stock redemption, partially offset by net income.\nNet Interest Income\nNet interest income increased $1.2 billion to $16.4 billion, and $3.8 billion to $48.2 billion for the three and nine months ended September 30, 2026 compared to the same periods in 2025. Net interest yield on a fully taxable-equivalent (FTE) basis increased 15 basis points (bps) to 2.16 percent and 12 bps to 2.10 percent for the three and nine months ended September 30, 2026 compared to the same periods in 2025. The increase in the three-month period was primarily driven by loan and deposit growth, higher net interest income related to Global Markets activity, and fixed-asset repricing, partially offset by the impact of lower interest rates. The increase in the nine-month period was primarily driven by higher net interest income related to Global Markets activity, loan and deposit growth, and fixed-asset repricing, partially offset by the impact of lower interest rates. For more information on net interest yield and FTE basis, see Supplemental Financial Data on page 6, and for more information on interest rate risk management, see Interest Rate Risk Management for the Banking Book on page 43.\nBank of America 4"}, {"label": 88, "gold": false, "text": "Recurring Fair Value\nAssets and liabilities carried at fair value on a recurring basis at September 30, 2026 and December 31, 2025, including financial instruments that the Corporation accounts for under t ces as of January 31, 2026 $ 4,792 $ 23,622 $ 321 $ 28,735", "url": "https://www.sec.gov/Archives/edgar/data/104169/000010416926000055/wmt-20260131.htm", "pages": [{"label": 58, "gold": true, "text": "Impairment of Long-Lived Assets\nManagement reviews long-lived assets for indicators of impairment whenever events or changes in circumstances indicate that the carrying amount may not be recoverable. The evaluation is performed at the lowest level of identifiable cash flows, which is at the individual store or club level. Undiscounted cash flows expected to be generated by the related assets are estimated over the assets' useful lives based on updated projections. If the evaluation indicates that the carrying amount of the assets may not be recoverable, any potential impairment is measured based upon the fair value of the related asset or asset group as determined by an appropriate market appraisal or other valuation technique.\nGoodwill and Other Acquired Intangible Assets\nGoodwill represents the excess of the purchase price over the fair value of net assets acquired in business combinations and is allocated to the appropriate reporting unit when acquired. Other acquired intangible assets are stated at the fair value acquired as determined by a valuation technique commensurate with the intended use of the related asset. Goodwill and indefinite-lived intangible assets are not amortized; rather, they are evaluated for impairment annually and whenever events or changes in circumstances indicate that the value of the asset may be impaired. Definite-lived intangible assets are considered long-lived assets and are amortized on a straight-line basis over the periods that expected economic benefits will be provided.\nGoodwill is typically assigned to the reporting unit which consolidates the acquisition. Components within the same reportable segment are aggregated and deemed a single reporting unit if the components have similar economic characteristics. Goodwill and other indefinite-lived acquired intangible assets are evaluated for impairment using either a qualitative or quantitative approach for each of the Company's reporting units. Generally, a qualitative assessment is first performed to determine whether a quantitative goodwill impairment test is necessary. If management determines, after performing an assessment based on the qualitative factors, that the fair value of the reporting unit is more likely than not less than the carrying amount, or that a fair value of the reporting unit substantially in excess of the carrying amount cannot be assured, then a quantitative goodwill impairment test would be required. The quantitative test for goodwill impairment is performed by determining the fair value of the related reporting units. Fair value is measured based on the discounted cash flow method and relative market-based approaches. Management has performed its evaluation and determined the fair value of each reporting unit is significantly greater than the carrying amount and, accordingly, the Company has not recorded any impairment charges related to goodwill during fiscal 2026, fiscal 2025 or fiscal 2024.\nThe following table reflects goodwill activity, by reportable segment, for fiscal 2026 and 2025:\n(Amounts in millions) Walmart U.S. Walmart International Sam's Club U.S. Total\nBalances as of February 1, 2024 $ 3,364 $ 24,428 $ 321 $ 28,113\nChanges in currency translation and other — (696) — (696)\nAcquisitions(1) 1,375 — — 1,375\nBalances as of January 31, 2025 4,739 23,732 321 28,792\nChanges in currency translation and other 53 (119) — (66)\nAcquisitions — 9 — 9\nBalances as of January 31, 2026 $ 4,792 $ 23,622 $ 321 $ 28,735\n(1)Goodwill recorded in fiscal 2025 relates to the acquisition of VIZIO Holding Corp. in December 2024 within the Walmart U.S. segment.\nIntangible assets are recorded in other long-term assets in the Company's Consolidated Balance Sheets. As of January 31, 2026 and 2025, the Company had $4.3 billion and $4.5 billion, respectively, in indefinite-lived intangible assets which primarily consists of acquired trade names. There were no significant impairment charges related to intangible assets for fiscal 2026, 2025 or 2024.\nFair Value Measurement\nThe Company records and discloses certain financial and non-financial assets and liabilities at fair value. The fair value of an asset is the price at which the asset could be sold in an orderly transaction between unrelated, knowledgeable and willing parties able to engage in the transaction. The fair value of a liability is the amount that would be paid to transfer the liability to a new obligor in a transaction between such parties, not the amount that would be paid to settle the liability with the creditor. Refer to Note 7 for more information.\nInvestments\nInvestments in equity securities are recorded in other long-term assets in the Consolidated Balance Sheets. Changes in the fair value of certain equity securities, as well as certain immaterial equity method investments where the Company has elected the fair value option, are measured on a recurring basis (generally using Level 1 and Level 2 inputs in the fair value hierarchy) and recognized within other gains and losses in the Consolidated Statements of Income. Measurement of equity investments using Level 2 inputs is primarily based on quoted prices for similar securities in active markets. Equity investments without readily\n59"}, {"label": 14, "gold": false, "text": "consumer credit, higher consumer debt levels, changes in consumer spending and shopping patterns, fluctuations in currency exchange rates, higher tax rates, imposition of new taxes or other changes in tax laws, changes in healthcare laws, other regulatory changes, the imposition of export and import restrictions, tariffs, trade barriers or other measures that create barriers to or increase the costs associated with international trade, overall economic slowdown or recession and other economic factors in the U.S., or in any of the other markets in which we operate, could adversely affect consumer demand for the products and services we sell in the U.S. or such other markets, change the mix of products we sell to any one or more markets with a lower average gross margin, cause a slowdown in discretionary purchases of goods, adversely affect our net sales, growth rates, operating income and result in slower inventory turnover and greater markdowns of inventory, or otherwise materially adversely affect our operations and operating results and could result in impairment charges to intangible assets, goodwill or other long-lived assets.\nIn addition, the economic factors listed above, any other economic factors or circumstances resulting in higher transportation, labor, insurance or healthcare costs or commodity prices, including energy prices, and other economic factors in the U.S. and other countries in which we operate can increase our cost of sales and operating, selling, general and administrative expenses and otherwise materially adversely affect our operations and operating results.\nThe economic factors that affect our operations may also adversely affect the operations of our suppliers, which can result in an increase in the cost to us of the goods we sell to our customers or, in more extreme cases, in certain suppliers not producing goods in the volume typically available to us for sale, or adversely impact product margins due to higher labor and material costs of our suppliers that we are unable, or choose not, to pass on to our customers.\nThe performance of strategic alliances and other business relationships to support the expansion of our business could materially adversely affect our financial performance.\nWe may enter into strategic alliances and other business relationships in the countries in which we have existing operations or in other markets to expand our business. These arrangements may not generate the level of sales or profitability we anticipate when entering into the arrangement or may otherwise adversely impact our business and competitive position relative to the results we could have achieved in the absence of such alliance. In addition, any investment we make in connection with a strategic alliance, business relationship or in certain of our divested markets, could materially adversely affect our financial performance.\nOperational Risks\nGlobal or regional health pandemics or epidemics could negatively impact our business, financial position and results of operations.\nThe emergence, severity, magnitude and duration of global or regional pandemics, epidemics or other health crises are uncertain and difficult to predict. A pandemic, epidemic or contagious disease outbreak that affects humans or the food supply, such as the avian flu impact on poultry and egg production could impact our business operations, demand for our products and services, in-stock positions, costs of doing business, access to inventory, supply chain operations, ability to predict future performance, exposure to litigation and financial performance, among other things. In the event of any global or regional health crisis, customer demand for certain products may fluctuate, customer behaviors may change and consumer disposable income could be negatively impacted, which may challenge our ability to anticipate and/or adjust inventory levels to meet that demand. These risks and their impacts are difficult to predict and could otherwise disrupt and adversely affect our operations and our financial performance.\nTo the extent that a future pandemic, epidemic or contagious disease outbreak occurs, such events may also heighten other risks described in this Item 1A, including but not limited to those related to consumer behavior and expectations, competition, our reputation, implementation of strategic initiatives, cybersecurity threats, payment-related risks, technology systems disruption, supply chain disruptions, labor availability and cost, and litigation and regulatory requirements.\nNatural disasters, climate change, geopolitical events, catastrophic and other events could materially adversely affect our financial performance.\nNatural disasters and weather conditions, which may include hurricanes, tropical storms, typhoons, floods, wildfires, cyclones, tornadoes, winter storms, droughts, extreme temperatures, could have a material adverse effect on our operations and financial performance, and a changing climate could exacerbate certain of these events and conditions. Moreover, geopolitical tensions or events such as war; civil unrest (including theft, looting or vandalism); terrorist attacks; acts of violence, including active shooter situations (such as those that have occurred in our U.S. stores); or similar disruptions in countries or regions in which our suppliers operate or through which goods are transported could materially adversely affect our operations and financial performance. Protecting the safety of our associates, including our senior leaders, is critical to preventing business disruption and executing on our business strategies and objectives.\nThe occurrence of these events could result in immediate and longer-term impacts on our operations, including physical damage or loss of properties, the closure of stores, clubs and distribution or fulfillment centers, limited operating hours, workforce shortages and challenges in labor availability, the inability of customers and associates to reach or have transportation to our\n15"}, {"label": 57, "gold": false, "text": "Receivables\nReceivables are stated at their carrying values, net of a reserve for credit losses, and are primarily due from the following: customers, which includes pharmacy insurance companies, advertisers, and banks for customer credit, debit cards and electronic transfer transactions that take in excess of seven days to process; suppliers for marketing or incentive programs; governments for income taxes; and real estate transactions. Net receivables from transactions with customers were $4.9 billion and $4.4 billion as of January 31, 2026 and January 31, 2025, respectively.\nInventories\nThe Company utilizes various inventory methods to account for and value its inventories depending upon the nature of the store formats and businesses in each of its segments, resulting in inventories that are recorded at the lower of cost or market or net realizable value, as appropriate.\n•Walmart U.S. Segment - Inventories are primarily accounted for under the retail inventory method of accounting (\"RIM\") to determine inventory cost, using the last-in, first-out (\"LIFO\") valuation method. RIM generally results in inventory being valued at the lower of cost or market as permanent markdowns are immediately recorded as a reduction of the retail value of inventory.\n•Walmart International Segment – Depending on the store format in each market, inventories are generally accounted for using either the RIM or weighted-average cost method, using the first-in, first-out valuation method.\n•Sam's Club U.S. Segment - The majority of this segment's inventory is accounted for and valued using the weighted-average cost LIFO method.\nFor those segments that utilize the LIFO method, the Company records an adjustment each quarter, if necessary, for the projected annual effect of inflation or deflation. These estimates are adjusted to actual results determined at year end for inflation or deflation and inventory levels.\nProperty and Equipment\nProperty and equipment are initially recorded at cost. Gains or losses on disposition are recognized as earned or incurred. Costs of major improvements are capitalized, while costs of normal repairs and maintenance are expensed as incurred. The following table summarizes the Company's property and equipment balances and includes the estimated useful lives that are generally used to depreciate the assets on a straight-line basis:\nEstimated Useful Lives As of January 31,\n(Dollars in millions) (in Years) 2026 2025\nLand N/A $ 20,754 $ 19,342\nBuildings and improvements 3 - 40 128,472 117,973\nFixtures and equipment 2 - 30 85,539 76,226\nTransportation equipment 3 - 15 2,928 2,673\nConstruction in progress N/A 18,728 15,403\nProperty and equipment 256,421 231,617\nAccumulated depreciation (120,338) (111,624)\nProperty and equipment, net $ 136,083 $ 119,993\nLeasehold improvements are depreciated or amortized over the shorter of the estimated useful life of the asset or the remaining expected lease term. Total depreciation and amortization expense for property and equipment, property under finance leases and intangible assets was $14.2 billion, $13.0 billion and $11.9 billion for fiscal 2026, 2025 and 2024, respectively.\nLeases\nThe Company determines whether an arrangement is or contains a lease at the inception of the contract. The Company records right-of-use (\"ROU\") assets and lease obligations for its finance and operating leases, which are initially recognized based on the discounted future lease payments over the term of the lease. If the rate implicit in the Company's leases is not readily determinable, the Company's applicable incremental borrowing rate is used in calculating the present value of the sum of the lease payments.\nLease term is defined as the non-cancelable period of the lease plus any options to extend or terminate the lease when it is reasonably certain that the Company will exercise the option. The Company has elected not to recognize ROU asset and lease obligations for its short-term leases, which are defined as leases with an initial term of 12 months or less.\nFor a majority of all classes of underlying assets, the Company has elected to not separate lease from non-lease components. For leases in which the lease and non-lease components have been combined, the variable lease expense includes expenses such as common area maintenance, utilities and repairs and maintenance.\n58"}]}, {"n": 53, "id": "FE-0569", "slice": "S5", "company": "Medtronic plc", "form": "10-Q", "question": "What was Medtronic plc's goodwill for its Reportable Segments segment as of April 24, 2026?", "found": true, "display": "40,332", "scale": "millions", "unit": "USD", "period": "2026-04-24", "dims": {"us-gaap:StatementBusinessSegmentsAxis": "us-gaap:ReportableSegmentAggregationBeforeOtherOperatingSegmentMember"}, "line": "April 24, 2026 $ 8,602 $ 11,777 $ 19,953 $ 40,332 $ 2,256 $ 42,587", "url": "https://www.sec.gov/Archives/edgar/data/1613103/000162828026060473/mdt-20260731.htm", "pages": [{"label": 26, "gold": true, "text": "Medtronic plc\nNotes to Condensed Consolidated Financial Statements\n(Unaudited)\n10. Goodwill and Other Intangible Assets\nGoodwill\nThe following table presents the changes in the carrying amount of goodwill by reportable segment and goodwill assigned to the other operating segments:\n(in millions) Cardiovascular Neuroscience Medical Surgical Reportable Segments Other Operating Segments Total\nApril 24, 2026 $ 8,602 $ 11,777 $ 19,953 $ 40,332 $ 2,256 $ 42,587\nGoodwill as a result of acquisitions — 933 — 933 — 933\nPurchase accounting adjustments 18 — — 18 — 18\nCurrency translation and other (36) (37) (277) (350) (1) (351)\nJuly 31, 2026 $ 8,583 $ 12,673 $ 19,675 $ 40,932 $ 2,255 $ 43,187\nNo goodwill impairment was recognized during the three months ended July 31, 2026 and July 25, 2025.\nIntangible Assets\nThe following table presents the gross carrying amount and accumulated amortization of intangible assets:\nJuly 31, 2026 April 24, 2026\n(in millions) Gross Carrying Amount Accumulated Amortization Gross Carrying Amount Accumulated Amortization\nDefinite-lived:\nCustomer-related $ 16,716 $ (10,824) $ 16,559 $ (10,596)\nPurchased technology and patents 12,190 (8,481) 11,875 (8,319)\nTrademarks and tradenames 424 (297) 422 (295)\nOther 379 (135) 373 (126)\nTotal $ 29,709 $ (19,737) $ 29,229 $ (19,336)\nIndefinite-lived:\nIPR&D $ 265 $ — $ 253 $ —\nThe Company did not recognize any definite-lived or indefinite-lived intangible asset impairment charges during the three months ended July 31, 2026 and July 25, 2025. Due to the nature of IPR&D projects, the Company may experience future delays or failures to obtain regulatory approvals to conduct clinical trials, failures of clinical trials, delays or failures to obtain required market clearances, other failures to achieve a commercially viable product, or the discontinuation of certain projects, and as a result, may recognize impairment losses in the future.\nAmortization Expense\nIntangible asset amortization expense for the three months ended July 31, 2026 was $412 million. Intangible asset amortization expense for the three months ended July 25, 2025 was $459 million, including $45 million of accelerated amortization on certain intangible assets within the Cardiovascular Portfolio.\n11. Income Taxes\nThe Company's effective tax rate for the three months ended July 31, 2026 was 16.4%, as compared to 19.6% for the three months ended July 25, 2025. The decrease in the effective tax rate for the three months ended July 31, 2026 primarily relates to the release of reserves for uncertain tax positions on prior period intercompany transactions and year-over-year changes in operational results by jurisdiction.\nAt July 31, 2026 and April 24, 2026, the Company's gross unrecognized tax benefits were $2.9 billion and $3.0 billion, respectively. The Company had interest and penalties net receivable of $34 million and $22 million at July 31, 2026 and April 24, 2026, respectively. If all of the Company’s unrecognized tax benefits were recognized, approximately $2.6 billion would impact the Company’s effective tax rate. At both July 31, 2026 and April 24, 2026, the amount of the Company's gross unrecognized tax benefits, net of cash advance, recorded as a noncurrent liability within accrued income taxes on the consolidated balance sheets was $2.0 billion. The Company recognizes interest and penalties related to income tax matters within income tax provision in the consolidated statements of income and records the liability within either current or noncurrent accrued income taxes on the consolidated balance sheets.\n24"}, {"label": 35, "gold": false, "text": "Medtronic plc\nNotes to Condensed Consolidated Financial Statements\n(Unaudited)\nTotal Assets and Depreciation Expense\nTotal Assets Depreciation Expense\nAs of Three months ended\n(in millions) July 31, 2026 April 24, 2026 July 31, 2026 July 25, 2025\nCardiovascular $ 17,517 $ 17,553 $ 71 $ 64\nNeuroscience 19,942 18,514 78 77\nMedical Surgical 31,905 32,535 65 54\nTotal reportable segments 69,364 68,602 215 194\nOther operating segments(1) 4,747 4,827 34 31\nCorporate 19,195 19,598 69 64\nTotal $ 93,306 $ 93,028 $ 317 $ 289\n(1)Includes the operations and ongoing transition agreements from businesses the Company has exited, divested, or intends to separate, including the Diabetes Business.\nGeographic Information\nNet sales are attributed to the country based on the location of the customer taking possession of the products or in which the services are rendered. The following table presents net sales for the three months ended July 31, 2026 and July 25, 2025 for the Company's country of domicile, countries with significant concentrations, and all other countries:\nThree months ended\n(in millions) July 31, 2026 July 25, 2025\nIreland $ 40 $ 33\nUnited States 4,906 4,224\nRest of world 4,810 4,321\nTotal other countries, excluding Ireland 9,716 8,545\nTotal $ 9,756 $ 8,578\n18. MiniMed Separation\nOn March 9, 2026, MiniMed completed an initial public offering of 28,000,000 shares of its common stock, par value $0.01 per share (MiniMed Common Stock), at an initial public offering price of $20.00 per share for net proceeds of $538 million. MiniMed shares began trading on the Nasdaq Global Select Market (Nasdaq) under the symbol \"MMED.\"\nAs of the closing of the IPO, Medtronic owns 252,813,348 shares of MiniMed Common Stock, or approximately 90.03% of the total outstanding shares of MiniMed Common Stock. There were no changes to the number of shares the Company owned as of July 31, 2026. Due to the Company retaining a controlling financial interest, the condensed consolidated financial statements reflect the financial results of MiniMed. As of March 9, 2026, the non-controlling interest associated with MiniMed was $381 million. The difference between the net proceeds from the IPO and the non-controlling interest balance is recognized in additional paid-in capital on the condensed consolidated balance sheets.\nMedtronic and MiniMed have entered into various definitive agreements that, among other things, set forth the terms and conditions of the separation, the most significant of which includes a Transition Services Agreement (“TSA”). The TSA specifies the services to be provided by Medtronic to MiniMed for a period generally not expected to exceed 24 months following the completion of the IPO. The services are intended to facilitate an orderly transition of the Diabetes Business to operate as an independent public company.\nThe Company plans to complete the separation of its Diabetes Business within the fiscal year.\n33"}, {"label": 25, "gold": false, "text": "Medtronic plc\nNotes to Condensed Consolidated Financial Statements\n(Unaudited)\nThe following tables provide information as if the Company had elected to offset the asset and liability balances of derivative instruments, netted in accordance with various criteria as stipulated by the terms of the master netting arrangements with each of the counterparties. Derivatives not subject to master netting arrangements are not eligible for net presentation.\nJuly 31, 2026\nGross Amount Not Offset on the Balance Sheet\n(in millions) Gross Amount of Recognized Assets (Liabilities) Financial Instruments Cash Collateral Received Net Amount\nDerivative assets:\nCurrency exchange rate contracts $ 640 $ (169) $ (40) $ 432\nDerivative liabilities:\nCurrency exchange rate contracts (197) 169 — (28)\nTotal $ 443 $ — $ (40) $ 404\nApril 24, 2026\nGross Amount Not Offset on the Balance Sheet\n(in millions) Gross Amount of Recognized Assets (Liabilities) Financial Instruments Cash Collateral Posted Net Amount\nDerivative assets:\nCurrency exchange rate contracts $ 555 $ (232) $ — $ 323\nDerivative liabilities:\nCurrency exchange rate contracts (420) 232 98 (91)\nTotal $ 135 $ — $ 98 $ 233\nConcentrations of Credit Risk\nFinancial instruments, which potentially subject the Company to significant concentrations of credit risk, consist principally of interest-bearing investments, derivative contracts, and trade accounts receivable. Global concentrations of credit risk with respect to trade accounts receivable are limited due to the large number of customers and their dispersion across many geographic areas. The Company monitors the creditworthiness of its customers to which it grants credit terms in the normal course of business.\nThe Company has cash and cash equivalents, investments, and certain other financial instruments positions (including currency exchange rate and interest rate derivative contracts) with various major financial institutions. The Company performs periodic evaluations of the relative credit standings of these financial institutions and limits the amount of credit exposure with any one institution. In addition, the Company has collateral credit agreements with its primary derivatives counterparties. Under these agreements, either party is required to post eligible collateral when the market value of transactions covered by the agreement exceeds specific thresholds, thus limiting credit exposure for both parties. As of July 31, 2026, the Company received net cash collateral of $40 million. Cash collateral received is recorded as an increase in cash and cash equivalents with the offset recorded in other accrued expenses in the condensed consolidated balance sheets. As of April 24, 2026, the Company posted net cash collateral of $98 million to its counterparties. Cash collateral posted is recorded as a reduction in cash and cash equivalents, with the offset recorded as an increase in other current assets in the consolidated balance sheets.\n9. Inventories\nInventory balances were as follows:\n(in millions) July 31, 2026 April 24, 2026\nFinished goods $ 4,121 $ 4,075\nWork-in-process 900 800\nRaw materials 1,194 1,076\nTotal $ 6,215 $ 5,951\n23"}]}, {"n": 54, "id": "FE-0541", "slice": "S5", "company": "Home Depot, Inc.", "form": "10-Q", "question": "What was Home Depot, Inc.'s goodwill for its primary segment as of August 2, 2026?", "found": true, "display": "8,603", "scale": "millions", "unit": "USD", "period": "2026-08-02", "dims": {"us-gaap:StatementBusinessSegmentsAxis": "hd:PrimarySegmentMember"}, "line": "Goodwill, balance at August 2, 2026 $ 8,603 $ 14,296 $ 22,899", "url": "https://www.sec.gov/Archives/edgar/data/354950/000162828026058715/hd-20260802.htm", "pages": [{"label": 13, "gold": true, "text": "Table of Contents\n3.PROPERTY AND LEASES\nNet Property and Equipment\nNet property and equipment included accumulated depreciation and finance lease amortization of $32.9 billion as of August 2, 2026 and $31.4 billion as of February 1, 2026.\nLeases\nThe following table presents certain consolidated balance sheet information related to operating and finance leases:\nin millions Consolidated Balance Sheet Classification August 2, 2026 February 1, 2026\nAssets:\nOperating lease assets Operating lease right-of-use assets $ 9,300 $ 9,204\nFinance lease assets (1) Net property and equipment 2,691 2,563\nTotal lease assets $ 11,991 $ 11,767\nLiabilities:\nCurrent:\nOperating lease liabilities Current operating lease liabilities $ 1,516 $ 1,418\nFinance lease liabilities Current installments of long-term debt 303 288\nLong-term:\nOperating lease liabilities Long-term operating lease liabilities 8,155 8,160\nFinance lease liabilities Long-term debt, excluding current installments 2,791 2,675\nTotal lease liabilities $ 12,765 $ 12,541\n—————\n(1) Finance lease assets are recorded net of accumulated amortization of $1.7 billion and $1.6 billion as of August 2, 2026 and February 1, 2026, respectively.\nThe following table presents supplemental non-cash information related to leases:\nSix Months Ended\nin millions August 2, 2026 August 3, 2025\nLease assets obtained in exchange for new operating lease liabilities $ 816 $ 793\nLease assets obtained in exchange for new finance lease liabilities 294 154\n4.GOODWILL AND INTANGIBLE ASSETS\nGoodwill\nThe following table presents the changes in the carrying amount of our goodwill:\nin millions Primary Other (3) Consolidated\nGoodwill, balance at February 1, 2026 $ 8,564 $ 13,780 $ 22,344\nAcquisitions (1) 38 525 563\nOther (2) 1 (9) (8)\nGoodwill, balance at August 2, 2026 $ 8,603 $ 14,296 $ 22,899\n—————\n(1) Activity includes the preliminary determination of goodwill related to the Mingledorff’s acquisition and other immaterial acquisitions completed during the six months ended August 2, 2026. See Note 10 for details regarding the Mingledorff’s acquisition.\n(2) Primarily reflects the net impact of foreign currency translation as well as immaterial measurement period adjustments related to acquisitions completed in the prior fiscal year.\n(3) Amounts presented in the Other column represent goodwill activity within our SRS non-reportable operating segments.\nFiscal Q2 2026 Form 10-Q 10"}, {"label": 24, "gold": false, "text": "Table of Contents\nDEBT\nWe have a commercial paper program that allows for an aggregate of $11.0 billion in borrowings, and is supported by $11.0 billion of back-up credit facilities. At the beginning of fiscal 2026, these back-up credit facilities consisted of a five-year $3.5 billion credit facility scheduled to expire in May 2030, a 364-day $3.5 billion credit facility scheduled to expire in July 2026, a three-year $3.0 billion credit facility scheduled to expire in July 2028, and a 364-day $1.0 billion credit facility scheduled to expire in July 2026. During the second quarter of fiscal 2026, we entered into a new 364-day $4.5 billion back-up credit facility scheduled to expire in July 2027. This facility replaced our prior 364-day $3.5 billion and 364-day $1.0 billion back-up credit facilities, which were scheduled to expire in July 2026.\nDuring the first six months of fiscal 2026, all of our short-term borrowings were under our commercial paper program. We utilized commercial paper borrowings to support general liquidity, including the repayment of long-term debt, and the maximum amount outstanding during the first six months of fiscal 2026 was $6.2 billion. At August 2, 2026, we had outstanding borrowings under our commercial paper program of $4.2 billion with a weighted average interest rate of 3.8%, we had no outstanding borrowings under our back-up credit facilities, and we were in compliance with all of the covenants contained in our back-up credit facilities, none of which are expected to impact our liquidity or capital resources.\nWe also issue senior notes from time to time. We did not have any issuances of senior notes during the first six months of fiscal 2026. During the first six months of fiscal 2026, we repaid an aggregate of $2.8 billion of senior notes at maturity.\nThe indentures governing our senior notes do not generally limit our ability to incur additional indebtedness or require us to maintain financial ratios or specified levels of net worth or liquidity. The indentures governing our notes contain various covenants, none of which are expected to impact our liquidity or capital resources. We were in compliance with all such covenants at August 2, 2026. See Note 5 to our consolidated financial statements for further discussion of our debt arrangements.\nCASH FLOWS SUMMARY\nOperating Activities\nCash flow generated from operations provides us with a significant source of liquidity. Our operating cash flows result primarily from cash received from our customers, offset by cash payments we make for products and services, associate compensation, operations, occupancy costs, and income taxes. Cash provided by or used in operating activities is also subject to changes in working capital. Working capital at any point in time is subject to many variables, including seasonality, inventory management and category expansion, the timing of cash receipts and payments, vendor payment terms, and fluctuations in foreign exchange rates.\nNet cash provided by operating activities increased by $2.5 billion in the first six months of fiscal 2026 compared to the first six months of fiscal 2025, primarily due to changes in working capital. Changes in working capital were primarily driven by timing of vendor payments and inventory management, along with the deferral of our fourth quarter fiscal 2024 estimated federal tax payment to the first quarter of fiscal 2025, which resulted in fewer income tax payments in the first six months of fiscal 2026 compared to the first six months of fiscal 2025.\nInvesting Activities\nNet cash used in investing activities increased by $1.1 billion in the first six months of fiscal 2026 compared to the first six months of fiscal 2025, primarily resulting from higher cash paid for acquisitions during the first six months of fiscal 2026 compared to the first six months of fiscal 2025.\nFinancing Activities\nNet cash used in financing activities in the first six months of fiscal 2026 primarily reflected $4.6 billion of cash dividends paid and $3.0 billion of repayments of long-term debt. Net cash used in financing activities in the first six months of fiscal 2025 primarily reflected $4.6 billion of cash dividends paid and $1.2 billion of repayments of long-term debt.\nFiscal Q2 2026 Form 10-Q 21"}, {"label": 12, "gold": false, "text": "Table of Contents\nThe following table presents net sale ecorded as deferred revenue until the sale or service is complete. Such performance obligations are part of contracts with expected original durations of typically three months or less. As of August 2, 2026 and February 1, 2026, deferred revenue for products and services was $1.7 billion and $1.5 billion, respectively.\nWe further record deferred revenue for the sale of gift cards and recognize the associated revenue upon the redemption of those gift cards, which generally occurs within six months of gift card issuance. As of August 2, 2026 and February 1, 2026, our performance obligations for unredeemed gift cards were $1.0 billion and $1.1 billion, respectively. Gift card breakage income, which is our estimate of the portion of our outstanding gift card balance not expected to be redeemed, is recognized in net sales and was immaterial for the three and six months ended August 2, 2026 and August 3, 2025.\nFiscal Q2 2026 Form 10-Q 9"}]}, {"n": 55, "id": "FE-0528", "slice": "S5", "company": "Walt Disney Company", "form": "10-Q", "question": "What was Walt Disney Company's goodwill for its Experiences Segment as of September 27, 2025?", "found": true, "display": "5,550", "scale": "millions", "unit": "USD", "period": "2025-09-27", "dims": {"us-gaap:StatementBusinessSegmentsAxis": "dis:ExperiencesSegmentMember"}, "line": "Balance at September 27, 2025 $ 51,258 $ 16,486 $ 5,550 $ 73,294", "url": "https://www.sec.gov/Archives/edgar/data/1744489/000174448926000057/dis-20260627.htm", "pages": [{"label": 15, "gold": true, "text": "THE WALT DISNEY COMPANY\nNOTES TO CONDENSED CONSOLIDATED FINANCIAL STATEMENTS\n(unaudited; tabular dollars in millions, except for per share data)\nFuboTV Inc.\nOn October 29, 2025, the Company and Fubo, a publicly traded vMVPD, combined certain Hulu Live TV assets, including its carriage agreements, subscription agreements and related data, advertising and sponsorship agreements and intellectual property exclusively related to the “Live TV” brand, with Fubo (the Fubo Transaction). The Company has a 70% economic interest in the combined operations, a 70% voting interest in Fubo on a fully diluted basis and the right to appoint a majority of Fubo’s Board of Directors. The remaining 30% equity interest in Fubo is retained by Fubo public shareholders.\nBased on the closing price of Fubo common stock of $3.69 on October 29, 2025, the estimated fair value of Fubo was $1.3 billion, which was primarily allocated to goodwill of $1.4 billion and identifiable intangible assets of $0.4 billion, partially offset by debt of $0.4 billion. Goodwill reflects the synergies expected from enhancing and expanding the Company’s vMVPD offerings with more high-quality offerings, choice and increased flexibility.\nAs of October 29, 2025, the Company has included the financial results attributable to Fubo in the Condensed Consolidated Financial Statements. Revenue included in the quarter and nine months ended June 27, 2026 was approximately $0.3 billion and $1.0 billion, respectively. The impact on the Company’s net income was not significant for the quarter and nine months ended June 27, 2026.\nPursuant to an agreement entered into as part of the Fubo Transaction, the Company is the exclusive distributor of the Hulu Live TV service for five years (renewable for an additional five-year term by mutual agreement) and pays a wholesale fee to Fubo based on Fubo’s cost to program Hulu Live TV. Under the same agreement, the Company manages the marketing for Hulu Live TV and sells advertising for the Hulu Live TV and Fubo services for a fee.\nGoodwill\nThe changes in the carrying amount of goodwill are as follows:\nEntertainment Sports Experiences Total\nBalance at September 27, 2025 $ 51,258 $ 16,486 $ 5,550 $ 73,294\nFubo and NFL Transactions 1,357 49 — 1,406\nCurrency translation adjustments and other, net (18) — — (18)\nBalance at June 27, 2026 $ 52,597 $ 16,535 $ 5,550 $ 74,682\n5.Cash, Cash Equivalents, Restricted Cash and Borrowings\nCash, Cash Equivalents and Restricted Cash\nThe following table provides a reconciliation of cash, cash equivalents and restricted cash reported in the Condensed Consolidated Balance Sheets to the total of the amounts reported in the Condensed Consolidated Statements of Cash Flows.\nJune 27, 2026 September 27, 2025\nCash and cash equivalents $ 5,185 $ 5,695\nRestricted cash included in:\nOther current assets 5 —\nOther assets 109 104\nTotal cash, cash equivalents and restricted cash in the statement of cash flows $ 5,299 $ 5,799\n15"}, {"label": 14, "gold": false, "text": "THE WALT DISNEY COMPANY\nNOTES TO CONDENSED CONSOLIDATED FINANCIAL STATEMENTS\n(unaudited; tabular dollars in millions, except for per share data)\nRevenues recognized in the current and prior-year periods from performance obligations satisfied (or partially satisfied) in previous reporting periods primarily relate to revenues earned on content made available to distributors and licensees in previous reporting periods. For the quarter ended June 27, 2026, $0.3 billion was recognized related to performance obligations satisfied as of March 28, 2026. For the nine months ended June 27, 2026, $0.8 billion was recognized related to performance obligations satisfied as of September 27, 2025. For the quarter ended June 28, 2025, $0.3 billion was recognized related to performance obligations satisfied as of March 29, 2025. For the nine months ended June 28, 2025, $0.8 billion was recognized related to performance obligations satisfied as of September 28, 2024.\nAs of June 27, 2026, revenue for unsatisfied performance obligations expected to be recognized in the future is $16 billion, primarily for IP to be made available in the future under existing agreements with merchandise and co-branding licensees and sponsors, wholesalers of SVOD streaming services, sports sublicensees and television station affiliates. Of this amount, we expect to recognize approximately $2 billion in the remainder of fiscal 2026, $6 billion in fiscal 2027, $4 billion in fiscal 2028 and $4 billion thereafter. These amounts include only fixed consideration or minimum guarantees and do not include amounts related to (i) contracts with an original expected term of one year or less or (ii) licenses of IP that are solely based on the sales of the licensee.\nAccounts receivable and deferred revenues from contracts with customers are as follows:\nJune 27, 2026 September 27, 2025\nAccounts receivable\nCurrent $ 12,064 $ 10,544\nNon-current 1,081 985\nAllowance for credit losses (145) (126)\nDeferred revenues\nCurrent 6,402 5,689\nNon-current 693 785\nFor the quarter and nine months ended June 27, 2026, the Company recognized revenue of $0.5 billion and $5.0 billion, respectively, that was included in the September 27, 2025 deferred revenue balance. For the quarter and nine months ended June 28, 2025, the Company recognized revenue of $0.5 billion and $5.0 billion, respectively, that was included in the September 28, 2024 deferred revenue balance. Amounts deferred generally relate to theme park admissions and vacation packages, subscriptions to streaming services and advances related to merchandise and TV/VOD licenses.\n4.Acquisitions\nNFL media assets\nOn January 31, 2026, ESPN acquired NFL Network and certain other media assets owned and controlled by NFL Enterprises LLC, including the NFL RedZone channel’s pay TV distribution and NFL Fantasy (collectively the Specified Assets), from NFL Enterprises LLC in exchange for a 10% noncontrolling interest in ESPN (the NFL Transaction). This transaction will allow the Company to expand audience reach, increase accessibility and flexibility for consumers, drive innovation, and offer more high-quality content at competitive prices. Following the NFL Transaction, the Company has an effective 72% interest in ESPN and Hearst Corporation has an 18% interest. After July 2034, based on the performance of the Specified Assets, the Company may have the right to reacquire the NFL’s interest in ESPN in exchange for a ten-year note at 70% of the then fair market value of the NFL’s interest in ESPN (the Exchange Right). Alternatively, on a similar time frame, the NFL may have the right to acquire up to a 4% additional equity interest in ESPN at a purchase price equal to 70% of the then fair market value of the additional interest in ESPN.\nThe estimated fair value of the NFL Transaction was approximately $3 billion. A significant portion of the transaction value was deferred in other assets and will be amortized as an expense starting in 2033, or, in the case that the Company exercises its Exchange Right, would be charged to equity. The remaining transaction value was primarily allocated to identifiable intangible assets.\nAs of January 31, 2026, the Company has included the financial results attributable to the Specified Assets in the Condensed Consolidated Financial Statements. The results were not material to the Company’s revenue and net income for the quarter and nine months ended June 27, 2026. Because the NFL Transaction was the exchange of equity interests, the $3 billion fair value is a non-cash transaction and is not reflected in the Condensed Consolidated Statement of Cash Flow.\n14"}, {"label": 3, "gold": false, "text": "PART I. FINANCIAL INFORMATION\nItem 1: Financial Statements\nTHE WALT DISNEY COMPANY\nCONDENSED CONSOLIDATED STATEMENTS OF INCOME\n(unaudited; in millions, except per share data)\nQuarter Ended Nine Months Ended\nJune 27, 2026 June 28, 2025 June 27, 2026 June 28, 2025\nRevenues:\nServices $ 22,675 $ 21,214 $ 68,565 $ 64,520\nProducts 2,573 2,436 7,832 7,441\nTotal revenues 25,248 23,650 76,397 71,961\nCosts and expenses:\nCost of services (exclusive of depreciation and amortization) (13,674) (13,034) (43,094) (40,201)\nCost of products (exclusive of depreciation and amortization) (1,432) (1,498) (4,582) (4,547)\nSelling, general, administrative and other (3,968) (4,141) (12,162) (12,052)\nDepreciation  to extensive federal, state and local laws and regulations, including those of the DEA and individual state controlled substance authorities, the Food and Drug Administration and Boards of Pharmacy.\nWe could face potential claims in connection with purported errors by our home delivery, specialty or compounding or clinic-based pharmacies or the provision of home infusion services, as well as claims related to the inherent risks in the packaging and distribution of pharmaceuticals and other health care products. Disruptions from any of our home delivery, specialty pharmacy or home infusion services could materially and adversely affect our results of operations, financial position and cash flows.\nIn addition, our pharmacy care services businesses provide services to sponsors of health benefit plans subject to ERISA. A private party or the DOL, which is the agency that enforces ERISA, could assert that fiduciary obligations imposed by the statute apply to some or all of the services provided by our pharmacy care services businesses even where those businesses are not contractually obligated to assume fiduciary obligations. If a court were to determine such fiduciary obligations apply, we could be subject to claims for breaches of fiduciary obligations or claims we entered into prohibited transactions.\nIf we fail to comply with applicable privacy, security, technology and data laws, regulations and standards, including with respect to third-party service providers utilizing protected personal information on our behalf, our business, reputation, results of operations, financial position and cash flows could be materially and adversely affected.\nThe collection, maintenance, protection, use, transmission, disclosure and disposal of protected personal information are regulated at the federal, state, international and industry levels and addressed in requirements of our customer contracts. Additionally, legislative and regulatory action in the United States at the federal, state and local levels, as well as internationally, is emerging in the areas of AI and automation. These laws, regulations and requirements are subject to frequent and often unpredictable change. Compliance with new privacy, security, technology and data laws, regulations and requirements may result in increased operating costs, and may constrain or require us to alter our business model or operations.\nInternationally, many of the jurisdictions in which we operate have established their own data security and privacy legal framework with which we or our customers must comply. We expect there will continue to be new proposed laws, regulations and industry standards concerning privacy, data protection, information security, and AI/ML and automation in the European Union, UK, Chile, India and other jurisdictions, which may have negative impacts on our businesses or the businesses of our customers.\nHIPAA requires business associates as well as covered entities to comply with specified privacy and security requirements. While we provide for appropriate protections through our contracts with our third-party service providers and in certain cases assess their security controls, we have limited oversight or control over their actions and practices. Several of our businesses act as business associates to their covered entity customers and, as a result, collect, use, disclose and maintain protected personal information in order to provide services to these customers. If HHS alleges or finds noncompliance by us with HIPAA privacy or security requirements, the allegations or findings could damage our reputation and subject us to monetary and other sanctions.\nThrough our Optum businesses, we maintain a database of administrative and clinical data statistically de-identified in accordance with HIPAA standards. Noncompliance or findings of noncompliance with applicable laws, regulations or requirements, or the occurrence of any privacy or security breach involving the misappropriation, loss or other unauthorized disclosure of protected personal information, whether by us or by one of our third-party service providers, could have an adverse effect on our reputation and business and, among other consequences, could subject us to mandatory disclosure to affected customers and the media, loss of existing or new customers, and significant increases in the cost of managing and remediating privacy or security incidents, and could also result in significant fines, penalties and litigation awards. Any of these consequences could have a material and adverse effect on our results of operations, financial position and cash flows.\nWe increasingly rely on new and evolving technologies, including those powered by or incorporating AI, as part of our internal operations and in the delivery of our products and services. AI technologies are subject to evolving and uncertain U.S. federal, state, and international laws and regulations. Emerging requirements may impose new compliance obligations, increase operating costs, or limit certain uses of AI.\n20"}, {"label": 59, "gold": false, "text": "Table of Contents\nThe gross carrying value, accumulated amortization and net carrying value of other intangible assets were as follows:\nDecember 31, 2025 December 31, 2024\n(in millions) Gross Carrying Value Accumulated Amortization Net Carrying Value Gross Carrying Value Accumulated Amortization Net Carrying Value\nCustomer-related $ 14,456 $ (5,966) $ 8,490 $ 17,190 $ (6,675) $ 10,515\nTrademarks and technology 2,356 (1,265) 1,091 2,917 (1,284) 1,633\nTrade names, trademarks, operating licenses and certificates and other indefinite-lived 10,734 — 10,734 10,454 — 10,454\nOther 400 (241) 159 1,057 (391) 666\nTotal $ 27,946 $ (7,472) $ 20,474 $ 31,618 $ (8,350) $ 23,268\nThe fair values and weighted-average useful lives assigned to intangible assets as a result of transactions completed during years ended:\n2025 2024\n(in millions, except years) Fair Value Weighte
